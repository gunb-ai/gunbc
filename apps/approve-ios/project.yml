# XcodeGen spec — no .xcodeproj is committed. On the MacBook: `brew install xcodegen && xcodegen generate`.
name: Approve
options:
  bundleIdPrefix: ai.gunb
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM, APPROVE_SERVER_HOST and APNS_ENVIRONMENT come from Config/Team.xcconfig.
targets:
  Approve:
    type: application
    platform: iOS
    sources: [Approve]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.gunb.approve
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Approving a request signs it with a key that only unlocks with Face ID."
        INFOPLIST_KEY_CFBundleDisplayName: Approve
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Approve/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        # Read by ServerConfig at launch; the values are xcconfig-substituted.
        ApproveServerHost: $(APPROVE_SERVER_HOST)
        ApproveApnsEnvironment: $(APNS_ENVIRONMENT)
    entitlements:
      path: Approve/Approve.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)
        # extdeps.apple.app_attest AppAttestEnvironment: "development" for an Xcode build,
        # "production" for TestFlight/App Store (the AAGUID the server checks follows this).
        com.apple.developer.devicecheck.appattest-environment: $(APP_ATTEST_ENVIRONMENT)
  ApproveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ApproveTests
      # The fixture vectors are EMITTED by the .dag witness (test.claim.approval_device_redemption_witness_test),
      # never hand-copied; the test bundle carries the committed file as a resource.
      - path: ../../dag/test/fixture/approval_device_redemption/vectors.json
        buildPhase: resources
    dependencies:
      - target: Approve
