# Channel pin for local rustup and GitHub Actions: `actions-rust-lang/setup-rust-toolchain`
# reads this file when workflow steps omit an explicit `toolchain:` input.
# Keep `channel` aligned with `ci_pinned_toolchain` in `dsl/extdeps/rustup.dag`.
[toolchain]
channel = "1.93.0"
components = ["clippy", "rustfmt"]
