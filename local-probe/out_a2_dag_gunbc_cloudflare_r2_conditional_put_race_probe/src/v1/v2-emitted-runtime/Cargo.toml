[package]
name = "v2-emitted-runtime"
version = "0.1.0"
edition = "2021"
[features]
default = []
text_lookup_work_counter = []


[dependencies]
im = { version = "15.1", features = ["serde"] }
unicode-ident = "1"
unicode-properties = { version = "0.1", features = ["emoji"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
libc = "0.2"
stacker = "0.1"
lazy_static = "1"
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
async-trait = "0.1"
