<svg xmlns="http://www.w3.org/2000/svg" width="549" height="122" viewBox="0 0 549 122" role="img" aria-label="gunbc tools">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f8fafc"/>
    <stop offset="100%" stop-color="#eef2ff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
  </marker>
</defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&amp;family=Space+Mono&amp;display=swap');
  .bg { fill: url(#bg); }
  .node-rect { fill: #f8fafc; stroke: #334155; stroke-width: 1.2; rx: 10; filter: url(#shadow); }
  .node-rect.observe { stroke-dasharray: 5 4; }
  .node-rect.writes { stroke: #c2410c; stroke-width: 1.8; }
  .node-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
  .node-sub { font-family: 'Space Grotesk', sans-serif; font-size: 11px; fill: #475569; }
  .port-text { font-family: 'Space Mono', monospace; font-size: 11px; fill: #334155; }
  .port-guard { font-family: 'Space Mono', monospace; font-size: 10px; fill: #64748b; }
  .edge { fill: none; stroke: #64748b; stroke-width: 1.3; marker-end: url(#arrow); }
</style>
<rect class="bg" width="549" height="122"/>
<g class="edges">
  <path class="edge" d="M 189.0 61.0 C 229.0 61.0, 229.0 61.0, 269.0 61.0"/>
</g>
<g class="nodes">
  <g id="tool_auth" transform="translate(40.0 30.0)">
    <rect class="node-rect" width="149.0" height="62.0"/>
    <text class="node-title" x="74.5" y="16.0" text-anchor="middle" dominant-baseline="hanging">auth</text>
    <text class="node-sub" x="74.5" y="31.0" text-anchor="middle" dominant-baseline="hanging">upsert=Instantiated</text>
  </g>
  <g id="tool_gistgen" transform="translate(269.0 30.0)">
    <rect class="node-rect" width="240.0" height="62.0"/>
    <text class="node-title" x="120.0" y="16.0" text-anchor="middle" dominant-baseline="hanging">gistgen</text>
    <text class="node-sub" x="120.0" y="31.0" text-anchor="middle" dominant-baseline="hanging">upsert=NotApplicable: gistgen...</text>
  </g>
</g>
</svg>

