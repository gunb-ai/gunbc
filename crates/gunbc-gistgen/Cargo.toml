[package]
name = "gunbc-gistgen"
version = "0.1.0"
edition = "2021"

[lib]
name = "gunbc_gistgen"
path = "src/lib.rs"

[dependencies]
gunbc-ir = { path = "../gunbc-ir" }
gunbc-exec = { path = "../gunbc-exec" }
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
gunbc-contracts = { path = "../gunbc-contracts" }
gunbc-codegen = { path = "../gunbc-codegen" }
gunbc-test = { path = "../gunbc-test" }
