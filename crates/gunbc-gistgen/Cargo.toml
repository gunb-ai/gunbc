[package]
name = "gunbc-gistgen"
version = "0.1.0"
edition = "2021"

[dependencies]
gunbc-ir = { path = "../gunbc-ir" }
gunbc-validate = { path = "../gunbc-validate" }
gunbc-exec = { path = "../gunbc-exec" }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
