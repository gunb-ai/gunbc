# Manual C1 Phase-1 Tier-3 mirror baseline capture (``tier3_baseline.json``).
#
# Dispatched on self-hosted arm64 (srv1/srv2; R-3 per ``docs/audit/c1-r3-canonical-bench-host-decision-matrix.md`` —
# host class changed from `ubicloud-standard-2` to gunbc self-hosted arm64 on 2026-05-22; baselines captured on the
# prior host class are not directly comparable, so the next baseline refresh re-establishes ground truth on the new host).
# Runs five independent bench jobs (separate VMs), aggregates per procedure §2 / R-7 via
# ``scripts/aggregate_tier3_baseline.py``.
#
# **Phase-1 gate (R-7):** the canonical baseline lives in the repo tree at
# ``src/v3/compiler/benches/tier3_baseline.json`` (merged on ``main`` before mirror dissolution PRs).
# This workflow does **not** replace that file: it is a **recapture / audit** path for
# Director-approved baseline refresh or for comparing fresh Criterion output against the
# committed baseline (diff the artifact vs the checked-in JSON; land updates only via normal PR).
#
# Once this YAML exists on ``main``, operators may ``gh workflow run tier3-baseline-capture.yml``,
# then review or diff the emitted ``tier3_baseline.json`` artifact.

name: Tier-3 baseline capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tier3-baseline-capture-${{ github.repository }}
  cancel-in-progress: false

# See `.github/workflows/ci.yml` for the per-job CARGO_HOME / RUSTUP_HOME
# rationale — self-hosted runners on srv1/srv2 share `$HOME` across ephemeral
# worker instances, so per-job toolchain state must live in `RUNNER_TEMP` to
# avoid concurrent-rustup races. Matters especially here because the matrix
# fans out 5 simultaneous setup-rust calls.

jobs:
  capture-run:
    strategy:
      fail-fast: false
      matrix:
        run_number: [1, 2, 3, 4, 5]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
      - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: true
          rustflags: ""

      - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"

      - name: Run tier3 mirror benchmarks
        run: cargo bench --bench tier3_mirror_perf -p v3-compiler

      - name: Stage capture bundle (criterion + rustc provenance)
        run: |
          mkdir -p staging
          cp -a target/criterion staging/criterion
          rustc --version | tee staging/rustc_version.txt

      - name: Upload capture bundle
        uses: actions/upload-artifact@v4
        with:
          name: tier3-criterion-${{ matrix.run_number }}
          path: staging

  aggregate:
    needs: capture-run
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download criterion artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tier3-criterion-*
          path: runs
          merge-multiple: false

      - name: Aggregate into tier3_baseline.json
        run: |
          set -euxo pipefail
          # Artifact-only aggregate (compare vs src/v3/compiler/benches/tier3_baseline.json in-tree).
          # Each matrix job uploaded `staging/` with `criterion/` + rustc_version.txt
          shopt -s nullglob
          bundles=(runs/tier3-criterion-*)
          if [ "${#bundles[@]}" -lt 3 ]; then
            echo "::error::expected ≥3 capture bundles under runs/tier3-criterion-*, got ${#bundles[@]}"
            ls -la runs || true
            exit 1
          fi
          mapfile -t sorted < <(printf '%s\n' "${bundles[@]}" | sort -V)
          python3 scripts/aggregate_tier3_baseline.py \
            --host-id gunbc-self-hosted-arm64 \
            --git-sha "${GITHUB_SHA}" \
            --output tier3_baseline.json \
            "${sorted[@]}"

      - name: Upload baseline JSON
        uses: actions/upload-artifact@v4
        with:
          name: tier3-baseline-json
          path: tier3_baseline.json
