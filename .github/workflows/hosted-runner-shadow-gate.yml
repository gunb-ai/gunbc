name: hosted-runner-shadow-gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:
    inputs:
      pattern:
        description: "evidence re-runs only: remote gate pattern override (e.g. a pattern the remote host fails, for the red control). Empty defaults to the modelled plumbing-proof pattern."
        required: false
        type: string
jobs:
  shadow-gate-config:
    name: "Hosted-runner shadow gate: configuration"
    runs-on: ubuntu-24.04
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo 'configured=true' >> $GITHUB_OUTPUT
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo '::error::not a dispatch at refs/heads/main: the WIF provider is pinned to the reviewed main copy of this workflow (hosted_ci_secrets_attribute_condition), so this run cannot federate the credentials; a dispatched verdict request that cannot federate fails rather than passing green'
            exit 1
          else
            echo 'configured=false' >> $GITHUB_OUTPUT
            echo '::notice::remote legs run only on workflow_dispatch at refs/heads/main: the pinned WIF provider refuses pull_request/merge_group claims, so the remote build is not shadowed on this event; see gunbc.integration_concern::shadow_gate_pr_time_remote_build_capability_gap'
          fi
        shell: bash
  remote-build-shadow:
    name: Hosted-runner shadow gate (remote build)
    runs-on: ubuntu-24.04
    needs: [shadow-gate-config]
    timeout-minutes: 30
    if: needs.shadow-gate-config.outputs.configured == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build gunbc
        id: build-gunbc
        run: |
          cargo build --release --bin gunbc
        shell: bash
      - name: "Federate to the hosted-CI service account (pinned: this workflow at refs/heads/main, dispatch only)"
        id: wif_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-hosted-shadow-gate/providers/github-hosted-shadow-gate-oidc
          service_account: hosted-ci-secrets@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
        timeout-minutes: 5
      - name: Fetch CI credentials over WIF (SM pinned versions -> 0600 file + masked env, fingerprint-pinned)
        id: fetch-credentials
        run: |
          set -euo pipefail
          umask 077
          HDR_FILE="$RUNNER_TEMP/shadow-gate-auth-header"
          VAL_FILE="$RUNNER_TEMP/shadow-gate-oauth-val"
          KEY_FILE="$RUNNER_TEMP/remote-build-ci-ssh-key"
          cleanup() { rm -f "$HDR_FILE" "$VAL_FILE"; }
          trap cleanup EXIT
          printf 'Authorization: Bearer %s\n' "$WIF_ACCESS_TOKEN" > "$HDR_FILE"
          rm -f "$KEY_FILE"
          curl -fsSL -H @"$HDR_FILE" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/remote-build-ci-ssh-key/versions/2:access" | python3 -c 'import sys,json,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["payload"]["data"]).decode("utf-8"))' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          ACTUAL_FP="$(ssh-keygen -lf "$KEY_FILE" | awk '{print $2}')"
          EXPECTED_FP="SHA256:Xy1UDMurH15SRT6Uhp5STj2YcIjPzW/OzPtEidv7ioM"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            rm -f "$KEY_FILE"
            echo "::error::fetched remote-build CI SSH key fingerprint $ACTUAL_FP != the modeled $EXPECTED_FP; refusing to connect with it" >&2
            exit 1
          fi
          curl -fsSL -H @"$HDR_FILE" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/tailscale-oauth-client-secret/versions/1:access" | python3 -c 'import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)["payload"]["data"]).decode("utf-8"), end="")' > "$VAL_FILE"
          rm -f "$HDR_FILE"
          VAL="$(cat "$VAL_FILE")"
          echo "::add-mask::$VAL"
          printf '%s=%s\n' "TS_OAUTH_SECRET" "$VAL" >> "$GITHUB_ENV"
          rm -f "$VAL_FILE"
        shell: bash
        env:
          WIF_ACCESS_TOKEN: ${{ steps.wif_auth.outputs.access_token }}
      - name: Join tailnet (ephemeral, tag:ci-dispatch)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: kNQLY8UpZK11CNTRL
          oauth-secret: ${{ env.TS_OAUTH_SECRET }}
          tags: tag:ci-dispatch
          args: --accept-dns=false
      - name: "Plumbing proof: remote_test_cli over the plumbing-proof pattern"
