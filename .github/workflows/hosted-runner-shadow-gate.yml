name: hosted-runner-shadow-gate
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:
    inputs:
      pattern:
        description: "evidence re-runs only: remote gate pattern override (e.g. a pattern the remote host fails, for the red control). Empty defaults to the modelled plumbing-proof pattern."
        required: false
        type: string
jobs:
  shadow-gate-config:
    name: "Hosted-runner shadow gate: configuration"
    runs-on: ubuntu-24.04
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.TS_OAUTH_CLIENT_ID }}" ] || [ -z "${{ secrets.TS_OAUTH_SECRET }}" ] || [ -z "${{ secrets.GUNBC_REMOTE_BUILD_CI_SSH_KEY }}" ]; then
            echo 'configured=false' >> $GITHUB_OUTPUT
            if [ "$GITHUB_EVENT_NAME" = "merge_group" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::not configured: required secret absent on $GITHUB_EVENT_NAME; the shadow gate refuses to silently pass"
              exit 1
            fi
            echo '::notice::not configured: required secret absent; shadow gate skipped (pull_request arm: fork PRs get no secrets by design, and the pre-cutover case)'
          else
            echo 'configured=true' >> $GITHUB_OUTPUT
          fi
        shell: bash
  remote-build-shadow:
    name: Hosted-runner shadow gate (remote build)
    runs-on: ubuntu-24.04
    needs: [shadow-gate-config]
    timeout-minutes: 30
    if: needs.shadow-gate-config.outputs.configured == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build gunbc
        id: build-gunbc
        run: |
          cargo build --release --bin gunbc
        shell: bash
      - name: Join tailnet (ephemeral, tag:ci-dispatch)
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-dispatch
          args: --accept-dns=false --ephemeral=true
      - name: Write the CI SSH key
        id: ssh-setup
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh && printf '%s\n' "${{ secrets.GUNBC_REMOTE_BUILD_CI_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519 && eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519
        shell: bash
      - name: "Plumbing proof: remote_test_cli over the plumbing-proof pattern"
        id: remote-build-plumbing-proof
        run: |
          set -euo pipefail && echo '--- remote gate step ---' && ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 gunbc-build@srv1.tailecbe08.ts.net true
          set -euo pipefail && target/release/gunbc run --entry dag/gunbc/compute/remote_build_client.dag --function remote_test_cli --arg worktree=$PWD --arg pattern="${GUNBC_GATE_PATTERN:-//dag/test/claim/compute/host_capacity_seal_witness.dag}" --arg receipt_path=/tmp/shadow-gate-receipt-plumbing-proof.json && cat /tmp/shadow-gate-receipt-plumbing-proof.json
        shell: bash
        env:
          GUNBC_GATE_PATTERN: ${{ inputs.pattern }}
