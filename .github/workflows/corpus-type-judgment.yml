name: Corpus type judgment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus_type_judgment:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: false
      - name: Build the measurement
        id: build_corpus_type_judgment
        run: |
          cargo build --release -p v1-compiler --bin claim_executor
      - name: Corpus type judgment (preparation only, no witness executes)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT"
          'target/release/claim_executor' '--corpus-type-judgment'
        if: "!cancelled() && steps.build_corpus_type_judgment.outcome == 'success'"
