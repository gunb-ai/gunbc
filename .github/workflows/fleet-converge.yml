name: fleet-converge
on:
  workflow_dispatch:
    inputs:
      mode:
        description: plan shows membership hunks; apply executes a prior plan artifact
        required: true
        type: choice
      plan_artifact_hash:
        description: Fnv1a64Structural digest of plan.txt — required for apply (printed by plan step)
        required: false
        type: string
      plan_workflow_run_id:
        description: Workflow run id that produced the plan artifact — required for apply
        required: false
        type: string
jobs:
  fleet-converge:
    runs-on: [self-hosted, linux, arm64, srv1]
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_healed_sha || github.sha }}
      - name: Refuse a heal revalidation whose run subject or checkout does not name the expected healed SHA
        run: |
          EXPECTED_HEALED_SHA="${{ inputs.expected_healed_sha }}"
          RUN_SUBJECT_HEAD="${{ github.sha }}"
          if [ -n "$EXPECTED_HEALED_SHA" ]; then
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if ! [ "$RUN_SUBJECT_HEAD" = "$EXPECTED_HEALED_SHA" ]; then
          echo "::error::heal revalidation refused: workflow run subject $RUN_SUBJECT_HEAD does not equal expected healed head $EXPECTED_HEALED_SHA"
          exit 1
          fi
          if ! [ "$ACTUAL_HEAD" = "$EXPECTED_HEALED_SHA" ]; then
          echo "::error::heal revalidation refused: checkout head $ACTUAL_HEAD does not equal expected healed head $EXPECTED_HEALED_SHA"
          exit 1
          fi
          echo "heal revalidation preflight: checkout names expected healed head $EXPECTED_HEALED_SHA"
          fi
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        id: release_bins
        run: |
          # 🟡 dissolve-on: ci_release_bins_unpack_verify_script — concat-built foreign-executor (GitHub Actions run:) release-bins unpack + claim_executor --verify-build-artifacts runner; membership of verified paths is derived from gunbc.ci_release_bins, but the unpack/verify transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the unpack/verify runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/selection_control_skip_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census" "$ROOT/target/release/cssl_assemble" "$ROOT/target/release/frontier_probe_survey" "$ROOT/target/release/namespace_structural_root_exposure_generated_witness"
        timeout-minutes: 5
      - name: WIF auth (OIDC -> fleet-cloud-convergence SA, access token only)
        id: wif_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
        timeout-minutes: 5
      - name: Materialize fleet key in-run (SM versions/1 pinned -> RUNNER_TEMP 0600 -> ssh-agent -> wipe file)
        run: |
          # 🟡 dissolve-on: gunbc_ci_fleet_key_agent_script — concat-built foreign-executor (GitHub Actions run:) shell materializing the fleet automation key from Secret Manager versions/1 into an in-run ssh-agent; DISSOLVES WHEN the typed secret-materialization effect (SecretRef -> in-run agent, SECRET-VERSION-LIFECYCLE-0 machinery) lands on host_effect_apply and the step becomes an emitted typed effect
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/fleet-automation-key"
          AGENT_STARTED=0
          cleanup() { rm -f "$KEY_FILE"; if [ "$AGENT_STARTED" = 1 ] && [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi; }
          trap cleanup EXIT
          curl -sSf -H "Authorization: Bearer $WIF_ACCESS_TOKEN" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/fleet-automation-ssh-key/versions/1:access" | python3 -c 'import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["payload"]["data"]))' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          EXPECTED_FP="SHA256:mGT7qJsh36VsVb8OPh3m8br3oHedQHxRukRkW5P0CoQ"
          OBSERVED_FP="$(ssh-keygen -y -f "$KEY_FILE" | ssh-keygen -lf - | awk '{print $2}')"
          if [ "$OBSERVED_FP" != "$EXPECTED_FP" ]; then echo "ProbeCredentialIdentityMismatch: fetched secret versions/1 fingerprint $OBSERVED_FP != modeled $EXPECTED_FP; contacting NO host" >&2; exit 1; fi
          eval "$(ssh-agent -s)" >/dev/null
          AGENT_STARTED=1
          ssh-add "$KEY_FILE" 2>/dev/null
          rm -f "$KEY_FILE"
          trap - EXIT
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "fleet-key: agent loaded (identity fleet-automation@gunbc; secret versions/1 pinned; fingerprint verified against modeled authority; key file wiped)"
        env:
          WIF_ACCESS_TOKEN: ${{ steps.wif_auth.outputs.access_token }}
        timeout-minutes: 5
      - name: Fleet converge plan (membership_reconcile → artifact)
        id: plan
        run: |
          # 🟡 dissolve-on: gunbc_ci_fleet_converge_plan_invoke — foreign-executor shell invoking fleet_converge_plan_wet; DISSOLVES WHEN bash-emit binds the step to orchestration emit over typed WitnessBin.Run
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/fleet_converge_plan_cli.dag --function fleet_converge_plan_wet
        if: github.event.inputs.mode == 'plan'
        timeout-minutes: 5
      - name: Upload fleet converge plan artifact
        id: plan_upload
        uses: actions/upload-artifact@v4
        with:
          name: fleet-converge-plan
          path: /tmp/fleet-converge-plan
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
        if: github.event.inputs.mode == 'plan'
        timeout-minutes: 10
      - name: Download fleet converge plan artifact
        id: plan_download
        uses: actions/download-artifact@v4
        with:
          name: fleet-converge-plan
          path: /tmp/fleet-converge-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.plan_workflow_run_id }}
        if: github.event.inputs.mode == 'apply'
        timeout-minutes: 10
      - name: Fleet converge apply (CAS + generated apply.sh)
        id: apply
        run: |
          # 🟡 dissolve-on: gunbc_ci_fleet_converge_apply_invoke — foreign-executor shell verifying plan hash then invoking fleet_converge_apply_wet; DISSOLVES WHEN bash-emit binds the step to orchestration emit over typed WitnessBin.Run
          set -euo pipefail
          EXPECTED="${{ github.event.inputs.plan_artifact_hash }}"
          ACTUAL="$(cat /tmp/fleet-converge-plan/plan_content.hex)"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::PlanArtifactHashMismatch expected=$EXPECTED actual=$ACTUAL" >&2
            exit 1
          fi
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/fleet_converge_plan_cli.dag --function fleet_converge_apply_wet
        if: github.event.inputs.mode == 'apply'
        timeout-minutes: 5
      - name: Kill the in-run ssh-agent (key never outlives the job)
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k || true; fi
        if: always()
        timeout-minutes: 5
