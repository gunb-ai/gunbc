name: fleet-converge
on:
  workflow_dispatch:
    inputs:
      host:
        description: Executor fleet host (runner pinned here; plan mode observes this host)
        required: true
        options: [srv1, srv2, srv3, srv4]
        type: choice
      mode:
        description: plan shows membership hunks; apply executes a prior plan artifact; spark_linger enables linger on target spark via FleetSsh typed argv from executor; spark_observe is a read-only observation of both Sparks
        required: true
        options: [plan, apply, spark_linger, spark_observe, spark_reboot, spark_grants, spark_durability]
        type: choice
      target:
        description: Spark target host for spark_linger mode (srv5 or srv6)
        required: false
        options: [srv5, srv6]
        type: choice
      plan_artifact_hash:
        description: Fnv1a64Structural bundle digest of plan.txt + apply.sh + spark_serving_typed_actions.wire — required for apply (printed by plan step). A plan artifact minted before the typed-actions wire joined the bundle will not match.
        required: false
        type: string
      plan_workflow_run_id:
        description: Workflow run id that produced the plan artifact — required for apply
        required: false
        type: string
jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          printf '%s\n' "CiSccacheProviderReceipt: provider=bound catalog=sccache_local"
          else
          printf '%s\n' "CiSccacheProviderReceipt: provider=SKIPPED catalog=sccache_local host=$(hostname) cause=daemon-unavailable; the release build runs UNCACHED — a counted degradation, not a supported mode (host_build_cache_provision P1b should have converged this host)"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Derive native-cache root (rustc-version segment; after setup-rust-toolchain)
        run: |
          # 🟡 dissolve-on: ci_native_cache_root_script — orch-emitted foreign-executor prelude step deriving GUNBC_NATIVE_CACHE_ROOT from rustc -V after setup-rust-toolchain; leaf rustc/tr/mkdir/echo strings remain until typed toolchain probe lands on host_effect_apply (#5828 / shell→intent Phase 2)
          if ! GUNBC_TOOLCHAIN_SEG_RAW=$(rustc -V 2>/dev/null); then echo "::error::rustc -V failed after setup-rust-toolchain: cannot derive native-cache toolchain segment"; exit 1; fi
          GUNBC_TOOLCHAIN_SEG=$(echo "$GUNBC_TOOLCHAIN_SEG_RAW" | tr ' ' '-')
          if [ -z "$GUNBC_TOOLCHAIN_SEG" ]; then echo "::error::rustc -V produced an empty native-cache toolchain segment after setup-rust-toolchain"; exit 1; fi
          mkdir -p "$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG"
          echo "GUNBC_NATIVE_CACHE_ROOT=$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG" >> "$GITHUB_ENV"
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Build release bins (claim_executor + gunbc)
        id: release_build
        run: |
          # 🟡 dissolve-on: ci_release_build_script — concat-built foreign-executor (GitHub Actions run:) release-build runner (ROOT stamp + verify-artifacts + sccache stats wrapping the orch-emitted EAGAIN retry core); membership of --bin / verify paths is derived from gunbc.ci_release_bins, but the runner transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the release-build runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_BIN" build -p v1-compiler --release --features text_lookup_work_counter,interp_test_witness,test_hooks --bin claim_executor --bin gunbc --bin discover_source_root_ingest --bin claim_batch --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness --bin cssl_assemble --bin namespace_structural_root_exposure_generated_witness --bin codex_app_server_stdio_session) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              CARGO_BUILD_JOBS=1 "$CARGO_BIN" build -p v1-compiler --release --features text_lookup_work_counter,interp_test_witness,test_hooks --bin claim_executor --bin gunbc --bin discover_source_root_ingest --bin claim_batch --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness --bin cssl_assemble --bin namespace_structural_root_exposure_generated_witness --bin codex_app_server_stdio_session
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/cssl_assemble" "$ROOT/target/release/namespace_structural_root_exposure_generated_witness" "$ROOT/target/release/codex_app_server_stdio_session"
          sccache --show-stats 2>/dev/null || true
        timeout-minutes: 45
      - name: Pack release bins for cross-job handoff (tar keeps exec bits)
        run: |
          # 🟡 dissolve-on: ci_release_bins_pack_script — concat-built foreign-executor (GitHub Actions run:) release-bins tar pack runner; membership of archived bin names is derived from gunbc.ci_release_bins, but the pack transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the pack runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          tar -czf "$ROOT/release-bins.tgz" -C "$ROOT/target/release" "claim_executor" "gunbc" "discover_source_root_ingest" "claim_batch" "interp_recorded_fixture_witness" "v1_src_dag_parse" "auth_declared_but_unwired_witness" "bootstrap_witness" "dag_collect_fingerprint_witness" "diagnostics_witness" "effects_rest_transport_witness" "infer_semantics_witness" "parse_witness" "cssl_assemble" "namespace_structural_root_exposure_generated_witness" "codex_app_server_stdio_session"
        timeout-minutes: 5
      - name: Upload release-bins artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bins
          path: release-bins.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
        timeout-minutes: 10
  fleet-converge:
    runs-on: ${{ fromJSON(format('["self-hosted","linux","arm64","{0}"]', github.event.inputs.host)) }}
    needs: [build]
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        id: release_bins
        run: |
          # 🟡 dissolve-on: ci_release_bins_unpack_verify_script — concat-built foreign-executor (GitHub Actions run:) release-bins unpack + claim_executor --verify-build-artifacts runner; membership of verified paths is derived from gunbc.ci_release_bins, but the unpack/verify transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the unpack/verify runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/cssl_assemble" "$ROOT/target/release/namespace_structural_root_exposure_generated_witness" "$ROOT/target/release/codex_app_server_stdio_session"
        timeout-minutes: 5
      - name: WIF auth (OIDC -> fleet-cloud-convergence SA, access token only)
        id: wif_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
        timeout-minutes: 5
      - name: Materialize fleet key in-run (SM versions/1 pinned -> RUNNER_TEMP 0600 -> ssh-agent -> wipe file)
        run: |
          # 🟡 dissolve-on: gunbc_ci_fleet_key_agent_script — concat-built foreign-executor (GitHub Actions run:) shell materializing the fleet automation key from Secret Manager versions/1 into an in-run ssh-agent; DISSOLVES WHEN the typed secret-materialization effect (SecretRef -> in-run agent, SECRET-VERSION-LIFECYCLE-0 machinery) lands on host_effect_apply and the step becomes an emitted typed effect
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/fleet-automation-key"
          AGENT_STARTED=0
          cleanup() { rm -f "$KEY_FILE"; if [ "$AGENT_STARTED" = 1 ] && [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi; }
          trap cleanup EXIT
          curl -sSf -H "Authorization: Bearer $WIF_ACCESS_TOKEN" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/fleet-automation-ssh-key/versions/1:access" | python3 -c 'import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["payload"]["data"]))' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          EXPECTED_FP="SHA256:mGT7qJsh36VsVb8OPh3m8br3oHedQHxRukRkW5P0CoQ"
          OBSERVED_FP="$(ssh-keygen -y -f "$KEY_FILE" | ssh-keygen -lf - | awk '{print $2}')"
          if [ "$OBSERVED_FP" != "$EXPECTED_FP" ]; then echo "ProbeCredentialIdentityMismatch: fetched secret versions/1 fingerprint $OBSERVED_FP != modeled $EXPECTED_FP; contacting NO host" >&2; exit 1; fi
          eval "$(ssh-agent -s)" >/dev/null
          AGENT_STARTED=1
          ssh-add "$KEY_FILE" 2>/dev/null
          rm -f "$KEY_FILE"
          trap - EXIT
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "fleet-key: agent loaded (identity fleet-automation@gunbc; secret versions/1 pinned; fingerprint verified against modeled authority; key file wiped)"
        env:
          WIF_ACCESS_TOKEN: ${{ steps.wif_auth.outputs.access_token }}
        timeout-minutes: 5
      - name: Fleet converge plan (membership_reconcile → artifact)
        id: plan
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/fleet_converge_plan_cli.dag --function fleet_converge_plan_wet
        if: github.event.inputs.mode == 'plan'
        timeout-minutes: 5
      - name: Upload fleet converge plan artifact
        id: plan_upload
        uses: actions/upload-artifact@v4
        with:
          name: fleet-converge-plan
          path: /tmp/fleet-converge-plan
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
        if: github.event.inputs.mode == 'plan'
        timeout-minutes: 10
      - name: Download fleet converge plan artifact
        id: plan_download
        uses: actions/download-artifact@v4
        with:
          name: fleet-converge-plan
          path: /tmp/fleet-converge-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.inputs.plan_workflow_run_id }}
        if: github.event.inputs.mode == 'apply'
        timeout-minutes: 10
      - name: Fleet converge apply (CAS + generated apply.sh)
        id: apply
        run: |
          set -euo pipefail
          ACTUAL="$(cat /tmp/fleet-converge-plan/plan_content.hex)"
          if [ -z "${EXPECTED_HASH:-}" ] || [ "$EXPECTED_HASH" != "$ACTUAL" ]; then echo "::error::PlanArtifactHashMismatch expected=$EXPECTED_HASH actual=$ACTUAL" >&2; exit 1; fi
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/fleet_converge_plan_cli.dag --function fleet_converge_apply_wet
        env:
          EXPECTED_HASH: ${{ github.event.inputs.plan_artifact_hash }}
        if: github.event.inputs.mode == 'apply'
        timeout-minutes: 5
      - name: Spark serving linger converge (executor→target FleetSsh typed argv)
        id: spark_linger
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/spark/serving_converge_slice_wet.dag --function spark_serving_converge_slice_ci_wet
          cat "$ROOT/target/spark-serving-converge-slice-wet-receipt.txt"
        env:
          SPARK_CONVERGE_TARGET: ${{ github.event.inputs.target }}
          SPARK_CONVERGE_EXECUTE: 1
        if: github.event.inputs.mode == 'spark_linger'
        timeout-minutes: 60
      - name: Spark managed grant reconcile (materializes its own administrator credential in-run, installs only the grants measured missing at the named target, removes the credential within this same step)
        id: spark_grants
        run: |
          set -euo pipefail
          umask 077
          CRED_FILE="$RUNNER_TEMP/spark-administrator-credential"
          RESP_FILE="$RUNNER_TEMP/spark-administrator-response.json"
          trap 'rm -f "$CRED_FILE" "$RESP_FILE"' EXIT
          HTTP_CODE="$(curl -sS -o "$RESP_FILE" -w '%{http_code}' -H "Authorization: Bearer $WIF_ACCESS_TOKEN" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/spark-administrator-password/versions/1:access" || echo 000)"
          if [ "$HTTP_CODE" = 403 ]; then echo "SparkAdministratorCredentialUnreadable: projects/gunbai-secrets/secrets/spark-administrator-password/versions/1 answered 403 to serviceAccount:fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com. Secret Manager returns 403 both when a version exists and is not readable AND when it does not exist, so this run cannot tell those apart -- REMEDY EITHER WAY: confirm the version exists and grant that principal roles/secretmanager.secretAccessor on it. Contacting NO host." >&2; exit 1; fi
          if [ "$HTTP_CODE" = 404 ]; then echo "SparkAdministratorCredentialAbsent: projects/gunbai-secrets/secrets/spark-administrator-password/versions/1 answered 404; the modeled reference names a version Secret Manager does not hold. Contacting NO host." >&2; exit 1; fi
          if [ "$HTTP_CODE" != 200 ]; then echo "SparkAdministratorCredentialFetchFailed: HTTP $HTTP_CODE from projects/gunbai-secrets/secrets/spark-administrator-password/versions/1; contacting NO host." >&2; exit 1; fi
          python3 -c 'import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(open(sys.argv[1]))["payload"]["data"]))' "$RESP_FILE" > "$CRED_FILE"
          rm -f "$RESP_FILE"
          chmod 600 "$CRED_FILE"
          if [ ! -s "$CRED_FILE" ]; then echo "SparkAdministratorCredentialEmpty: projects/gunbai-secrets/secrets/spark-administrator-password/versions/1 returned 200 with an empty payload, which is an enrolled-but-blank secret and never a blank password; contacting NO host" >&2; exit 1; fi
          export GUNBC_SPARK_BOOTSTRAP_CREDENTIAL_FILE="$CRED_FILE"
          echo "spark-admin-credential: materialized from projects/gunbai-secrets/secrets/spark-administrator-password/versions/1 to a 0600 run-local file, consumed and removed within this one step"
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/spark/grant_install.dag --function spark_grant_install_ci_wet
          cat "$ROOT/target/spark-grant-install-receipt.txt"
        env:
          SPARK_CONVERGE_TARGET: ${{ github.event.inputs.target }}
          WIF_ACCESS_TOKEN: ${{ steps.wif_auth.outputs.access_token }}
        if: github.event.inputs.mode == 'spark_grants'
        timeout-minutes: 60
      - name: "Spark serving observation (read-only: unit state, runtime version, model tags, driver)"
        id: spark_observe
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/spark/serving_observe.dag --function spark_serving_observe_ci_wet
          cat "$ROOT/target/spark-serving-observe-ci-receipt.txt"
        if: github.event.inputs.mode == 'spark_observe'
        timeout-minutes: 60
      - name: "Spark serving reboot (durability probe: the receipt is the converge that follows)"
        id: spark_reboot
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/spark/serving_reboot_probe.dag --function spark_serving_reboot_ci_wet
          cat "$ROOT/target/spark-serving-reboot-receipt.txt"
        env:
          SPARK_CONVERGE_TARGET: ${{ github.event.inputs.target }}
        if: github.event.inputs.mode == 'spark_reboot'
        timeout-minutes: 60
      - name: Spark serving durability transaction (boot identity before and after, in one run)
        id: spark_durability
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/spark/serving_durability.dag --function spark_serving_durability_ci_wet
          cat "$ROOT/target/spark-serving-durability-receipt.txt"
        env:
          SPARK_CONVERGE_TARGET: ${{ github.event.inputs.target }}
        if: github.event.inputs.mode == 'spark_durability'
        timeout-minutes: 60
      - name: Kill the in-run ssh-agent (key never outlives the job)
        run: |
          if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k || true; fi
        if: always()
        timeout-minutes: 5
