# ONE-OFF MEASURING PR — DO NOT MERGE.
#
# Purpose: capture the REAL wall-clock cost of the native v2 route (the lane
# authority v2.workflow.v2_native_route / job_id=required-v2-native) on v2-bootstrap's
# runner class, with BUILD wall and CLAIM wall reported SEPARATELY, plus the
# refused-at-Eval set, verdicts, and peak RSS. The operator decision (escalation
# msg_be7bb738, 2026-11-15, by default on timeout) is: "Run one measuring PR first
# (build vs claim time)". This is that measurement. It restores no lane; it gates
# nothing; it is closed once the numbers are captured.
#
# Context: the route was taken off the acceptance path (#11003, 2026-09-11) because
# its wall (~4h) did not fit the 180-min envelope, on the required job. CI has
# executed NO witness claim since 2026-09-19. We need a current, split number to
# decide the honest restoration path (prep-once + per-claim bounds vs. a smaller cap).
#
# The route is hermetic by construction: a host-effect claim is REFUSED at Eval
# (the refused-at-Eval set captured below), so it does not hang the job. Host-dependent
# floor_route_gap claims are therefore excluded automatically, not run.
#
# MEMORY BINDING — why GUNBC_BIND_MEMORY_CGROUP_BYTES is deliberately NOT set here:
#   The route fail-closes at startup when a kernel cgroup2 bind is REQUESTED but the
#   cgroup2 tree is not writable by the runner process (memory_governor.rs
#   CgroupBindDecision::Refused{CgroupTreeNotWritable}: "a bound that cannot be
#   written is not a bound and this run has none" — Refused is the ONLY decision that
#   stops the line; NotRequested, i.e. asking for no bound, is silence and proceeds).
#   Binding affects OOM behaviour, not compute time, so the BUILD-vs-CLAIM WALL this
#   PR exists to capture is unaffected by omitting it. The route still runs bounded by
#   the runner's own per-instance cgroup (actions-runner@srvNN.service is a distinct
#   cgroup per runner instance, so there is no cross-job OOM exposure). Peak RSS is
#   therefore reported as a PROCESS-TREE measurement under the runner slot, explicitly
#   NOT a kernel cgroup bound and NOT the required-lane enforcement memory budget
#   (ruling ci_job_budgets_closed_to_growth: memory budgets are to be lowered, not
#   raised; this run grows no standing budget).
#
# --- scaffold labelling (ctrl review policy, hand-shell gate) ---
# Hand-written shell, not model-generated. DO-NOT-MERGE one-off measuring scaffold:
# not emitted by gunbc.witness.compiler_gate_workflow, claims no permanence, adds no
# permanent budget.
#   removal: close PR #16527 and delete branch measure/required-v2-native once the
#     numbers are captured. NEVER merged; operator decision msg_be7bb738 authorized
#     RUNNING one measuring PR, not adding a permanent job (job roster stays closed
#     to growth, ruling gunbc.design_ruling::job_roster_closed_to_growth).
#   dissolution trigger (hand-shell gate): when this measurement's run-steps can be
#     EMITTED from the model by the same bash-emit capability that generates
#     gunbc.witness.compiler_gate_workflow (the modeled run-step emitter), this
#     hand-authored workflow is deleted rather than kept. Until then it is scaffold.
#   triggers: workflow_dispatch (via `gh workflow run --ref`, which the REST API
#     allows for any ref carrying the file) PLUS push scoped to
#     measure/required-v2-native only, so it fires automatically for this branch yet
#     can add no job to main or to PRs against main even if it lingered.
name: '[MEASURE][DO-NOT-MERGE] required-v2-native build-vs-claim wall'

on:
  workflow_dispatch: {}
  push:
    branches: [measure/required-v2-native]

permissions:
  contents: read

concurrency:
  group: measure-required-v2-native
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Bound the seed build's footprint so a co-running job is not starved.
  CARGO_BUILD_JOBS: '6'
  # Per-claim cooperative wall ceiling (ns): 8 s, the model's required-floor safety
  # limit (8000 ms), so no single claim runs past the job boundary. Cooperatively
  # enforced by the process (does NOT need a writable cgroup, so it still applies).
  CLAIM_IN_FLIGHT_WALL_CAP_NANOS: '8000000000'

jobs:
  measure-required-v2-native:
    name: 'measure required-v2-native (build vs claim) [DO NOT MERGE]'
    # Same runner class v2-bootstrap uses.
    runs-on: [self-hosted, linux, arm64]
    # Historical full-population required-v2-native was declined at ~4 h (#11003).
    # 180 min keeps the comparison apples-to-apples; the split we report shows how
    # far the run got within the envelope.
    timeout-minutes: 180
    steps:
      - name: 'checkout (measuring branch)'
        uses: actions/checkout@v4
        with:
          fetch-depth: '1'

      # Toolchain provisioning mirrors v2-bootstrap exactly (isolated homes, same
      # setup action + pin), so cargo is present for BOTH the seed build below and
      # the route's internal emitted-crate cargo build.
      - name: 'Isolate toolchain homes'
        run: |-
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: 'Install Rust toolchain'
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          components: rustfmt
          cache: false
          rustflags: ''
      - name: 'Pin rustup default (isolated RUSTUP_HOME has no default toolchain)'
        run: |-
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
          # Make the isolated cargo reachable by every later step AND by the
          # route's internal `cargo build` of the emitted crate.
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: 'Cache Cargo registry'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |-
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-

      - name: 'report environment'
        run: |
          echo "runner=$(uname -a)"
          echo "cores=$(nproc)"
          echo "cgroup v2: $(stat -fc %T /sys/fs/cgroup 2>/dev/null || echo n/a)"
          # Whether the route's kernel bind WOULD be creatable on this runner (the
          # route fail-closes if asked and the tree is not writable; we do not ask).
          if [ -w /sys/fs/cgroup/cgroup.procs ] 2>/dev/null; then echo "cgroup2_tree_writable=yes"; else echo "cgroup2_tree_writable=no (route runs unbound here; wall unaffected)"; fi
          command -v cargo || echo "cargo uses the isolated CARGO_HOME shim"
          "${CARGO_BIN:-cargo}" --version || true
          command -v perl && perl -MTime::HiRes -e1 && echo "perl-hires=ok"
          command -v pgrep >/dev/null && echo "pgrep=ok"

      - name: 'seed build claim_executor (BUILD wall, timed separately)'
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          # Clear -D warnings for the measuring build: this PR measures TIME, not
          # warning policy; a stray warning must not abort the wall capture.
          export RUSTFLAGS=''
          # Do NOT let `bash -e` abort before the wall/exit are recorded: the build
          # wall is the number this PR exists to capture, so capture it even on a
          # non-zero build (review 95623 finding 2), then surface the failure loudly.
          set +e
          t0=$(date +%s.%N)
          cargo build --release -p v1-compiler --bins > /tmp/seed_build.log 2>&1
          rc=$?
          t1=$(date +%s.%N)
          tail -25 /tmp/seed_build.log
          echo "SEED_BUILD_WALL_SECONDS=$(awk -v a=$t0 -v b=$t1 'BEGIN{printf "%.1f", b-a}')" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "SEED_BUILD_EXIT=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la target/release/claim_executor target/release/claim_batch 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] || [ ! -x target/release/claim_executor ]; then
            echo "::error::seed build failed (exit $rc) — the route cannot run without claim_executor"
            exit 1
          fi

      - name: 'run native route (CLAIM wall + route process-tree peak RSS)'
        # Continue even if the route exits nonzero or hits the inner timeout — we
        # want whatever numbers it produced. The log is ms-timestamped (perl
        # autoflush so it streams) so emit+build vs adjudicate (claim) separate.
        continue-on-error: true
        timeout-minutes: 168
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          export RUSTFLAGS=''
          date +%s.%N > /tmp/route_t0
          : > /tmp/route_proc_peak
          : > /tmp/route_proc_peak_time
          # Process-tree peak RSS sampler: every second sum VmRSS over claim_executor
          # and all its descendants (cargo, the emitted compiler it builds and spawns).
          # The route makes no kernel cgroup on this runner, so the route's true
          # resident footprint is its own process tree — measured, not inferred.
          (
            max=0
            while :; do
              roots=$(pgrep -x claim_executor 2>/dev/null)
              if [ -n "$roots" ]; then
                all="$roots"; frontier="$roots"
                while [ -n "$frontier" ]; do
                  nf=""
                  for p in $frontier; do
                    for c in $(pgrep -P "$p" 2>/dev/null); do nf="$nf $c"; done
                  done
                  frontier="$nf"; all="$all $nf"
                done
                total=0
                for p in $all; do
                  r=$(awk '/^VmRSS:/{print $2}' "/proc/$p/status" 2>/dev/null)
                  total=$((total + ${r:-0}))
                done
                bytes=$((total * 1024))
                if [ "$bytes" -gt "$max" ]; then
                  max=$bytes; echo "$bytes" > /tmp/route_proc_peak
                  awk -v a="$(cat /tmp/route_t0)" -v b="$(date +%s.%N)" 'BEGIN{printf "%.1f", b-a}' > /tmp/route_proc_peak_time
                fi
              fi
              sleep 1
            done
          ) &
          echo "$!" > /tmp/route_sampler_pid
          # perl timestamp BEFORE capturing to /tmp/route.log, with autoflush ($|=1)
          # so the log streams and the [Ns] markers land per-line.
          ./target/release/claim_executor --v2-native-route \
            --source-root dag --source-root src/v2 2>&1 \
            | perl -MTime::HiRes=time -pe 'BEGIN{$|=1;$t0=time} my $s=time-$t0; printf "[%.1fs] %s",$s,$_' \
            > /tmp/route.log
          echo "${PIPESTATUS[0]}" > /tmp/route_exit
          kill "$(cat /tmp/route_sampler_pid 2>/dev/null || echo 0)" 2>/dev/null || true
          tail -200 /tmp/route.log

      - name: 'report measurements'
        if: always()
        run: |
          kill "$(cat /tmp/route_sampler_pid 2>/dev/null || echo 0)" 2>/dev/null || true
          echo "## required-v2-native MEASUREMENT" >> "$GITHUB_STEP_SUMMARY"
          echo "_All figures measured on the self-hosted arm64 runner class. No kernel cgroup memory bind is requested (route fail-closes when the cgroup2 tree is not writable); peak RSS below is a PROCESS-TREE measurement under the runner slot, NOT a cgroup bound and NOT the required-lane memory budget._" >> "$GITHUB_STEP_SUMMARY"
          echo "ROUTE_EXIT=$(cat /tmp/route_exit 2>/dev/null || echo n/a)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/route_t0 ]; then
            rt0=$(cat /tmp/route_t0); rt1=$(date +%s.%N)
            echo "ROUTE_TOTAL_WALL_SECONDS=$(awk -v a=$rt0 -v b=$rt1 'BEGIN{printf "%.1f", b-a}')" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "### route peak RSS (process-tree, under runner slot; NOT a cgroup bound)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/route_proc_peak ]; then
            rpeak=$(sort -n /tmp/route_proc_peak | tail -1)
            echo "ROUTE_PEAK_RSS_BYTES(process_tree)=$rpeak" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ROUTE_PEAK_RSS_MiB(process_tree)=$(awk -v p=$rpeak 'BEGIN{printf "%.0f", p/1048576}')" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ROUTE_PEAK_AT_SECONDS=$(cat /tmp/route_proc_peak_time 2>/dev/null || echo n/a)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "ROUTE_PEAK_RSS(process_tree)=(not captured)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Build-vs-claim split from the ms-timestamped route log.
          echo "### build-vs-claim phase markers (elapsed time embedded)" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -nE "emitting .*seed, in-process|FRESH PRODUCT RECEIPT|establishing the discriminating red|native product|building cold|adjudicat" /tmp/route.log 2>/dev/null | head -40 | tee -a "$GITHUB_STEP_SUMMARY" || echo "(no phase markers captured)" | tee -a "$GITHUB_STEP_SUMMARY"
          # Refused-at-Eval set (the host-gated claims the route refuses, not runs).
          echo "### refused at Eval" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "refusing files=|V2-NATIVE REFUSAL" /tmp/route.log 2>/dev/null | tail -60 | tee -a "$GITHUB_STEP_SUMMARY" || echo "(none captured)" | tee -a "$GITHUB_STEP_SUMMARY"
          # Verdict census.
          echo "### verdict census" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "census|adjudicate|passed|refused " /tmp/route.log 2>/dev/null | tail -40 | tee -a "$GITHUB_STEP_SUMMARY" || echo "(none captured)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### full log tail" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -120 /tmp/route.log 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: 'attach full route log'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: required-v2-native-measure-log
          path: |-
            /tmp/route.log
            /tmp/route_proc_peak
            /tmp/route_proc_peak_time
            /tmp/route_exit
            /tmp/seed_build.log
          if-no-files-found: warn

      # GREEN MEANS THE ROUTE ACTUALLY RAN AND PASSED — no fabricated success.
      # The route step is continue-on-error (so numbers are always captured even
      # on a crash/timeout), which means the job would otherwise show green even
      # when the route aborted — exactly the vacuous 0.0s "success" the cgroup
      # bind refusal produced earlier. DESIGN.md Fail-closed
      # (gunbc.design_argument::fail_closed): "no plausible output is fabricated."
      # So after the numbers are captured, fail the job when the route did not
      # genuinely execute to a verdict, or exited non-zero.
      - name: 'gate: green only if the route truly ran and passed'
        if: always()
        run: |
          rc=$(cat /tmp/route_exit 2>/dev/null || echo MISSING)
          if [ ! -s /tmp/route.log ] || ! grep -qE "census|adjudicate|FRESH PRODUCT RECEIPT" /tmp/route.log 2>/dev/null; then
            echo "::error::route produced no verdicts/census (ROUTE_EXIT=$rc) — failing so a green run can never be read as 'route passed' when it did not (fail_closed: no plausible output is fabricated). See the report-measurements summary + route.log artifact."
            exit 1
          fi
          if [ "$rc" != "0" ]; then
            echo "::error::route exited non-zero (ROUTE_EXIT=$rc); the captured numbers are in the 'report measurements' summary — failing so a green run cannot be misread as 'route passed' (fail_closed)."
            exit 1
          fi
          echo "route executed to a verdict and passed (ROUTE_EXIT=0, verdicts present)"
