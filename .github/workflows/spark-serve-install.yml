# srv5 CANARY — STEP 2/3: install the pinned serving process, load ONE model, read back the
# identity that was ACTUALLY LOADED.
#
# THIS IS THE FIRST MUTATION IN THIS LANE. Everything before it observed. Scope is deliberately
# the narrowest that can work, and that scope is DERIVED, not preferred:
#
#   OBSERVED on srv5: `sudo -n` is NO, and the docker socket refuses briansrls.
#   CONSEQUENCE:      no systemd SYSTEM unit and no container are installable by this principal.
#                     ONE cause, two closures. What remains is user scope -- not a taste.
#
# So: a venv under $HOME, a systemd --user unit with lingering, bound to 127.0.0.1:8000. It writes
# no system unit, no authorized_keys, and nothing outside $HOME. A later reader must be able to see
# that a system unit would reintroduce a human step, which is why the grounding is stated here
# rather than left as an unexplained choice.
#
# PORT 8000 is a MEASURED choice: :11000 was identified as NVIDIA's own localhost web UI (HTTP 200,
# NVIDIA markup, /v1/models redirects to / so it is not an inference endpoint). 8000 was observed
# free in the same receipt.
name: spark-serve-install

# TEMPORARY branch-scoped trigger; not a required check and gates no pull request.
# DISSOLVE-ON: deleted once the canary sequence has produced its receipt.
on:
  workflow_dispatch:
  push:
    branches:
      - session/spark-serve-0
    paths:
      - .github/workflows/spark-serve-install.yml

permissions:
  contents: read
  id-token: write

jobs:
  install:
    name: Install pinned vLLM user-unit on srv5 and read back loaded identity
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 120
    env:
      SPARK_ADDR: 192.168.1.222
      SPARK_USER: briansrls
      MODEL_ID: Qwen/Qwen2.5-7B-Instruct
      # EXACT REVISION SHA, never a tag. A moving tag makes the identity claim unfalsifiable and
      # could differ between srv5 and srv6, silently breaking the exact-replay half of the canary.
      MODEL_REV: a09a35458c702b33eeacc393d103063234e8bc28
      SERVE_PORT: "8000"
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC/WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Materialize fleet key
        env:
          TOK: ${{ steps.auth.outputs.access_token }}
        run: |
          set -uo pipefail
          umask 077
          WORK="${RUNNER_TEMP}/serve"; mkdir -p "$WORK"
          cat > "$WORK/curlrc" <<EOF
          header = "Authorization: Bearer ${TOK}"
          EOF
          CODE=$(curl -s --config "$WORK/curlrc" -o "$WORK/v.json" -w '%{http_code}' \
            "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/fleet-automation-ssh-key/versions/latest:access")
          echo "AccessVersion http=$CODE"
          [ "$CODE" = "200" ] || { echo "REFUSED: cannot materialize fleet key"; exit 1; }
          python3 -c "import json,base64,sys;d=json.load(open('$WORK/v.json'));sys.stdout.write(base64.b64decode(d['payload']['data']).decode())" > "$WORK/id"
          chmod 600 "$WORK/id"
          rm -f "$WORK/curlrc" "$WORK/v.json"
          echo "key bytes: $(wc -c < "$WORK/id")"

      - name: Install venv + pinned vLLM (user scope)
        run: |
          set -uo pipefail
          WORK="${RUNNER_TEMP}/serve"
          SSH="ssh -i $WORK/id -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=$WORK/kh"
          # A pip RESOLVE is not an install. This step is where "a build exists for aarch64
          # Blackwell" becomes "a build installed", and the two are separate facts.
          if $SSH "${SPARK_USER}@${SPARK_ADDR}" 'bash -s' <<'REMOTE'; then RC=0; else RC=$?; fi
          set -uo pipefail
          mkdir -p "$HOME/gunbc-serve"
          cd "$HOME/gunbc-serve"
          if [ ! -x venv/bin/python ]; then python3 -m venv venv || exit 20; fi
          ./venv/bin/pip install --upgrade pip >/dev/null 2>&1
          echo "INSTALL-BEGIN vllm==0.26.0"
          ./venv/bin/pip install 'vllm==0.26.0' 2>&1 | tail -15
          PIPRC=${PIPESTATUS[0]}
          echo "INSTALL-PIP-RC=$PIPRC"
          [ "$PIPRC" = "0" ] || exit 21
          # An install is still not a LOAD. Import separately so an installed-but-broken build is a
          # distinct, named outcome rather than surfacing later as a mysterious startup failure.
          ./venv/bin/python -c 'import vllm;print("IMPORT-OK vllm",vllm.__version__)' 2>&1 | tail -5
          IMPRC=${PIPESTATUS[0]}
          [ "$IMPRC" = "0" ] || exit $IMPRC
          # RESOLVED-CLOSURE LOCK. A pinned model and a pinned vllm still leave the transitive
          # closure floating: torch and everything under it resolve to whatever pip picks that day.
          # That is LATENT on one host and becomes a real divergence the moment a second exists, so
          # the closure is captured HERE, from the host that actually works, and srv6 installs
          # against it rather than re-resolving. Replaying first and reconciling after is the one
          # ordering that makes a difference indistinguishable between "the day" and "the host".
          ./venv/bin/pip freeze > "$HOME/gunbc-serve/constraints.txt"
          echo "LOCK-LINES=$(wc -l < "$HOME/gunbc-serve/constraints.txt")"
          echo "LOCK-BEGIN"; cat "$HOME/gunbc-serve/constraints.txt"; echo "LOCK-END"
          exit 0
          REMOTE
          echo "install rc=$RC"
          [ "$RC" = "0" ] || { echo "MEASURED OUTCOME: vllm 0.26.0 did not install/import on GB10 (rc=$RC)."
                               echo "Reported as-is. No substitute serving stack is being selected here."
                               exit 1; }

      - name: Install systemd --user unit and start it
        run: |
          set -uo pipefail
          WORK="${RUNNER_TEMP}/serve"
          SSH="ssh -i $WORK/id -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=$WORK/kh"
          $SSH "${SPARK_USER}@${SPARK_ADDR}" \
            "MODEL_ID='${MODEL_ID}' MODEL_REV='${MODEL_REV}' SERVE_PORT='${SERVE_PORT}' bash -s" <<'REMOTE'
          set -uo pipefail
          # ENDPOINT AUTHENTICATION. The loopback bind and the fleet key on the transport are real
          # protection, but the contract word is "authenticated MODEL" and that is a property of the
          # ENDPOINT, not of the transport. These are two different threats and closing one does not
          # close the other, so the endpoint gets its own key and the bind stays on loopback.
          #
          # The key is generated ON THE HOST into a 0600 file and never leaves it: it is not in the
          # repo, not in CI logs, not in argv, and not in the unit file. Secret Manager is not the
          # home for it because this principal holds versions.access ONLY -- it cannot AddVersion --
          # so storing it there would require a privilege I provably do not have.
          # A prior generation may be in a restart loop; stop it BEFORE rewriting the unit so the
          # new definition is not racing an old process for the port and the GPU. A restart counter
          # in the twenties will have tripped the start limit, so the unit is FAILED rather than
          # merely stopped and a plain start would refuse -- reset-failed is systemd working, not a
          # new defect.
          systemctl --user stop gunbc-vllm.service 2>/dev/null || true
          systemctl --user stop gunbc-vllm-verify.service 2>/dev/null || true
          systemctl --user reset-failed gunbc-vllm.service 2>/dev/null || true

          # CACHE INTEGRITY AFTER THE SIGKILL LOOP. Twenty starts each SIGKILLed partway through a
          # 14.19 GiB checkpoint read is exactly the half-written-cache case, and a partially written
          # weight file that loads WITHOUT erroring is the worst available outcome. This does not
          # trust the loader to notice: the HF cache stores weights as blobs whose FILENAME IS THEIR
          # SHA256, so each blob is verifiable against the store's own naming -- an independent
          # check, not a re-download and not the loader vouching for itself.
          HUB="$HOME/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct"
          if [ -d "$HUB/blobs" ]; then
            BAD=0; N=0
            for b in "$HUB"/blobs/*; do
              [ -f "$b" ] || continue
              base=$(basename "$b")
              case "$base" in *[!0-9a-f]*) continue;; esac
              [ ${#base} -eq 64 ] || continue
              N=$((N+1))
              got=$(sha256sum "$b" | cut -d' ' -f1)
              if [ "$got" != "$base" ]; then echo "CACHE-CORRUPT blob=$base got=$got"; BAD=$((BAD+1)); fi
            done
            echo "CACHE-CHECK verified=$N corrupt=$BAD"
            if [ "$BAD" != "0" ]; then
              echo "CACHE-ACTION purging corrupt cache and re-fetching (clean outcome, not a failure to hide)"
              rm -rf "$HUB"
            fi
          else
            echo "CACHE-CHECK no-blobs-dir (nothing cached yet)"
          fi
          mkdir -p "$HOME/.config/systemd/user"
          if [ ! -s "$HOME/gunbc-serve/api-key.env" ]; then
            umask 077
            printf 'VLLM_API_KEY=%s\n' "$(head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 40)" \
              > "$HOME/gunbc-serve/api-key.env"
            chmod 600 "$HOME/gunbc-serve/api-key.env"
            echo "API-KEY=generated-on-host (value never printed)"
          else
            echo "API-KEY=already-present (value never printed, not rotated here)"
          fi
          cat > "$HOME/.config/systemd/user/gunbc-vllm.service" <<UNIT
          [Unit]
          Description=gunbc pinned vLLM serving canary
          After=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=%h/gunbc-serve
          Environment=HF_HUB_ENABLE_HF_TRANSFER=0
          EnvironmentFile=%h/gunbc-serve/api-key.env
          ExecStart=%h/gunbc-serve/venv/bin/vllm serve ${MODEL_ID} \\
            --revision ${MODEL_REV} \\
            --api-key \${VLLM_API_KEY} \\
            --host 127.0.0.1 --port ${SERVE_PORT} \\
            --max-model-len 4096
          Restart=on-failure
          RestartSec=10

          [Install]
          WantedBy=default.target
          UNIT
          # PER-START IDENTITY VERIFICATION. An initial-load readback describes a process that may
          # since have RESTARTED, and Restart=on-failure can bring the server back on whatever is in
          # cache -- nothing would distinguish that from the pinned revision. Retry that cannot verify
          # what came back is precisely the arm the readback exists to close, so the check runs as
          # ExecStartPost on EVERY start and the unit FAILS if the loaded revision disagrees.
          #
          # It reads the same independent fact as the workflow's readback: the snapshot path the
          # process actually mmapped. It does NOT consult /v1/models, which would echo the launch
          # argument and pass regardless of what loaded.
          cat > "$HOME/gunbc-serve/verify-loaded-revision.sh" <<'VERIFY'
          #!/usr/bin/env bash
          set -uo pipefail
          EXPECT="$1"; PORT="$2"
          for _ in $(seq 1 180); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/health" 2>/dev/null)
            [ "$code" = "200" ] && break
            sleep 10
          done
          PID=$(pgrep -f 'vllm serve' | head -1)
          if [ -z "$PID" ]; then echo "verify: REFUSE no serving process"; exit 10; fi
          GOT=$(grep -o 'snapshots/[0-9a-f]\{40\}' "/proc/$PID/maps" 2>/dev/null | sed 's|snapshots/||' | sort -u)
          if [ -z "$GOT" ]; then echo "verify: REFUSE loaded revision not observable"; exit 11; fi
          if [ "$GOT" != "$EXPECT" ]; then
            echo "verify: REFUSE loaded=$GOT expected=$EXPECT"; exit 12
          fi
          echo "verify: OK loaded=$GOT"
          VERIFY
          chmod +x "$HOME/gunbc-serve/verify-loaded-revision.sh"
          # VERIFICATION RUNS AS ITS OWN UNIT, NOT AS ExecStartPost. Attaching it to ExecStartPost
          # put it INSIDE the start deadline: with Type=simple systemd bounds ExecStart plus
          # ExecStartPost by TimeoutStartSec (90s default), so a verifier waiting for a multi-minute
          # weight load was terminated and the LOADING ENGINE WAS SIGKILLED WITH IT -- then restarted
          # into the same race, 20 times. The guard strangled the thing it guards, which is only
          # visible by execution. Ordered After= instead: a slow load can no longer read as a failed
          # start, and verification still refuses on mismatch by stopping the service.
          cat > "$HOME/.config/systemd/user/gunbc-vllm-verify.service" <<VUNIT
          [Unit]
          Description=gunbc pinned vLLM loaded-revision verification
          After=gunbc-vllm.service
          BindsTo=gunbc-vllm.service

          [Service]
          Type=oneshot
          ExecStart=%h/gunbc-serve/verify-loaded-revision.sh ${MODEL_REV} ${SERVE_PORT}
          ExecStopPost=/bin/sh -c 'test "\$EXIT_STATUS" = "0" || systemctl --user stop gunbc-vllm.service'

          [Install]
          WantedBy=default.target
          VUNIT

          # Lingering is what makes a --user unit survive logout; without it the "continuously
          # serve" requirement is not met by a unit that exists.
          loginctl enable-linger "$USER" 2>&1 | head -2 || echo "linger: refused (no privilege)"
          echo "LINGER=$(loginctl show-user "$USER" -p Linger --value 2>/dev/null || echo UNKNOWN)"
          systemctl --user daemon-reload
          systemctl --user enable --now gunbc-vllm.service 2>&1 | head -5
          systemctl --user enable gunbc-vllm-verify.service 2>&1 | head -3
          echo "UNIT-STATE=$(systemctl --user is-active gunbc-vllm.service 2>&1)"
          REMOTE

      - name: Wait for the model to LOAD (weights download on first start)
        run: |
          set -uo pipefail
          WORK="${RUNNER_TEMP}/serve"
          SSH="ssh -i $WORK/id -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=$WORK/kh"
          # WAIT BUDGET DERIVED FROM MEASURED PHASES, not from a guess. Run 31350806927 recorded
          # weights loading in 111s and the model resident at 14.29 GiB in 112.6s -- then entering
          # FIRST-RUN torch.compile, which binds no port until it completes. My previous 30-minute
          # flat budget expired during that compile and reported a healthy, ACTIVE unit as a failed
          # load. Three harness timeouts in a row now (ExecStartPost deadline, then this) share one
          # cause: I set time bounds from what I imagined the work costs instead of from what the
          # journal says it costs. Phases: download, load ~2min, compile (first run only, cached
          # after), bind. Budget 80 minutes, inside the 120-minute job timeout.
          for i in $(seq 1 240); do
            OUT=$($SSH "${SPARK_USER}@${SPARK_ADDR}" \
              "curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:${SERVE_PORT}/health 2>/dev/null; \
               echo \" state=\$(systemctl --user is-active gunbc-vllm.service 2>&1)\"" 2>&1)
            echo "[$i] $OUT"
            case "$OUT" in 200*) echo "SERVING"; exit 0;; esac
            case "$OUT" in *failed*) echo "UNIT FAILED — measured outcome, reporting rather than routing around it"
                                     $SSH "${SPARK_USER}@${SPARK_ADDR}" \
                                       'journalctl --user -u gunbc-vllm.service -n 40 --no-pager' 2>&1 | tail -40
                                     exit 1;; esac
            sleep 20
          done
          echo "TIMED OUT waiting for load -- last journal lines below name the phase reached,"
          echo "so a budget overrun is distinguishable from a hang or a crash:"
          $SSH "${SPARK_USER}@${SPARK_ADDR}" 'journalctl --user -u gunbc-vllm.service -n 40 --no-pager' 2>&1 | tail -40
          exit 1

      - name: INDEPENDENT identity readback (not /v1/models)
        run: |
          set -uo pipefail
          WORK="${RUNNER_TEMP}/serve"
          SSH="ssh -i $WORK/id -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o UserKnownHostsFile=$WORK/kh"
          # WHY NOT /v1/models: vLLM echoes the model id it was LAUNCHED with, and the revision is
          # not in that response at all. Comparing it to the pin compares a string against itself --
          # it would return the same answer if a different revision, a stale cache, or an unrelated
          # checkpoint had loaded. That is a receipt supplying its own denominator.
          #
          # WHAT IS INDEPENDENT: the HF loader resolves a revision to
          # ~/.cache/huggingface/hub/models--*/snapshots/<SHA>/ and the serving process MMAPS the
          # weight files from it. The SHA in /proc/<pid>/maps is therefore produced by the loading,
          # not by the launch arguments -- it is the path the process actually opened.
          $SSH "${SPARK_USER}@${SPARK_ADDR}" "SERVE_PORT='${SERVE_PORT}' bash -s" <<'REMOTE'
          set -uo pipefail
          PID=$(pgrep -f 'vllm serve' | head -1)
          echo "READBACK pid=${PID:-NONE}"
          if [ -z "$PID" ]; then echo "READBACK=UNESTABLISHED-no-process"; exit 0; fi

          echo "-- DEPENDENT (echoes launch args; recorded for contrast, proves nothing) --"
          echo "v1_models=$(curl -s -m 5 http://127.0.0.1:${SERVE_PORT}/v1/models | head -c 200)"

          echo "-- INDEPENDENT (produced by the load, not by the launch) --"
          MAPPED=$(grep -o 'snapshots/[0-9a-f]\{40\}' "/proc/$PID/maps" 2>/dev/null | sed 's|snapshots/||' | sort -u | tr '\n' ' ')
          echo "mmapped_revisions=${MAPPED:-NONE}"
          FD=$(ls -l "/proc/$PID/fd" 2>/dev/null | grep -o 'snapshots/[0-9a-f]\{40\}' | sed 's|snapshots/||' | sort -u | tr '\n' ' ')
          echo "open_fd_revisions=${FD:-NONE}"
          echo "cache_snapshots=$(ls "$HOME/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/" 2>/dev/null | tr '\n' ' ' || echo ABSENT)"
          if [ -z "$MAPPED" ] && [ -z "$FD" ]; then
            echo "READBACK=UNESTABLISHED-no-independent-fact-observable"
          fi
          REMOTE

      - name: Shred credential material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/serve" || true
