name: fleet-desired
on:
  workflow_run:
    workflows: [witnesses]
    branches: [main]
    types: [completed]
concurrency:
  queue: max
  group: gunbc-fleet-desired-admission
  cancel-in-progress: false
jobs:
  admit:
    runs-on: [self-hosted, linux, arm64, srv1]
    timeout-minutes: 60
    if: github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain homes
        run: |
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2), at which point this carrier and its unmarked siblings ci_isolate_toolchain_script and ci_pin_rustup_default_script dissolve together
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Hostile legacy shared-home writer discriminator
        run: |
          set -eu
          LEGACY_HOME="$RUNNER_TEMP/legacy-shared-toolchain"
          PRIVATE_A="$RUNNER_TEMP/private-toolchain-a"
          PRIVATE_B="$RUNNER_TEMP/private-toolchain-b"
          mkdir -p "$LEGACY_HOME/bin" "$PRIVATE_A/bin" "$PRIVATE_B/bin"
          cp "$CARGO_HOME/bin/rustup" "$PRIVATE_A/bin/rustup"
          cp "$CARGO_HOME/bin/rustup" "$PRIVATE_B/bin/rustup"
          ( i=0; while [ "$i" -lt 64 ]; do "$PRIVATE_A/bin/rustup" --version >/dev/null; i=$((i + 1)); done ) & A_PID=$!
          ( i=0; while [ "$i" -lt 64 ]; do "$PRIVATE_B/bin/rustup" --version >/dev/null; i=$((i + 1)); done ) & B_PID=$!
          ( i=0; while [ "$i" -lt 64 ]; do rm -f "$LEGACY_HOME/bin/rustup"; cp "$CARGO_HOME/bin/rustup" "$LEGACY_HOME/bin/rustup"; i=$((i + 1)); done ) & C_PID=$!
          wait "$A_PID"
          wait "$B_PID"
          wait "$C_PID"
      - name: Build the admission binary
        run: |
          cargo build --release -p v1-compiler --bin gunbc
      - name: Stage the floor run event payload
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target"
          rm -f "$ROOT/target/fleet-desired-authorized-action.sh"
          cp "$GITHUB_EVENT_PATH" "$ROOT/target/fleet-desired-admission-event.json"
      - name: Decide whether the floor admits this revision
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/fleet_desired_admission.dag --function admit_fleet_desired_from_floor_event_wet
      - name: Execute the authorized fleet-desired advance
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          test -s "$ROOT/target/fleet-desired-authorized-action.sh"
          sh "$ROOT/target/fleet-desired-authorized-action.sh"
