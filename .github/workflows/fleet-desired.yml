name: fleet-desired
on:
  workflow_run:
    workflows: [witnesses]
    branches: [main]
    types: [completed]
concurrency:
  queue: max
  group: gunbc-fleet-desired-admission
  cancel-in-progress: false
jobs:
  admit:
    runs-on: [self-hosted, linux, arm64, srv1]
    timeout-minutes: 60
    if: github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Expose installed rustup to setup guard
        run: |
          CARGO_BIN_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          echo "$CARGO_BIN_DIR" >> "$GITHUB_PATH"
          test -x "$CARGO_BIN_DIR/rustup" || { echo "::error::installed rustup missing at $CARGO_BIN_DIR/rustup"; exit 1; }
          stat -c '%d:%i:%s:%y:%z' "$CARGO_BIN_DIR/rustup" > "$RUNNER_TEMP/gunbc-rustup-before.stat"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
      - name: Record the toolchain environment
        run: |
          echo "host=$(hostname) runner=${RUNNER_NAME:-unset}"
          echo "PATH=$PATH"
          CARGO_BIN_DIR="${CARGO_HOME:-$HOME/.cargo}/bin"
          case ":$PATH:" in *":$CARGO_BIN_DIR:"*) ;; *) echo "::error::cargo bin dir absent from PATH: $CARGO_BIN_DIR"; exit 1;; esac
          stat -c '%d:%i:%s:%y:%z' "$CARGO_BIN_DIR/rustup" > "$RUNNER_TEMP/gunbc-rustup-after.stat"
          if ! cmp -s "$RUNNER_TEMP/gunbc-rustup-before.stat" "$RUNNER_TEMP/gunbc-rustup-after.stat"; then echo "::error::rustup dispatcher was rewritten during this job"; diff -u "$RUNNER_TEMP/gunbc-rustup-before.stat" "$RUNNER_TEMP/gunbc-rustup-after.stat" || true; exit 1; fi
          which -a rustfmt || echo "which rustfmt: absent from PATH"
          which -a cargo rustc rustup || echo "which cargo/rustc/rustup: absent from PATH"
          ls -l "${CARGO_HOME:-$HOME/.cargo}/bin" || echo "cargo bin dir: absent"
          rustup which rustfmt || echo "rustup which rustfmt: no answer"
          rustup toolchain list || echo "rustup toolchain list: no answer"
          rustup default || echo "rustup default: no answer"
        if: "!cancelled()"
      - name: Build the admission binary
        run: |
          cargo build --release -p v1-compiler --bin gunbc
      - name: Stage the floor run event payload
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target"
          rm -f "$ROOT/target/fleet-desired-authorized-action.sh"
          cp "$GITHUB_EVENT_PATH" "$ROOT/target/fleet-desired-admission-event.json"
      - name: Decide whether the floor admits this revision
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/fleet_desired_admission.dag --function admit_fleet_desired_from_floor_event_wet
      - name: Execute the authorized fleet-desired advance
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          test -s "$ROOT/target/fleet-desired-authorized-action.sh"
          sh "$ROOT/target/fleet-desired-authorized-action.sh"
