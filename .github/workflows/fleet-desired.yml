name: fleet-desired
on:
  workflow_run:
    workflows: [witnesses]
    branches: [main]
    types: [completed]
concurrency:
  queue: max
  group: gunbc-fleet-desired-admission
  cancel-in-progress: false
jobs:
  admit:
    runs-on: [self-hosted, linux, arm64, srv1]
    timeout-minutes: 60
    if: github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain homes
        run: |
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2), at which point this carrier dissolves together with ci_pin_rustup_default_script (marked on its own declaration) and ci_isolate_toolchain_script (still unmarked)
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting the isolated RUSTUP_HOME's active toolchain as its default and resolving CARGO_BIN, required because an isolated RUSTUP_HOME starts with no default; leaf rustup/awk/command -v strings remain until a typed toolchain-selection effect lands on host_effect_apply (shell-to-intent Phase 2), at which point this carrier dissolves together with ci_toolchain_home_isolation_script and ci_isolate_toolchain_script
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Build the admission binary
        run: |
          cargo build --release -p v1-compiler --bin gunbc
      - name: Stage the floor run event payload
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target"
          rm -f "$ROOT/target/fleet-desired-authorized-action.sh"
          cp "$GITHUB_EVENT_PATH" "$ROOT/target/fleet-desired-admission-event.json"
      - name: Decide whether the floor admits this revision
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/fleet_desired_admission.dag --function admit_fleet_desired_from_floor_event_wet
      - name: Execute the authorized fleet-desired advance
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          test -s "$ROOT/target/fleet-desired-authorized-action.sh"
          sh "$ROOT/target/fleet-desired-authorized-action.sh"
