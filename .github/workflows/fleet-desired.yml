# Generated by gunbc.fleet_desired_admission_workflow expected_fleet_desired_yml — do not hand-edit.
# Authority: gunbc.fleet_desired_admission_workflow fleet_desired_admission_workflow; regen via tools.generated_artifact_gate main_wet.
name: fleet-desired
on:
  push:
    branches: [main]
concurrency:
  queue: max
  group: gunbc-fleet-desired-admission
  cancel-in-progress: false
jobs:
  admit:
    runs-on: [self-hosted, linux, arm64, srv1]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: "0"
      - name: Isolate toolchain homes
        run: |-
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          components: rustfmt
          cache: false
          rustflags: -D warnings
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |-
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Fetch the merge queue's compiler pair candidate for this revision
        id: pair_candidate
        run: |
          set -e
          'rm' '-rf' "$RUNNER_TEMP"'/pair-candidate/'
          'mkdir' '-p' "$RUNNER_TEMP"'/pair-candidate/'
          CHECKED_OUT=$('git' 'rev-parse' 'HEAD')
          'curl' '-fsSL' '--max-time' '300' '-H' 'Authorization: Bearer '"$GITHUB_TOKEN" '-H' 'Accept: application/vnd.github+json' '-o' "$RUNNER_TEMP"'/pair-candidate/runs.json' "$GITHUB_API_URL"'/repos/'"$GITHUB_REPOSITORY"'/actions/runs?event=merge_group&status=success&per_page=100&head_sha='"$CHECKED_OUT" || ('echo' '::error title=pair-candidate RunsUnreadable::the Actions API did not answer the merge_group run query; that is not absence'; exit 1)
          'jq' '-e' '.total_count == (.workflow_runs | length)' "$RUNNER_TEMP"'/pair-candidate/runs.json' || ('echo' '::error title=pair-candidate RunsListingTruncated::the merge_group run listing for this revision is not complete on one page; an unread page is not absence'; exit 1)
          RUN_ID=$('jq' '-r' '[.workflow_runs[] | select(.path == ".github/workflows/witnesses.yml")] | sort_by(.created_at) | reverse | .[0].id // empty' "$RUNNER_TEMP"'/pair-candidate/runs.json')
          if '[' '-z' "$RUN_ID" ']'; then 'echo' 'pair-candidate: absent (no successful merge_group run of the required workflow on this revision); this run builds gunbc itself'; 'echo' 'standing=absent' | 'tee' '-a' "$GITHUB_OUTPUT" > '/dev/null'; exit 0; fi
          'curl' '-fsSL' '--max-time' '300' '-H' 'Authorization: Bearer '"$GITHUB_TOKEN" '-H' 'Accept: application/vnd.github+json' '-o' "$RUNNER_TEMP"'/pair-candidate/artifacts.json' "$GITHUB_API_URL"'/repos/'"$GITHUB_REPOSITORY"'/actions/runs/'"$RUN_ID"'/artifacts?per_page=100&name=compiler-pair-candidate' || ('echo' '::error title=pair-candidate ArtifactsUnreadable::the Actions API did not answer the candidate artifact query; that is not absence'; exit 1)
          'jq' '-e' '.total_count == (.artifacts | length)' "$RUNNER_TEMP"'/pair-candidate/artifacts.json' || ('echo' '::error title=pair-candidate ArtifactsListingTruncated::the run'\''s candidate artifact listing is not complete on one page; an unread page is not absence'; exit 1)
          ARTIFACT_ID=$('jq' '-r' '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty' "$RUNNER_TEMP"'/pair-candidate/artifacts.json')
          if '[' '-z' "$ARTIFACT_ID" ']'; then 'echo' 'pair-candidate: absent (the newest successful merge_group run of this revision holds no unexpired candidate artifact); this run builds gunbc itself'; 'echo' 'standing=absent' | 'tee' '-a' "$GITHUB_OUTPUT" > '/dev/null'; exit 0; fi
          'curl' '-fsSL' '--max-time' '300' '-H' 'Authorization: Bearer '"$GITHUB_TOKEN" '-H' 'Accept: application/vnd.github+json' '-o' "$RUNNER_TEMP"'/pair-candidate/candidate.zip' "$GITHUB_API_URL"'/repos/'"$GITHUB_REPOSITORY"'/actions/artifacts/'"$ARTIFACT_ID"'/zip' || ('echo' '::error title=pair-candidate ArtifactUndownloadable::the candidate artifact exists and could not be downloaded; that is not absence'; exit 1)
          'python3' '-m' 'zipfile' '-e' "$RUNNER_TEMP"'/pair-candidate/candidate.zip' "$RUNNER_TEMP"'/pair-candidate/unzipped' || ('echo' '::error title=pair-candidate ArtifactUnreadable::the candidate artifact is not a readable zip'; exit 1)
          '[' '-f' "$RUNNER_TEMP"'/pair-candidate/unzipped/pack.tar' ']' || ('echo' '::error title=pair-candidate ArtifactIncomplete::the candidate artifact holds no pack object'; exit 1)
          'echo' 'FABRIC_BLOB_OUT='"$RUNNER_TEMP"'/pair-candidate/unzipped/pack.tar' | 'tee' '-a' "$GITHUB_ENV" > '/dev/null'
          'echo' 'pair-candidate: present, artifact '"$ARTIFACT_ID"
          'echo' 'standing=present' | 'tee' '-a' "$GITHUB_OUTPUT" > '/dev/null'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        timeout-minutes: 10
      - name: Verify the candidate as this tree's canonical compiler pair, then promote it
        run: |
          set -e
          ROOT=$('git' 'rev-parse' '--show-toplevel')
          'printf' '%s' 'release-bins.preimage
          release-bins.manifest
          release-bins.tgz
          ' > "$RUNNER_TEMP"'/pack-object.expected'
          'tar' '-tf' "$FABRIC_BLOB_OUT" > "$RUNNER_TEMP"'/pack-object.listing'
          'cmp' '-s' "$RUNNER_TEMP"'/pack-object.listing' "$RUNNER_TEMP"'/pack-object.expected' || ('echo' '::error title=release-bins PackListingNotRoster::the downloaded pack'\''s archive listing is not exactly the roster (an extra, duplicate, directory or escaping entry)'; exit 1)
          'rm' '-rf' "$RUNNER_TEMP"'/canonical-pack'
          'mkdir' '-p' "$RUNNER_TEMP"'/canonical-pack'
          'tar' '-xf' "$FABRIC_BLOB_OUT" '-C' "$RUNNER_TEMP"'/canonical-pack' '--no-same-owner'
          'grep' '-qxF' 'kind=gunbc.compiler_pair_release_bins' "$RUNNER_TEMP"'/canonical-pack/release-bins.preimage' || ('echo' '::error title=release-bins ConsumerProductKindMismatch::the pack'\''s preimage does not name the product kind gunbc.compiler_pair_release_bins this consumer asked for; it is another product'\''s pack'; exit 1)
          OBJECT_FORMAT=$('git' '-C' "$ROOT" 'rev-parse' '--show-object-format')
          SOURCE_TREE=$('git' '-C' "$ROOT" 'rev-parse' 'HEAD^{tree}')
          '[' '-n' "$OBJECT_FORMAT" ']' || ('echo' '::error title=release-bins AxisValueUnread::the key input OBJECT_FORMAT read back empty, so the key would not name the build; refusing to key'; exit 1)
          '[' '-n' "$SOURCE_TREE" ']' || ('echo' '::error title=release-bins AxisValueUnread::the key input SOURCE_TREE read back empty, so the key would not name the build; refusing to key'; exit 1)
          SOURCE_CLOSURE='tree:'"$OBJECT_FORMAT"':'"$SOURCE_TREE"
          'grep' '-qxF' 'source_closure='"$SOURCE_CLOSURE" "$RUNNER_TEMP"'/canonical-pack/release-bins.preimage' || ('echo' '::error title=release-bins ConsumerSourceTreeMismatch::the pack was keyed on a different source tree than this job'\''s checkout'; exit 1)
          'printf' '%s' 'claim_executor
          gunbc
          build_diagnostics
          ' > "$RUNNER_TEMP"'/release-bins.roster'
          'tar' '-tzf' "$RUNNER_TEMP"'/canonical-pack/release-bins.tgz' > "$RUNNER_TEMP"'/pack-listing.out'
          'cmp' '-s' "$RUNNER_TEMP"'/pack-listing.out' "$RUNNER_TEMP"'/release-bins.roster' || ('echo' '::error title=release-bins PackListingNotRoster::the downloaded pack'\''s archive listing is not exactly the roster (an extra, duplicate, directory or escaping entry)'; exit 1)
          'cut' '-c' '67-' "$RUNNER_TEMP"'/canonical-pack/release-bins.manifest' > "$RUNNER_TEMP"'/manifest-names.out'
          'cmp' '-s' "$RUNNER_TEMP"'/manifest-names.out' "$RUNNER_TEMP"'/release-bins.roster' || ('echo' '::error title=release-bins ManifestRosterMismatch::the downloaded manifest does not name exactly the gunbc.ci_release_bins roster in order'; exit 1)
          if 'grep' '-qvE' '^[0-9a-f]{64}  [A-Za-z0-9_]+$' "$RUNNER_TEMP"'/canonical-pack/release-bins.manifest'; then ('echo' '::error title=release-bins ManifestMalformed::the downloaded manifest has a line that is not one well-formed sha256 record for a roster member'; exit 1); fi
          'rm' '-rf' "$RUNNER_TEMP"'/canonical-check'
          'mkdir' '-p' "$RUNNER_TEMP"'/canonical-check'
          'tar' '-xzf' "$RUNNER_TEMP"'/canonical-pack/release-bins.tgz' '-C' "$RUNNER_TEMP"'/canonical-check' '--no-same-owner'
          'printf' '%s' 'claim_executor:regular file:1
          gunbc:regular file:1
          ' > "$RUNNER_TEMP"'/member-types.expected'
          ('cd' "$RUNNER_TEMP"'/canonical-check' && 'stat' '-c' '%n:%F:%h' 'claim_executor' 'gunbc') > "$RUNNER_TEMP"'/member-types.out'
          'cmp' '-s' "$RUNNER_TEMP"'/member-types.out' "$RUNNER_TEMP"'/member-types.expected' || ('diff' "$RUNNER_TEMP"'/member-types.expected' "$RUNNER_TEMP"'/member-types.out' || ':' 'no-op'; ('echo' '::error title=release-bins MemberNotRegularFile::the downloaded pack has a member that is not a self-contained regular file (a link, special file or hard-link dependency; the report above names it)'; exit 1))
          ('cd' "$RUNNER_TEMP"'/canonical-check' && 'find' 'claim_executor' 'gunbc' '-maxdepth' '0' '!' '-perm' '-u+x') > "$RUNNER_TEMP"'/member-nonexec.out'
          '[' '!' '-s' "$RUNNER_TEMP"'/member-nonexec.out' ']' || ('cat' "$RUNNER_TEMP"'/member-nonexec.out'; ('echo' '::error title=release-bins MemberNotExecutable::the downloaded pack has a member that is not executable (listed above)'; exit 1))
          ('cd' "$RUNNER_TEMP"'/canonical-check' && 'sha256sum' '--strict' '--quiet' '-c' "$RUNNER_TEMP"'/canonical-pack/release-bins.manifest') || ('echo' '::error title=release-bins MemberDigestMismatch::the downloaded member bytes do not match the manifest under strict checking; refusing before any member is promoted or run'; exit 1)
          'mkdir' '-p' "$ROOT"'/target/release'
          ('cd' "$ROOT"'/target/release' && 'rm' '-f' 'claim_executor' 'gunbc')
          ('cd' "$RUNNER_TEMP"'/canonical-check' && 'cp' '-p' 'claim_executor' 'gunbc' "$ROOT"'/target/release''/')
          'rm' '-rf' "$RUNNER_TEMP"'/canonical-check'
          "$ROOT"'/target/release/claim_executor' '--verify-build-artifacts' "$ROOT"'/target/release''/claim_executor' "$ROOT"'/target/release''/gunbc'
          'echo' 'release-bins: canonical gunbc.compiler_pair_release_bins pack verified and promoted'
        if: steps.pair_candidate.outputs.standing == 'present'
        timeout-minutes: 10
      - name: Build the admission binary (no candidate for this revision)
        run: |
          cargo build --release -p v1-compiler --bin gunbc
        if: steps.pair_candidate.outputs.standing == 'absent'
      - name: Stage the floor run event payload
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target"
          rm -f "$ROOT/target/fleet-desired-authorized-action.sh"
          cp "$GITHUB_EVENT_PATH" "$ROOT/target/fleet-desired-admission-event.json"
      - name: Decide whether the floor admits this revision
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/fleet/fleet_desired_admission.dag --function admit_fleet_desired_from_push_wet
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Execute the authorized fleet-desired advance
        run: |
          set -eu
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          test -s "$ROOT/target/fleet-desired-authorized-action.sh"
          sh "$ROOT/target/fleet-desired-authorized-action.sh"
