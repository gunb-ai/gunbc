      contents: read
    steps:
      - name: Checkout the commit this lane judges
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
        if: "!inputs.compose_caller_dag"
      - name: Checkout gunbc's default branch for a calling repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: gunb-ai/gunbc
          fetch-depth: 0
          persist-credentials: false
        if: inputs.compose_caller_dag
      - name: Checkout the calling repository's commit
