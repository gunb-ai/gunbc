    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      compose_caller_dag:
        description: Judge gunb-ai/gunbc's default branch with the calling repository's dag/ copied into it
        required: false
        type: boolean
  schedule:
    - cron: 37 3 * * *
permissions:
  contents: read
concurrency:
  group: witness-floor-${{ github.event_name == 'merge_group' && format('mg-{0}', github.sha) || github.event_name == 'workflow_dispatch' && github.event.inputs.expected_healed_sha != '' && format('heal-{0}', github.event.inputs.expected_healed_sha) || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
