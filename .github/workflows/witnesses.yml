  witnesses:
    runs-on: ubuntu-24.04-arm
    needs: [compiler, clippy]
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
    steps:
      - name: Every required lane must have succeeded
        run: |-
          echo "required lanes: compiler=$COMPILER clippy=$CLIPPY"
          if [ "$COMPILER" = failure ] || [ "$CLIPPY" = failure ]; then echo "::error::a required lane concluded failure (compiler=$COMPILER clippy=$CLIPPY) - open that job's log" >&2; exit 1; fi
          if [ "$COMPILER" != success ] || [ "$CLIPPY" != success ]; then echo "::error::a required lane produced no conclusion of its own, so this head is unobserved rather than failed (compiler=$COMPILER clippy=$CLIPPY)" >&2; exit 1; fi
        env:
          COMPILER: ${{ needs.compiler.result }}
          CLIPPY: ${{ needs.clippy.result }}
