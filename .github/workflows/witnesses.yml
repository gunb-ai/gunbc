          if ! 'git' 'diff' '--quiet' '--' 'dag'; then 'echo' '::error::the calling repository replaces these files of gunbc'\''s tree, so two modules claim one storage path:'; 'git' 'diff' '--name-only' '--' 'dag'; exit 1; fi
          'rm' '-rf' '--' '.gunbc-caller'
