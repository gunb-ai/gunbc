name: witnesses
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: witness-floor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  GUNBC_EXPECTED_RED_ROSTER_JOIN: expected_red_roster_join.tsv
  GUNBC_REQUIRED_FLOOR_DISPOSITION: required_floor_disposition.tsv
  GUNBC_LONG_HOME_STORAGE_AGREEMENT: long_home_storage_agreement.tsv
jobs:
  witnesses:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: false
      - name: Build the witness fold
        id: build_witness_fold
        run: |
          cargo build --release -p v1-compiler --bin claim_executor --bin gunbc
      - name: "Required CI: parse, regen, regen determinism, witness floor"
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT"
          'target/release/claim_executor' '--required-ci' '--source-root' 'dag' '--source-root' 'src/v2'
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
