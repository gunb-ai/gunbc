name: witnesses
on:
  workflow_dispatch:
  merge_group:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: witness-floor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  GUNBC_EXPECTED_RED_ROSTER_JOIN: expected_red_roster_join.tsv
  GUNBC_REQUIRED_FLOOR_DISPOSITION: required_floor_disposition.tsv
  GUNBC_LONG_HOME_STORAGE_AGREEMENT: long_home_storage_agreement.tsv
jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain homes
        run: |
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Discriminate private homes from a hostile legacy writer
        run: |
          # dissolve-on: ci_hostile_legacy_writer_discriminator_script -- foreign-executor concurrency control proving readers sharing a mutable toolchain path are disrupted by a hostile reinstall while readers bound to the job-private CARGO_HOME are unaffected. Its process synchronization, executable replacement, and observations remain shell until a typed concurrent filesystem/tool-execution interference probe effect lands on host_effect_apply (shell-to-intent Phase 2); neither the environment-binding effect nor the toolchain-selection effect can replace this observation
          set -eu
          ROOT="$RUNNER_TEMP/gunbc-hostile-toolchain-writer"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          await_barrier() { WAIT_PATH=$1; WAIT_LABEL=$2; I=0; while [ ! -e "$WAIT_PATH" ]; do I=$((I + 1)); if [ "$I" -gt 3000 ]; then echo "::error::hostile-writer $WAIT_LABEL barrier not reached: $WAIT_PATH" >&2; return 1; fi; sleep 0.01; done; }
          run_arm() {
            ARM=$1; READER_HOME=$2; LEGACY_HOME=$3
            mkdir -p "$READER_HOME/bin" "$LEGACY_HOME/bin" "$ARM"
            printf '#!/bin/sh\nprintf safe\n' > "$READER_HOME/bin/toolchain-probe"
            chmod +x "$READER_HOME/bin/toolchain-probe"
            ( await_barrier "$ARM/writer-ready" reader-a-writer-ready && touch "$ARM/reader-a-observed" && [ "$("$READER_HOME/bin/toolchain-probe")" = safe ] ) & A=$!
            ( await_barrier "$ARM/writer-ready" reader-b-writer-ready && touch "$ARM/reader-b-observed" && [ "$("$READER_HOME/bin/toolchain-probe")" = safe ] ) & B=$!
            ( printf '#!/bin/sh\nprintf hostile\n' > "$ARM/reinstall" && chmod +x "$ARM/reinstall" && mv -f "$ARM/reinstall" "$LEGACY_HOME/bin/toolchain-probe" && touch "$ARM/writer-ready" && await_barrier "$ARM/readers-done" writer-readers-done ) & C=$!
            if wait "$A"; then AS=0; else AS=$?; fi; if wait "$B"; then BS=0; else BS=$?; fi; touch "$ARM/readers-done"; if wait "$C"; then CS=0; else CS=$?; fi
            if [ "$CS" -ne 0 ] || [ ! -e "$ARM/reader-a-observed" ] || [ ! -e "$ARM/reader-b-observed" ]; then echo "::error::hostile-writer control failed before reader comparison in $ARM" >&2; return 2; fi
            if [ "$AS" -eq 0 ] && [ "$BS" -eq 0 ]; then return 0; else return 1; fi
          }
          SHARED="$ROOT/shared"
          if run_arm "$ROOT/shared-arm" "$SHARED" "$SHARED"; then SHARED_STATUS=0; else SHARED_STATUS=$?; fi
          if [ "$SHARED_STATUS" -ne 1 ]; then echo "::error::hostile writer shared-arm expected reader interference, status=$SHARED_STATUS" >&2; exit 1; fi
          LEGACY="$ROOT/legacy"
          case "${CARGO_HOME:-}" in "$RUNNER_TEMP/cargo") PRIVATE_READER="$CARGO_HOME" ;; *) PRIVATE_READER="$LEGACY" ;; esac
          if run_arm "$ROOT/private-arm" "$PRIVATE_READER" "$LEGACY"; then PRIVATE_STATUS=0; else PRIVATE_STATUS=$?; fi
          if [ "$PRIVATE_STATUS" -ne 0 ]; then echo "::error::hostile legacy writer affected private-home readers, status=$PRIVATE_STATUS" >&2; exit 1; fi
      - name: Build the witness fold
        id: build_witness_fold
        run: |
          cargo build --release -p v1-compiler --bins
      - name: Record the toolchain environment
        run: |
          echo "host=$(hostname) runner=${RUNNER_NAME:-unset}"
          echo "PATH=$PATH"
          which -a rustfmt || echo "which rustfmt: absent from PATH"
          which -a cargo rustc rustup || echo "which cargo/rustc/rustup: absent from PATH"
          if [ -z "${CARGO_HOME:-}" ] || [ -z "${RUSTUP_HOME:-}" ]; then echo "::error::ToolchainHomesNotIsolated CARGO_HOME=${CARGO_HOME:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset} -- the isolation step did not run, so this job shares a toolchain with every other runner slot on this host and a concurrent install can replace a binary mid-run" >&2; exit 1; fi
          ls -l "$CARGO_HOME/bin" || echo "cargo bin dir: absent"
          rustup which rustfmt || echo "rustup which rustfmt: no answer"
          rustup toolchain list || echo "rustup toolchain list: no answer"
          rustup default || echo "rustup default: no answer"
        if: "!cancelled()"
      - name: "Required CI: build lane (regen, v2 emission)"
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT"
          'target/release/claim_executor' '--required-ci' '--source-root' 'dag' '--source-root' 'src/v2' '--required-lane' 'build'
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
  floor:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain homes
        run: |
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Discriminate private homes from a hostile legacy writer
        run: |
          # dissolve-on: ci_hostile_legacy_writer_discriminator_script -- foreign-executor concurrency control proving readers sharing a mutable toolchain path are disrupted by a hostile reinstall while readers bound to the job-private CARGO_HOME are unaffected. Its process synchronization, executable replacement, and observations remain shell until a typed concurrent filesystem/tool-execution interference probe effect lands on host_effect_apply (shell-to-intent Phase 2); neither the environment-binding effect nor the toolchain-selection effect can replace this observation
          set -eu
          ROOT="$RUNNER_TEMP/gunbc-hostile-toolchain-writer"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          await_barrier() { WAIT_PATH=$1; WAIT_LABEL=$2; I=0; while [ ! -e "$WAIT_PATH" ]; do I=$((I + 1)); if [ "$I" -gt 3000 ]; then echo "::error::hostile-writer $WAIT_LABEL barrier not reached: $WAIT_PATH" >&2; return 1; fi; sleep 0.01; done; }
          run_arm() {
            ARM=$1; READER_HOME=$2; LEGACY_HOME=$3
            mkdir -p "$READER_HOME/bin" "$LEGACY_HOME/bin" "$ARM"
            printf '#!/bin/sh\nprintf safe\n' > "$READER_HOME/bin/toolchain-probe"
            chmod +x "$READER_HOME/bin/toolchain-probe"
            ( await_barrier "$ARM/writer-ready" reader-a-writer-ready && touch "$ARM/reader-a-observed" && [ "$("$READER_HOME/bin/toolchain-probe")" = safe ] ) & A=$!
            ( await_barrier "$ARM/writer-ready" reader-b-writer-ready && touch "$ARM/reader-b-observed" && [ "$("$READER_HOME/bin/toolchain-probe")" = safe ] ) & B=$!
            ( printf '#!/bin/sh\nprintf hostile\n' > "$ARM/reinstall" && chmod +x "$ARM/reinstall" && mv -f "$ARM/reinstall" "$LEGACY_HOME/bin/toolchain-probe" && touch "$ARM/writer-ready" && await_barrier "$ARM/readers-done" writer-readers-done ) & C=$!
            if wait "$A"; then AS=0; else AS=$?; fi; if wait "$B"; then BS=0; else BS=$?; fi; touch "$ARM/readers-done"; if wait "$C"; then CS=0; else CS=$?; fi
            if [ "$CS" -ne 0 ] || [ ! -e "$ARM/reader-a-observed" ] || [ ! -e "$ARM/reader-b-observed" ]; then echo "::error::hostile-writer control failed before reader comparison in $ARM" >&2; return 2; fi
            if [ "$AS" -eq 0 ] && [ "$BS" -eq 0 ]; then return 0; else return 1; fi
          }
          SHARED="$ROOT/shared"
          if run_arm "$ROOT/shared-arm" "$SHARED" "$SHARED"; then SHARED_STATUS=0; else SHARED_STATUS=$?; fi
          if [ "$SHARED_STATUS" -ne 1 ]; then echo "::error::hostile writer shared-arm expected reader interference, status=$SHARED_STATUS" >&2; exit 1; fi
          LEGACY="$ROOT/legacy"
          case "${CARGO_HOME:-}" in "$RUNNER_TEMP/cargo") PRIVATE_READER="$CARGO_HOME" ;; *) PRIVATE_READER="$LEGACY" ;; esac
          if run_arm "$ROOT/private-arm" "$PRIVATE_READER" "$LEGACY"; then PRIVATE_STATUS=0; else PRIVATE_STATUS=$?; fi
          if [ "$PRIVATE_STATUS" -ne 0 ]; then echo "::error::hostile legacy writer affected private-home readers, status=$PRIVATE_STATUS" >&2; exit 1; fi
      - name: Build the witness fold
        id: build_witness_fold
        run: |
          cargo build --release -p v1-compiler --bin claim_executor --bin gunbc
      - name: Record the toolchain environment
        run: |
          echo "host=$(hostname) runner=${RUNNER_NAME:-unset}"
          echo "PATH=$PATH"
          which -a rustfmt || echo "which rustfmt: absent from PATH"
          which -a cargo rustc rustup || echo "which cargo/rustc/rustup: absent from PATH"
          if [ -z "${CARGO_HOME:-}" ] || [ -z "${RUSTUP_HOME:-}" ]; then echo "::error::ToolchainHomesNotIsolated CARGO_HOME=${CARGO_HOME:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset} -- the isolation step did not run, so this job shares a toolchain with every other runner slot on this host and a concurrent install can replace a binary mid-run" >&2; exit 1; fi
          ls -l "$CARGO_HOME/bin" || echo "cargo bin dir: absent"
          rustup which rustfmt || echo "rustup which rustfmt: no answer"
          rustup toolchain list || echo "rustup toolchain list: no answer"
          rustup default || echo "rustup default: no answer"
        if: "!cancelled()"
      - name: "Required CI: witnesses lane (parse, witness floor)"
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT"
          'target/release/claim_executor' '--required-ci' '--source-root' 'dag' '--source-root' 'src/v2' '--required-lane' 'witnesses'
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: Upload the floor's admission roster
        uses: actions/upload-artifact@v4
        with:
          name: required-floor-disposition
          path: required_floor_disposition.tsv
          if-no-files-found: error
          retention-days: 14
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: Upload the expected-red roster join
        uses: actions/upload-artifact@v4
        with:
          name: expected-red-roster-join
          path: expected_red_roster_join.tsv
          if-no-files-found: error
          retention-days: 14
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: Upload the long-home storage agreement
        uses: actions/upload-artifact@v4
        with:
          name: long-home-storage-agreement
          path: long_home_storage_agreement.tsv
          if-no-files-found: error
          retention-days: 14
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: Every v1-compiler binary target compiles
        id: build_all_binary_targets
        run: |
          cargo build --release -p v1-compiler
        if: "!cancelled()"
  witnesses:
    runs-on: [self-hosted, linux, arm64]
    needs: [build, floor]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Both required lanes must have succeeded
        run: |
          BUILD='${{ needs.build.result }}'
          FLOOR='${{ needs.floor.result }}'
          PULL_REQUEST='${{ github.event.pull_request.number }}'
          EVENT_NAME='${{ github.event_name }}'
          MEASURED_HEAD='${{ github.event.pull_request.head.sha }}'
          RUN_ID='${{ github.run_id }}'
          HEAD_STANDING='not-applicable'
          if '[' "$EVENT_NAME" '=' 'pull_request' ']'; then HEAD_STANDING='unobserved'; fi
          'echo' 'required floor attempt: pull_request='"$PULL_REQUEST"' measured_head='"$MEASURED_HEAD"' run_id='"$RUN_ID"' head_standing='"$HEAD_STANDING"
          VERDICT='stands-green'
          if '[' "$BUILD" '!=' 'success' ']' || '[' "$FLOOR" '!=' 'success' ']'; then VERDICT='stands-unestablished'; fi
          if '[' "$BUILD" '=' 'failure' ']' || '[' "$FLOOR" '=' 'failure' ']'; then VERDICT='stands-red'; fi
          MECHANISM='unestablished'
          ATTRIBUTION='unestablished'
          'echo' 'required lanes: build='"$BUILD"' floor='"$FLOOR"' verdict='"$VERDICT"' mechanism='"$MECHANISM"' attribution='"$ATTRIBUTION"
          if '[' "$VERDICT" '=' 'stands-red' ']'; then 'echo' '::error::a required lane concluded failure; that alone does not establish whether its subject was evaluated, so read the log before assuming a defect in the diff (build='"$BUILD"' floor='"$FLOOR"' mechanism='"$MECHANISM"' attribution='"$ATTRIBUTION"') - open that job'\''s log' >&2; exit 1; fi
          if '[' "$VERDICT" '=' 'stands-unestablished' ']'; then 'echo' '::error::a required lane produced no conclusion of its own, so this head'\''s floor verdict is unobservable rather than failed; rerun it (build='"$BUILD"' floor='"$FLOOR"' mechanism='"$MECHANISM"' attribution='"$ATTRIBUTION"') - open that job'\''s log' >&2; exit 1; fi
        if: always()
