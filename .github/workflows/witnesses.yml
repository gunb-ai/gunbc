name: witnesses
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: witness-floor-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  GUNBC_EXPECTED_RED_ROSTER_JOIN: expected_red_roster_join.tsv
jobs:
  witnesses:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: false
      - name: Build the witness fold
        id: build_witness_fold
        run: |
          cargo build --release -p v1-compiler --bin claim_executor --bin gunbc --bin v1_src_dag_parse
      - name: src/v1 .dag sources parse
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cd "$ROOT" && "$ROOT/target/release/v1_src_dag_parse"
      - name: "Regen fixed point: first generation matches committed candidate"
        id: required_regen
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --required-regen --source-root "$ROOT/dag" --source-root "$ROOT/src/v2"
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: "Regen determinism: G0 emit reproduces itself on a second pass"
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --required-regen-fixed-point --source-root "$ROOT/dag" --source-root "$ROOT/src/v2"
        if: "!cancelled() && steps.required_regen.outcome == 'success'"
      - name: "Behavioral receipt discriminates: equivalent arm and divergent arm"
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --behavioral-receipt-selftest --source-root "$ROOT/dag" --source-root "$ROOT/src/v2"
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: "Behavioral receipt: changed authorities are equivalent to their mirrors"
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --behavioral-receipt-plan --source-root "$ROOT/dag" --source-root "$ROOT/src/v2"
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
      - name: All witnesses (one prepared subject, one fold)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --required-floor --source-root "$ROOT/dag" --source-root "$ROOT/src/v2"
        if: "!cancelled() && steps.build_witness_fold.outcome == 'success'"
