      - name: Compose the calling repository's dag/ into gunbc's
        run: |
          # dissolve-on: compiler_gate_compose_caller_statements -- bash-node carrier of CallerTreeComposition, copying a calling repository's dag/ into gunbc's and refusing a caller file that replaces one of gunbc's. Dissolves when the compiler admits a second checkout as a source root whose modules the source layout (gunbc.source_layout) admits or refuses by namespace, so the copy is deleted and a clash is that layout's located refusal.
