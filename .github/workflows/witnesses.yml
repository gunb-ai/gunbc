          for GUNBC_TOOLCHAIN_FS_PATH in "${RUNNER_TEMP:-/path-that-does-not-exist}"/rustup/toolchains/*/bin/rustc "${RUNNER_TEMP:-/path-that-does-not-exist}"/rustup/toolchains/*/bin/rustfmt "${RUNNER_TEMP:-/path-that-does-not-exist}"/cargo/bin/cargo; do if [ -e "$GUNBC_TOOLCHAIN_FS_PATH" ]; then GUNBC_TOOLCHAIN_FS_STAT=$(stat -c 'size=%s mtime_epoch=%Y mtime=%y inode=%i' "$GUNBC_TOOLCHAIN_FS_PATH" 2>&1 || echo stat-unavailable); echo "$GUNBC_TOOLCHAIN_FS_PREFIX kind=file path=$GUNBC_TOOLCHAIN_FS_PATH exists=yes $GUNBC_TOOLCHAIN_FS_STAT"; else echo "$GUNBC_TOOLCHAIN_FS_PREFIX kind=file path=$GUNBC_TOOLCHAIN_FS_PATH exists=no size=unavailable mtime_epoch=unavailable mtime=unavailable inode=unavailable"; fi; done
          for GUNBC_TOOLCHAIN_FS_PATH in "${RUNNER_TEMP:-/path-that-does-not-exist}"/rustup/toolchains/*/bin "${RUNNER_TEMP:-/path-that-does-not-exist}"/rustup/toolchains "${RUNNER_TEMP:-/path-that-does-not-exist}"/cargo/bin; do if [ -d "$GUNBC_TOOLCHAIN_FS_PATH" ]; then GUNBC_TOOLCHAIN_FS_STAT=$(stat -c 'mtime_epoch=%Y mtime=%y inode=%i' "$GUNBC_TOOLCHAIN_FS_PATH" 2>&1 || echo stat-unavailable); echo "$GUNBC_TOOLCHAIN_FS_PREFIX kind=directory path=$GUNBC_TOOLCHAIN_FS_PATH exists=yes $GUNBC_TOOLCHAIN_FS_STAT"; else echo "$GUNBC_TOOLCHAIN_FS_PREFIX kind=directory path=$GUNBC_TOOLCHAIN_FS_PATH exists=no mtime_epoch=unavailable mtime=unavailable inode=unavailable"; fi; done
        if: always()
  heal-generated-artifacts:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 90
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - name: WIF auth (OIDC -> fleet-cloud-convergence SA, access token only)
        id: wif_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
        timeout-minutes: 5
      - name: Mint the gunbai-bot installation token the heal push advances under
        id: heal_app_token
        run: |
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/app-installation-key"
          HDR_FILE="$RUNNER_TEMP/app-installation-auth-header"
          JWT_FILE="$RUNNER_TEMP/app-installation-jwt"
          TOKEN_HEADERS="$RUNNER_TEMP/app-installation-token-headers"
          TOKEN_BODY="$RUNNER_TEMP/app-installation-token-body"
          cleanup() { rm -f "$KEY_FILE" "$HDR_FILE" "$JWT_FILE" "$TOKEN_HEADERS" "$TOKEN_BODY" "$RUNNER_TEMP/app-installation-key-sm-body"; unset GUNBC_APP_INSTALLATION_TOKEN GH_TOKEN; }
          trap cleanup EXIT
          printf 'Authorization: Bearer %s\n' "$WIF_ACCESS_TOKEN" > "$HDR_FILE"
          SM_BODY="$RUNNER_TEMP/app-installation-key-sm-body"
          SM_CODE="$(curl -sS -o "$SM_BODY" -w '%{http_code}' -H @"$HDR_FILE" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/agent-github-app-private-key/versions/latest:access")"
          rm -f "$HDR_FILE"
          if [ "$SM_CODE" != 200 ]; then rm -f "$SM_BODY"; echo "AppInstallationKeyUnreadable: Secret Manager answered HTTP $SM_CODE for projects/gunbai-secrets/secrets/agent-github-app-private-key/versions/latest to the fleet-cloud-convergence principal. 403 means the version exists and is not readable OR does not exist -- REMEDY: confirm projects/gunbai-secrets/secrets/agent-github-app-private-key exists and that roles/secretmanager.secretAccessor is bound on it for fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com. Minting NO token." >&2; exit 1; fi
          python3 -c 'import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(open(sys.argv[1]))["payload"]["data"]))' "$SM_BODY" > "$KEY_FILE"
          rm -f "$SM_BODY"
          chmod 600 "$KEY_FILE"
          NOW=$(date +%s)
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          JWT_HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          JWT_PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW-60))" "$((NOW+540))" "3909950" | b64url)
          JWT_SIG=$(printf '%s.%s' "$JWT_HEADER" "$JWT_PAYLOAD" | openssl dgst -sha256 -sign "$KEY_FILE" | b64url)
          rm -f "$KEY_FILE"
          printf 'Authorization: Bearer %s.%s.%s\n' "$JWT_HEADER" "$JWT_PAYLOAD" "$JWT_SIG" > "$JWT_FILE"
          curl -sS -X POST -H @"$JWT_FILE" -H 'Accept: application/vnd.github+json' -D "$TOKEN_HEADERS" -o "$TOKEN_BODY" "https://api.github.com/app/installations/136673607/access_tokens"
          rm -f "$JWT_FILE"
          if ! head -n1 "$TOKEN_HEADERS" | grep -q ' 201 '; then echo "AppInstallationTokenRefused: GitHub answered $(head -n1 "$TOKEN_HEADERS" | tr -d '\r') for the gunbai-bot installation; a revoked key, a removed installation, or a missing contents or workflows permission each look like this -- inspect the App's installation on the organization" >&2; exit 1; fi
          GUNBC_APP_INSTALLATION_TOKEN="$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["token"])' "$TOKEN_BODY")"
          rm -f "$TOKEN_HEADERS" "$TOKEN_BODY"
          export GUNBC_APP_INSTALLATION_TOKEN
          echo "app-installation: token minted in-run for app gunbai-bot installation 136673607 (one-hour lifetime; key wiped; token held in this step's environment only)"
          echo "::add-mask::$GUNBC_APP_INSTALLATION_TOKEN"
          echo "token=$GUNBC_APP_INSTALLATION_TOKEN" >> "$GITHUB_OUTPUT"
        env:
          WIF_ACCESS_TOKEN: ${{ steps.wif_auth.outputs.access_token }}
      - name: Checkout triggering branch head (heal pushes the regeneration back to this branch)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.heal_app_token.outputs.token }}
      - name: Isolate toolchain homes
        run: |
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Build the regenerator this job runs against its own checkout
        id: build_witness_fold
        run: |
          cargo build --release -p v1-compiler --bin gunbc
      - name: Declare which ledger rows this heal will repair
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/instruments/generated_artifact_gate.dag --function heal_repair_declaration
      - name: Regenerate every committed generated artifact
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/instruments/generated_artifact_gate.dag --function main_wet
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/instruments/generated_artifact_gate.dag --function main
      - name: Converge repository-local git config
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/repo/repo_local_git_config.dag --function converge
      - name: Commit and push the regeneration
        id: heal_commit_push
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          git config user.name "gunbc-ci-auto-heal"
          git config user.email "gunbc-ci-auto-heal@users.noreply.github.com"
          AUTHOR_COMMIT_DRIFT=""
          echo "heal_author_commit_required=0" >> "$GITHUB_OUTPUT"
          if [ -n "$AUTHOR_COMMIT_DRIFT" ]; then
            rm -rf "heal-author-commit-required"
            for p in $AUTHOR_COMMIT_DRIFT; do
              if ! mkdir -p "heal-author-commit-required/$(dirname "$p")"; then echo "::error::HealRepairBundleIncomplete path=$p" >&2; exit 1; fi
              if ! cp "$p" "heal-author-commit-required/$p"; then echo "::error::HealRepairBundleIncomplete path=$p" >&2; exit 1; fi
            done
            echo "heal_author_commit_required=1" >> "$GITHUB_OUTPUT"
          fi
          PRIOR_HEAD=$(git rev-parse HEAD)
          if git diff --cached --quiet; then
            if [ -n "$AUTHOR_COMMIT_DRIFT" ]; then
              echo "::error::HealAuthorCommitRequired head=$PRIOR_HEAD author_commit_paths=$AUTHOR_COMMIT_DRIFT cause=ManagedInstallationGrantUnobserved+ManagedInstallationGrantUnobserved+ManagedInstallationGrantUnobserved regen_command='gunbc run --source-root dag --source-root src/v2 --entry dag/gunbc/instruments/generated_artifact_gate.dag --function main_wet'" >&2
              exit 1
            fi
            echo "HealNoChange head=$PRIOR_HEAD"
            exit 0
          else
            CHANGED_ARTIFACTS=$(git diff --cached --name-only)
            HEAL_MESSAGE_FILE=$(mktemp)
            printf '%s\n' "chore: regenerate drifted generated artifacts (ci auto-heal)" > "$HEAL_MESSAGE_FILE"
            if [ ! -s "target/heal-repair-declaration.txt" ]; then echo "::error::HealRepairDeclarationMissing path=target/heal-repair-declaration.txt -- the declaration step did not produce a judgment for this head, so a commit here would record zero repairs over an unstated population" >&2; exit 1; fi
            cat "target/heal-repair-declaration.txt" >> "$HEAL_MESSAGE_FILE"
            git commit --no-verify -F "$HEAL_MESSAGE_FILE"
            HEALED_HEAD=$(git rev-parse HEAD)
            git -c core.hooksPath= push origin HEAD:${{ github.head_ref || github.ref_name }}
            echo "HealProduced prior_head=$PRIOR_HEAD healed_head=$HEALED_HEAD changed_artifacts=$CHANGED_ARTIFACTS"
            GUNBC_HEALED_HEAD="$HEALED_HEAD" GUNBC_HEAL_BRANCH_REF="${{ github.head_ref || github.ref_name }}" "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/instruments/ci_heal_dispatch.dag --function main
            echo "SupersededByHealedHead prior_head=$PRIOR_HEAD healed_head=$HEALED_HEAD; revalidation-required"
            if [ -n "$AUTHOR_COMMIT_DRIFT" ]; then
              echo "::error::HealAuthorCommitRequired head=$HEALED_HEAD author_commit_paths=$AUTHOR_COMMIT_DRIFT cause=ManagedInstallationGrantUnobserved+ManagedInstallationGrantUnobserved+ManagedInstallationGrantUnobserved regen_command='gunbc run --source-root dag --source-root src/v2 --entry dag/gunbc/instruments/generated_artifact_gate.dag --function main_wet'" >&2
            fi
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload the author-commit-required regeneration
        uses: actions/upload-artifact@v4
        with:
          name: heal-author-commit-required
          path: heal-author-commit-required
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
        if: always() && steps.heal_commit_push.outputs.heal_author_commit_required == '1'
  witnesses:
    runs-on: [self-hosted, linux, arm64]
    needs: [required-witnesses-build, required-witnesses-floor]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Every required lane must have succeeded
        run: |
          HEAD_STANDING='not-applicable'
          if '[' "$EVENT_NAME" '=' 'pull_request' ']'; then HEAD_STANDING='unobserved'; fi
          'echo' 'required floor attempt: pull_request='"$PULL_REQUEST"' measured_head='"$MEASURED_HEAD"' run_id='"$RUN_ID"' head_standing='"$HEAD_STANDING"
          VERDICT='stands-green'
          if '[' "$BUILD" '!=' 'success' ']' || '[' "$FLOOR" '!=' 'success' ']'; then VERDICT='stands-unestablished'; fi
          if '[' "$BUILD" '=' 'failure' ']' || '[' "$FLOOR" '=' 'failure' ']'; then VERDICT='stands-red'; fi
          MECHANISM='unestablished'
          ATTRIBUTION='unestablished'
          'echo' 'required lanes: build='"$BUILD"' floor='"$FLOOR"' verdict='"$VERDICT"' mechanism='"$MECHANISM"' attribution='"$ATTRIBUTION"
          if '[' "$VERDICT" '=' 'stands-red' ']'; then 'echo' '::error::a required lane concluded failure; that alone does not establish whether its subject was evaluated, so read the log before assuming a defect in the diff (build='"$BUILD"' floor='"$FLOOR"' mechanism='"$MECHANISM"' attribution='"$ATTRIBUTION"') - open that job'\''s log' >&2; exit 1; fi
          if '[' "$VERDICT" '=' 'stands-unestablished' ']'; then 'echo' '::error::a required lane produced no conclusion of its own, so this head'\''s floor verdict is unobservable rather than failed; rerun it (build='"$BUILD"' floor='"$FLOOR"' mechanism='"$MECHANISM"' attribution='"$ATTRIBUTION"') - open that job'\''s log' >&2; exit 1; fi
        env:
          BUILD: ${{ needs['required-witnesses-build'].result }}
          FLOOR: ${{ needs['required-witnesses-floor'].result }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          MEASURED_HEAD: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        if: always()
