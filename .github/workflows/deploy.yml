name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: gunbc-live-deploy-srv1
jobs:
  deploy:
    runs-on: [self-hosted, linux, arm64, srv1]
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: false
      - name: Build the deploy binary
        run: |
          cargo build --release -p v1-compiler --bin gunbc
      - name: Materialize the pinned provider runtime
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/host_codex_runtime_provision.dag --function materialize_codex_runtime_on_local_host
      - name: Deploy the dashboard to srv1
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/live_deploy/apply.dag --function live_deploy_apply_srv1_wet
      - name: Advance the admitted fleet revision
        run: |
          # 🟡 dissolve-on: gunbc_ci_advance_fleet_desired_script — concat-built foreign-executor (GitHub Actions run:) CAS ref advance (git ls-remote + push --force-with-lease onto gunbc.fleet_main_revision fleet_desired_ref_name); DISSOLVES WHEN the SCM ref-update realization lands as the typed git.Core CAS service op (membership-diff spine classify_change SCM-ref arm) invoked via host_effect_apply
          set -eu
          DESIRED_REF=refs/fleet/desired
          CURRENT=$(git ls-remote origin "$DESIRED_REF" | cut -f1)
          if [ -z "$CURRENT" ]; then
          git push origin "$GITHUB_SHA:$DESIRED_REF"
          echo "[fleet-desired] created $DESIRED_REF -> $GITHUB_SHA"
          else
          git push --force-with-lease="$DESIRED_REF:$CURRENT" origin "$GITHUB_SHA:$DESIRED_REF"
          echo "[fleet-desired] advanced $DESIRED_REF: $CURRENT -> $GITHUB_SHA (CAS expected-prior held)"
          fi
