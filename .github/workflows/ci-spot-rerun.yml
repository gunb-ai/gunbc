name: ci spot rerun

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun-once:
    # Only retry real failures. `cancelled` is usually `concurrency.cancel-in-progress`:
    # a newer run superseded this one — rerunning `--failed` duplicates work and can
    # fight the active run (extra v3 jobs, Zig setup canceled again).
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: [self-hosted, linux, x64, gunbc-quick]
    timeout-minutes: 5
    steps:
      # `run_attempt < 3` allows two automatic reruns after the initial run (three
      # attempts total) when self-hosted spot runners drop mid-suite jobs.
      - name: Rerun failed jobs (automatic retry)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "Rerunning failed jobs for workflow run ${RUN_ID} after conclusion=${CONCLUSION}"
          gh run rerun "${RUN_ID}" --repo "${REPO}" --failed
