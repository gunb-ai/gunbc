# SCAFFOLD — foreign-executor workflow for Wave 1 expected-red failure census.
# Hand-shell transport (operator-scoped diagnostic): workflow_dispatch + session branch only;
# production witnesses.yml does not set census env vars. Operator verdict: Wave 1 partition
# lane (read-only census before qualification vs binding-wall decision).
# dissolve-on: Wave 1 name-resolution debt repaid OR floor-enrolled census lens subsumes
# `required_floor_failure_census` host transport (same trigger as
# CLI_RUN_REQUIRED_FLOOR_FAILURE_CENSUS_SCAFFOLD_MARKER in cli_run.rs).
# Authority: docs/probes/floor_cut_name_resolution_partition.md;
#   src/v1/stage0/src/bin/required_floor_failure_census.rs.
# Receipt: `rg required-floor-census.yml .github/workflows` == 1 until deletion.
name: required-floor-census
on:
  workflow_dispatch:
  push:
    branches:
      - session/valiant-hawk-198
permissions:
  contents: read
concurrency:
  group: required-floor-census-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target-census
jobs:
  census:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      # 🟡 dissolve-on: required_floor_failure_census hand-Rust build — DISSOLVES WHEN
      # census transport is modeled in .dag or subsumed by a floor-enrolled lens
      # (CLI_RUN_REQUIRED_FLOOR_FAILURE_CENSUS_SCAFFOLD_MARKER).
      - name: Build census binary
        run: cargo build --release -p v1-compiler --bin required_floor_failure_census
      # 🟡 dissolve-on: inline hand-shell census + partition post-process — same trigger as
      # docs/probes/run_floor_cut_name_resolution_census.sh; authority partition.md.
      - name: Run expected-red failure census
        run: |
          ROOT=$(git rev-parse --show-toplevel)
          cd "$ROOT"
          BIN="${CARGO_TARGET_DIR:-$ROOT/target}/release/required_floor_failure_census"
          "$BIN" docs/probes/floor_cut_name_resolution_census.tsv
          python3 docs/probes/floor_cut_name_resolution_partition.py \
            docs/probes/floor_cut_name_resolution_census.tsv \
            -o docs/probes/floor_cut_name_resolution_partition.tsv
      - name: Upload partition artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floor-cut-name-resolution-partition
          path: |
            docs/probes/floor_cut_name_resolution_census.tsv
            docs/probes/floor_cut_name_resolution_partition.tsv
