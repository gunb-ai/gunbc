# Generated by gunbc.heal_publisher_workflow expected_heal_publisher_workflow_yml — do not hand-edit.
# Authority: gunbc.heal_publisher_workflow heal_publisher_workflow; regen via tools.generated_artifact_gate main_wet.
name: heal-publish
on:
  workflow_run:
    workflows: [heal]
    branches: ["**"]
    types: [completed]
concurrency:
  queue: max
  group: heal-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    steps:
      - name: Checkout the default branch this publisher runs from
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download the candidate the triggering heal run produced
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: heal-repair-candidate
          path: heal-candidate
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Isolate toolchain homes
        run: |
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          components: rustfmt
          cache: false
          rustflags: -D warnings
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Build the publisher this job runs from the default branch
        id: build_witness_fold
        run: |
          GUNBC_FLOOR_LOG='gunbc-floor-cmd.log'
          'set' '+e'
          'set' '-o' 'pipefail'
          ('sh' '-e' '-c' 'cargo build --release -p v1-compiler --bin gunbc') 2>&1 | 'tee' "$GUNBC_FLOOR_LOG"
          GUNBC_FLOOR_EXIT="$?"
          GUNBC_FLOOR_RECEIPT='gunbc-floor-outcome.txt'
          GUNBC_FLOOR_CLASS='structural'
          GUNBC_FLOOR_SIGNATURE=''
          if '[' "$GUNBC_FLOOR_EXIT" '-eq' '126' ']'; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='CommandInvokedCannotExecute'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' "$GUNBC_FLOOR_EXIT" '-eq' '127' ']'; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='CommandNotFound'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' "$GUNBC_FLOOR_EXIT" '-eq' '0' ']'; then GUNBC_FLOOR_CLASS='none'; GUNBC_FLOOR_SIGNATURE=''; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'MemoryStallRefusedPageThrash' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='MemoryStallRefusedPageThrash'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'The runner has received a shutdown signal' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='RunnerLost'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'sccache: error: failed to execute compile' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheFailedToExecuteCompile'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' '(exit status: 254)' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheRustcWrapperExit254'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'sccache: encountered fatal error' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheFatalError'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'failed to spawn' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='ProcessSpawnFailure'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'Resource temporarily unavailable' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='ResourceTemporarilyUnavailable'; fi
          if (! '[' '-f' "$GUNBC_FLOOR_RECEIPT" ']') || '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' || ('[' "$GUNBC_FLOOR_CLASS" '=' 'infra' ']' && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=structural' "$GUNBC_FLOOR_RECEIPT"))) || ('[' "$GUNBC_FLOOR_CLASS" '=' 'none' ']' && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=structural' "$GUNBC_FLOOR_RECEIPT")) && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=infra' "$GUNBC_FLOOR_RECEIPT"))); then 'printf' 'class=%s\nsignature=%s\nexit=%s\n' "$GUNBC_FLOOR_CLASS" "$GUNBC_FLOOR_SIGNATURE" "$GUNBC_FLOOR_EXIT" > "$GUNBC_FLOOR_RECEIPT"; if '[' "$GUNBC_FLOOR_CLASS" '=' 'infra' ']'; then 'echo' '::error title=environment::floor_class='"$GUNBC_FLOOR_CLASS"' signature='"$GUNBC_FLOOR_SIGNATURE"' exit='"$GUNBC_FLOOR_EXIT"'; this is not a verdict about the diff. Attempt receipt: '"$GUNBC_FLOOR_RECEIPT"; fi; if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']'; then 'echo' '::error title=subject::floor_class='"$GUNBC_FLOOR_CLASS"' exit='"$GUNBC_FLOOR_EXIT"'; read the step log for the subject defect'; fi; fi
          'exit' "$GUNBC_FLOOR_EXIT"
      - name: Admit the candidate against this checkout's policy, with no publication credential
        run: |
          set -euo pipefail
          GUNBC_CG=/sys/fs/cgroup/gunbc-publish
          echo "+memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          sudo mkdir -p "$GUNBC_CG"
          echo 12884901888 | sudo tee "$GUNBC_CG/memory.max" >/dev/null
          echo $$ | sudo tee "$GUNBC_CG/cgroup.procs" >/dev/null
          cat "$GUNBC_CG/memory.max"
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/heal_publication.dag --function heal_publication_admit_wet
        env:
          HEAL_CANDIDATE_DIRECTORY: heal-candidate
          GITHUB_TOKEN: ${{ github.token }}
      - name: Federate to the publisher's own identity (access token only, five minutes)
        id: heal_publisher_wif
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-heal-publisher/providers/github-heal-publisher-oidc
          service_account: heal-publisher@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
        if: hashFiles('heal-candidate/heal-repair-candidate-blob-*') != ''
      - name: Publish the admitted repair, fast-forward only, and read it back
        run: |
          set -euo pipefail
          GUNBC_CG=/sys/fs/cgroup/gunbc-publish
          echo "+memory" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          sudo mkdir -p "$GUNBC_CG"
          echo 12884901888 | sudo tee "$GUNBC_CG/memory.max" >/dev/null
          echo $$ | sudo tee "$GUNBC_CG/cgroup.procs" >/dev/null
          cat "$GUNBC_CG/memory.max"
          set -euo pipefail
          umask 077
          KEY_FILE="$RUNNER_TEMP/heal-publisher-app-key"
          HDR_FILE="$RUNNER_TEMP/heal-publisher-auth-header"
          JWT_FILE="$RUNNER_TEMP/heal-publisher-app-jwt"
          TOKEN_HEADERS="$RUNNER_TEMP/heal-publisher-token-headers"
          TOKEN_BODY="$RUNNER_TEMP/heal-publisher-token-body"
          cleanup() { rm -f "$KEY_FILE" "$HDR_FILE" "$JWT_FILE" "$TOKEN_HEADERS" "$TOKEN_BODY" "$RUNNER_TEMP/heal-publisher-app-key-sm-body"; unset GITHUB_TOKEN; }
          trap cleanup EXIT
          printf 'Authorization: Bearer %s\n' "$WIF_ACCESS_TOKEN" > "$HDR_FILE"
          SM_BODY="$RUNNER_TEMP/heal-publisher-app-key-sm-body"
          SM_CODE="$(curl -sS -o "$SM_BODY" -w '%{http_code}' -H @"$HDR_FILE" "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/agent-github-app-private-key/versions/latest:access")"
          rm -f "$HDR_FILE"
          if [ "$SM_CODE" != 200 ]; then rm -f "$SM_BODY"; echo "HealPublisherAppKeyUnreadable: Secret Manager answered HTTP $SM_CODE for projects/gunbai-secrets/secrets/agent-github-app-private-key/versions/latest to the heal-publisher@gunbai-secrets.iam.gserviceaccount.com principal. 403 means the version exists and is not readable OR does not exist -- REMEDY: run gunbc.auth.heal_publisher_provision heal_publisher_key_provision_with_supplied_token, which provisions the key into that secret and binds roles/secretmanager.secretAccessor for that service account only after reading the version back. Minting NO token, so nothing is published." >&2; exit 1; fi
          python3 -c 'import sys,json,base64; sys.stdout.buffer.write(base64.b64decode(json.load(open(sys.argv[1]))["payload"]["data"]))' "$SM_BODY" > "$KEY_FILE"
          rm -f "$SM_BODY"
          chmod 600 "$KEY_FILE"
          NOW=$(date +%s)
          b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
          JWT_HEADER=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          JWT_PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((NOW-60))" "$((NOW+540))" "3909950" | b64url)
          JWT_SIG=$(printf '%s.%s' "$JWT_HEADER" "$JWT_PAYLOAD" | openssl dgst -sha256 -sign "$KEY_FILE" | b64url)
          rm -f "$KEY_FILE"
          printf 'Authorization: Bearer %s.%s.%s\n' "$JWT_HEADER" "$JWT_PAYLOAD" "$JWT_SIG" > "$JWT_FILE"
          curl -sS -X POST -H @"$JWT_FILE" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"repositories": ["gunbc"], "permissions": {"contents": "write"}}' -D "$TOKEN_HEADERS" -o "$TOKEN_BODY" "https://api.github.com/app/installations/136673607/access_tokens"
          rm -f "$JWT_FILE"
          if ! head -n1 "$TOKEN_HEADERS" | grep -q ' 201 '; then echo "HealPublisherInstallationTokenRefused: GitHub answered $(head -n1 "$TOKEN_HEADERS" | tr -d '\r') for the publisher App's installation; a revoked key, a removed installation, or a Contents permission that is no longer write each look like this -- inspect the App's installation on this repository" >&2; exit 1; fi
          GITHUB_TOKEN="$(python3 -c 'import sys,json; print(json.load(open(sys.argv[1]))["token"])' "$TOKEN_BODY")"
          rm -f "$TOKEN_HEADERS" "$TOKEN_BODY"
          export GITHUB_TOKEN
          echo "heal-publisher: installation token minted in-run for app gunbai installation 136673607 (one hour, contents:write on this repository only; key wiped; token held in this step's environment only)"
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/heal_publication.dag --function heal_publication_publish_wet
        env:
          HEAL_CANDIDATE_DIRECTORY: heal-candidate
          WIF_ACCESS_TOKEN: ${{ steps.heal_publisher_wif.outputs.access_token }}
        if: hashFiles('heal-candidate/heal-repair-candidate-blob-*') != ''
