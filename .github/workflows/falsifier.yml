          ref: ${{ inputs.expected_healed_sha || github.sha }}
      - name: Refuse a heal revalidation whose run subject or checkout does not name the expected healed SHA
        run: |
          EXPECTED_HEALED_SHA="${{ inputs.expected_healed_sha }}"
          RUN_SUBJECT_HEAD="${{ github.sha }}"
          if [ -n "$EXPECTED_HEALED_SHA" ]; then
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if ! [ "$RUN_SUBJECT_HEAD" = "$EXPECTED_HEALED_SHA" ]; then
          echo "::error::heal revalidation refused: workflow run subject $RUN_SUBJECT_HEAD does not equal expected healed head $EXPECTED_HEALED_SHA"
          exit 1
          fi
          if ! [ "$ACTUAL_HEAD" = "$EXPECTED_HEALED_SHA" ]; then
          echo "::error::heal revalidation refused: checkout head $ACTUAL_HEAD does not equal expected healed head $EXPECTED_HEALED_SHA"
          exit 1
          fi
          echo "heal revalidation preflight: checkout names expected healed head $EXPECTED_HEALED_SHA"
          fi
      - name: Setup Rust (floor gate toolchain — batch-4 emit_host/self_host gates need cargo/rustfmt; no isolated rustup)
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
      - name: Derive native-cache root (rustc-version segment; after setup-rust-toolchain)
        run: |
          # 🟡 dissolve-on: ci_native_cache_root_script — orch-emitted foreign-executor prelude step deriving GUNBC_NATIVE_CACHE_ROOT from rustc -V after setup-rust-toolchain; leaf rustc/tr/mkdir/echo strings remain until typed toolchain probe lands on host_effect_apply (#5828 / shell→intent Phase 2)
          if ! GUNBC_TOOLCHAIN_SEG_RAW=$(rustc -V 2>/dev/null); then echo "::error::rustc -V failed after setup-rust-toolchain: cannot derive native-cache toolchain segment"; exit 1; fi
          GUNBC_TOOLCHAIN_SEG=$(echo "$GUNBC_TOOLCHAIN_SEG_RAW" | tr ' ' '-')
          if [ -z "$GUNBC_TOOLCHAIN_SEG" ]; then echo "::error::rustc -V produced an empty native-cache toolchain segment after setup-rust-toolchain"; exit 1; fi
          mkdir -p "$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG"
          echo "GUNBC_NATIVE_CACHE_ROOT=$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG" >> "$GITHUB_ENV"
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        id: release_bins
        run: |
          # 🟡 dissolve-on: ci_release_bins_unpack_verify_script — concat-built foreign-executor (GitHub Actions run:) release-bins unpack + claim_executor --verify-build-artifacts runner; membership of verified paths is derived from gunbc.ci_release_bins, but the unpack/verify transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the unpack/verify runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/selection_control_skip_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census" "$ROOT/target/release/cssl_assemble" "$ROOT/target/release/frontier_probe_survey" "$ROOT/target/release/namespace_structural_root_exposure_generated_witness"
        timeout-minutes: 5
      - name: Affected-set selection control (floor_skip_discovery_witness)
        run: |
          # Affected-set-scoped selection-control admission (pull_request only) — the selection mechanism applied to itself. selection_control_skip_witness intersects the merge-base diff with the control suite's input closure (cli_run::selection_control_input_sources: the suite's declared .dag entries plus their import closure through [src/v2, dag], the src/v1/** prefix covering the selection implementation and the witness bin, the Cargo/toolchain build config, and EVERY markdown path). The markdown arm is not incidental: the suite's declared entry dag/test/claim/doc_reachability_witness_test.dag declares LiveTreeDisposition = ReadsLiveTree and folds the live doc graph (gunbc.doc_graph_roots.doc_graph_roots_all) to decide doc_graph_has_no_orphan_docs, asserting the orphan wall green against the REAL tree — so a .md add/edit/delete genuinely changes this suite's verdict, and a live-tree read is not an import edge, so no closure walk can discover that reach. It is a structural over-approximation computed AS the answer (DESIGN §5: a closure superset is the precision frontier), not a widening failure arm. Found by review 44682 on this PR, whose first draft skipped docs-only diffs while its green control asserted that skip. A PR diff touching none of those provably cannot change the suite's verdict, so the step exits 0 immediately. NOT circular: the skip decision is a coarse path/import-closure intersection, never the node-frontier selector the suite verifies, so a broken selector cannot suppress its own control. TWO KINDS OF ARM, and the difference is the whole fail-closed story. STRUCTURAL arms — empty diff, ANY departed path (no docs carve-out — deleting a doc is the direction the orphan/dangling wall is most sensitive to, and regen's/compile-clean's docs exemption is correct only because markdown is outside THEIR closures), any markdown path, and any closure intersection — are label-valued: the diff WAS observed, so the answer is computed, and the witness exits 0 printing run_selection_control. REFUSAL arms — diff-observation failure and input-closure failure — do NOT run the suite and do NOT print a label: they STOP THE LINE. The witness prints a typed, located, countable diagnostic (SELECTION_CONTROL_REFUSED cause=DiffObservationFailed or cause=InputClosureFailed) to stderr and exits NON-ZERO, so the step goes RED. That is DESIGN §5's rule that a failure arm must refuse, never widen: 'can't compute the affected set → rerun everything' is the named absorbing fallback, conflating ⊤-as-ignorance with ⊤-as-answer, and it fails open twice — the deficit's frequency is zeroed by construction so it never ranks for fixing, and the cost is denominated in the corpus rather than the change. It is also the ruling already recorded in floor_diff_baseline_law (src/v2/workflow/floor_diff_observe.dag): a BaselineRefused → NameStatusDiffFail HALTS with a typed AFFECTED-SET REFUSAL, refusing every enrolled row rather than widening to a full-corpus run (operator ruling 2026-07-05). Corrected here after review 44768 caught this note still claiming the failure arms ran the suite — a §3 single-authority violation, since the note is emitted into ci.yml and would have been the authoritative description of the opposite behaviour. TWO DISTINCT fail-closed mechanisms sit outside that, and they are not the same arm: (a) the witness exits 0 but prints anything other than the skip label — the string comparison fails and the suite runs; (b) the witness exits NON-zero — either a deliberate typed REFUSAL (the two computation-failure arms above) or a panic (e.g. the workspace chdir failing) — GitHub runs this step under bash -e, so the command substitution's failure aborts the step RED rather than falling through. (b) is deliberately unlike the regen precedent, which suppresses stderr and defaults with a shell fallback; here a crashing skip witness stops the line loudly instead of being papered over, and stderr is left unredirected so the witness's own typed explanation of WHICH arm fired lands in the job log. COLD CONTROL: the skip is gated to pull_request events via GITHUB_EVENT_NAME, so push-to-main and workflow_dispatch run the suite UNCONDITIONALLY. A wrong closure that lets a PR wrongly skip therefore surfaces on the very next merge to main (the one-merge acceptance window, the regen-skip shape). MEASURED BASIS, including the part that makes this a trade rather than a free win. The step costs 9m02s per PR (run 30482171871, job 90679506428) against the 80s local basis gunbc.ci_workflow's step note declares. The skip witness itself costs ~100s per invocation (three local runs: 100.0s, 100.3s, 103.1s), because selection_control_skip_label_for_ci observes the diff through cli_run::floor_git_diff_name_status_range, which resolves floor_diff_observe.dag with a COLD whole-pool index — that observation, not the closure walk, is essentially the whole 100s. So: a skipping PR pays ~100s instead of 542s (saves ~7m22s); a NON-skipping PR pays 542s + ~100s (a ~100s REGRESSION, stated because it is real). SKIP RATE, MEASURED AGAINST THE REAL CLOSURE (corrected 2026-07-29, third revision — read the correction history, it is the point): over the last 100 origin/main commits, 35 touch src/v1/**, 36 touch markdown, 1 touches Cargo/toolchain, and of the 36 that survive those arms, 13 intersect the suite's actual 391-file import closure. TRUE SKIP RATE 23 of 100, so expected value is about -25s/PR (0.23 x -442s + 0.77 x +100s) — roughly 1.2 percent of a 33.6-minute ci job. Two earlier claims in this note were WRONG and are superseded: -7.7 min/PR from an unmeasured 85 percent skip rate, then -4.3 min/PR from a partially-measured <=66 percent ceiling that extrapolated the src/v1/** prefix alone and had not yet counted markdown or the closure. Each is recorded rather than quietly replaced, because the drift this very note documents (an 80s basis left standing against a 542s reality) is the same failure mode. CONSEQUENCE, stated plainly: the cost win alone does NOT justify this scaffold's hand-Rust under DESIGN §6 (denominate the benefit in displaced cost). What ruins the mean is the ~100s cold diff observation — the 🟡 deficit below, paid twice per PR — not the mechanism; dissolve that and the same code is about -102s/PR at near-zero cost. The teardown removal (-11.2s every PR) and this note's own measured corrections stand independently of the skip. 🟡 dissolve-on: the ~100s diff observation is now paid TWICE per PR, once here and once by regen_floor_skip_witness in the regen job, and both pay it as a cold whole-pool index build in a fresh process. It dissolves with the same persistent content-keyed node store gunbc.ci_materialization's resolve-receipt note names as the terminal condition for the per-entry cold resolve class; until then the double payment is counted here rather than hidden, and the non-skipping regression above is its visible cost.
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          _ci_selection_skip="$("$ROOT/target/release/selection_control_skip_witness" )"
          if [ "$_ci_selection_skip" = selection_control_not_affected_skip ]; then
          echo "gunbc ci selection control: pull_request diff does not intersect the control suite's input closure — its verdict is provably unchanged; skipping (push-to-main runs it unconditionally as the cold control)"
          exit 0
          fi
          fi
          "$ROOT/target/release/floor_skip_discovery_witness"
        timeout-minutes: 15
