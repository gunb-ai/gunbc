name: affected-set-falsifier
on:
  workflow_dispatch:
  schedule:
    - cron: 0 7 * * *
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  falsifier:
    runs-on: [ubicloud-standard-16-arm]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=11" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Build release bins (claim_executor + gunbc)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc --bin floor_skip_discovery_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              RETRY_LOG=$(mktemp)
              if ! ( CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc --bin floor_skip_discovery_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness ) 2>&1 | tee "$RETRY_LOG"; then
                if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$RETRY_LOG"; then
                  echo "::warning::cargo/sccache still failing; retry without RUSTC_WRAPPER"
                  env -u RUSTC_WRAPPER CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc --bin floor_skip_discovery_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness || exit 1
                else
                  exit 1
                fi
              fi
              rm -f "$RETRY_LOG"
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness"
          sccache --show-stats 2>/dev/null || true
        timeout-minutes: 45
      - name: Floor cgroup peak pre-read (calibration; reset if permitted)
        run: |
          # dissolve-on: bash-emit (#5828 / gap-B emit(intent, Bash)) realizes the cgroup peak observation as an emitted ShellProgram intent (the floor_diff_observe.dag pattern: model the observation, emit the transport) or a typed host Observe effect; these concat-built runners retire then. Until that lands they are §2 transport scaffolds bound by the three Scaffold rows in gunbc.ci_workflow (locate/pre/post *_shell_emit_dissolution_trigger).
          d="/sys/fs/cgroup$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)"
          while [ -n "$d" ] && [ "$d" != "/sys/fs/cgroup" ] && [ ! -f "$d/memory.peak" ]; do d=$(dirname "$d"); done
          if [ -f "$d/memory.peak" ]; then
            if echo reset > "$d/memory.peak" 2>/dev/null; then echo "[calibration] floor_peak_pre reset=ok scope=floor cgroup=$d"
            else echo "[calibration] floor_peak_pre reset=unsupported pre_peak=$(cat "$d/memory.peak") scope=span cgroup=$d (post>pre attributes the peak to the floor exactly; post==pre means floor peak <= pre, a job-scoped upper bound)"; fi
          else echo "[calibration] floor_peak_pre scope=unavailable (no memory.peak ancestor)"; fi
        timeout-minutes: 5
      - name: affected-set falsifier (predict-only cold run)
        id: floor
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --source-root dag --source-root src/v2 --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_falsifier_batches
        env:
          GUNBC_CI_DIFF_BASE: HEAD~20
          GUNBC_CI_DIFF_HEAD: HEAD
        timeout-minutes: 120
      - name: Floor cgroup peak post-read (calibration; survives a killed floor)
        run: |
          # dissolve-on: bash-emit (#5828 / gap-B emit(intent, Bash)) realizes the cgroup peak observation as an emitted ShellProgram intent (the floor_diff_observe.dag pattern: model the observation, emit the transport) or a typed host Observe effect; these concat-built runners retire then. Until that lands they are §2 transport scaffolds bound by the three Scaffold rows in gunbc.ci_workflow (locate/pre/post *_shell_emit_dissolution_trigger).
          d="/sys/fs/cgroup$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)"
          while [ -n "$d" ] && [ "$d" != "/sys/fs/cgroup" ] && [ ! -f "$d/memory.peak" ]; do d=$(dirname "$d"); done
          if [ -f "$d/memory.peak" ]; then echo "[calibration] floor_peak_post=$(cat "$d/memory.peak") floor_outcome=${{ steps.floor.outcome }} cgroup=$d (observation label: floor_outcome=success is an EXACT point; any other outcome is a CENSORED lower bound - the process was killed while exceeding the read, so true demand is strictly greater. scope per the floor_peak_pre line: reset=ok means this IS the floor peak; scope=span compares against pre_peak)"
          else echo "[calibration] floor_peak_post floor_outcome=${{ steps.floor.outcome }} scope=unavailable (no memory.peak ancestor)"; fi
        if: always()
        timeout-minutes: 5
