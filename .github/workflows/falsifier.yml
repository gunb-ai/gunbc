name: affected-set-falsifier
on:
  workflow_dispatch:
  schedule:
    - cron: 0 0,4,8,12,16,20 * * *
permissions:
  contents: read
concurrency:
  group: affected-set-falsifier
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  falsifier-build:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          printf '%s\n' "CiSccacheProviderReceipt: provider=bound catalog=sccache_local"
          else
          printf '%s\n' "CiSccacheProviderReceipt: provider=SKIPPED catalog=sccache_local host=$(hostname) cause=daemon-unavailable; the release build runs UNCACHED — a counted degradation, not a supported mode (host_build_cache_provision P1b should have converged this host)"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Derive native-cache root (rustc-version segment; after setup-rust-toolchain)
        run: |
          # 🟡 dissolve-on: ci_native_cache_root_script — orch-emitted foreign-executor prelude step deriving GUNBC_NATIVE_CACHE_ROOT from rustc -V after setup-rust-toolchain; leaf rustc/tr/mkdir/echo strings remain until typed toolchain probe lands on host_effect_apply (#5828 / shell→intent Phase 2)
          if ! GUNBC_TOOLCHAIN_SEG_RAW=$(rustc -V 2>/dev/null); then echo "::error::rustc -V failed after setup-rust-toolchain: cannot derive native-cache toolchain segment"; exit 1; fi
          GUNBC_TOOLCHAIN_SEG=$(echo "$GUNBC_TOOLCHAIN_SEG_RAW" | tr ' ' '-')
          if [ -z "$GUNBC_TOOLCHAIN_SEG" ]; then echo "::error::rustc -V produced an empty native-cache toolchain segment after setup-rust-toolchain"; exit 1; fi
          mkdir -p "$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG"
          echo "GUNBC_NATIVE_CACHE_ROOT=$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG" >> "$GITHUB_ENV"
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Build release bins (claim_executor + gunbc)
        id: release_build
        run: |
          # 🟡 dissolve-on: ci_release_build_script — concat-built foreign-executor (GitHub Actions run:) release-build runner (ROOT stamp + verify-artifacts + sccache stats wrapping the orch-emitted EAGAIN retry core); membership of --bin / verify paths is derived from gunbc.ci_release_bins, but the runner transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the release-build runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_BIN" build -p v1-compiler --release --features text_lookup_work_counter,interp_test_witness,test_hooks --bin claim_executor --bin gunbc --bin regen_floor_skip_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness --bin resolution_divergence_census --bin cssl_assemble --bin frontier_probe_survey --bin namespace_structural_root_exposure_generated_witness) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              CARGO_BUILD_JOBS=1 "$CARGO_BIN" build -p v1-compiler --release --features text_lookup_work_counter,interp_test_witness,test_hooks --bin claim_executor --bin gunbc --bin regen_floor_skip_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness --bin resolution_divergence_census --bin cssl_assemble --bin frontier_probe_survey --bin namespace_structural_root_exposure_generated_witness
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census" "$ROOT/target/release/cssl_assemble" "$ROOT/target/release/frontier_probe_survey" "$ROOT/target/release/namespace_structural_root_exposure_generated_witness"
          sccache --show-stats 2>/dev/null || true
        timeout-minutes: 45
      - name: Pack release bins for cross-job handoff (tar keeps exec bits)
        run: |
          # 🟡 dissolve-on: ci_release_bins_pack_script — concat-built foreign-executor (GitHub Actions run:) release-bins tar pack runner; membership of archived bin names is derived from gunbc.ci_release_bins, but the pack transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the pack runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          tar -czf "$ROOT/release-bins.tgz" -C "$ROOT/target/release" "claim_executor" "gunbc" "regen_floor_skip_witness" "discover_source_root_ingest" "claim_batch" "regen_stage0" "interp_recorded_fixture_witness" "v1_src_dag_parse" "auth_declared_but_unwired_witness" "bootstrap_witness" "dag_collect_fingerprint_witness" "diagnostics_witness" "effects_rest_transport_witness" "infer_semantics_witness" "parse_witness" "resolution_divergence_census" "cssl_assemble" "frontier_probe_survey" "namespace_structural_root_exposure_generated_witness"
        timeout-minutes: 5
      - name: Upload release-bins artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bins
          path: release-bins.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
        timeout-minutes: 10
  cold-corpus:
    runs-on: [self-hosted, linux, arm64]
    needs: [falsifier-build]
    timeout-minutes: 285
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_healed_sha || github.sha }}
      - name: Refuse a heal revalidation whose run subject or checkout does not name the expected healed SHA
        run: |
          EXPECTED_HEALED_SHA="${{ inputs.expected_healed_sha }}"
          RUN_SUBJECT_HEAD="${{ github.sha }}"
          if [ -n "$EXPECTED_HEALED_SHA" ]; then
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if ! [ "$RUN_SUBJECT_HEAD" = "$EXPECTED_HEALED_SHA" ]; then
          echo "::error::heal revalidation refused: workflow run subject $RUN_SUBJECT_HEAD does not equal expected healed head $EXPECTED_HEALED_SHA"
          exit 1
          fi
          if ! [ "$ACTUAL_HEAD" = "$EXPECTED_HEALED_SHA" ]; then
          echo "::error::heal revalidation refused: checkout head $ACTUAL_HEAD does not equal expected healed head $EXPECTED_HEALED_SHA"
          exit 1
          fi
          echo "heal revalidation preflight: checkout names expected healed head $EXPECTED_HEALED_SHA"
          fi
      - name: Setup Rust (floor gate toolchain — batch-4 emit_host/self_host gates need cargo/rustfmt; no isolated rustup)
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
      - name: Derive native-cache root (rustc-version segment; after setup-rust-toolchain)
        run: |
          # 🟡 dissolve-on: ci_native_cache_root_script — orch-emitted foreign-executor prelude step deriving GUNBC_NATIVE_CACHE_ROOT from rustc -V after setup-rust-toolchain; leaf rustc/tr/mkdir/echo strings remain until typed toolchain probe lands on host_effect_apply (#5828 / shell→intent Phase 2)
          if ! GUNBC_TOOLCHAIN_SEG_RAW=$(rustc -V 2>/dev/null); then echo "::error::rustc -V failed after setup-rust-toolchain: cannot derive native-cache toolchain segment"; exit 1; fi
          GUNBC_TOOLCHAIN_SEG=$(echo "$GUNBC_TOOLCHAIN_SEG_RAW" | tr ' ' '-')
          if [ -z "$GUNBC_TOOLCHAIN_SEG" ]; then echo "::error::rustc -V produced an empty native-cache toolchain segment after setup-rust-toolchain"; exit 1; fi
          mkdir -p "$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG"
          echo "GUNBC_NATIVE_CACHE_ROOT=$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG" >> "$GITHUB_ENV"
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        id: release_bins
        run: |
          # 🟡 dissolve-on: ci_release_bins_unpack_verify_script — concat-built foreign-executor (GitHub Actions run:) release-bins unpack + claim_executor --verify-build-artifacts runner; membership of verified paths is derived from gunbc.ci_release_bins, but the unpack/verify transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the unpack/verify runner through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census" "$ROOT/target/release/cssl_assemble" "$ROOT/target/release/frontier_probe_survey" "$ROOT/target/release/namespace_structural_root_exposure_generated_witness"
        timeout-minutes: 5
      - name: Floor cgroup peak pre-read (calibration; reset if permitted)
        run: |
          # 🟡 dissolve-on: ci_cgroup_peak_locate_shell — foreign-executor (GitHub Actions run:) shell transport composing extdeps.linux.proc_self_cgroup unified-hierarchy membership (v2.extdeps.languages.bash_proc_self_cgroup) with std.path_intent NearestAncestorContaining dirname ascent (bash_orch_if). Procfs path is extdeps.linux.procfs ProcSelfCgroup. DISSOLVES WHEN shell→intent Phase 2 realizes cgroup membership plus path ascent on host_effect_apply / orchestration path arms without medium-as-string Run.command concat.
          { _cg_bad=0; _cg_n=0; _cg_rel=""; while IFS= read -r _cg_line || [ -n "$_cg_line" ]; do _cg_trim=$(echo "$_cg_line" | sed -e 's/^ //' -e 's/ $//'); [ -z "$_cg_trim" ] && continue; case "$_cg_trim" in *:*:*) ;; *) _cg_bad=1; continue ;; esac; _cg_h=$(echo "$_cg_trim" | cut -d: -f1); _cg_ctl=$(echo "$_cg_trim" | cut -d: -f2); _cg_path=$(echo "$_cg_trim" | cut -d: -f3-); [ -z "$_cg_h" ] && _cg_bad=1; [ -z "$_cg_path" ] && _cg_bad=1; if [ "$_cg_h" = "0" ] && [ -z "$_cg_ctl" ]; then _cg_n=$((_cg_n + 1)); _cg_rel="$_cg_path"; fi; done < /proc/self/cgroup; [ "$_cg_bad" -eq 1 ] && { echo "[calibration] cgroup_membership=malformed" >&2; exit 1; }; [ "$_cg_n" -eq 0 ] && { echo "[calibration] cgroup_membership=missing" >&2; exit 1; }; [ "$_cg_n" -gt 1 ] && { echo "[calibration] cgroup_membership=ambiguous" >&2; exit 1; }; d="/sys/fs/cgroup$_cg_rel"; } || exit 1
          while [ -n "$d" ] && [ "$d" != "/sys/fs/cgroup" ] && ! [ -f "$d/memory.peak" ]; do d=$(dirname "$d"); done
          if [ -f "$d/memory.peak" ]; then if echo reset > "$d/memory.peak" 2>/dev/null; then echo "[calibration] floor_peak_pre reset=ok scope=floor cgroup=$d"; else echo "[calibration] floor_peak_pre reset=unsupported pre_peak=$(cat "$d/memory.peak") scope=span cgroup=$d (post>pre attributes the peak to the floor exactly; post==pre means floor peak <= pre, a job-scoped upper bound)"; fi; else echo "[calibration] floor_peak_pre scope=unavailable (no memory.peak ancestor)"; fi
        timeout-minutes: 5
      - name: affected-set falsifier (predict-only cold run)
        id: floor
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --source-root dag --source-root src/v2 --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_falsifier_plan
        env:
          GUNBC_CI_DIFF_BASE: HEAD~20
          GUNBC_CI_DIFF_HEAD: HEAD
          GUNBC_FLOOR_PHASE_JOURNAL: target/floor-phase-journal.tsv
        timeout-minutes: 170
      - name: Upload floor component receipt (read by falsifier-alert)
        uses: actions/upload-artifact@v4
        with:
          name: floor-component-receipt
          path: target/floor-component-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
        if: always()
        timeout-minutes: 10
      - name: Upload floor phase journal (survives killed floor)
        uses: actions/upload-artifact@v4
        with:
          name: floor-phase-journal
          path: target/floor-phase-journal.tsv
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
        if: always()
        timeout-minutes: 10
      - name: Upload floor receipts (TSV authority for cost/drift rows)
        uses: actions/upload-artifact@v4
        with:
          name: floor-receipts
          path: target/floor-*
          if-no-files-found: warn
          retention-days: 14
        if: always()
        timeout-minutes: 5
      - name: compile-clean whole-tree cold control (scoped-PR admission counterpart)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --source-root dag --source-root src/v2 --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_ci_plan_artifact_plan
        env:
          GUNBC_CI_COMPILE_CLEAN_COLD_CONTROL: 1
        if: always() && !cancelled() && steps.release_bins.outcome == 'success'
        timeout-minutes: 30
      - name: native-cache cold control (warm-tier admission counterpart)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/claim_executor" --source-root dag --source-root src/v2 --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_falsifier_native_cache_cold_plan
        env:
          GUNBC_CI_NATIVE_CACHE_COLD_CONTROL: 1
        if: always() && !cancelled() && steps.release_bins.outcome == 'success'
        timeout-minutes: 30
      - name: Floor cgroup peak post-read (calibration; survives a killed floor)
        run: |
          # 🟡 dissolve-on: ci_floor_phase_journal_if — bounded foreign-executor (GitHub Actions run:) shell transport for exactly four journal leaves: FileExists, column-name log, row-count summary log, and absent log. If/else control flow is already v2.std.orchestration intent; only those leaves remain medium-as-string Run.command values. DISSOLVES WHEN bash-emit (#5828 / ROADMAP shell-effectplan-to-bash / shell→intent Phase 2) binds typed filesystem observation plus diagnostic-log operations through host_effect_apply, so ci_floor_phase_journal_if contains no opaque shell command text.
          if [ -f "$GUNBC_FLOOR_PHASE_JOURNAL" ]; then
          echo "[floor-phase-journal] columns: unix_millis pid phase state detail"
          echo "[floor-phase-journal] $(wc -l < $GUNBC_FLOOR_PHASE_JOURNAL) rows retained; full journal in the floor-phase-journal artifact"
          else
          echo "[floor-phase-journal] absent"
          fi
          # 🟡 dissolve-on: ci_floor_wet_witness_row_outcome_receipt_if — bounded foreign-executor (GitHub Actions run:) shell transport for exactly four receipt leaves: FileExists, column-name log, row-count summary log, and absent log. DISSOLVES WHEN bash-emit (#5828 / ROADMAP shell-effectplan-to-bash / shell→intent Phase 2) binds typed filesystem observation plus diagnostic-log operations through host_effect_apply, so ci_floor_wet_witness_row_outcome_receipt_if contains no opaque shell command text.
          if [ -f "target/floor-wet-witness-row-outcome-receipt.tsv" ]; then
          echo "[wet-witness-row-outcome-receipt] columns: batch entry function outcome detail"
          echo "[wet-witness-row-outcome-receipt] $(wc -l < target/floor-wet-witness-row-outcome-receipt.tsv) rows; full receipt in the floor-component-receipt artifact"
          else
          echo "[wet-witness-row-outcome-receipt] absent"
          fi
          # 🟡 dissolve-on: ci_cgroup_peak_locate_shell — foreign-executor (GitHub Actions run:) shell transport composing extdeps.linux.proc_self_cgroup unified-hierarchy membership (v2.extdeps.languages.bash_proc_self_cgroup) with std.path_intent NearestAncestorContaining dirname ascent (bash_orch_if). Procfs path is extdeps.linux.procfs ProcSelfCgroup. DISSOLVES WHEN shell→intent Phase 2 realizes cgroup membership plus path ascent on host_effect_apply / orchestration path arms without medium-as-string Run.command concat.
          { _cg_bad=0; _cg_n=0; _cg_rel=""; while IFS= read -r _cg_line || [ -n "$_cg_line" ]; do _cg_trim=$(echo "$_cg_line" | sed -e 's/^ //' -e 's/ $//'); [ -z "$_cg_trim" ] && continue; case "$_cg_trim" in *:*:*) ;; *) _cg_bad=1; continue ;; esac; _cg_h=$(echo "$_cg_trim" | cut -d: -f1); _cg_ctl=$(echo "$_cg_trim" | cut -d: -f2); _cg_path=$(echo "$_cg_trim" | cut -d: -f3-); [ -z "$_cg_h" ] && _cg_bad=1; [ -z "$_cg_path" ] && _cg_bad=1; if [ "$_cg_h" = "0" ] && [ -z "$_cg_ctl" ]; then _cg_n=$((_cg_n + 1)); _cg_rel="$_cg_path"; fi; done < /proc/self/cgroup; [ "$_cg_bad" -eq 1 ] && { echo "[calibration] cgroup_membership=malformed" >&2; exit 1; }; [ "$_cg_n" -eq 0 ] && { echo "[calibration] cgroup_membership=missing" >&2; exit 1; }; [ "$_cg_n" -gt 1 ] && { echo "[calibration] cgroup_membership=ambiguous" >&2; exit 1; }; d="/sys/fs/cgroup$_cg_rel"; } || exit 1
          while [ -n "$d" ] && [ "$d" != "/sys/fs/cgroup" ] && ! [ -f "$d/memory.peak" ]; do d=$(dirname "$d"); done
          if [ -f "$d/memory.peak" ]; then echo "[calibration] floor_peak_post=$(cat "$d/memory.peak") floor_outcome=${{ steps.floor.outcome }} cgroup=$d (observation label: floor_outcome=success is an EXACT point; any other outcome is a CENSORED lower bound - the process was killed while exceeding the read, so true demand is strictly greater. scope per the floor_peak_pre line: reset=ok means this IS the floor peak; scope=span compares against pre_peak)"; else echo "[calibration] floor_peak_post floor_outcome=${{ steps.floor.outcome }} scope=unavailable (no memory.peak ancestor)"; fi
        env:
          GUNBC_FLOOR_PHASE_JOURNAL: target/floor-phase-journal.tsv
        if: always()
        timeout-minutes: 5
  aggregate-verdict:
    runs-on: [self-hosted, linux, arm64]
    needs: [falsifier-build, cold-corpus]
    timeout-minutes: 20
    if: always() && !cancelled()
    steps:
      - name: Download floor component receipt (cold-corpus execution witness)
        id: floor_component_receipt_download
        uses: actions/download-artifact@v4
        with:
          name: floor-component-receipt
          path: target
        continue-on-error: true
        timeout-minutes: 10
      - name: Aggregate falsifier cadence verdict (typed cold-corpus execution)
        id: aggregate_verdict
        run: |
          # 🟡 dissolve-on: falsifier_aggregate_verdict_script — concat-built foreign-executor (GitHub Actions run:) aggregate cadence verdict shell; receipt JSON literals are derived from gunbc.falsifier_cold_corpus_execution classify_cold_corpus_execution / cold_corpus_execution_receipt_json, but the transport itself remains hand-shell; DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0 / shell→intent Phase 2) realizes the aggregate verdict step through orchestration emit or typed host_effect_apply without a medium-as-string concat scaffold
          set -euo pipefail
          mkdir -p target
          BUILD_RESULT="${{ needs.falsifier-build.result }}"
          COLD_RESULT="${{ needs.cold-corpus.result }}"
          if [ "${BUILD_RESULT}" = "cancelled" ]; then
          printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"build-job-cancelled\"}" > target/falsifier-cold-corpus-execution.json
            printf '%s\n' "::error::Cold corpus did not run — build cancelled; infrastructure, not a falsifier regression finding"
            exit 1
          fi
          if [ "${BUILD_RESULT}" = "skipped" ]; then
          printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"build-job-skipped\"}" > target/falsifier-cold-corpus-execution.json
            printf '%s\n' "::error::Cold corpus did not run — build skipped; infrastructure, not a falsifier regression finding"
            exit 1
          fi
          if [ "${BUILD_RESULT}" != "success" ]; then
          printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"build-job-failed\"}" > target/falsifier-cold-corpus-execution.json
            printf '%s\n' "::error::Cold corpus did not run — build unavailable (${BUILD_RESULT}); infrastructure, not a falsifier regression finding"
            exit 1
          fi
          if [ "${COLD_RESULT}" = "skipped" ]; then
          printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"cold-corpus-job-skipped\",\"blocking_job\":\"cold-corpus\"}" > target/falsifier-cold-corpus-execution.json
            printf '%s\n' "::error::Cold corpus skipped despite successful build — topology violation"
            exit 1
          fi
          if [ "${COLD_RESULT}" = "cancelled" ]; then
          printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"cold-corpus-job-cancelled\"}" > target/falsifier-cold-corpus-execution.json
            printf '%s\n' "::error::Cold corpus cancelled — environment unavailability"
            exit 1
          fi
          FLOOR_RECEIPT_PRESENT=false
          if [ -f target/floor-component-receipt.json ] && grep -q floor-component-receipt/v1 target/floor-component-receipt.json; then
            FLOOR_RECEIPT_PRESENT=true
          fi
          if [ "${FLOOR_RECEIPT_PRESENT}" != true ]; then
            if [ "${COLD_RESULT}" = "success" ]; then
              printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"cold-corpus-receipt-artifact-absent\"}" > target/falsifier-cold-corpus-execution.json
              printf '%s\n' "::error::Cold corpus succeeded but floor-component receipt artifact absent — transport or emit failure, not a falsifier regression finding"
              exit 1
            fi
            printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-not-run\",\"cause\":\"cold-corpus-failed-before-receipt\"}" > target/falsifier-cold-corpus-execution.json
            printf '%s\n' "::error::Cold corpus did not produce floor-component receipt (cold=${COLD_RESULT}) — infrastructure, not a falsifier regression finding"
            exit 1
          fi
            printf '%s\n' "{\"schema\":\"falsifier-cold-corpus-execution/v1\",\"execution\":\"corpus-executed\",\"receipt_path\":\"target/floor-component-receipt.json\"}" > target/falsifier-cold-corpus-execution.json
          if [ "${COLD_RESULT}" != "success" ]; then
            printf '%s\n' "::error::Falsifier cadence red — cold=${COLD_RESULT} (corpus executed; see target/falsifier-cold-corpus-execution.json)"
            exit 1
          fi
          printf '%s\n' "FalsifierCadenceVerdict: cadence-green"
        timeout-minutes: 5
