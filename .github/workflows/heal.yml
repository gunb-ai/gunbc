# Generated by gunbc.heal_workflow expected_heal_workflow_yml — do not hand-edit.
# Authority: gunbc.heal_workflow heal_workflow; regen via gunbc.instruments.generated_artifact_gate main_wet.
name: heal
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: [dag/**, src/v2/**, src/v1/**, .cargo/config.toml, dag/gunbc/stage0/stage0_crate_layout_generated.dag, src/v1/stage0/src/bootstrap_stage0_crate_layout_generated.rs, dag/gunbc/stage0/stage0_crate_partition_generated.dag, dag/gunbc/stage0/stage0_executable_assembly_generated.dag, src/v1/stage0/linked_partition_crates.generated.txt, src/v1/stage0/src/bootstrap_seed_retention_frontier_generated.rs, src/v1/stage0/src/v1_interpreter_dispatch_generated.rs, src/v1/stage0/src/evaluation_budget_consequence_generated.rs, src/v1/stage0/src/release_locus_seed_constants_generated.rs, src/v1/stage0/src/gunbc_file_transport_generated.rs, src/v1/stage0/src/native_route_seed_boundary_generated.rs]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request this manual repair describes
        required: true
        type: string
      head_sha:
        description: Exact head commit the candidate is sealed against
        required: true
        type: string
      head_ref:
        description: Head branch the repair would fast-forward
        required: true
        type: string
      base_ref:
        description: Base branch of that pull request
        required: true
        type: string
      base_sha:
        description: Base commit (40-hex) of that pull request
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: heal-pr-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  MALLOC_ARENA_MAX: "2"
jobs:
  heal-generated-artifacts:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
    steps:
      - name: Checkout the exact pull request head this candidate will describe
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          persist-credentials: false
      - name: Isolate toolchain homes
        run: |-
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          components: rustfmt
          cache: false
          rustflags: -D warnings
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |-
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Build the regenerator this job runs against its own checkout
        id: build_witness_fold
        run: |+
          GUNBC_SEED_CHECKOUT=$('git' 'rev-parse' '--show-toplevel')
          '[' '-n' "$GUNBC_SEED_CHECKOUT" ']' || ('echo' '::error title=seedBuildRemap CheckoutRootUnread::the checkout root read back empty, so a remap prefix would name nothing and the seed binary would keep absolute paths baked in; refusing to build'; exit 1)
          if '[' '-n' "$CARGO_TARGET_DIR" ']'; then GUNBC_SEED_TARGET="$CARGO_TARGET_DIR"; else GUNBC_SEED_TARGET="$GUNBC_SEED_CHECKOUT"'/target'; fi
          if '[' '-n' "$CARGO_HOME" ']'; then GUNBC_SEED_CARGO_HOME="$CARGO_HOME"; else GUNBC_SEED_CARGO_HOME="$HOME"'/.cargo'; fi
          GUNBC_SEED_SYSROOT=$('rustc' '--print' 'sysroot')
          '[' '-n' "$GUNBC_SEED_SYSROOT" ']' || ('echo' '::error title=seedBuildRemap SysrootUnread::the rustc sysroot read back empty, so the sysroot remap would name nothing; refusing to build'; exit 1)
          RUSTFLAGS=' -D warnings'' --remap-path-prefix='"$GUNBC_SEED_CHECKOUT"'=/build/checkout'' --remap-path-prefix='"$GUNBC_SEED_TARGET"'=/build/target'' --remap-path-prefix='"$GUNBC_SEED_CARGO_HOME"'=/build/cargo-home'' --remap-path-prefix='"$GUNBC_SEED_SYSROOT"'=/build/rust'
          'export' 'RUSTFLAGS'
          'export' 'GUNBC_SEED_CHECKOUT'
          'export' 'GUNBC_SEED_TARGET'
          'export' 'GUNBC_SEED_CARGO_HOME'
          'export' 'GUNBC_SEED_SYSROOT'
          GUNBC_SEED_WORKTREE_DIRTY=$('git' 'status' '--porcelain=1' '--untracked-files=no')
          if '[' '-z' "$GUNBC_MATERIALIZED_TREE_IDENTITY" ']' && '[' '-z' "$GUNBC_SEED_WORKTREE_DIRTY" ']'; then GUNBC_SEED_OBJECT_FORMAT=$('git' 'rev-parse' '--show-object-format'); '[' '-n' "$GUNBC_SEED_OBJECT_FORMAT" ']' || ('echo' '::error title=seedBuildIdentity ObjectFormatUnread::the git object format read back empty, so the pinned identity would be malformed; refusing to build'; exit 1); GUNBC_MATERIALIZED_TREE_IDENTITY='tree:'"$GUNBC_SEED_OBJECT_FORMAT"':'$('git' 'rev-parse' 'HEAD^{tree}'); 'export' 'GUNBC_MATERIALIZED_TREE_IDENTITY'; fi

          GUNBC_FLOOR_LOG='gunbc-floor-cmd.log'
          'set' '+e'
          'set' '-o' 'pipefail'
          ('sh' '-e' '-c' 'cargo build --release -p v1-compiler --bin gunbc --bin claim_executor') 2>&1 | 'tee' "$GUNBC_FLOOR_LOG"
          GUNBC_FLOOR_EXIT="$?"
          GUNBC_FLOOR_RECEIPT='gunbc-floor-outcome.txt'
          GUNBC_FLOOR_CLASS='structural'
          GUNBC_FLOOR_SIGNATURE=''
          if '[' "$GUNBC_FLOOR_EXIT" '-eq' '126' ']'; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='CommandInvokedCannotExecute'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' "$GUNBC_FLOOR_EXIT" '-eq' '127' ']'; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='CommandNotFound'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' "$GUNBC_FLOOR_EXIT" '-eq' '0' ']'; then GUNBC_FLOOR_CLASS='none'; GUNBC_FLOOR_SIGNATURE=''; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'MemoryStallRefusedPageThrash' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='MemoryStallRefusedPageThrash'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'The runner has received a shutdown signal' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='RunnerLost'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'sccache: error: failed to execute compile' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheFailedToExecuteCompile'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' '(exit status: 254)' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheRustcWrapperExit254'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'sccache: encountered fatal error' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheFatalError'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'failed to spawn' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='ProcessSpawnFailure'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'Resource temporarily unavailable' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='ResourceTemporarilyUnavailable'; fi
          if (! '[' '-f' "$GUNBC_FLOOR_RECEIPT" ']') || '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' || ('[' "$GUNBC_FLOOR_CLASS" '=' 'infra' ']' && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=structural' "$GUNBC_FLOOR_RECEIPT"))) || ('[' "$GUNBC_FLOOR_CLASS" '=' 'none' ']' && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=structural' "$GUNBC_FLOOR_RECEIPT")) && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=infra' "$GUNBC_FLOOR_RECEIPT"))); then 'printf' 'class=%s\nsignature=%s\nexit=%s\n' "$GUNBC_FLOOR_CLASS" "$GUNBC_FLOOR_SIGNATURE" "$GUNBC_FLOOR_EXIT" > "$GUNBC_FLOOR_RECEIPT"; if '[' "$GUNBC_FLOOR_CLASS" '=' 'infra' ']'; then 'echo' '::error title=environment::floor_class='"$GUNBC_FLOOR_CLASS"' signature='"$GUNBC_FLOOR_SIGNATURE"' exit='"$GUNBC_FLOOR_EXIT"'; this is not a verdict about the diff. Attempt receipt: '"$GUNBC_FLOOR_RECEIPT"; fi; if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']'; then 'echo' '::error title=subject::floor_class='"$GUNBC_FLOOR_CLASS"' exit='"$GUNBC_FLOOR_EXIT"'; read the step log for the subject defect'; fi; fi
          'exit' "$GUNBC_FLOOR_EXIT"

      - name: Converge the stage0 mirrors to the seed's own fixed point
        run: target/release/claim_executor --regen-round-cost --base-mirror --source-root dag --source-root src/v2
        env:
          HEAL_BASE_MIRROR_COMMIT: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      - name: Refuse when the stage0 round wrote a file the seed-build writer owns
        run: |-
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/heal_candidate_stage0.dag --function heal_stage0_overlap_refusal_wet
      - name: Regenerate the seed-build artifacts without loading the registry
        run: |-
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/instruments/seed_build_artifacts_regen.dag --function main_wet
      - name: Produce the sealed repair candidate
        run: |-
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/heal_candidate_stage0.dag --function heal_candidate_stage0_produce_wet
        env:
          HEAL_REPOSITORY: ${{ github.repository }}
          HEAL_PULL_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          HEAL_HEAD_REF: ${{ github.event.pull_request.head.ref || inputs.head_ref }}
          HEAL_BASE_REF: ${{ github.event.pull_request.base.ref || inputs.base_ref }}
          HEAL_RUN_ID: ${{ github.run_id }}
      - name: Upload the sealed repair candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: heal-repair-candidate
          path: target/heal-repair-candidate
          if-no-files-found: error
          retention-days: 3
  heal-fork-skipped:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: read
    steps:
      - name: Say that a fork pull request is not repaired
        run: "echo \"::notice title=heal skipped::fork pull request: this repository cannot push to a fork's branch, so stage0 mirrors and seed-build artifacts are not regenerated here. Regenerate them locally and push.\""
