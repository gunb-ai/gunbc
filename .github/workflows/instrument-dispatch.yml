      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Isolate toolchain homes
        run: |-
          # dissolve-on: ci_toolchain_home_isolation_script -- orch-emitted foreign-executor prelude step wiping and setting HOME/CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP so concurrent runner slots stop sharing one toolchain; leaf rm/echo strings remain until a typed per-job filesystem-and-environment effect lands on host_effect_apply (shell-to-intent Phase 2). This obligation covers THIS carrier and ci_isolate_toolchain_script, which share that terminal construction; ci_pin_rustup_default_script carries its own obligation because it does not
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7
        with:
          components: rustfmt
          cache: false
          rustflags: -D warnings
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |-
          # dissolve-on: ci_pin_rustup_default_script -- orch-emitted foreign-executor step selecting a rustup default toolchain inside an isolated RUSTUP_HOME, which starts with none, and resolving the cargo binary that selection implies. The leaf rustup/command/echo strings remain until a typed TOOLCHAIN-SELECTION effect lands on host_effect_apply -- NOT the filesystem-and-environment effect ci_toolchain_home_isolation_script waits on, which is why this is a separate obligation: that effect landing alone would leave this carrier standing
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Build the compiler
        id: build_witness_fold
        run: |+
          GUNBC_FLOOR_LOG='gunbc-floor-cmd.log'
          'set' '+e'
          'set' '-o' 'pipefail'
          ('sh' '-e' '-c' 'cargo build --release -p v1-compiler --bin gunbc') 2>&1 | 'tee' "$GUNBC_FLOOR_LOG"
          GUNBC_FLOOR_EXIT="$?"
          GUNBC_FLOOR_RECEIPT='gunbc-floor-outcome.txt'
          GUNBC_FLOOR_CLASS='structural'
          GUNBC_FLOOR_SIGNATURE=''
          if '[' "$GUNBC_FLOOR_EXIT" '-eq' '126' ']'; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='CommandInvokedCannotExecute'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' "$GUNBC_FLOOR_EXIT" '-eq' '127' ']'; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='CommandNotFound'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' "$GUNBC_FLOOR_EXIT" '-eq' '0' ']'; then GUNBC_FLOOR_CLASS='none'; GUNBC_FLOOR_SIGNATURE=''; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'MemoryStallRefusedPageThrash' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='MemoryStallRefusedPageThrash'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'The runner has received a shutdown signal' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='RunnerLost'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'sccache: error: failed to execute compile' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheFailedToExecuteCompile'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' '(exit status: 254)' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheRustcWrapperExit254'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'sccache: encountered fatal error' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='SccacheFatalError'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'failed to spawn' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='ProcessSpawnFailure'; fi
          if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' && '[' '-f' "$GUNBC_FLOOR_LOG" ']' && 'grep' '-q' 'Resource temporarily unavailable' "$GUNBC_FLOOR_LOG"; then GUNBC_FLOOR_CLASS='infra'; GUNBC_FLOOR_SIGNATURE='ResourceTemporarilyUnavailable'; fi
          if (! '[' '-f' "$GUNBC_FLOOR_RECEIPT" ']') || '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']' || ('[' "$GUNBC_FLOOR_CLASS" '=' 'infra' ']' && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=structural' "$GUNBC_FLOOR_RECEIPT"))) || ('[' "$GUNBC_FLOOR_CLASS" '=' 'none' ']' && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=structural' "$GUNBC_FLOOR_RECEIPT")) && (! ('[' '-f' "$GUNBC_FLOOR_RECEIPT" ']' && 'grep' '-q' 'class=infra' "$GUNBC_FLOOR_RECEIPT"))); then 'printf' 'class=%s\nsignature=%s\nexit=%s\n' "$GUNBC_FLOOR_CLASS" "$GUNBC_FLOOR_SIGNATURE" "$GUNBC_FLOOR_EXIT" > "$GUNBC_FLOOR_RECEIPT"; if '[' "$GUNBC_FLOOR_CLASS" '=' 'infra' ']'; then 'echo' '::error title=environment::floor_class='"$GUNBC_FLOOR_CLASS"' signature='"$GUNBC_FLOOR_SIGNATURE"' exit='"$GUNBC_FLOOR_EXIT"'; this is not a verdict about the diff. Attempt receipt: '"$GUNBC_FLOOR_RECEIPT"; fi; if '[' "$GUNBC_FLOOR_CLASS" '=' 'structural' ']'; then 'echo' '::error title=subject::floor_class='"$GUNBC_FLOOR_CLASS"' exit='"$GUNBC_FLOOR_EXIT"'; read the step log for the subject defect'; fi; fi
          'exit' "$GUNBC_FLOOR_EXIT"

      - name: Require isolated toolchain homes
        run: |
          if [ -z "${CARGO_HOME:-}" ] || [ -z "${RUSTUP_HOME:-}" ]; then echo "::error::ToolchainHomesNotIsolated CARGO_HOME=${CARGO_HOME:-unset} RUSTUP_HOME=${RUSTUP_HOME:-unset} -- the isolation step did not run, so this job shares a toolchain with every other runner slot on this host and a concurrent install can replace a binary mid-run" >&2; exit 1; fi
        if: "!cancelled()"
      - name: Stage the receipts this shape consumes (transport; the reader judges them)
        id: wave_receipt_transport
        run: |
          python3 - <<'PYEOF'
          import glob, json, os, shutil, subprocess, tempfile, urllib.request, urllib.error, zipfile
          HEAD = os.environ['GITHUB_SHA']
          REPO = os.environ['GITHUB_REPOSITORY']
          RUN = int(os.environ['GITHUB_RUN_ID'])
          TOKEN = os.environ['GITHUB_TOKEN']
          MODE = os.environ['GUNBC_WAVE_SHARD']
          STAGING = os.environ['WAVE_RECEIPT_STAGING']
          WORKFLOW_FILE = 'instrument-dispatch.yml'
          def api(path):
              req = urllib.request.Request('https://api.github.com' + path, headers={'Authorization': 'Bearer ' + TOKEN, 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          import base64 as _b64
          SERVER = os.environ['GITHUB_SERVER_URL']
          BASE_REF = 'origin/main'.replace('origin/', '')
          def auth_header():
              return 'Authorization: Basic ' + _b64.b64encode(('x-access-token:' + TOKEN).encode()).decode()
          def ensure_objects(rev):
              subprocess.run(['git', 'config', '--global', '--replace-all', 'http.' + SERVER + '/.extraHeader', auth_header()], check=True)
              subprocess.run(['git', '-c', 'http.extraHeader=' + auth_header(), 'fetch', '--quiet', '--depth=50', 'origin', rev], check=False)
              subprocess.run(['git', '-c', 'http.extraHeader=' + auth_header(), 'fetch', '--quiet', '--deepen=500', 'origin'], check=False)
              shallow = os.path.exists(os.path.join('.git', 'shallow'))
              for _round in range(8):
                  probe = subprocess.run(['git', 'cat-file', '-t', rev], capture_output=True, text=True)
                  if probe.returncode == 0 and probe.stdout.strip() == 'commit':
                      return
                  subprocess.run(['git', '-c', 'http.extraHeader=' + auth_header(), 'fetch', '--quiet', '--depth=500', 'origin', BASE_REF + ':refs/remotes/origin/' + BASE_REF], check=True)
                  if shallow:
                      subprocess.run(['git', '-c', 'http.extraHeader=' + auth_header(), 'fetch', '--quiet', '--deepen=500', 'origin'], check=False)
              raise SystemExit('wave-transport: the merge base object is unreachable after 8 deepen rounds -- refusing before the instrument runs')
          def merge_base():
              return api('/repos/' + REPO + '/compare/' + BASE_REF + '...' + HEAD)['merge_base_commit']['sha']
          def clear(dest):
              os.makedirs(dest, exist_ok=True)
              for old in os.listdir(dest):
                  p = os.path.join(dest, old)
                  shutil.rmtree(p) if os.path.isdir(p) else os.remove(p)
          ARTIFACT_PREFIX = 'instrument-dispatch-receipt'
          SHARD_ROLES = ['0-of-4', '1-of-4', '2-of-4', '3-of-4']
          def role_artifact_name(role):
              return ARTIFACT_PREFIX + '-' + role
          _workflow_cache = {}
          _workflow_path_seen = {}
          def run_produced_by_this_workflow(rid):
              if rid not in _workflow_cache:
                  try:
                      w = api('/repos/' + REPO + '/actions/runs/' + str(rid))
                      _workflow_path_seen[rid] = str(w.get('path'))
                      _workflow_cache[rid] = w.get('path') == '.github/workflows/' + WORKFLOW_FILE
                  except urllib.error.HTTPError:
                      _workflow_path_seen[rid] = 'HTTPError'
                      _workflow_cache[rid] = False
              return _workflow_cache[rid]
          def artifact_candidates(role, head_ok):
              target = role_artifact_name(role)
              out = []
              def _decide(tag, rid, created, aid, verdict, why):
                  print('stager: ' + tag + ' run=' + str(rid) + ' created=' + str(created) + ' artifact=' + str(aid) + ' -> ' + str(verdict) + (' (' + why + ')' if why else ''))
              try:
                  for a in api('/repos/' + REPO + '/actions/artifacts?name=' + target + '&per_page=100')['artifacts']:
                      wr = a.get('workflow_run') or {}
                      rid = wr.get('id')
                      if rid is None or rid == RUN:
                          _decide('fast', rid, a.get('created_at'), a.get('id'), 'skip', 'own run or missing run id')
                          continue
                      if head_ok and (wr.get('head_sha') or '') != HEAD:
                          _decide('fast', rid, a.get('created_at'), a.get('id'), 'skip', 'head_sha != HEAD')
                          continue
                      if not run_produced_by_this_workflow(rid):
                          _decide('fast', rid, a.get('created_at'), a.get('id'), 'reject', 'producing-run path ' + str(_workflow_path_seen.get(rid)) + ' is not .github/workflows/' + WORKFLOW_FILE)
                          continue
                      _decide('fast', rid, a.get('created_at'), a.get('id'), 'accept', 'identity proven')
                      out.append((str(a.get('created_at') or ''), rid))
                  out.sort(reverse=True)
                  return out
              except urllib.error.HTTPError:
                  print('stager: fast path raised HTTPError; falling back to per-run enumeration for ' + target)
              for w in api('/repos/' + REPO + '/actions/workflows/' + WORKFLOW_FILE + '/runs?per_page=100')['workflow_runs']:
                  rid = w.get('id')
                  if rid is None or rid == RUN:
                      _decide('fallback', rid, w.get('created_at'), None, 'skip', 'own run or missing run id')
                      continue
                  if head_ok and w.get('head_sha') != HEAD:
                      _decide('fallback', rid, w.get('created_at'), None, 'skip', 'head_sha != HEAD')
                      continue
                  try:
                      arts = api('/repos/' + REPO + '/actions/runs/' + str(rid) + '/artifacts')['artifacts']
                  except urllib.error.HTTPError:
                      _decide('fallback', rid, w.get('created_at'), None, 'skip', 'artifact listing HTTPError')
                      continue
                  _hit = any(a.get('name') == target and not a.get('expired') for a in arts)
                  _decide('fallback', rid, w.get('created_at'), None, 'accept' if _hit else 'skip', 'named non-expired receipt present' if _hit else 'no non-expired ' + target)
                  if _hit:
                      out.append((str(w.get('created_at') or ''), rid))
              out.sort(reverse=True)
              return out
          class _StripAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return urllib.request.Request(newurl, headers={}, method=req.get_method())
          def download(url, path):
              opener = urllib.request.build_opener(_StripAuthRedirect)
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + TOKEN})
              with opener.open(req, timeout=600) as r, open(path, 'wb') as f:
                  while True:
                      chunk = r.read(1048576)
                      if not chunk:
                          break
                      f.write(chunk)
          def place(dest, src):
              dst = os.path.join(dest, os.path.basename(src))
              if os.path.exists(dst) and open(dst, 'rb').read() != open(src, 'rb').read():
                  raise SystemExit('wave-transport: transport_duplicate_receipt_bytes_differ: ' + os.path.basename(src) + ' staged twice with different bytes -- refusing before the instrument runs')
              shutil.copy2(src, dst)
          def fetch(wid, dest, want_name, must_glob):
              for a in api('/repos/' + REPO + '/actions/runs/' + str(wid) + '/artifacts')['artifacts']:
                  if a.get('name') != want_name or a.get('expired'):
                      continue
                  st = a.get('state')
                  if st is not None and st != 'completed':
                      continue
                  tmp = tempfile.mkdtemp(dir=os.path.dirname(dest))
                  zp = os.path.join(tmp, 'receipt.zip')
                  download(a['archive_download_url'], zp)
                  with zipfile.ZipFile(zp) as z:
                      z.extractall(tmp)
                  os.remove(zp)
                  hits = glob.glob(os.path.join(tmp, '**', must_glob), recursive=True)
                  if not hits:
                      shutil.rmtree(tmp)
                      return False
                  for hit in hits:
                      place(dest, hit)
                  shutil.rmtree(tmp)
                  return True
              return False
          os.makedirs(STAGING, exist_ok=True)
          clear(STAGING)
          MB = merge_base()
          ensure_objects(MB)
          PROBE = os.path.join(os.path.dirname(STAGING), 'base-probe')
          if MODE != 'base':
              if MODE.startswith('merge/'):
                  for role in SHARD_ROLES:
                      for created, wid in artifact_candidates(role, True):
                          if fetch(wid, STAGING, role_artifact_name(role), 'shard-*-' + role + '.txt'):
                              break
              for created, wid in artifact_candidates('base', False)[:16]:
                  clear(PROBE)
                  if fetch(wid, PROBE, role_artifact_name('base'), 'base-' + MB + '-*' + '.txt'):
                      for hit in glob.glob(os.path.join(PROBE, '**', 'base-' + MB + '-*' + '.txt'), recursive=True):
                          place(STAGING, hit)
                      break
              clear(PROBE)
          PYEOF
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GUNBC_WAVE_SHARD: ${{ inputs.wave_shard }}
          WAVE_RECEIPT_STAGING: ${{ runner.temp }}/instrument-dispatch/wave-staging
        if: inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard != 'none'
      - name: Move the staged receipts into the reader's directory
        id: wave_receipt_import
        run: |
          'mkdir' '-p' '././target/namespace-wave-binding-diff/shards'
          'find' "$WAVE_RECEIPT_STAGING" '-type' 'f' '(' '-name' 'base-*.txt' '-o' '-name' 'shard-*.txt' '-o' '-name' 'verdict-*.txt' ')' '-exec' 'cp' '-a' '-t' '././target/namespace-wave-binding-diff/shards' '{}' '+'
        shell: bash
        env:
          WAVE_RECEIPT_STAGING: ${{ runner.temp }}/instrument-dispatch/wave-staging
        if: inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard != 'none'
      - name: Run the dispatched instrument
        id: instrument
        run: |
          set -e
          status='0'
          'set' '-o' 'pipefail'
          ('target/release/gunbc' 'test' "$INSTRUMENT_LABEL" > "$RUNNER_TEMP"'/instrument-dispatch/stdout.txt') 2>&1 | 'tee' "$RUNNER_TEMP"'/instrument-dispatch/stderr.txt' >&2 || status="$?"
          'cat' "$RUNNER_TEMP"'/instrument-dispatch/stdout.txt'
          'echo' 'exit='"$status" > "$RUNNER_TEMP"'/instrument-dispatch/exit.txt'
          '[' "$status" '=' '0' ']'
        shell: bash
        env:
          INSTRUMENT_LABEL: ${{ inputs.label }}
          GUNBC_WAVE_SHARD: ${{ inputs.wave_shard }}
      - name: Copy the reader's receipts into the artifact tree
        id: wave_receipt_export
        run: |
          if '[' '-d' '././target/namespace-wave-binding-diff/shards' ']'; then 'mkdir' '-p' "$RUNNER_TEMP"'/instrument-dispatch''/shards'; 'cp' '-a' '././target/namespace-wave-binding-diff/shards''/.' "$RUNNER_TEMP"'/instrument-dispatch''/shards'; fi
        shell: bash
        if: always()
      - name: Upload the run's receipt and output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard == 'merge/4' && 'instrument-dispatch-receipt-merge-of-4' || inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard == '3/4' && 'instrument-dispatch-receipt-3-of-4' || inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard == '2/4' && 'instrument-dispatch-receipt-2-of-4' || inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard == '1/4' && 'instrument-dispatch-receipt-1-of-4' || inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard == '0/4' && 'instrument-dispatch-receipt-0-of-4' || inputs.label == '//gunbc/instruments:namespace-wave-binding-diff' && inputs.wave_shard == 'base' && 'instrument-dispatch-receipt-base' || 'instrument-dispatch-receipt' }}
          path: ${{ runner.temp }}/instrument-dispatch
          if-no-files-found: error
          retention-days: 30
        if: always()
