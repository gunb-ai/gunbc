# Hand-synced projection of src/v2/workflow/release.dag (RELEASE_TODO.md §5 Phase 1a).
# Semantic authority: src/v2/workflow/release.dag — update the model first, then mirror here.
# YamlStatic `release_pipeline → release.yml` deferred (same posture as ci.dag / TASKS T-24).
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            artifact_basename: gunbc-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            cross: true
            artifact_basename: gunbc-aarch64-unknown-linux-musl
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
            artifact_basename: gunbc-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            runner: macos-14
            cross: false
            artifact_basename: gunbc-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            cross: false
            artifact_basename: gunbc-x86_64-pc-windows-msvc.exe
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            cross: false
            artifact_basename: gunbc-aarch64-pc-windows-msvc.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: true
          cache-workspaces: src/v1/stage0
          rustflags: ''
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Install aarch64 strip (musl cross artifacts on x86 runner)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: Build gunbc
        shell: bash
        run: |
          set -eux
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p v1-compiler --bin gunbc --target '${{ matrix.target }}'
            bin="target/${{ matrix.target }}/release/gunbc"
          else
            cargo build --release -p v1-compiler --bin gunbc --target '${{ matrix.target }}'
            if [ '${{ runner.os }}' = 'Windows' ]; then
              bin="target/${{ matrix.target }}/release/gunbc.exe"
            else
              bin="target/${{ matrix.target }}/release/gunbc"
            fi
          fi
          mkdir -p dist
          cp "$bin" "dist/${{ matrix.artifact_basename }}"
          case '${{ matrix.target }}' in
            aarch64-unknown-linux-musl) aarch64-linux-gnu-strip "dist/${{ matrix.artifact_basename }}" ;;
            *-pc-windows-msvc) ;;
            *) strip "dist/${{ matrix.artifact_basename }}" ;;
          esac
      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_basename }}
          path: dist/${{ matrix.artifact_basename }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # RELEASE_TODO §5 Phase 1b — hand-synced from install.dag until ShellStatic emit lands.
      - name: Stage install assets
        run: |
          set -eux
          cp install.sh dist/install.sh
          # Flat basename only — GH Release assets are a flat namespace; install.sh
          # downloads release-target-triples.sh from releases/download/{tag}/.
          cp install/release-target-triples.sh dist/release-target-triples.sh
          chmod +x dist/install.sh dist/release-target-triples.sh
          ls -la dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
