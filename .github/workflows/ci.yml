name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
# Shell-free CI floor (operator 2026-06-16): demolished the bash/python gate
# scripts and the `.dag` shell-out orchestration. Gates run as direct cargo +
# ci-claim-gate invocations; the claim corpus is discovery-driven (reflection
# over `unified_claim_*` BoolWitness decls), no hand-typed roster. Branch
# protection should reference job id `ci`.
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      # CARGO_HOME/RUSTUP_HOME MUST be exported here, before `Setup Rust` + `Cache
      # Cargo` below install/restore into the isolated dirs. The sccache upsert is
      # NOT here: it is modeled fail-closed inside the floor binary (the
      # sccache-upsert gate in dsl/gunbc/ci.dag), which brings up the daemon and
      # wraps the cargo-bearing gates it spawns. No fail-open "building cold" path.
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Scrub dangling remote refs (shared runner worktree)
      run: |
        scrub_repo() {
          local repo="$1"
          [ -d "${repo}/.git" ] || return 0
          echo "::group::Scrub dangling remote refs: ${repo}"
          while IFS= read -r sha ref; do
            [ -n "$ref" ] || continue
            if ! git -C "$repo" cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::warning::deleting dangling ref ${ref}"
              if ! git -C "$repo" update-ref -d "$ref" 2>/dev/null; then
                echo "::warning::update-ref -d failed for ${ref} -- removing repo for fresh clone"
                rm -rf "$repo"
                echo "::endgroup::"
                return 0
              fi
            fi
          done < <(git -C "$repo" show-ref refs/remotes/origin 2>/dev/null || true)
          corrupt=0
          if ! git -C "$repo" for-each-ref >/dev/null 2>&1; then
            corrupt=1
          else
            while IFS= read -r sha ref; do
              [ -n "$ref" ] || continue
              if ! git -C "$repo" cat-file -e "${sha}^{commit}" 2>/dev/null; then
                echo "::warning::ref ${ref} tip still missing after scrub"
                corrupt=1
                break
              fi
            done < <(git -C "$repo" show-ref refs/remotes/origin 2>/dev/null || true)
          fi
          if [ "$corrupt" -eq 1 ]; then
            echo "::warning::repo ${repo} has unresolvable refs after scrub -- removing for fresh clone"
            rm -rf "$repo"
          fi
          echo "::endgroup::"
        }
        for repo in \
          "${RUNNER_WORKSPACE}/gunbc" \
          "${RUNNER_WORKSPACE}/gunbc/gunbc" \
          "${RUNNER_WORKSPACE}/_work/gunbc/gunbc"; do
          scrub_repo "$repo"
        done
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
      env:
        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    # The whole CI floor: one .dag binary. ci-claim-gate discovers the
    # `unified_claim_*` BoolWitness corpus and evaluates every claim in-interpreter.
    # No shell gate script, no hand-typed roster, no `.dag` shell-out.
    - name: CI floor (.dag claim gate)
      run: cargo run -p ci_claim_gate --release -- --source-root src/v4 --roster-from-discovery --scan-dir src/v4/test/claim --notice-title "v4 claim corpus"
