name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v2/stage0/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Build Compiler
        run: cargo build -p v2-compiler --release

      - name: CI Pipeline
        run: cargo run -p v2-compiler --release -- run --source-root dsl --function run_ci_pipeline

      - name: CI Timing
        if: always()
        run: cat /tmp/v2-ci-timing.txt 2>/dev/null || echo "no timing data"

  v3:
    runs-on: ubuntu-latest
    # Full suite is capped at 750s, plus clippy + lens gates + cold compile — 15m
    # can cancel the job before the final steps finish.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo (v3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v3-${{ runner.os }}-

      # Layer 1 (coarse CI): wall-clock gates on `cargo test -p v3-compiler`.
      #
      # Full-suite budget is 750s (upstream). Warm local runs are often ~520–560s for
      # `cargo test -p v3-compiler`, but cold GitHub runners + cache misses still
      # need headroom beyond a tight 600s-style cap (Layer 1 ratchet history).
      # Regressions show up when integration tests redo full `compile_to_dag` per
      # `#[test]` (see `lane2_stage_2e_parallelism_test`: shared `OnceLock` + clone).
      #
      # Wall-clock gate on `lane2_stage_2d_symbolic_cost_test` only (ζ / #537).
      # The timer wraps the full `cargo test` process, so **cold** runs (cache
      # miss, first compile of `v3-compiler` + test binary on ubuntu-latest) can
      # spend minutes linking — 120s was too tight and failed CI while local warm
      # runs stayed ~5–15s. Keep this high enough for cold paths; per-test
      # discipline still lives in `tests/common/budgeted.rs` (DEFAULT_BUDGET_MS).
      - name: v3 tests (Stage 2d binary, 300s cold-compile-safe budget)
        run: |
          start=$(date +%s)
          cargo test -p v3-compiler --test lane2_stage_2d_symbolic_cost_test
          elapsed=$(( $(date +%s) - start ))
          echo "v3 Stage 2d test wall time: ${elapsed}s"
          if [ "$elapsed" -gt 300 ]; then
            echo "::error::v3 Stage 2d tests took ${elapsed}s (budget: 300s) — share bootstrap setup via OnceLock or collapse fine-grained tests"
            exit 1
          fi

      - name: v3 tests (full suite, 750s budget)
        run: |
          start=$(date +%s)
          cargo test -p v3-compiler
          elapsed=$(( $(date +%s) - start ))
          echo "v3 full-suite wall time: ${elapsed}s"
          if [ "$elapsed" -gt 750 ]; then
            echo "::error::v3 full-suite tests took ${elapsed}s (budget: 750s). Likely cause: integration tests redoing full bootstrap + compile per #[test] without shared setup, or an unexpected suite-wide slowdown. Share compile results via OnceLock/module cache, collapse fine-grained tests, or trim redundant work."
            exit 1
          fi

      - name: v3 Compiler Clippy
        run: cargo clippy -p v3-compiler --all-targets -- -D warnings

      - name: L-7 Substrate accessor reconstruction gate
        run: |
          # L-7 (INVARIANTS.md): lenses consume substrate query
          # functions (`port`, `node`, `resolve_producer`) instead of
          # reconstructing local `find_port` / `find_behavior` / ...
          # Scan `.dag` lens files for forbidden helper declarations.
          matches=$(grep -nE "fn (find_port|find_behavior|resolve_producer|lookup_node|lookup_port)" src/v3/lenses/*.dag 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::L-7 violation: lens reconstructs a substrate lookup locally"
            echo "$matches"
            exit 1
          fi

      - name: L-8 Lens surface gate
        run: |
          # L-8 (INVARIANTS.md): migrated .dag lenses must not collapse
          # their typed failure carriers into primitives at the public
          # Rust surface. The forbidden shape is any `pub fn ... -> T`
          # for T in {usize, bool, i64} inside a hand-written wrapper
          # alongside a generated lens module — e.g., the deleted
          # `pub fn cost_of(&self, port: PortId) -> usize` wrapper that
          # shadowed the generated `CostLookup` carrier.
          #
          # Scope: every `src/v3/compiler/src/lens_*.rs` wrapper except
          # `lens_depth.rs` (hand-written legacy lens, not migrated
          # from .dag, so out of L-8 scope). `*_generated.rs` files are
          # also scanned — they should never contain a collapsing
          # wrapper, and catching one there would mean the emitter
          # regressed.
          wrappers=$(ls src/v3/compiler/src/lens_*.rs 2>/dev/null | grep -v "/lens_depth.rs$" || true)
          if [ -z "$wrappers" ]; then
            echo "L-8: no lens wrapper files to scan"
            exit 0
          fi
          matches=$(grep -nE "pub fn .*-> (usize|bool|i64)" $wrappers 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::L-8 violation: lens wrapper collapses typed carrier to a primitive"
            echo "$matches"
            exit 1
          fi

      - name: Banked-dissolutions ratchet
        run: scripts/check-banked-dissolutions.sh
