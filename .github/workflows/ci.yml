name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
# One-binary CI floor (operator 2026-06-15): gate membership + shell transport live in
# dsl/gunbc/ci.dag; execution + GHA log annotations in dsl/gunbc/tools/ci_runner.dag.
# This workflow is a thin shim: runner-isolation guard + checkout/toolchain + one
# `run_ci_pipeline` invocation. Branch protection should reference job id `ci` (and
# `infra_isolation` for the fork-PR de-priv guard).
jobs:
  infra_isolation:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Assert runner is de-privileged (adversarial)
      run: |
        fail(){ echo "::error::INFRA ISOLATION REGRESSION: $1"; exit 1; }
        [ "$(id -u)" -ne 0 ] || fail "running as root"
        for g in docker sudo lxd wheel root; do id -nG | tr ' ' '\n' | grep -qx "$g" && fail "in privileged group $g"; done
        cat /etc/actions-runner/app.pem >/dev/null 2>&1 && fail "can read the App private key"
        sudo -n true 2>/dev/null && fail "has passwordless sudo"
        { test -r /var/run/docker.sock || test -w /var/run/docker.sock; } && fail "can read or write docker.sock"
        echo "OK: non-root, no privileged groups (docker/sudo/lxd/wheel/root), App key unreadable, no passwordless sudo, docker.sock inaccessible"
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    needs: [infra_isolation]
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
        sccache --stop-server >/dev/null 2>&1 || true
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ] \
             && sccache --start-server >/dev/null 2>&1 \
             && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache server (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent, unwritable, or unreachable; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Scrub dangling remote refs (shared runner worktree)
      run: |
        scrub_repo() {
          local repo="$1"
          [ -d "${repo}/.git" ] || return 0
          echo "::group::Scrub dangling remote refs: ${repo}"
          while IFS= read -r sha ref; do
            [ -n "$ref" ] || continue
            if ! git -C "$repo" cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::warning::deleting dangling ref ${ref}"
              if ! git -C "$repo" update-ref -d "$ref" 2>/dev/null; then
                echo "::warning::update-ref -d failed for ${ref} -- removing repo for fresh clone"
                rm -rf "$repo"
                echo "::endgroup::"
                return 0
              fi
            fi
          done < <(git -C "$repo" show-ref refs/remotes/origin 2>/dev/null || true)
          corrupt=0
          if ! git -C "$repo" for-each-ref >/dev/null 2>&1; then
            corrupt=1
          else
            while IFS= read -r sha ref; do
              [ -n "$ref" ] || continue
              if ! git -C "$repo" cat-file -e "${sha}^{commit}" 2>/dev/null; then
                echo "::warning::ref ${ref} tip still missing after scrub"
                corrupt=1
                break
              fi
            done < <(git -C "$repo" show-ref refs/remotes/origin 2>/dev/null || true)
          fi
          if [ "$corrupt" -eq 1 ]; then
            echo "::warning::repo ${repo} has unresolvable refs after scrub -- removing for fresh clone"
            rm -rf "$repo"
          fi
          echo "::endgroup::"
        }
        for repo in \
          "${RUNNER_WORKSPACE}/gunbc" \
          "${RUNNER_WORKSPACE}/gunbc/gunbc" \
          "${RUNNER_WORKSPACE}/_work/gunbc/gunbc"; do
          scrub_repo "$repo"
        done
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
      env:
        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Cache Cargo
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Run modeled CI pipeline (one-binary floor)
      run: cargo run -p v2-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/gunbc/tools/ci_runner.dag --function run_ci_pipeline
    - name: Floor witness RED teeth (hermetic by-execution)
      run: bash scripts/ci-floor-witnesses.sh --red-demo
