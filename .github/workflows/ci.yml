          target/release/gunbc
          target/release/claim_batch
          target/release/claim_executor
        key: gunbc-lens-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          gunbc-lens-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Build v2 compiler (v4 lens CI perturb)
