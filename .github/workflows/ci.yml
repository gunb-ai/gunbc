      run: bash .github/ci-floor/with-sccache-retry.sh cargo build -p v2-compiler --release
    - name: affected-set lens PERTURB shard (red-under-mutation receipts)
      run: bash scripts/v4-affected-set-node-frontier-gate.sh --perturb-shard "${{ strategy.job-index }}" "${{ strategy.job-total }}"
