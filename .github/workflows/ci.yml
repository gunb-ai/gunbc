name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  fmt:
    if: github.event.pull_request.draft != true
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: cargo fmt --all --check
      run: cargo fmt --all --check
  # Affected-set detection — drives gating of v2/v3 jobs (frozen components
  # only run their heavy CI when their source is touched, or on push-to-main
  # for trunk verification). Cheap (~30s); other jobs depend on its outputs.
  affected:
    if: github.event.pull_request.draft != true
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    outputs:
      v2: ${{ steps.detect.outputs.v2 }}
      v3: ${{ steps.detect.outputs.v3 }}
      v4: ${{ steps.detect.outputs.v4 }}
      workflow_policy: ${{ steps.detect.outputs.workflow_policy }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch main for diff base
      if: github.event_name == 'pull_request'
      run: git fetch origin main:refs/remotes/origin/main
    - name: Detect affected components
      id: detect
      run: bash scripts/detect-affected-components.sh "${{ github.event_name }}" "$GITHUB_OUTPUT"
  ci:
    if: github.event.pull_request.draft != true
    needs: [affected]
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Fetch main for PR discipline diffs
      if: github.event_name == 'pull_request'
      run: git fetch origin main:refs/remotes/origin/main
    - name: SG-0 net-shrink PR-body discipline (self-test)
      run: bash scripts/check-pr-sg0-net-shrink-discipline.sh --self-test
    - name: SG-0 net-shrink PR-body discipline
      if: github.event_name == 'pull_request'
      env:
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        body="${PR_BODY}"
        append_file="scripts/ci-merge/sg0-pr-body-append.${{ github.event.pull_request.number }}.txt"
        if [ -f "${append_file}" ]; then
          # Prepend so `check-pr-sg0-net-shrink-discipline.sh` (grep head-1 on
          # `SG-0 hand-path delta:`) reads the machine-authored append **first**. PR
          # descriptions often keep template scaffolding or mistaken `+0` paste lines
          # above the fold — appending only left those as the first match and tripped
          # declared-vs-computed mismatch (false fail).
          body="$(cat "${append_file}")"$'\n\n'"${body}"
        fi
        PR_BODY="${body}" bash scripts/check-pr-sg0-net-shrink-discipline.sh
    - name: R4-carve dissolution discipline (self-test)
      run: bash scripts/check-r4-carve-dissolution-discipline.sh --self-test
    - name: R4-carve dissolution discipline
      run: bash scripts/check-r4-carve-dissolution-discipline.sh
    - name: Fabrication sentinel ratchet (P0-C)
      run: bash scripts/check-fabrication-sentinels.sh
    - name: v4 strict-deprose script self-test (Python)
      run: python3 scripts/test_strict_deprose_dag.py
    - name: v4 strict-deprose allowlist (--check; merge-base + Part 6 inventory)
      run: python3 scripts/strict_deprose_dag.py --check
    - name: Release-doc authority check (P2 single-authority discipline)
      run: bash scripts/check-release-doc-authority.sh
    - name: Release-doc authority self-test (consumer not ceremonial)
      run: bash scripts/test-check-release-doc-authority.sh
    - name: Manager-brief authority check (P2 single-authority discipline)
      run: bash scripts/check-manager-brief-authority.sh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Manager-brief authority self-test (consumer not ceremonial)
      run: bash scripts/test-check-manager-brief-authority.sh
    - name: Test-timeout ratchet self-test (consumer not ceremonial)
      run: bash scripts/test-check-test-timeout.sh
    - name: Rust toolchain single-authority check (P2)
      run: bash scripts/check-rust-toolchain-single-authority.sh
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Cache Cargo (ci bootstrap gate)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-ci-${{ runner.os }}-
    - name: v3 bootstrap snapshot freshness gate (--verify)
      if: needs.affected.outputs.v3 == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      run: cargo run -p v3-compiler --features bootstrap-regen-fresh --bin regen_bootstrap -- --verify
    - name: 'Gate #103 — path-regex inventory ratchet (canvas §5)'
      if: needs.affected.outputs.workflow_policy == 'true' || needs.affected.outputs.v3 == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      run: bash scripts/check-workflow-path-regex-inventory.sh
    - name: 'Gate #103 — Layer 1 selection + workflow YAML policy (integration)'
      if: needs.affected.outputs.workflow_policy == 'true' || needs.affected.outputs.v3 == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      run: |
        set -euo pipefail
        cargo test -p v3-compiler --test integration ci_uses_affected_set_selection -- --quiet
        cargo test -p v3-compiler --test integration workflow_no_path_regex_policy_ci_yml -- --quiet
    # T-15 SG-0 / INVARIANTS §P5(b) receipt: `v4_bin_main_dag_smoke_test` lives in the v3
    # integration harness, but the v3 job still runs that harness under the gunbc#846 HOT-FIX
    # zero-test-filter — so this receipt must execute here (ci job) whenever v3/v4/workflow_policy
    # gates compile the integration binary, else the parse/tokenize/source-anchor assertions never run.
    - name: T-15 v4 bin main.dag smoke (live integration receipt)
      if: needs.affected.outputs.v4 == 'true' || needs.affected.outputs.v3 == 'true' || needs.affected.outputs.workflow_policy == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      run: cargo test -p v3-compiler --test integration v4_bin_main_dag_smoke_test::v4_bin_main_dag_tokenizes_and_parses_with_trampoline_source_anchor -- --exact --quiet
  # v2 fixed-point — runs only when src/v2/ is affected. v2 is restored as
  # comparison artifact + v4 bootstrap source (frozen-buildable). Verifies
  # that any modification to v2 preserves the self-host fixed-point property.
  v2:
    if: github.event.pull_request.draft != true && needs.affected.outputs.v2 == 'true'
    needs: [affected]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
    - name: Cache Cargo (v2)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v2/**') }}
        restore-keys: |
          cargo-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-v2-${{ runner.os }}-
    - name: v2 fixed-point (bootstrap_fixed_point, --ignored)
      run: |
        set -euo pipefail
        cargo test -p v2-compiler-tests --release bootstrap_fixed_point -- --ignored --exact
  # v4 bootstrap viability — verifies v2's compiled binary can still parse
  # every v4 .dag file. v4 stage0 must stay in v2-syntax-compatible subset
  # (per src/v4/workflow/bootstrap.dag bootstrap chain) until v4 self-compiles.
  # This gate catches any v4 change that introduces syntax v2 can't parse.
  v4:
    if: github.event.pull_request.draft != true && needs.affected.outputs.v4 == 'true'
    needs: [affected]
    runs-on: ubicloud-standard-8
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
    - name: Cache Cargo (v4 — shares with v2 since we build v2 binary)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v2/**') }}
        restore-keys: |
          cargo-v2-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-v2-${{ runner.os }}-
    # Cache the built v2-compiler BINARY, keyed on the frozen bootstrap
    # seed. src/v2/ is touched almost never (and CI-gated when it is), so
    # this key is near-permanently stable — a hit skips the cold ~1m
    # v2-compiler rebuild entirely. Caching target/ alone is unreliable:
    # cargo's freshness check over a cache-restored target/ frequently
    # recompiles anyway; caching the output artifact and not invoking
    # cargo at all sidesteps that.
    #
    # Interim MANUAL key. The structural form is content_hash() over the
    # src/v2/stage0 input subgraph — see src/v4/lens/affected_set.dag and
    # src/v4/workflow/ci.dag. Once workflow/ci.dag (T-24) emits this
    # workflow, the key becomes an emitted content-hash, not a hashFiles
    # glob.
    - name: Cache v2-compiler binary
      id: v2-bin
      uses: actions/cache@v4
      with:
        path: target/release/v2-compiler
        # Root Cargo.toml is included: its [profile.release] settings
        # affect the v2-compiler binary without touching Cargo.lock or
        # src/v2/stage0/**.
        key: v2-compiler-bin-${{ runner.os }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
    - name: Build v2 compiler (bootstrap stage minus one)
      if: steps.v2-bin.outputs.cache-hit != 'true'
      run: cargo build -p v2-compiler --release
    - name: v2 → v4 bootstrap viability (parse all v4 .dag files via v2)
      run: |
        set -euo pipefail
        rm -rf /tmp/v4-stage1
        mkdir -p /tmp/v4-stage1
        set +e
        timeout 120s target/release/v2-compiler compile --source-root src/v4 --output-dir /tmp/v4-stage1 --target dag 2>&1 | tee /tmp/v4-stage1.log
        status=${PIPESTATUS[0]}
        set -e
        if [[ "$status" -eq 0 ]]; then
          echo "Bootstrap viability OK — v2 compiled all v4 modules."
        elif [[ "$status" -eq 124 ]] && grep -q "resolved .* sources (transitive import closure)" /tmp/v4-stage1.log; then
          echo "Bootstrap viability OK — v2 indexed and resolved all v4 modules; emit path remains T-22-deferred."
        else
          exit "$status"
        fi
    - name: 'INTERIM (T-24 bridge) — v4 v2-run-preflight notice (run gate deferred T-22)'
      env:
        V2_PREFLIGHT_SKIP_COMPILE: "1"
      run: bash scripts/v2-run-preflight.sh
  # v3 — FROZEN 2026-05-15 pending v4 program. Runs only when src/v3/ or dsl/
  # is affected (or on push-to-main for trunk verification). v3 is no longer
  # the active compiler; v4 program supersedes it (see PR #3147).
  v3:
    if: github.event.pull_request.draft != true && (needs.affected.outputs.v3 == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [affected]
    runs-on: ubicloud-standard-8
    timeout-minutes: 120
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt, clippy
        cache: false
        rustflags: ''
    - name: Setup Zig C toolchain
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.13.0
        cache: false
    - name: Configure user-space C linker
      run: |
        mkdir -p "${RUNNER_TEMP}/gunbc-bin"
        cat > "${RUNNER_TEMP}/gunbc-bin/zig-cc" <<'EOF'
        #!/usr/bin/env bash
        exec zig cc "$@"
        EOF
        chmod +x "${RUNNER_TEMP}/gunbc-bin/zig-cc"
        echo "CC=${RUNNER_TEMP}/gunbc-bin/zig-cc" >> "${GITHUB_ENV}"
        echo "RUSTFLAGS=-D warnings -C linker=${RUNNER_TEMP}/gunbc-bin/zig-cc" >> "${GITHUB_ENV}"
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.x
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version: stable
    - name: Cache Cargo (v3)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
        restore-keys: |
          cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-v3-${{ runner.os }}-
    - name: Build ExecuteCommand unshare helper
      run: cargo build -p execute-command-bootstrap
    - name: Prebuild v3 integration test binary (lane2d wall-clock denominator)
      run: |
        set -euo pipefail
        heartbeat() {
          while sleep 60; do
            echo "v3 prebuild heartbeat: $(date -u +%FT%TZ)"
          done
        }
        heartbeat &
        heartbeat_pid=$!
        trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
        cargo test -p v3-compiler --test integration --no-run
    - name: v3 tests (Stage 2d integration module, HOT-FIX SKIPPED)
      run: |
        echo "::notice::v3 lane2d Stage 2d test execution SKIPPED per operator hot-fix directive at gunbc#846 (cold-v3 → ~10min target)."
        echo "::notice::Restore criteria: per-test wall ≤ 2s under OnceLock/cached_compile amortization (rebuild session per #2722 §5)."
        exit 0
    - name: v3 full-suite split guard (integration test targets)
      run: scripts/check-v3-full-suite-split-test-targets.sh
    - name: v3 tests (full suite lib+bins, timings part 1/4)
      env:
        CARGO_TERM_COLOR: never
        RUST_MIN_STACK: 16777216
      run: |
        set -euo pipefail
        echo "V3_SUITE_START_TS=$(date +%s)" >> "${GITHUB_ENV}"
        : > /tmp/v3-test-timings.log
        RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --lib --bins -- -Z unstable-options --report-time 2>&1 | tee /tmp/v3-test-timings.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "::error::cargo test (lib+bins) failed (exit=$status)"
          exit "$status"
        fi
    - name: v3 tests (full suite determinism harness, timings part 2/4)
      env:
        CARGO_TERM_COLOR: never
        RUST_MIN_STACK: 16777216
      run: |
        set -euo pipefail
        RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --test determinism_test -- -Z unstable-options --report-time 2>&1 | tee -a /tmp/v3-test-timings.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "::error::cargo test (determinism_test) failed (exit=$status)"
          exit "$status"
        fi
    - name: v3 tests (full suite doc tests, timings part 3/4)
      env:
        CARGO_TERM_COLOR: never
        RUST_MIN_STACK: 16777216
      run: |
        set -euo pipefail
        RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --doc -- -Z unstable-options --report-time 2>&1 | tee -a /tmp/v3-test-timings.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          echo "::error::cargo test (--doc) failed (exit=$status)"
          exit "$status"
        fi
    - name: v3 tests (full suite integration harness, HOT-FIX zero-test-filter)
      env:
        CARGO_TERM_COLOR: never
        RUST_MIN_STACK: 16777216
      run: |
        set -euo pipefail
        echo "::notice::v3 integration test execution SKIPPED via zero-test-filter per operator hot-fix at gunbc#846."
        echo "::notice::Guard pattern preserved; integration binary runs zero tests (nonexistent filter)."
        if [ -z "${V3_SUITE_START_TS:-}" ]; then
          echo "::error::missing V3_SUITE_START_TS (full suite part 1 must run first)"
          exit 1
        fi
        # Zero-test-filter: `__HOT_FIX_NONEXISTENT_FILTER__` matches no tests;
        # binary runs through libtest setup + reports 0 tests run. Satisfies
        # check-v3-full-suite-split-test-targets.sh pattern requirement.
        RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --test integration __HOT_FIX_NONEXISTENT_FILTER__ -- -Z unstable-options --report-time 2>&1 | tee -a /tmp/v3-test-timings.log
        status=${PIPESTATUS[0]}
        elapsed=$(( $(date +%s) - V3_SUITE_START_TS ))
        echo "v3 full-suite wall time (integration-skipped): ${elapsed}s"
        if [ "$status" -ne 0 ]; then
          echo "::error::cargo test (integration, zero-filter) failed (exit=$status) — should never happen with nonexistent filter; investigate."
          exit "$status"
        fi
        echo "::notice::Restore criteria: rebuild session per #2722 §5 OnceLock/cached_compile amortization → per-test wall ≤ 2s ratchet → re-enable per cluster filter (replace __HOT_FIX_NONEXISTENT_FILTER__ with cluster-specific filter)."
    - name: v3 gunbc-ci binary (wall-clock warn manifest + BinaryShim stub)
      if: always()
      run: cargo build -p v3-compiler --bin gunbc-ci
    - name: v3 tests (per-test 2s ratchet)
      if: always()
      run: |
        if [ ! -s /tmp/v3-test-timings.log ]; then
          echo "::notice::no timing log captured or log is empty (full-suite steps did not reach cargo test, or tee wrote nothing) — skipping per-test ratchet"
          exit 0
        fi
        scripts/check-test-timeout.sh /tmp/v3-test-timings.log
    - name: v3 Compiler Clippy (default features)
      run: cargo clippy -p v3-compiler --all-targets -- -D warnings
    - name: v3 Compiler Clippy (bootstrap-regen-fresh)
      run: cargo clippy -p v3-compiler --all-targets --features bootstrap-regen-fresh -- -D warnings
    - name: v3 test targets compile with bootstrap-regen-fresh
      run: cargo test -p v3-compiler --no-run --features bootstrap-regen-fresh
    - name: L-7 Substrate accessor reconstruction gate
      run: |
        # L-7 (INVARIANTS.md): lenses consume substrate query
        # functions (`port`, `node`, `resolve_producer`) instead of
        # reconstructing local `find_port` / `find_behavior` / ...
        # Scan `.dag` lens files for forbidden helper declarations.
        matches=$(grep -nE "fn (find_port|find_behavior|resolve_producer|lookup_node|lookup_port)" src/v3/lenses/*.dag 2>/dev/null || true)
        if [ -n "$matches" ]; then
          echo "::error::L-7 violation: lens reconstructs a substrate lookup locally"
          echo "$matches"
          exit 1
        fi
    - name: L-8 Lens surface gate
      run: |
        # L-8 (INVARIANTS.md): migrated .dag lenses must not collapse
        # their typed failure carriers into primitives at the public
        # Rust surface. The forbidden shape is any `pub fn ... -> T`
        # for T in {usize, bool, i64} inside a hand-written wrapper
        # alongside a generated lens module — e.g., the deleted
        # `pub fn cost_of(&self, port: PortId) -> usize` wrapper that
        # shadowed the generated `CostLookup` carrier.
        #
        # Scope: every `src/v3/compiler/src/lens_*.rs` file (hand-written
        # and `*_generated.rs` — catching a collapsed wrapper in generated
        # code would mean the emitter regressed).
        wrappers=$(ls src/v3/compiler/src/lens_*.rs 2>/dev/null || true)
        if [ -z "$wrappers" ]; then
          echo "L-8: no lens wrapper files to scan"
          exit 0
        fi
        matches=$(grep -nE "pub fn .*-> (usize|bool|i64)" $wrappers 2>/dev/null || true)
        if [ -n "$matches" ]; then
          echo "::error::L-8 violation: lens wrapper collapses typed carrier to a primitive"
          echo "$matches"
          exit 1
        fi
    - name: Compiler-std consolidation ratchet
      run: scripts/check-compiler-std-ratchet.sh
    - name: Banked-dissolutions ratchet
      run: scripts/check-banked-dissolutions.sh
  self_host_ratchet:
    if: ${{ always() && github.event.pull_request.draft != true && (needs.affected.outputs.v3 == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubicloud-standard-8
    timeout-minutes: 60
    needs:
    - affected
    - v3
    continue-on-error: true
    steps:
    - name: Validate gate evidence (fail-closed under v3 failure; tolerates v3 skipped)
      run: |
        echo "Gate evidence: v3.result=${{ needs.v3.result }}"
        # Under v3-freeze (2026-05-15), v3 job is skipped on PRs that don't touch v3.
        # 'skipped' is acceptable here — means v3 was correctly not run.
        if [ "${{ needs.v3.result }}" = "skipped" ]; then
          echo "::notice::v3 job skipped (v3 not affected by this PR); self_host_ratchet has nothing to validate."
          exit 0
        fi
        if [ "${{ needs.v3.result }}" = "failure" ] || [ "${{ needs.v3.result }}" = "cancelled" ]; then
          echo "::error::v3 job did not succeed (result=${{ needs.v3.result }}); ratchet cannot claim green."
          exit 1
        fi
        if [ "${{ needs.v3.result }}" != "success" ]; then
          echo "::error::v3 job has unexpected result (result=${{ needs.v3.result }}); expected success after Layer-2 path-regex removal."
          exit 1
        fi
        echo "Gate evidence validated; ratchet may proceed."
    - name: Checkout
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: DB-8 stub (PR / non-main — full matrix is main-push only)
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      run: |
        echo "::notice::self_host_ratchet DB-8 release matrix runs only on pushes to main (Lane 1e staged)."
        exit 0
    - name: Setup Rust
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
    - name: Cache Cargo (self_host_ratchet)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: cargo-self-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/**') }}
        restore-keys: |
          cargo-self-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-self-host-${{ runner.os }}-
    - name: DB-8 determinism_test (5× emit matrix)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      continue-on-error: true
