name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Run CI Pipeline
        run: cargo run -p gunbc-dag --bin gunbc-ci
        env:
          CARGO_INCREMENTAL: "1"
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_SECRETS_PROJECT: ${{ secrets.GCP_SECRETS_PROJECT }}
          GCP_SECRETS_PREFIX: ${{ secrets.GCP_SECRETS_PREFIX }}
          GCP_SECRETS_SA: ${{ secrets.GCP_SECRETS_SA }}
          GCP_SECRETS_IMPERSONATE_SA: ${{ secrets.GCP_SECRETS_IMPERSONATE_SA }}
