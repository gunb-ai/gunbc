name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
# Wave 1 §11.7.1 safety floor — fmt + affected receipt + ci_floor (M1 rust+dag emit + DAG parity)
# Required on every non-draft PR: fmt, affected-set component receipt, M1 rust+dag emit, DAG parity receipt.
jobs:
  # RUNNER-ISOLATION SECURITY FLOOR -- model authority: src/v4/workflow/ci.dag
  # `ci_runner_isolation_policy`. This job + its carrier Job record are coverage-bound byte-for-byte
  # by the full-workflow carrier dsl/gunbc/ci_github_actions_workflow.dag (tests
  # gunbc_ci_github_actions_workflow_matches_ci_yml_structure + _pins_ci_yml_source_checksum).
  # gunbc is PUBLIC on the private self-hosted fleet, so
  # fork-PR runs execute attacker-controlled code on srv1/srv2. The operator runner de-priv (jobs run
  # as unprivileged `ghrunner`: non-root, not in docker/sudo/lxd/wheel/root, no passwordless sudo, no
  # read on the App private key or docker.sock) lives in the fleet host config OUTSIDE this repo -- a
  # silent host-side regression would re-expose the fleet with no in-repo diff. This job adversarially
  # probes its own runtime privilege and fails closed the moment the runner is re-privileged. It runs
  # UNCONDITIONALLY (no draft gate, no affected mask): the fork-PR exposure exists wherever a runner
  # executes. It does NOT check out the repo or build -- no fork code runs in the guard itself. The
  # operator branch-protection references the job id `infra_isolation`. Check set live-verified against
  # the de-priv by calm-gull-119 (CI floor coordination, 2026-06-01).
  infra_isolation:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Assert runner is de-privileged (adversarial)
      run: |
        fail(){ echo "::error::INFRA ISOLATION REGRESSION: $1"; exit 1; }
        [ "$(id -u)" -ne 0 ] || fail "running as root"
        for g in docker sudo lxd wheel root; do id -nG | tr ' ' '\n' | grep -qx "$g" && fail "in privileged group $g"; done
        cat /etc/actions-runner/app.pem >/dev/null 2>&1 && fail "can read the App private key"
        sudo -n true 2>/dev/null && fail "has passwordless sudo"
        { test -r /var/run/docker.sock || test -w /var/run/docker.sock; } && fail "can read or write docker.sock"
        echo "OK: non-root, no privileged groups (docker/sudo/lxd/wheel/root), App key unreadable, no passwordless sudo, docker.sock inaccessible"
  fmt:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts; src/v4/workflow/ci.dag cache-projection note) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
        # at this pre-cargo step -- gate on the socket's PARENT DIR being writable, not the socket file:
        # the runner provisions that dir ghrunner:ghrunner 0755 (ctrl#1419), so the gate passes pre-start
        # and sccache then binds its socket there on first rustc. Fails SAFE: a missing or non-writable
        # dir -> cold build (::warning), never silently / never fail-hard. dissolve-on-arrival.
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache socket (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent or not usable by runner user; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: cargo fmt --all --check
      run: cargo fmt --all --check
  # Affected-set component host transport -- live fail-closed receipt.
  # This promotes only GitDiffNameOnly -> CiComponentAffected. Node-frontier TestClaim selection stays shadow.
  affected:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    outputs:
      v2: ${{ steps.detect.outputs.v2 }}
      v3: ${{ steps.detect.outputs.v3 }}
      v4: ${{ steps.detect.outputs.v4 }}
      testclaim_corpus: ${{ steps.detect.outputs.testclaim_corpus }}
      workflow_policy: ${{ steps.detect.outputs.workflow_policy }}
      release_distribution: ${{ steps.detect.outputs.release_distribution }}
      release_distribution_only: ${{ steps.detect.outputs.release_distribution_only }}
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts; src/v4/workflow/ci.dag cache-projection note) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
        # at this pre-cargo step -- gate on the socket's PARENT DIR being writable, not the socket file:
        # the runner provisions that dir ghrunner:ghrunner 0755 (ctrl#1419), so the gate passes pre-start
        # and sccache then binds its socket there on first rustc. Fails SAFE: a missing or non-writable
        # dir -> cold build (::warning), never silently / never fail-hard. dissolve-on-arrival.
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache socket (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent or not usable by runner user; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Fetch main for diff base
      if: github.event_name == 'pull_request'
      run: git fetch origin main:refs/remotes/origin/main
    - name: Detect affected components
      id: detect
      run: cargo run -p ci_affected_components --bin detect-ci-affected-components -- "${{ github.event_name }}" "$GITHUB_OUTPUT"
    - name: Emit Wave 3 shadow selection receipt (Class C, non-blocking)
      continue-on-error: true
      run: cargo run -p ci_affected_components --bin emit-ci-wave3-shadow-receipt -- "${{ github.event_name }}"
    # Wave-1 §11.7 kill-criterion instrumentation (work-item adhoc-0ae3efe5-52b). Measurement only:
    # emits a per-PR JSON receipt (affected-set partition + bootstrap_required prediction) that the
    # operator aggregates to decide whether to affected-set-gate ci_floor. Does NOT gate any job.
    # See docs/planning/affected-set-ci-kill-criterion-instrumentation-2026-06-02.md.
    # estimated-full-run-minutes is the PROVISIONAL ci_floor p50 (~13-15m, self-hosted arm64, runs
    # this session; CI Manager 2026-06-02) — revise once we have a 20+ PR sample. Per-run wall-clock /
    # actual_run_minutes await a follow-up aggregator job that reads GHA job timings via the API, so
    # saved_minutes is not yet populated from real run time (actual_run_minutes defaults to 0).
    - name: Emit affected-set CI kill-criterion receipt
      run: cargo run -p ci_affected_components --bin emit-affected-set-ci-receipt -- "${{ github.event_name }}" "$RUNNER_TEMP/affected-set-ci-receipt.json" --estimated-full-run-minutes 15
    - name: Upload affected-set CI receipt
      uses: actions/upload-artifact@v4
      with:
        name: affected-set-ci-receipt
        path: ${{ runner.temp }}/affected-set-ci-receipt.json
        if-no-files-found: warn
  # §11.7.1 Class A safety floor -- single job, one v2 build, two compiles (M1 rust + bootstrap dag).
  ci_floor:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts; src/v4/workflow/ci.dag cache-projection note) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
        # at this pre-cargo step -- gate on the socket's PARENT DIR being writable, not the socket file:
        # the runner provisions that dir ghrunner:ghrunner 0755 (ctrl#1419), so the gate passes pre-start
        # and sccache then binds its socket there on first rustc. Fails SAFE: a missing or non-writable
        # dir -> cold build (::warning), never silently / never fail-hard. dissolve-on-arrival.
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache socket (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent or not usable by runner user; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    # INTERIM transport repair (operator 2026-06-01, "stop the bleeding"). Authority for the
    # right-way fix: src/v4/workflow/ci.dag cache-projection note + dsl/std/cache_interface.dag.
    # The old key mixed in hashFiles('src/v3/compiler/src/**', …), which changes on nearly every
    # commit -- so the primary slot was NEVER reused: each run minted a brand-new ~200 MiB cache,
    # flooding the repo's 10 GB budget and LRU-evicting the warm caches (including the v2
    # `gunbc-bin` build) before the next run could restore them. Cargo's own fingerprinting
    # already invalidates stale crates on top of a restored target/, so the v3-src component
    # bought churn, not correctness. De-churned to Cargo.lock + toolchain -> one cache per
    # dependency set, restored via the broad restore-key, eviction pressure cut ~100×.
    # Does NOT speed up the M1 emit-probe / bootstrap steps -- those need content-addressed
    # sccache via the modeled cache_interface projection (see ci.dag note). dissolve-on-arrival.
    - name: Cache Cargo (ci floor)
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache gunbc binary (v4 floor)
      id: v4-v2-bin
      uses: actions/cache@v4
      with:
        path: target/release/gunbc
        key: gunbc-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
        # Broad restore-key fallback (independent of sccache): when the exact key misses (Cargo.lock /
        # toolchain / stage0 churn), restore the most-recent prior gunbc binary instead of nothing. The
        # build step below is gated on exact `cache-hit == 'true'`, so a partial restore still triggers a
        # rebuild -- but on top of the warm `target/` restored by the Cargo cache, that rebuild is
        # incremental (~3-6 min saved) rather than cold. Safe: a stale binary is overwritten by the rebuild.
        restore-keys: |
          gunbc-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Build v2 compiler (v4 floor)
      if: steps.v4-v2-bin.outputs.cache-hit != 'true'
      run: RUSTC_WRAPPER= cargo build -p v2-compiler --release
    - name: M1 v4 full-tree rust emit probe (v2 emit)
      timeout-minutes: 35
      env:
        V4_M1_RUST_EMIT_OUT: ${{ runner.temp }}/v4-rust-emit
        V4_M1_DAG_EMIT_OUT: ${{ runner.temp }}/v4-bootstrap
        V4_M1_DAG_EMIT_LOG: ${{ runner.temp }}/v4-bootstrap.shared.log
        V4_M1_RUST_EMIT_PROBE_STRICT: "0"
      run: bash .github/ci-floor/v4-m1-rust-emit-probe.sh
    - name: v2 DAG emit parity receipt (shared closure)
      run: cargo test -p v2-compiler-tests pipeline::dag_emit_from_resolved_matches_compile_sources_for_v4_slice -- --exact --quiet
  ci:
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [affected, ci_floor, infra_isolation]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Validate prerequisites (fail-closed under skipped/failed deps)
      run: |
        set -euo pipefail
        if [[ "${{ needs.affected.result }}" != "success" ]]; then
          echo "::error::affected job did not succeed (result=${{ needs.affected.result }}); ci aggregator fails closed."
          exit 1
        fi
        if [[ "${{ needs.ci_floor.result }}" != "success" ]]; then
          echo "::error::ci_floor job did not succeed (result=${{ needs.ci_floor.result }}); ci aggregator fails closed."
          exit 1
        fi
        if [[ "${{ needs.infra_isolation.result }}" != "success" ]]; then
          echo "::error::infra_isolation guard did not succeed (result=${{ needs.infra_isolation.result }}); runner de-priv unverified -- ci aggregator fails closed."
          exit 1
        fi
        echo "ci aggregator: Wave 1 safety floor satisfied (affected receipt + M1 rust+dag emit and DAG parity in ci_floor; infra_isolation de-priv guard green)"
    - name: ci receipt (section 11.7.1 floor)
      run: |
        echo "::notice::Required CI: fmt + affected receipt + ci_floor (M1 rust+dag emit + DAG parity)"
