        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    # INTERIM transport repair (operator 2026-06-01, "stop the bleeding"). Authority for the
    # right-way fix: src/v4/workflow/ci.dag cache-projection note + dsl/std/cache_interface.dag.
    # The old key mixed in hashFiles('src/v3/compiler/src/**', …), which changes on nearly every
    # commit -- so the primary slot was NEVER reused: each run minted a brand-new ~200 MiB cache,
    # flooding the repo's 10 GB budget and LRU-evicting the warm caches (including the v2
    # `gunbc-bin` build) before the next run could restore them. Cargo's own fingerprinting
    # already invalidates stale crates on top of a restored target/, so the v3-src component
    # bought churn, not correctness. De-churned to Cargo.lock + toolchain -> one cache per
    # dependency set, restored via the broad restore-key, eviction pressure cut ~100×.
    # Does NOT speed up the M1 emit-probe / bootstrap steps -- those need content-addressed
    # sccache via the modeled cache_interface projection (see ci.dag note). dissolve-on-arrival.
    - name: Cache Cargo (ci floor)
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache gunbc binary (v4 floor)
      id: v4-v2-bin
      uses: actions/cache@v5
      with:
        path: target/release/gunbc
        key: gunbc-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
        # Broad restore-key fallback (independent of sccache): when the exact key misses (Cargo.lock /
        # toolchain / stage0 churn), restore the most-recent prior gunbc binary instead of nothing. The
        # build step below is gated on exact `cache-hit == 'true'`, so a partial restore still triggers a
        # rebuild -- but on top of the warm `target/` restored by the Cargo cache, that rebuild is
        # incremental (~3-6 min saved) rather than cold. Safe: a stale binary is overwritten by the rebuild.
        restore-keys: |
          gunbc-bin-${{ runner.os }}-${{ runner.arch }}-
    # sccache honored via the probe-decided RUSTC_WRAPPER (set in the toolchain-isolation step
    # above): no per-step `RUSTC_WRAPPER=` override. Removing the override (a) lets the cold v2
    # build reuse sccache-cached dep objects and (b) keeps build + stage0 + DAG-parity on ONE
    # cargo fingerprint, so the parity `cargo test` reuses these artifacts instead of recompiling
    # under a different wrapper. The probe already degrades to a cold build on any sccache
    # unreachability, so this stays fail-closed (RR-L: observationally invisible + fail-closed).
    - name: Build v2 compiler (v4 floor)
      if: steps.v4-v2-bin.outputs.cache-hit != 'true'
      run: cargo build -p v2-compiler --release
    - name: v2 stage0 freshness receipt
      timeout-minutes: 30
      run: cargo run --release -p v2-compiler --bin regen_stage0 -- --verify
    # `--release` is load-bearing here, not cosmetic: the build + stage0 steps above compile
    # v2-compiler in the RELEASE profile. A debug `cargo test` lives in a different profile dir
    # (target/debug vs target/release) and shares ZERO artifacts with them, so it re-compiles the
    # whole v2-compiler closure from scratch (~64s/run, measured run 27021002250 step 11: 69s total,
    # of which the test itself is 0.01s). Running the parity test in release makes the "shared
    # closure" real -- it reuses the release v2-compiler already built by stage0 and only compiles
    # the small v2-compiler-tests crate (~5s). The receipt is profile-invariant (emit parity, no
    # debug_assert-dependent behavior), so this is observationally invisible + fail-closed (RR-L).
    - name: v2 DAG emit parity receipt (shared closure)
      run: cargo test -p v2-compiler-tests --release pipeline::dag_emit_from_resolved_matches_compile_sources_for_v4_slice -- --exact --quiet
  # §11.7.1 Class A safety floor (parallel lane) -- the v2-emit M1 rust+dag full-tree probe.
  # Split out of `ci_floor` so it runs CONCURRENTLY with stage0 freshness + DAG parity: the probe
  # (~510s, the v2 emitter's own runtime) is independent of the stage0 self-compile, so serializing
