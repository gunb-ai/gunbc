name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 360
    steps:
      - name: Isolate toolchain dirs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
            echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"
          else
            echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: P4b REST hermetic pilot (fixture replay + fail-closed neg-check)
        run: |
          # P4b REST hermetic pilot: hermetic replay from committed fixture seed.
          HTTP_PILOT_FIXTURES="$(pwd)/dsl/extdeps/test/fixtures/http_pilot"
          cargo run -p v1-compiler --release --bin claim_batch -- \
            --source-root . --source-root dsl \
            --entry dsl/test/claim/http_pilot_rest_witness.dag \
            --function http_pilot_rest_keystone_holds \
            --hermetic --fixture-store "$HTTP_PILOT_FIXTURES" \
            --fixture-no-expiry --claim-run
          if cargo run -p v1-compiler --release --bin claim_batch -- \
            --source-root . --source-root dsl \
            --entry dsl/test/claim/http_pilot_rest_witness.dag \
            --function http_pilot_rest_keystone_holds \
            --hermetic --claim-run; then
            echo "http pilot must fail closed without fixture store (no inline mock_response)"
            exit 1
          fi
      - name: gunbc ci (.dag witnesses + gates)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! (cargo build -p v1-compiler --release --features text_lookup_work_counter --bins) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              RETRY_LOG=$(mktemp)
              if ! ( CARGO_BUILD_JOBS=1 cargo build -p v1-compiler --release --features text_lookup_work_counter --bins ) 2>&1 | tee "$RETRY_LOG"; then
                if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache:' "$RETRY_LOG"; then
                  echo "::warning::cargo/sccache still failing; retry without RUSTC_WRAPPER"
                  env -u RUSTC_WRAPPER CARGO_BUILD_JOBS=1 cargo build -p v1-compiler --release --features text_lookup_work_counter --bins || exit 1
                else
                  exit 1
                fi
              fi
              rm -f "$RETRY_LOG"
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          sccache --show-stats 2>/dev/null || true
          git fetch --no-tags origin main 2>/dev/null || true
          "$ROOT/target/release/claim_executor" --source-root src/v2 --source-root dsl --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_ci_floor_batches --notice-title "v2 claim corpus"
  http_pilot_wet_record:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 30
    steps:
      - name: Isolate toolchain dirs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Wet record http_pilot (live jsonplaceholder — opt-in only)
        run: |
          HTTP_PILOT_FIXTURES="$(mktemp -d)"
          cargo run -p v1-compiler --release --bin claim_batch -- \
            --source-root . --source-root dsl \
            --entry dsl/test/claim/http_pilot_rest_witness.dag \
            --function http_pilot_rest_keystone_holds \
            --record --fixture-store "$HTTP_PILOT_FIXTURES"
          echo '(local recapture only — see http_pilot_rest_witness.dag header)'
          find "$HTTP_PILOT_FIXTURES" -type f
          rm -rf "$HTTP_PILOT_FIXTURES"
    if: github.event_name == 'workflow_dispatch'
