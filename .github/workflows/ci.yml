# Generated by gunbc - minimal YAML shim
# All CI logic is in testable Rust code, not YAML
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        
      - name: Run CI
        run: cargo run -p gunbc-ci -- run
