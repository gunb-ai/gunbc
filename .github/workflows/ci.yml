name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Opt every JavaScript action (checkout, upload-artifact, cache, setup-rust-toolchain) onto
  # Node.js 24 ahead of GitHub forcing it 2026-06-16 and removing Node 20 from the runner
  # 2026-09-16. Workflow-level so it covers ALL jobs/actions uniformly without chasing each
  # action's individually-Node24-compatible major version (which can change behavior). Quoted so
  # it parses as the string "true" (an unquoted bare `true` is a YAML bool). Drop this once every
  # pinned action ships a Node24 default. Ref: github.blog/changelog/2025-09-19-deprecation-of-node-20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
# Wave 1 §11.7.1 safety floor — fmt + affected receipt + ci_floor (stage0 freshness + DAG parity) + ci_floor_emit (M1 rust+dag emit)
# Required on every non-draft PR: fmt, affected-set component receipt, stage0 freshness, DAG parity (ci_floor), M1 rust+dag emit (ci_floor_emit).
jobs:
  # RUNNER-ISOLATION SECURITY FLOOR -- model authority: src/v4/workflow/ci.dag
  # `ci_runner_isolation_policy`.
  # gunbc is PUBLIC on the private self-hosted fleet, so
  # fork-PR runs execute attacker-controlled code on srv1/srv2. The operator runner de-priv (jobs run
  # as unprivileged `ghrunner`: non-root, not in docker/sudo/lxd/wheel/root, no passwordless sudo, no
  # read on the App private key or docker.sock) lives in the fleet host config OUTSIDE this repo -- a
  # silent host-side regression would re-expose the fleet with no in-repo diff. This job adversarially
  # probes its own runtime privilege and fails closed the moment the runner is re-privileged. It runs
  # UNCONDITIONALLY (no draft gate, no affected mask): the fork-PR exposure exists wherever a runner
  # executes. It does NOT check out the repo or build -- no fork code runs in the guard itself. The
  # operator branch-protection references the job id `infra_isolation`. Check set live-verified against
  # the de-priv by calm-gull-119 (CI floor coordination, 2026-06-01).
  infra_isolation:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Assert runner is de-privileged (adversarial)
      run: |
        fail(){ echo "::error::INFRA ISOLATION REGRESSION: $1"; exit 1; }
        [ "$(id -u)" -ne 0 ] || fail "running as root"
        for g in docker sudo lxd wheel root; do id -nG | tr ' ' '\n' | grep -qx "$g" && fail "in privileged group $g"; done
        cat /etc/actions-runner/app.pem >/dev/null 2>&1 && fail "can read the App private key"
        sudo -n true 2>/dev/null && fail "has passwordless sudo"
        { test -r /var/run/docker.sock || test -w /var/run/docker.sock; } && fail "can read or write docker.sock"
        echo "OK: non-root, no privileged groups (docker/sudo/lxd/wheel/root), App key unreadable, no passwordless sudo, docker.sock inaccessible"
  fmt:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts; src/v4/workflow/ci.dag cache-projection note) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
        # at this pre-cargo step -- so we gate in two stages. (1) the socket's
        # PARENT DIR must be writable (runner provisions it ghrunner:ghrunner 0755,
        # ctrl#1419); a missing/unwritable dir -> cold build. (2) actively
        # health-probe the server: `--start-server` is idempotent (no-op if up,
        # else starts + WARMS it) and `--show-stats` forces the SAME client->server
        # round-trip the compile will use. Why (2): the dir test only proves sccache
        # COULD start, not that the server is reachable -- a lazily-started server
        # from a prior job can be mid-idle-shutdown exactly as this job's first
        # `rustc -vV` connects, failing the build HARD with "failed to read response
        # header" (observed 2026-06-04, run 26985377093). Probing here catches a
        # sick/unreachable server and degrades to a cold build (::warning) instead
        # of a hard mid-build failure. The `&&` chain runs in an `if` condition, so
        # a probe failure under `set -e` selects the cold branch, never aborts.
        # Fails SAFE at every stage; dissolve-on-arrival (real fix: ci.dag cache projection).
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ] \
             && sccache --start-server >/dev/null 2>&1 \
             && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache server (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent, unwritable, or unreachable; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
      # Shared-$HOME self-hosted runners: rustup-init's default modify-path appends
      # `. "$CARGO_HOME/env"` to ~/.bashrc and ~/.profile. With CARGO_HOME isolated to the
      # per-job $RUNNER_TEMP (step above), that path is wiped post-job, leaving a dangling source
      # line that errors on every interactive login and accumulates one per runner slot. Scope HOME
      # to throwaway $RUNNER_TEMP for just this step so those writes never touch the real shared
      # $HOME (the git-auth scrub step runs under the real HOME and is unaffected).
      env:
        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: cargo fmt --all --check
      run: cargo fmt --all --check
  # Affected-set component host transport -- live fail-closed receipt.
  # This promotes only GitDiffNameOnly -> CiComponentAffected. Node-frontier TestClaim selection stays shadow.
  affected:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    outputs:
      v2: ${{ steps.detect.outputs.v2 }}
      v3: ${{ steps.detect.outputs.v3 }}
      v4: ${{ steps.detect.outputs.v4 }}
      testclaim_corpus: ${{ steps.detect.outputs.testclaim_corpus }}
      workflow_policy: ${{ steps.detect.outputs.workflow_policy }}
      release_distribution: ${{ steps.detect.outputs.release_distribution }}
      release_distribution_only: ${{ steps.detect.outputs.release_distribution_only }}
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts; src/v4/workflow/ci.dag cache-projection note) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
