name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  build:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"
          GUNBC_TOOLCHAIN_SEG=$(rustc -V 2>/dev/null | tr ' ' '-'); if [ -z "$GUNBC_TOOLCHAIN_SEG" ]; then GUNBC_TOOLCHAIN_SEG=toolchain-unresolved; fi
          mkdir -p "$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG"
          echo "GUNBC_NATIVE_CACHE_ROOT=$RUNNER_TOOL_CACHE/gunbc-native/$GUNBC_TOOLCHAIN_SEG" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
            printf '%s\n' "CiSccacheProviderReceipt: provider=bound catalog=sccache_local"
          else
            printf '%s\n' "CiSccacheProviderReceipt: provider=SKIPPED catalog=sccache_local host=$(hostname) cause=daemon-unavailable; the release build runs UNCACHED — a counted degradation, not a supported mode (host_build_cache_provision P1b should have converged this host)"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: |
          rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
          if [ -x "$CARGO_HOME/bin/cargo" ]; then CARGO_BIN="$CARGO_HOME/bin/cargo"; else CARGO_BIN="$(command -v cargo || true)"; fi
          if [ -z "$CARGO_BIN" ]; then echo "::error::no cargo binary: neither the isolated $CARGO_HOME/bin/cargo shim nor PATH carries one"; exit 1; fi
          echo "CARGO_BIN=$CARGO_BIN" >> "$GITHUB_ENV"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: cargo fmt --all --check (fast gate; fails in seconds, before the release build)
        run: "\"$CARGO_BIN\" fmt --all --check"
        timeout-minutes: 5
      - name: Build release bins (claim_executor + gunbc)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_BIN" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc --bin compile_clean_floor_skip_witness --bin regen_floor_skip_witness --bin floor_skip_discovery_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness --bin resolution_divergence_census) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              CARGO_BUILD_JOBS=1 "$CARGO_BIN" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc --bin compile_clean_floor_skip_witness --bin regen_floor_skip_witness --bin floor_skip_discovery_witness --bin discover_source_root_ingest --bin claim_batch --bin regen_stage0 --bin interp_recorded_fixture_witness --bin v1_src_dag_parse --bin auth_declared_but_unwired_witness --bin bootstrap_witness --bin dag_collect_fingerprint_witness --bin diagnostics_witness --bin effects_rest_transport_witness --bin infer_semantics_witness --bin parse_witness --bin resolution_divergence_census
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/compile_clean_floor_skip_witness" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census"
          sccache --show-stats 2>/dev/null || true
        timeout-minutes: 45
      - name: Pack release bins for cross-job handoff (tar keeps exec bits)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          tar -czf "$ROOT/release-bins.tgz" -C "$ROOT/target/release" "claim_executor" "gunbc" "compile_clean_floor_skip_witness" "regen_floor_skip_witness" "floor_skip_discovery_witness" "discover_source_root_ingest" "claim_batch" "regen_stage0" "interp_recorded_fixture_witness" "v1_src_dag_parse" "auth_declared_but_unwired_witness" "bootstrap_witness" "dag_collect_fingerprint_witness" "diagnostics_witness" "effects_rest_transport_witness" "infer_semantics_witness" "parse_witness" "resolution_divergence_census"
        timeout-minutes: 5
      - name: Upload release-bins artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bins
          path: release-bins.tgz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
        timeout-minutes: 10
  regen:
    runs-on: [self-hosted, linux, arm64]
    needs: [build]
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Rust (floor gate toolchain — batch-4 emit_host/self_host gates need cargo/rustfmt; no isolated rustup)
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/compile_clean_floor_skip_witness" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census"
        timeout-minutes: 5
      - name: gunbc ci regen (self-host fixed-point — required)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          git fetch --no-tags origin main 2>/dev/null || true
          # Affected-set-scoped regen admission (pull_request only): on a pull_request event, regen_floor_skip_witness intersects the merge-base diff with the [src/v1, dag] regen input closure (shared authority cli_run::regen_input_sources — the exact set regen_stage0 compiles; both the RegenVerifyGate and the SelfHostStalenessGate invoke regen_stage0, so the closure covers both). A PR diff touching none of src/v1/** (emitter source + committed stage0 outputs), v1's transitive dag import-closure, or the Cargo/toolchain build config cannot change the self-host fixed-point, so the regen step exits 0 immediately (a required step that passes because the self-host fixed-point is provably unchanged — regen runs before the floor so emitter drift fails fast, with no floor or merge-admission dependency). Empty diff / diff failure / closure failure runs regen (fail-closed). COLD CONTROL: the skip is gated to pull_request events via GITHUB_EVENT_NAME, so push-to-main and workflow_dispatch run regen UNCONDITIONALLY (no witness). A wrong closure that lets a PR wrongly skip therefore surfaces as a counted divergence on the very next merge to main — the squash-merge main-push run has an empty diff and runs regen cold, reding main if the seed is stale (a one-merge acceptance window, the discovery-flip shape). The 4-hourly falsifier does NOT run regen_stage0; the unconditional main-push regen is the cold control.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            _ci_regen_skip=$("$ROOT/target/release/regen_floor_skip_witness" 2>/dev/null || echo run_regen)
            if [ "$_ci_regen_skip" = "regen_not_affected_skip" ]; then
                echo "gunbc ci regen: pull_request diff does not intersect the [src/v1, dag] regen input closure — self-host fixed-point provably unchanged; skipping (push-to-main runs regen unconditionally as the cold control)"
                exit 0
            fi
          fi
          "$ROOT/target/release/claim_executor" --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_ci_regen_floor_batches --notice-title "self-host fixed-point (regen + staleness) — required; own regen job upstream of ci"
        timeout-minutes: 15
  ci:
    runs-on: [self-hosted, linux, arm64]
    needs: [build, regen]
    timeout-minutes: 115
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Rust (floor gate toolchain — batch-4 emit_host/self_host gates need cargo/rustfmt; no isolated rustup)
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/compile_clean_floor_skip_witness" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census"
        timeout-minutes: 5
      - name: Floor cgroup peak pre-read (calibration; reset if permitted)
        run: |
          d="/sys/fs/cgroup$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)"
          while [ -n "$d" ] && [ "$d" != "/sys/fs/cgroup" ] && [ ! -f "$d/memory.peak" ]; do d=$(dirname "$d"); done
          if [ -f "$d/memory.peak" ]; then if echo reset > "$d/memory.peak" 2>/dev/null; then echo "[calibration] floor_peak_pre reset=ok scope=floor cgroup=$d"; else echo "[calibration] floor_peak_pre reset=unsupported pre_peak=$(cat "$d/memory.peak") scope=span cgroup=$d (post>pre attributes the peak to the floor exactly; post==pre means floor peak <= pre, a job-scoped upper bound)"; fi; else echo "[calibration] floor_peak_pre scope=unavailable (no memory.peak ancestor)"; fi
        timeout-minutes: 5
      - name: gunbc ci (.dag witnesses + gates)
        id: floor
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          # REMOVED 2026-07-21 (gunbc#7023 / proud-cat-517): the documentation_only_skip shell shortcut exited before claim_executor, bypassing the witness corpus entirely on docs-only PRs. That bypassed the existing ReadsLiveTree never-predict-skip lane — doc_reachability_witness_test.dag already declared ReadsLiveTree since #6654, but the shell never reached selection. Docs-only PRs now run the normal floor (SelectionApplied): import-closure skips non-live-tree witnesses cheaply; ReadsLiveTree rows (doc-graph wall, corpus-read host-fed lenses) always run. compile_clean_floor_skip_witness remains for dag_compile_clean_scope disposition only — it no longer gates floor admission.
          git fetch --no-tags origin main 2>/dev/null || true
          # 🟡 dissolve-on: ci_floor_disposition_marker_init_script — concat-built bash floor step opener stamping floor_running into target/ci-floor-disposition.txt (clears stale documentation_only_skipped on persistent self-hosted runners before docs-only branch); DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0) realizes floor disposition initialization through orchestration emit and the marker init retires without a transport scaffold
          # Positive floor-running stamp at the start of every floor step clears stale documentation_only_skipped left in target/ on persistent self-hosted runners (review 37010 / operator ruling 2026-07-11). Receipt gates skip only on an exact documentation_only_skipped match — never on file presence alone.
          mkdir -p target
          echo floor_running > target/ci-floor-disposition.txt
          set +e
          "$ROOT/target/release/claim_executor" --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_ci_floor_batches --notice-title "v2 claim corpus"
          FLOOR_EXIT=$?
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          CI_FLOOR_EXIT=$FLOOR_EXIT "$ROOT/target/release/gunbc" run --source-root dag --entry dag/tools/merge_admission_stamp.dag --function main
          STAMP_EXIT=$?
          if [ "$FLOOR_EXIT" -ne 0 ]; then exit "$FLOOR_EXIT"; fi
          exit "$STAMP_EXIT"
        timeout-minutes: 55
      - name: Floor cgroup peak post-read (calibration; survives a killed floor)
        run: |
          d="/sys/fs/cgroup$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup)"
          while [ -n "$d" ] && [ "$d" != "/sys/fs/cgroup" ] && [ ! -f "$d/memory.peak" ]; do d=$(dirname "$d"); done
          if [ -f "$d/memory.peak" ]; then echo "[calibration] floor_peak_post=$(cat "$d/memory.peak") floor_outcome=${{ steps.floor.outcome }} cgroup=$d (observation label: floor_outcome=success is an EXACT point; any other outcome is a CENSORED lower bound - the process was killed while exceeding the read, so true demand is strictly greater. scope per the floor_peak_pre line: reset=ok means this IS the floor peak; scope=span compares against pre_peak)"; else echo "[calibration] floor_peak_post floor_outcome=${{ steps.floor.outcome }} scope=unavailable (no memory.peak ancestor)"; fi
        if: always()
        timeout-minutes: 5
      - name: Floor resolve receipt gate (declared cold-resolve count)
        run: |
          # 🟡 dissolve-on: ci_documentation_only_gate_skip_prefix — concat-built bash receipt-gate skip predicate over target/ci-floor-disposition.txt (documentation-only floor-not-run); DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0) realizes documentation-only disposition through orchestration emit and receipt gates read CI_FLOOR_DISPOSITION without a transport scaffold
          if test -f target/ci-floor-disposition.txt; then _disp=$(cat target/ci-floor-disposition.txt)
          if test "$_disp" = "documentation_only_skipped"; then echo "floor resolve receipt gate: skipped — CI_FLOOR_DISPOSITION=$_disp (floor not run; no receipt debt incurred)"; exit 0; fi; fi
          if ! test -f target/floor-resolve-receipt.txt; then echo "floor resolve receipt missing - fail closed"; exit 1; fi
          n=$(sed -n 's/^resolves_total=//p' target/floor-resolve-receipt.txt)
          if test -z "$n"; then echo "floor resolve receipt malformed - fail closed"; exit 1; fi
          if test "$n" -ne 1; then echo "floor resolve count $n differs from declared 1: duplicate-computation debt changed - update ci_floor_declared_resolve_count consciously (dag/gunbc/ci_materialization.dag)"; exit 1; fi
          echo "floor resolve count $n matches declared 1 (declared cold-resolve receipt)"
        timeout-minutes: 5
      - name: Floor materialization receipt gate (demand ledger; disclosure gate — count pins retracted, walls tracked in ci_materialization.dag)
        run: |
          # 🟡 dissolve-on: ci_documentation_only_gate_skip_prefix — concat-built bash receipt-gate skip predicate over target/ci-floor-disposition.txt (documentation-only floor-not-run); DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0) realizes documentation-only disposition through orchestration emit and receipt gates read CI_FLOOR_DISPOSITION without a transport scaffold
          if test -f target/ci-floor-disposition.txt; then _disp=$(cat target/ci-floor-disposition.txt)
          if test "$_disp" = "documentation_only_skipped"; then echo "floor materialization receipt gate: skipped — CI_FLOOR_DISPOSITION=$_disp (floor not run; no receipt debt incurred)"; exit 0; fi; fi
          if ! test -f target/floor-materialization-receipt.txt; then echo "floor materialization receipt missing - fail closed"; exit 1; fi
          k=$(sed -n 's/^keyed_calls=//p' target/floor-materialization-receipt.txt)
          u=$(sed -n 's/^unkeyed_calls=//p' target/floor-materialization-receipt.txt)
          d=$(sed -n 's/^duplicated_keys=//p' target/floor-materialization-receipt.txt)
          if test -z "$k"; then echo "floor materialization receipt malformed - fail closed"; exit 1; fi
          if test -z "$u"; then echo "floor materialization receipt malformed - fail closed"; exit 1; fi
          if test -z "$d"; then echo "floor materialization receipt malformed - fail closed"; exit 1; fi
          if test "$k" -eq 0; then echo "floor evaluated zero keyed calls - ledger disabled or floor empty - fail closed"; exit 1; fi
          echo "floor materialization receipt: keyed=$k unkeyed=$u duplicated=$d (disclosure gate; count pins retracted 2026-07-10 — schedule-jittered per-ctx grain + diff-dependent affected-set denominator; walls forward: unkeyed==0 on closure identity, duplicated on structural frame grain)"
        timeout-minutes: 5
      - name: Affected-set selection control (floor_skip_discovery_witness)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          # 🟡 dissolve-on: ci_documentation_only_gate_skip_prefix — concat-built bash receipt-gate skip predicate over target/ci-floor-disposition.txt (documentation-only floor-not-run); DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0) realizes documentation-only disposition through orchestration emit and receipt gates read CI_FLOOR_DISPOSITION without a transport scaffold
          if test -f target/ci-floor-disposition.txt; then _disp=$(cat target/ci-floor-disposition.txt)
          if test "$_disp" = "documentation_only_skipped"; then echo "Affected-set selection control: skipped — CI_FLOOR_DISPOSITION=$_disp (floor not run; hermetic selection suite requires full floor context)"; exit 0; fi; fi
          "$ROOT/target/release/floor_skip_discovery_witness"
        timeout-minutes: 15
      - name: Merge-admission gate (receipt required; freshness block held until GatingEnforced)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          git fetch --no-tags origin main
          # 🟡 dissolve-on: ci_documentation_only_gate_skip_prefix — concat-built bash receipt-gate skip predicate over target/ci-floor-disposition.txt (documentation-only floor-not-run); DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0) realizes documentation-only disposition through orchestration emit and receipt gates read CI_FLOOR_DISPOSITION without a transport scaffold
          if test -f target/ci-floor-disposition.txt; then _disp=$(cat target/ci-floor-disposition.txt)
          if test "$_disp" = "documentation_only_skipped"; then echo "merge-admission gate: skipped — CI_FLOOR_DISPOSITION=$_disp (floor not run; merge-admission stamp already recorded Skipped disposition)"; exit 0; fi; fi
          "$ROOT/target/release/gunbc" run --source-root dag --entry dag/tools/merge_admission_gate.dag --function main
        timeout-minutes: 5
  deploy_dashboard_srv1:
    runs-on: [self-hosted, linux, arm64, srv1]
    needs: [ci]
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
          tar -xzf "$ROOT/release-bins.tgz" -C "$ROOT/target/release"
          rm -f "$ROOT/release-bins.tgz"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc" "$ROOT/target/release/compile_clean_floor_skip_witness" "$ROOT/target/release/regen_floor_skip_witness" "$ROOT/target/release/floor_skip_discovery_witness" "$ROOT/target/release/discover_source_root_ingest" "$ROOT/target/release/claim_batch" "$ROOT/target/release/regen_stage0" "$ROOT/target/release/interp_recorded_fixture_witness" "$ROOT/target/release/v1_src_dag_parse" "$ROOT/target/release/auth_declared_but_unwired_witness" "$ROOT/target/release/bootstrap_witness" "$ROOT/target/release/dag_collect_fingerprint_witness" "$ROOT/target/release/diagnostics_witness" "$ROOT/target/release/effects_rest_transport_witness" "$ROOT/target/release/infer_semantics_witness" "$ROOT/target/release/parse_witness" "$ROOT/target/release/resolution_divergence_census"
        timeout-minutes: 5
      - name: Deploy dashboard to srv1 (live_deploy_apply_srv1_wet)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          "$ROOT/target/release/gunbc" run --source-root "$ROOT/dag" --source-root "$ROOT/src/v2" --entry dag/gunbc/live_deploy/apply.dag --function live_deploy_apply_srv1_wet
  heal_generated_artifacts:
    runs-on: [self-hosted, linux, arm64]
    needs: [build]
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout triggering branch head (heal pushes the regeneration back to this branch)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download release-bins artifact
        uses: actions/download-artifact@v4
        with:
          name: release-bins
        timeout-minutes: 10
      - name: Unpack + verify release bins (claim_executor --verify-build-artifacts; fail-closed)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          mkdir -p "$ROOT/target/release"
