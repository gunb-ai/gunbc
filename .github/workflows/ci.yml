      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
      env:
        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Cache Cargo (v4 lens CI perturb)
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache gunbc + claim_batch binaries (v4 lens CI perturb)
      id: v4-v2-bin
      uses: actions/cache@v5
      with:
        # Same binary set + key namespace as v4_lens_ci ('gunbc-lens-bin-') so a
        # shard restores the artifacts v4_lens_ci built rather than cold-building.
