        V4_BOOTSTRAP_TIMEOUT_SECS: '300'
=======
        V4_BOOTSTRAP_TIMEOUT_SECS: 480
>>>>>>> origin/main
      run: |
        set +euo pipefail
        bash scripts/v4-bootstrap-viability.sh
        ec=$?
        echo "exitcode=${ec}" >> "$GITHUB_OUTPUT"
        exit "${ec}"
    - name: v2 → v4 bootstrap resolve-posture gate (CI emit-wall bridge)
      if: needs.affected.outputs.v4 == 'true' && (steps.v4_bootstrap_compile.outputs.exitcode == '124' || steps.v4_bootstrap_compile.outputs.exitcode == '143')
      id: v4_bootstrap_resolve_posture
      run: |
        set -euo pipefail
        V4_BOOTSTRAP_ALLOW_RESOLVE_POSTURE_BRIDGE=1 \
        V4_BOOTSTRAP_COMPILER_EXIT="${{ steps.v4_bootstrap_compile.outputs.exitcode }}" \
          bash scripts/v4-bootstrap-resolve-posture-gate.sh
    - name: v4 bootstrap gate result (compile or tracked bridge)
      if: always() && needs.affected.outputs.v4 == 'true' && steps.v4_bootstrap_compile.outcome != 'skipped'
      run: |
        set -euo pipefail
        if [[ "${{ steps.v4_bootstrap_compile.outcome }}" == "success" ]]; then
          echo "v4 bootstrap: full compile receipt"
          exit 0
        fi
        if [[ "${{ steps.v4_bootstrap_resolve_posture.outcome }}" == "success" ]]; then
          echo "v4 bootstrap: resolve-posture bridge receipt"
          exit 0
        fi
        echo "error: v4 bootstrap compile failed and resolve-posture bridge did not pass" >&2
        exit 1
    - name: 'T-22 TestClaim corpus structural bridge — manual .dag corpus'
      if: needs.affected.outputs.v4 == 'true' || needs.affected.outputs.workflow_policy == 'true'
      timeout-minutes: 15
      env:
