          # Self-heal: if the ref store is still unreadable, or any ref tip object remains missing
          # after the dangling-ref scrub (e.g. corrupt packed-refs that update-ref -d could not
          # clear), the next checkout fails 'fatal: bad object <ref>'. Remove the repo so
          # actions/checkout fresh-clones. Precise: fires ONLY when for-each-ref errors or a ref
          # tip is genuinely missing -- a healthy or empty checkout is never removed.
          corrupt=0
          if ! git -C "$repo" for-each-ref >/dev/null 2>&1; then
            corrupt=1
          elif git -C "$repo" for-each-ref --format='%(objectname)' 2>/dev/null \
               | git -C "$repo" cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            corrupt=1
          fi
          if [ "$corrupt" -eq 1 ]; then
            echo "::warning::repo ${repo} has unresolvable refs after scrub -- removing for fresh clone"
            rm -rf "$repo"
          fi
          echo "::endgroup::"
        }
        for repo in \
          "${RUNNER_WORKSPACE}/gunbc" \
          "${RUNNER_WORKSPACE}/gunbc/gunbc" \
          "${RUNNER_WORKSPACE}/_work/gunbc/gunbc"; do
          scrub_repo "$repo"
        done
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Doc references resolve (touched docs)
      run: |
        git fetch --no-tags origin main
        python3 scripts/check_doc_refs.py --changed origin/main
    - name: Doc-chain diagram is current (regenerated == embedded)
      run: python3 scripts/check_doc_refs.py --check-graph
