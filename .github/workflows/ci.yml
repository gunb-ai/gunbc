# The whole CI floor is one `.dag` binary: ci-claim-gate discovers the
# single-representation `test fn`/`test data` corpus under src/v2/test and evaluates
# every claim in-interpreter — no shell gate, no hand roster, no `.dag` shell-out.
# Branch protection should require job id `ci`.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    steps:
      # Toolchain isolation: the shared-$HOME self-hosted runners race on a global
      # rustup/cargo dir, so pin CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP per job.
      - name: Isolate toolchain dirs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 0 (not 1): full history so `origin/main...HEAD` merge-base resolves for the
          # Rust-gate affected-set below. rust_gate_runner fail-closes (runs the gates) if
          # the base is unavailable, so safety holds regardless. Revert to 1 if clone slows.
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: CI floor (.dag claim gate)
        run: cargo run -p ci_claim_gate --release -- --source-root src/v2 --roster-from-discovery --scan-dir src/v2/test --notice-title "v2 claim corpus"
      # Rust gates (clippy + fmt), conditional on the diff touching the Rust monolith.
      # WHICH gates run is decided by the v2.workflow.rust_stage0_gates `.dag` selector
      # (path_is_rust_monolith), consulted per changed path by rust_gate_runner — the
      # `.dag` is the authority, this binary is the realizer. The witness gate above is
      # the always-on floor; this adds the two Rust-only dependents. A `.dag`-only diff
      # selects neither. SCAFFOLD — dissolves when the Rust seed reaches zero (DESIGN §7).
      - name: Rust gates (clippy/fmt on Rust-touching diffs)
        run: |
          git fetch --no-tags origin main 2>/dev/null || true
          cargo run -p rust_gate_runner --release -- --source-root src/v2 --changed-paths-from-git --base origin/main
