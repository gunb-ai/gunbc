# The whole CI floor is one `.dag` binary: claim_batch discovers the
# single-representation `test fn`/`test data` corpus under src/v2/test and evaluates
# every claim in-interpreter — no shell gate, no hand roster, no `.dag` shell-out.
# Branch protection should require job id `ci`.
name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    steps:
      # Toolchain isolation: the shared-$HOME self-hosted runners race on a global
      # rustup/cargo dir, so pin CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP per job.
      - name: Isolate toolchain dirs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 0 (not 1): full history so `origin/main...HEAD` merge-base resolves for the
          # Rust-gate affected-set below. claim_batch fail-closes (runs the gates) if
          # the base is unavailable, so safety holds regardless. Revert to 1 if clone slows.
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      # CI floor — two composed passes (was nine separate cargo-run lines on main):
      #   (1) claim_batch: discovery over src/v2 (test fn / unified_claim_* corpus)
      #       PLUS hand-enrolled Bool witnesses (rust_stage0, emit_host, layering coverage,
      #       filesystem entry-kind, power/watt consuming-fold, dsl compile-clean) that lived
      #       on separate `gunbc run --claim-run` lines. One module index, one resolve per
      #       distinct entry — not one cold resolve per witness.
      #   SCAFFOLD — dissolve when the hand-enrolled witnesses enroll as discoverable
      #   `test fn` rows under a scanned dsl root (then drop the explicit --entry lines).
      #   (2) gunbc: tools.ci_floor_gates — the four effectful ProcessExit gates
      #       (rust fmt/clippy selector, emit-host MVP smokes, layering-imports host scan +
      #       perturb receipts, dsl whole-tree compile-clean) composed behind one entry
      #       resolve. The compile-clean gate is a SCAFFOLD (`--target rust` pending the
      #       v1.compiler.dag_collect identity-key fix).
      # The git fetch makes `origin/main...HEAD` resolvable for the rust gate.
      - name: CI floor (.dag witness corpus + gates via gunbc)
        run: |
          git fetch --no-tags origin main 2>/dev/null || true
          cargo run -p v1-compiler --release --bin claim_batch -- \
            --source-root src/v2 --source-root dsl \
            --roster-from-discovery \
            --entry dsl/test/claim/rust_stage0_gates_witness.dag --function rust_stage0_gates_witnesses \
            --entry dsl/test/claim/emit_host_gate_witness.dag --function emit_host_gate_witnesses \
            --entry src/v2/test/claim/layering_imports/coverage_domain_equivalence.dag --function coverage_domain_equivalence_argument_holds \
            --entry dsl/test/claim/filesystem_entry_kind_witness.dag --function filesystem_entry_kind_witnesses \
            --entry dsl/test/claim/power_watt_witness.dag --function power_watt_witnesses \
            --entry dsl/test/claim/cargo_target_path_witness.dag --function cargo_target_path_witnesses \
            --entry dsl/test/claim/dsl_compile_clean_witness.dag --function dsl_compile_clean_witnesses \
            --notice-title "v2 claim corpus"
          cargo run -p v1-compiler --release --bin gunbc -- run \
            --source-root dsl --source-root src/v2 \
            --entry dsl/tools/ci_floor_gates.dag --function main
