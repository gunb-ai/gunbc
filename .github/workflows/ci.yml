# Generated by gunbc-codegen
# DO NOT EDIT - regenerate with: cargo run -p gunbc-dag --bin gunbc-codegen -- cigen

name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/

          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Verify Bootstrap Invariants
        run: |
          rm -rf target/codegen
          # Cargo validates all [[bin]] paths even with --bin filter.
          # Create minimal stubs so the manifest parses, then check only bootstrap binaries.
          for dir in $(grep 'path = "../target/codegen/' gunbc-dag/Cargo.toml | sed 's|.*"../\(.*\)/main.rs"|\1|'); do
            mkdir -p "$dir" && echo 'fn main() {}' > "$dir/main.rs"
          done
          cargo check -p gunbc-dag --bin gunbc-codegen --bin gunbc-ci

      - name: Run CI Pipeline
        run: cargo run -p gunbc-dag --bin gunbc-ci
        env:
          CARGO_INCREMENTAL: "1"
          GCP_SECRETS_IMPERSONATE_SA: ${{ secrets.GCP_SECRETS_IMPERSONATE_SA }}
          GCP_SECRETS_PREFIX: ${{ secrets.GCP_SECRETS_PREFIX }}
          GCP_SECRETS_PROJECT: ${{ secrets.GCP_SECRETS_PROJECT }}
          GCP_SECRETS_SA: ${{ secrets.GCP_SECRETS_SA }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
