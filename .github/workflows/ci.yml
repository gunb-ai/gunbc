        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
        # at this pre-cargo step -- so we gate in two stages. (1) the socket's
        # PARENT DIR must be writable (runner provisions it ghrunner:ghrunner 0755,
        # ctrl#1419); a missing/unwritable dir -> cold build. (2) actively
        # health-probe the server: `--start-server` is idempotent (no-op if up,
        # else starts + WARMS it) and `--show-stats` forces the SAME client->server
        # round-trip the compile will use. Why (2): the dir test only proves sccache
        # COULD start, not that the server is reachable -- a lazily-started server
        # from a prior job can be mid-idle-shutdown exactly as this job's first
        # `rustc -vV` connects, failing the build HARD with "failed to read response
        # header" (observed 2026-06-04, run 26985377093). Probing here catches a
        # sick/unreachable server and degrades to a cold build (::warning) instead
        # of a hard mid-build failure. The `&&` chain runs in an `if` condition, so
        # a probe failure under `set -e` selects the cold branch, never aborts.
        # Fails SAFE at every stage; dissolve-on-arrival (real fix: the modeled cache_interface projection, dsl/std/cache_interface.dag).
        sccache --stop-server >/dev/null 2>&1 || true
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ] \
             && sccache --start-server >/dev/null 2>&1 \
             && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
