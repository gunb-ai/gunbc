      uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
      env:
        HOME: ${{ runner.temp }}
