      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Ensure layering imports gate binaries
      run: bash .github/ci-floor/with-sccache-retry.sh cargo build -p ci_claim_gate -p v2-compiler -p layering_imports_scan --release
    - name: Cross-layer import gate (clean tree + perturb receipts)
      run: bash scripts/v4-layering-imports-gate.sh --perturb-check
  # CI wall-time budget gate -- every timeout-minutes in .github/workflows/ must stay
  # within the ceiling declared in scripts/check_ci_timeout_budgets.py. Stops the
  # bump-the-timeout-in-the-same-diff pattern (#4324, #4633): a raise requires a loud,
  # separately-reviewable edit to the ceiling table with the root-cause analysis.
  timeout_budgets:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    # Shared srv1/srv2 runners persist $RUNNER_WORKSPACE/gunbc between jobs; shallow fetch +
    # branch churn can leave refs/remotes/origin/* pointing at missing objects and make checkout
    # fail (observed ci_floor srv2-23, run 27514705589: bad object refs/remotes/origin/session/*).
