name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Default types are opened/synchronize/reopened. Add `ready_for_review`
    # so CI fires when a draft is promoted without a new push.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  # Manager-brief authority check uses `gh pr view --json state` to
  # verify "LANDED via #N" claims map to MERGED PRs. Default
  # GITHUB_TOKEN scopes don't include pull-request read; without this
  # the check fails with "Resource not accessible by integration".
  pull-requests: read

# Cancel duplicate in-flight runs for the same PR **tip** only.
#
# PR-number-only groups caused `cancel-in-progress` to target every in-flight
# job for that PR: a stuck `v3` run on an older `head.sha` could abort a newer
# SHA's workflow mid-step (spurious red on the latest push; gunbc#2681).
# Appending `head.sha` scopes cancellation to same-commit reruns (double
# `synchronize`, label churn). Different SHAs no longer cancel each other.
#
# Keyed on PR number (not `head_ref`) so two fork PRs sharing a branch name do
# not share a group. On `push` to `main`, `pull_request` is absent — fall back
# to `github.sha` so each push stays distinct; `run_id` remains for uniqueness
# where needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

# Rust: each `setup-rust-toolchain` step omits `toolchain:` so the action reads
# `rust-toolchain.toml` at the repo root after `actions/checkout`. No job uses a
# non-default `working-directory` for Rust setup; if one did, make `rust-toolchain.toml`
# visible from that directory (e.g. copy it in) — do **not** add a workflow `toolchain:`
# input: `scripts/check-rust-toolchain-single-authority.sh` rejects `toolchain:` in the
# same Actions step as `actions-rust-lang/setup-rust-toolchain` in any
# `.github/workflows/*.{yml,yaml}`, and the action
# ignores the repo file when `toolchain` is set explicitly (upstream semantics).
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    # Skip draft PRs. `github.event.pull_request.draft` is undefined on push
    # events, so `!= true` keeps main-branch pushes running.
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, x64, gunbc-quick]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ""

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  # Policy + bootstrap snapshot verify (T-V2 G-2-prereq-ci): shell policy checks
  # plus `regen_bootstrap --verify` so stale `bootstrap_generated*.rs` cannot merge
  # when only this job is green (#1543). Legacy CI previously built and ran the
  # DAG-language compiler from the retired legacy tree in this job; that release transport is
  # removed to cut wall time. Full compiler + test surface stays in the `v3`
  # job. Local reproduction of the old pipeline: `dsl/gunbc/tools/ci_runner.dag`
  # `run_ci_pipeline`.
  # Dissolution trigger: remove the verify step below once the committed bootstrap
  # snapshot surface dissolves (default-build regen or chosen artifact path). Track
  # #1559; rationale: docs/audit/bootstrap-snapshot-drift-dissolution-assessment.md.
  ci:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, x64, gunbc-ci]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full clone so `git diff origin/main...HEAD` sees every commit on the PR
          # branch (shallow `fetch-depth: 1` misses earlier commits and can false-negative
          # the SG-0 net-shrink discipline gate).
          fetch-depth: 0

      - name: Fetch main for PR discipline diffs
        if: github.event_name == 'pull_request'
        run: git fetch origin main:refs/remotes/origin/main

      - name: SG-0 net-shrink PR-body discipline (self-test)
        run: bash scripts/check-pr-sg0-net-shrink-discipline.sh --self-test

      - name: SG-0 net-shrink PR-body discipline
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body="${PR_BODY}"
          append_file="scripts/ci-merge/sg0-pr-body-append.${{ github.event.pull_request.number }}.txt"
          if [ -f "${append_file}" ]; then
            # Prepend so `check-pr-sg0-net-shrink-discipline.sh` (grep head-1 on
            # `SG-0 hand-path delta:`) reads the machine-authored append **first**. PR
            # descriptions often keep template scaffolding or mistaken `+0` paste lines
            # above the fold — appending only left those as the first match and tripped
            # declared-vs-computed mismatch (false fail).
            body="$(cat "${append_file}")"$'\n\n'"${body}"
          fi
          PR_BODY="${body}" bash scripts/check-pr-sg0-net-shrink-discipline.sh

      - name: R4-carve dissolution discipline (self-test)
        run: bash scripts/check-r4-carve-dissolution-discipline.sh --self-test

      - name: R4-carve dissolution discipline
        run: bash scripts/check-r4-carve-dissolution-discipline.sh

      - name: Fabrication sentinel ratchet (P0-C)
        run: bash scripts/check-fabrication-sentinels.sh

      - name: Release-doc authority check (P2 single-authority discipline)
        # Forbidden-string consumer for release-control docs. Authority:
        # docs/r2-structure.md §"Release-doc authority discipline".
        run: bash scripts/check-release-doc-authority.sh

      - name: Release-doc authority self-test (consumer not ceremonial)
        # Prevents future RETRACTION_PATTERNS broadening from silently
        # neutering the consumer.
        run: bash scripts/test-check-release-doc-authority.sh

      - name: Manager-brief authority check (P2 single-authority discipline)
        # Verifies 7 R2 manager briefs cite live authorities and use
        # consistent projections. Q1 (file existence) + Q2 (anchor
        # existence) + Q4 (LANDED via #N reachability) + Q5 (cross-brief
        # lane-count consistency). Authority: gpt-5-5-pro meta-review
        # on PR #1126.
        run: bash scripts/check-manager-brief-authority.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Manager-brief authority self-test (consumer not ceremonial)
        # Prevents future MANAGER_BRIEFS or pattern-set changes from
        # silently neutering the consumer.
        run: bash scripts/test-check-manager-brief-authority.sh

      - name: Rust toolchain single-authority check (P2)
        # Pinned channel must not be duplicated in dsl/extdeps/rustup.dag;
        # authority is rust-toolchain.toml only (PR #1794).
        run: bash scripts/check-rust-toolchain-single-authority.sh

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ""

      - name: Cache Cargo (ci bootstrap gate)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-ci-${{ runner.os }}-

      - name: v3 bootstrap snapshot freshness gate (--verify)
        run: cargo run -p v3-compiler --features bootstrap-regen-fresh --bin regen_bootstrap -- --verify

  # Layer 1 CI mitigation (bridge-debt; gunbc#846 2026-05-11): coarse path
  # filter so docs-only PRs skip the heavy `v3` job (~67m wall). Computes a
  # single boolean output `code` = "PR touches anything outside the docs
  # allowlist." Docs allowlist: `docs/**` + root `*.md` files. Anything else
  # (src/, dsl/, scripts/, .github/, Cargo.lock, rust-toolchain.toml, etc.)
  # counts as a code change and runs the full v3 job.
  #
  # **Dissolution trigger**: gate `ci_uses_provable_minimal_affected_set_selection`
  # (**R4.B full delivery** per `docs/design-affected-set-lens.md` §5 "CI integration
  # sketch (deferred to R4 full delivery)"; the affected-set lens prototype is
  # pre-R3-close at gunbc#2699 but CI integration is R4-scoped). Once the lens
  # computes provable minimal test sets AND the CI integration lands, this coarse
  # filter is replaced by the structural lens output. Delete this job + `needs:
  # [changes]` on `v3` at that point.
  #
  # Note on branch protection: when `v3` skips (docs-only), `self_host_ratchet`
  # (`needs: [v3]`) would also skip. To keep its required-check name green for
  # branch protection, its `if:` was widened below to accept `v3.result ==
  # 'skipped'`.
  changes:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, x64, gunbc-quick]
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "push event — always run heavy v3 job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main:refs/remotes/origin/main
          changed=$(git diff --name-only origin/main...HEAD)
          echo "Changed files (first 200):"
          echo "$changed" | head -200
          # Docs-only allowlist: anything under docs/ OR a root-level *.md
          # file (no slash before .md). Examples that count as docs:
          #   docs/audit/foo.md           ✓
          #   docs/design-x.md            ✓
          #   WISHLIST.md                 ✓ (root *.md)
          #   ROADMAP.md                  ✓
          # Examples that count as code (run full v3):
          #   src/v3/compiler/src/foo.rs
          #   dsl/std/lens_foo.dag
          #   scripts/check-foo.sh
          #   .github/workflows/ci.yml    (workflow self-edit)
          #   src/v3/compiler/tests/README.md (nested .md, not root)
          non_docs=$(echo "$changed" | grep -vE '^(docs/.*|[^/]+\.md)$' || true)
          if [ -n "$non_docs" ]; then
            echo "Non-docs files detected; v3 will run full heavy compute:"
            echo "$non_docs" | head -50
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only PR (allowlist: docs/** + root *.md) — v3 will skip"
            echo "(Layer 1 CI mitigation; dissolution trigger = affected-set lens CI integration)"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  v3:
    # Job-level `if:` gates on the `changes` filter so docs-only PRs skip the
    # heavy compute entirely. Pushes to main always run the full job (no PR
    # base to diff against).
    if: github.event.pull_request.draft != true && (needs.changes.outputs.code == 'true' || github.event_name == 'push')
    needs: [changes]
    # Heavy compute (cargo release builds, full v3 test suite at the
    # 4000s transitional budget + clippy + lens gates). 2-core ubuntu-latest blows
    # the 60min cap reliably. Run the heavy job on the gunb-ci ephemeral
    # GCE Spot runner pool: each queued job gets one n2d-standard-8 VM,
    # the VM registers as an ephemeral GitHub runner, runs one job, then
    # self-deletes. Spot preemption is acceptable here; the companion
    # ci-spot-rerun workflow retries failed jobs while `run_attempt < 4` (four attempts).
    runs-on: [self-hosted, linux, x64, gunbc-ci]
    # Full suite is transitionally capped at 4000s (~67m), plus lane2d gate, prebuild,
    # two clippy passes, regen-fresh compile check, and L-7/L-8 shell gates. A 60m job cap
    # cancels mid-suite on cold/cache-miss runners (observed: Actions "maximum execution time
    # of 1h0m0s"). Keep headroom above the in-step 4000s budget + downstream steps.
    # Revert toward 60–90m when OnceLock/module-cache brings warmed full-suite wall back down.
    timeout-minutes: 120
    env:
      # Self-hosted `gunbc-ci` runs the Actions agent alongside `cargo` link jobs.
      # Default `.cargo/config.toml` uses `build.jobs = 2`; on cold integration builds
      # that has correlated with "runner lost communication" disconnect annotations
      # (oversubscribed VM + linker RSS). Force single-job compiles for this workflow
      # job only — wall time may rise slightly; stability beats flaky red merges.
      CARGO_BUILD_JOBS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          # Integration snapshot tests (`regen_parse` path, lane2d cost lens, …) shell out to `rustfmt`.
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Setup Zig C toolchain
        uses: goto-bus-stop/setup-zig@v2
        with:
          # Pin a stable linker toolchain instead of the action default
          # nightly/master download path; the self-hosted runner has lost
          # contact repeatedly while resolving the moving Zig setup target.
          version: 0.13.0
          cache: false

      - name: Configure user-space C linker
        run: |
          mkdir -p "${RUNNER_TEMP}/gunbc-bin"
          cat > "${RUNNER_TEMP}/gunbc-bin/zig-cc" <<'EOF'
          #!/usr/bin/env bash
          exec zig cc "$@"
          EOF
          chmod +x "${RUNNER_TEMP}/gunbc-bin/zig-cc"
          echo "CC=${RUNNER_TEMP}/gunbc-bin/zig-cc" >> "${GITHUB_ENV}"
          echo "RUSTFLAGS=-D warnings -C linker=${RUNNER_TEMP}/gunbc-bin/zig-cc" >> "${GITHUB_ENV}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Cache Cargo (v3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v3-${{ runner.os }}-

      # **PB-Runtime helper-binary prereq (PR #1049 / #1063 / #856).** The Linux
      # `ExecuteCommand` host path invokes `gunbc_execute_command_bootstrap` as the
      # `unshare(1)` target — it sets `FD_CLOEXEC` on fd 3 immediately before `execvp(3)`,
      # closing the sentinel channel atomically on successful exec (the structural P2(c)
      # guarantee). `cargo test -p v3-compiler` does not pull this bin-only crate into its
      # build graph (bin-only crates can't be `[dependencies]` on stable), so we build it
      # explicitly here. `test_runner.rs::locate_unshare_bootstrap_helper` walks from
      # `current_exe()` to find the resulting `target/debug/gunbc_execute_command_bootstrap`.
      - name: Build ExecuteCommand unshare helper
        run: cargo build -p execute-command-bootstrap

      # Layer 1 (coarse CI): wall-clock gates on `cargo test -p v3-compiler`.
      #
      # Full-suite wall-clock ratchet below is transitionally 4000s (raised from 3300s after
      # observed ~3681s cold gunbc-ci full-suite wall on PR #2696). Earlier history: 3300s from
      # ~2873s cold ubicloud-standard-8 runs (gate #78 era); 2400s before that. Revert toward lower
      # caps once integration amortization / OnceLock warming restores headroom. Mainline timing on ubuntu-24.04
      # reached ~951–953s after #548 (earlier green ~719s); warm local runs are often
      # ~520–560s for `cargo test -p v3-compiler`. Cold runners, cache misses, m1_5_testgen,
      # and the DB-8 determinism matrix can push higher — observed ~1082s motivated cap >1050s.
      # Ratchet is coarse (catch suite-wide slowdown), not a tight perf SLA.
      # Regressions show up when integration tests redo full `compile_to_dag` per
      # `#[test]` (see `lane2_stage_2e_parallelism_test`: shared `OnceLock` + clone).
      #
      # Wall-clock gate on lane2 Stage 2d symbolic-cost tests only (ζ / #537).
      # Post-#546 these live in the consolidated `integration` test binary; the
      # `lane2_stage_2d_symbolic_cost_test::` filter keeps the ratchet narrow.
      # The timer wraps the full `cargo test` process. Prebuild the integration
      # harness (`--no-run`) so this gate measures lane2d work — not a cold link
      # of the whole `integration` binary (observed ~322s over a 300s budget on
      # ubuntu-latest; PR #1794). **Cold** runs (cache miss) can still spend minutes;
      # keep headroom beyond a tight 120s; per-test discipline lives in
      # `tests/common/budgeted.rs` (DEFAULT_BUDGET_MS).
      # Tracked headroom: ratchet this ceiling back toward 300s once cold lane2d
      # CI runs regularly complete under 300s after fixture compile amortization.
      - name: Prebuild v3 integration test binary (lane2d wall-clock denominator)
        run: |
          set -euo pipefail
          heartbeat() {
            while sleep 60; do
              echo "v3 prebuild heartbeat: $(date -u +%FT%TZ)"
            done
          }
          heartbeat &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT
          cargo test -p v3-compiler --test integration --no-run

      # **HOT-FIX 2026-05-12 — Stage 2d test execution SKIPPED** per operator
      # directive at gunbc#846 ('cut all demos and integration tests for now,
      # get v3 to 10 minutes'). The lane2d integration tests are part of the
      # full integration harness and execution is paused until OnceLock/
      # cached_compile amortization (rebuild session) lands. Compile coverage
      # remains via the `--no-run` prebuild step above (catches Rust-level
      # breakages); only execution is skipped.
      #
      # **Restore criteria** (rebuild session per #2722 §5): when each lane2d
      # symbolic-cost test re-enables under shared bootstrap + OnceLock
      # amortization with per-test wall ≤ 2s, restore this step (or transition
      # to per-cluster path-conditional gating per Layer 2 brief #2719).
      - name: v3 tests (Stage 2d integration module, HOT-FIX SKIPPED)
        run: |
          echo "::notice::v3 lane2d Stage 2d test execution SKIPPED per operator hot-fix directive at gunbc#846 (cold-v3 → ~10min target)."
          echo "::notice::Restore criteria: per-test wall ≤ 2s under OnceLock/cached_compile amortization (rebuild session per #2722 §5)."
          exit 0

      # **Dissolution trigger:** reshape m1_5_testgen to spot-check instead of exhaustive
      # compile-every-claim, OR mark the two slow tests `#[ignore]`-by-default + nightly job.
      #
      # Timing capture — the trailing `-- -Z unstable-options --report-time` enables
      # libtest's per-test timing output (`<N.NNNs>` trailer) so the Phase 0 per-test
      # ratchet step below can parse violations without running the suite a second
      # time. `--report-time` is still unstable on 1.93 (rust-lang/rust#64888); the
      # `RUSTC_BOOTSTRAP=1` prefix is the documented narrow unlock for libtest flags
      # and does not enable unstable language features.
      #
      # **Split across YAML steps (gunbc#2681):** a single long `cargo test | tee`
      # step on self-hosted runners sometimes completed with `failure` while the
      # Actions log contained no `cargo test` output (mid-step runner loss / flush
      # behavior). Running `lib`+`bins`, `determinism_test`, `doc`, and `integration` as
      # separate steps preserves streamed logs per phase and the same combined
      # `/tmp/v3-test-timings.log` for `scripts/check-test-timeout.sh`.
      #
      # **Target-discovery guard:** every `tests/*.rs` integration binary must appear in
      # a split step with `--report-time` (codex review on #2681); otherwise clippy
      # `--all-targets` could compile a new harness without the full suite ever running it.
      # **Bridge debt:** script is a tracked hand-CI shim until Workflow-as-Data owns this
      # gate (see header in `scripts/check-v3-full-suite-split-test-targets.sh`; openai-pro
      # APPROVE_WITH_COMMENTS on #2681).
      - name: v3 full-suite split guard (integration test targets)
        run: scripts/check-v3-full-suite-split-test-targets.sh

      - name: v3 tests (full suite lib+bins, timings part 1/4)
        env:
          CARGO_TERM_COLOR: never
          RUST_MIN_STACK: 16777216
        run: |
          set -euo pipefail
          echo "V3_SUITE_START_TS=$(date +%s)" >> "${GITHUB_ENV}"
          : > /tmp/v3-test-timings.log
          RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --lib --bins -- -Z unstable-options --report-time 2>&1 | tee /tmp/v3-test-timings.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test (lib+bins) failed (exit=$status)"
            exit "$status"
          fi

      - name: v3 tests (full suite determinism harness, timings part 2/4)
        env:
          CARGO_TERM_COLOR: never
          RUST_MIN_STACK: 16777216
        run: |
          set -euo pipefail
          RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --test determinism_test -- -Z unstable-options --report-time 2>&1 | tee -a /tmp/v3-test-timings.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test (determinism_test) failed (exit=$status)"
            exit "$status"
          fi

      - name: v3 tests (full suite doc tests, timings part 3/4)
        env:
          CARGO_TERM_COLOR: never
          RUST_MIN_STACK: 16777216
        run: |
          set -euo pipefail
          RUSTC_BOOTSTRAP=1 cargo test -p v3-compiler --doc -- -Z unstable-options --report-time 2>&1 | tee -a /tmp/v3-test-timings.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo test (--doc) failed (exit=$status)"
            exit "$status"
          fi

      # **HOT-FIX 2026-05-12 — full integration harness execution SKIPPED** per
      # operator directive at gunbc#846 ('cut all demos and integration tests
      # for now, get v3 to 10 minutes'). The integration test binary is the
      # dominant wall-time contributor (~67min cold per Director tick framing);
      # execution is paused until OnceLock/cached_compile amortization (rebuild
      # session per #2722 §5) lands and tests can run within per-test 2s ratchet.
      #
      # **What still gates correctness on every PR** (NOT cut):
      # - lib+bins (Part 1/4 above) — unit-level correctness in src/
      # - determinism_test (Part 2/4) — emission determinism gate
      # - doc tests (Part 3/4) — doc-comment examples
      # - Compile coverage of integration via `--no-run` prebuild — catches Rust-level breakages
      # - Clippy + L-7 + L-8 + compiler-std + banked-dissolutions ratchets (below)
      #
      # **Restore criteria**: rebuild session #2722 §5 (OnceLock/cached_compile
      # amortization) reshapes each integration test to ≤2s under shared bootstrap.
      # As each test class re-enables, restore step + ratchet budget downward
      # incrementally.
      #
      # **Budget ratchet**: 4000s → effectively N/A (no execution); when integration
      # tests re-enable per cluster (via Layer 2 path-conditional gating from brief
      # #2719) or rebuild session, set per-step or per-cluster timeouts at that point.
      - name: v3 tests (full suite integration harness, HOT-FIX SKIPPED)
        run: |
          echo "::notice::v3 integration test execution SKIPPED per operator hot-fix directive at gunbc#846."
          echo "::notice::Cold-v3 wall-time target: ~10min (per Brian framing 2026-05-12)."
          echo "::notice::Correctness coverage preserved: lib+bins + determinism + doc tests + integration --no-run compile + clippy + lens gates + ratchets."
          echo "::notice::Restore criteria: rebuild session per #2722 §5 OnceLock/cached_compile amortization → per-test wall ≤ 2s ratchet → re-enable per cluster via Layer 2 path-conditional gating."

      # Per-test 2s wall-clock ratchet — binding Phase 0 gate.
      # Parses the timing log captured by the full-suite steps above; does not
      # re-run `cargo test`. Tests listed in
      # `scripts/slow-test-exemptions.txt` remain visible as warnings; any
      # non-exempt test above the threshold fails this step. See
      # `src/v3/compiler/tests/HANDOFF_PHASE0.md` (TESTING.md § test layers,
      # `feedback_test_timeout_2s`).
      #
      # **`if: always()`** — the ratchet report is still useful on red runs
      # (full-suite failure, 4000s transitional-budget overflow). The log is captured via
      # `tee` before the enforcement check, so partial timing data survives
      # failure and the ratchet can still emit actionable slow-test output.
      - name: v3 tests (per-test 2s ratchet)
        if: always()
        run: |
          if [ ! -s /tmp/v3-test-timings.log ]; then
            echo "::notice::no timing log captured or log is empty (full-suite steps did not reach cargo test, or tee wrote nothing) — skipping per-test ratchet"
            exit 0
          fi
          scripts/check-test-timeout.sh /tmp/v3-test-timings.log

      # Default graph (no regen feature): locks in `cfg_attr(dead_code)` hygiene and
      # ensures production targets stay clean without relying on the feature build alone.
      - name: v3 Compiler Clippy (default features)
        run: cargo clippy -p v3-compiler --all-targets -- -D warnings

      - name: v3 Compiler Clippy (bootstrap-regen-fresh)
        run: cargo clippy -p v3-compiler --all-targets --features bootstrap-regen-fresh -- -D warnings

      # Type-check lib + default integration harness with the regen feature on
      # (clippy already checks targets; this ensures `cargo test` linkage too).
      - name: v3 test targets compile with bootstrap-regen-fresh
        run: cargo test -p v3-compiler --no-run --features bootstrap-regen-fresh

      # `regen_bootstrap --verify` runs in the required `ci` job (pre-merge
      # fail-closed gate; #1543). Skip duplicate here. Dissolution trigger for
      # both places: #1559 (see docs/audit/bootstrap-snapshot-drift-dissolution-assessment.md).

      - name: L-7 Substrate accessor reconstruction gate
        run: |
          # L-7 (INVARIANTS.md): lenses consume substrate query
          # functions (`port`, `node`, `resolve_producer`) instead of
          # reconstructing local `find_port` / `find_behavior` / ...
          # Scan `.dag` lens files for forbidden helper declarations.
          matches=$(grep -nE "fn (find_port|find_behavior|resolve_producer|lookup_node|lookup_port)" src/v3/lenses/*.dag 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::L-7 violation: lens reconstructs a substrate lookup locally"
            echo "$matches"
            exit 1
          fi

      - name: L-8 Lens surface gate
        run: |
          # L-8 (INVARIANTS.md): migrated .dag lenses must not collapse
          # their typed failure carriers into primitives at the public
          # Rust surface. The forbidden shape is any `pub fn ... -> T`
          # for T in {usize, bool, i64} inside a hand-written wrapper
          # alongside a generated lens module — e.g., the deleted
          # `pub fn cost_of(&self, port: PortId) -> usize` wrapper that
          # shadowed the generated `CostLookup` carrier.
          #
          # Scope: every `src/v3/compiler/src/lens_*.rs` file (hand-written
          # and `*_generated.rs` — catching a collapsed wrapper in generated
          # code would mean the emitter regressed).
          wrappers=$(ls src/v3/compiler/src/lens_*.rs 2>/dev/null || true)
          if [ -z "$wrappers" ]; then
            echo "L-8: no lens wrapper files to scan"
            exit 0
          fi
          matches=$(grep -nE "pub fn .*-> (usize|bool|i64)" $wrappers 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::L-8 violation: lens wrapper collapses typed carrier to a primitive"
            echo "$matches"
            exit 1
          fi

      - name: Compiler-std consolidation ratchet
        run: scripts/check-compiler-std-ratchet.sh

      - name: Banked-dissolutions ratchet
        run: scripts/check-banked-dissolutions.sh

  # DB-8 — fixed-point ratchet infrastructure (Lane 3 Stage 3c prep). Staged until
  # Lane 1 Stage 1e closes: do not block merges on this job yet.
  self_host_ratchet:
    # Always schedule this job name on PRs so branch-protection "required checks" get a
    # definitive **success** after `v3` (skipped jobs / workflow-wide cancels were surfacing
    # as merge-blocking reds on #2681). The heavy DB-8 matrix still runs **only** on
    # `push` to `main`; PRs execute a cheap stub on `gunbc-quick` instead of competing
    # for `gunbc-ci` with `v3`.
    #
    # Layer 1 CI mitigation widens this `if:`: when `v3` is skipped on a docs-only
    # PR (via the `changes` filter job), this stub must still report green so its
    # required-check name doesn't block merges. The `always() && ... != 'failure'`
    # pattern lets this job run when `v3` either succeeded OR was skipped, but not
    # when `v3` actually failed.
    #
    # **Fail-closed under filter failure** (openai-pro REQUEST_CHANGES on PR #2718,
    # then codex BLOCKING on PR #2718 line 579 caught the actual fail-open):
    #
    # Original openai-pro fix used `if: ... && needs.changes.result == 'success'`,
    # intending changes-failure → self_host_ratchet skipped → branch-protection
    # incomplete signal. **But GitHub branch protection treats SKIPPED required
    # checks as SUCCESS by default** (per docs/en/pull-requests/.../troubleshooting-
    # required-status-checks#handling-skipped-but-required-checks). So skipping on
    # filter-failure was still phantom-green.
    #
    # **True fail-closed**: the job MUST RUN on every PR (`if: ${{ always() && ... }}`
    # with no result-checks gating the JOB), and an EXPLICIT step fails when the
    # gate evidence is incomplete. A failed step → job FAILURE → required-check RED
    # → branch-protection BLOCKS. Job-level `continue-on-error: true` (kept below)
    # only governs workflow conclusion, not job conclusion reported to branch
    # protection; individual DB-8 staging steps have their own step-level
    # continue-on-error to preserve their non-blocking semantics.
    if: ${{ always() && github.event.pull_request.draft != true }}
    # Same sizing rationale as `v3` above: DB-8 release builds + determinism_test (5× matrix) +
    # `self_host_fixed_point` run on the same ephemeral GCE Spot runner pool as `v3`;
    # small/default runners saw mid-compile shutdown on #1794. **60m** wall so cold-cache
    # / full release `cargo` is unlikely to cancel mid-job; ratchet remains non-blocking.
    # (Runner label is orthogonal to P2:
    # `rust-toolchain.toml` + no workflow `toolchain:` input.)
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'gunbc-ci' || 'gunbc-quick' }}
    timeout-minutes: 60
    # `changes` added to `needs:` so the fail-closed `if:` clause above can
    # reference `needs.changes.result` (openai-pro REQUEST_CHANGES fix). Without
    # the `needs:` declaration the `result` accessor is unavailable and the
    # gate degenerates to fail-open under filter failure.
    needs: [v3, changes]
    continue-on-error: true
    steps:
      # **Fail-closed gate-evidence validation** (codex BLOCKING on PR #2718 line 579 fix).
      # Reports explicit step FAILURE → job FAILURE → required-check RED when the
      # Layer 1 filter (`changes`) failed or was cancelled, or when `v3` failed/cancelled.
      # Job conclusion FAILURE propagates to branch protection (skipped does NOT — that's
      # the bug this fixes). No `continue-on-error` on this step; its failure must surface.
      #
      # Allowed `v3.result` values that the validation accepts:
      #   - `success`: v3 ran cleanly (CI green)
      #   - `skipped`: v3 was skipped because `changes` proved docs-only (`code=false`)
      # Allowed `changes.result` values:
      #   - `success`: filter completed (regardless of `code` value)
      # Anything else → fail with explicit diagnostic (P3 fail-closed / C-8).
      - name: Validate gate evidence (fail-closed under filter/v3 failure)
        run: |
          echo "Gate evidence: changes.result=${{ needs.changes.result }} v3.result=${{ needs.v3.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::Layer 1 filter (`changes` job) did not succeed (result=${{ needs.changes.result }})."
            echo "::error::Cannot determine v3 skip legitimacy — skipped required-checks default to SUCCESS"
            echo "::error::in GitHub branch protection (https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks#handling-skipped-but-required-checks),"
            echo "::error::so an explicit step failure here surfaces the missing-evidence as a diagnostic"
            echo "::error::per P3 fail-closed / C-8 discipline."
            exit 1
          fi
          if [ "${{ needs.v3.result }}" = "failure" ] || [ "${{ needs.v3.result }}" = "cancelled" ]; then
            echo "::error::v3 job did not succeed (result=${{ needs.v3.result }}); ratchet cannot claim green."
            exit 1
          fi
          # Either v3.result == success (ran cleanly) or v3.result == skipped (legit docs-only via changes.code=false)
          echo "Gate evidence validated; ratchet may proceed."

      - name: Checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: DB-8 stub (PR / non-main — full matrix is main-push only)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          echo "::notice::self_host_ratchet DB-8 release matrix runs only on pushes to main (Lane 1e staged)."
          exit 0

      - name: Setup Rust
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          cache: false
          rustflags: ""

      - name: Cache Cargo (self_host_ratchet)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-self-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/**') }}
          restore-keys: |
            cargo-self-host-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-self-host-${{ runner.os }}-

      # Named DB-8 ratchet (also executed inside the `v3` full suite); release
      # build here matches `self_host_fixed_point` and gives a dedicated log section.
      # Step-level continue-on-error: one ratchet can fail without aborting the other
      # (job-level continue-on-error keeps the workflow green until Lane 1e graduates).
      - name: DB-8 determinism_test (5× emit matrix)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: cargo test -p v3-compiler --release --test determinism_test

      - name: DB-8 self_host_fixed_point (staged)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: cargo run -p v3-compiler --release --bin self_host_fixed_point

      - name: DB-8 emit.rs HashMap iteration policy (informational)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if grep -nE "(HashMap|HashSet)::" src/v3/compiler/src/emit.rs; then
            echo "::notice::DB-8: emit.rs still uses HashMap/HashSet:: iteration — target is BTree* / sorted keys (determinism_test + ROADMAP Lane 3 Stage 3c prep)"
          else
            echo "emit.rs: no HashMap::/HashSet:: — consider graduating this check to required when Lane 1e clears debt"
          fi
