    # host CONSUMES the .dag (drop a dependency -> rebatch) and that the
    # executor's ordering gates execution (false gating claim -> batch 2 skipped).
    - name: v4 executor batch-runner dogfood (must-pass, discriminating)
      run: bash scripts/v4-batch-executor-gate.sh --perturb-check
  # §11.7.1 Class A safety floor (parallel matrix lane) -- the per-row PERTURB
  # fan-out split out of v4_lens_ci. The 15 red-under-mutation receipts (9
  # node-frontier + 6 affected-testgen) each require an independent cold full-tree
  # resolve, which serialized into the v4_lens_ci wall. Profiler E measured
  # DRAM-bandwidth contention at 2.2-3x and UNCHANGED post-DIMM, so concurrency is
  # CAPPED (max-parallel, default 4, env-tunable via the
  # V4_LENS_CI_PERTURB_MAX_PARALLEL repo variable): 3-4 concurrent captures most of
  # the wall-clock win without saturating bandwidth for every other concurrent job.
  # Shard count N = matrix leg count = strategy.job-total; this leg is K =
  # strategy.job-index. The script perturbs the combined-15 rows where i % N == K,
  # asserts its slice is non-empty and fully run, and the `ci` aggregator requires
  # EVERY leg to succeed -- a skipped/cancelled shard fails the gate closed (no
  # pass-by-omission). GREEN witnesses + the executor dogfood STAY in v4_lens_ci.
  # Enforced via the `ci` aggregator. dissolve-on: PR3 (uniform ci_claim_gate
  # single-process perturb) re-absorbs this split.
  v4_lens_ci_perturb:
    runs-on: [self-hosted, linux, arm64]
    # Per-shard budget rule (documented uncontended wall x2): with N=4 the
    # heaviest shard owns 4 of 15 rows; ~108s cold resolve/row + per-row src/v4
    # copy + checkout/setup/cache-restore ~= 8m uncontended; x2 -> 16, rounded to
    # 20m (matches the corpus shards). Re-derive once an on-wave per-shard wall
    # receipt exists; do NOT raise without one.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ vars.V4_LENS_CI_PERTURB_MAX_PARALLEL || 4 }}
      matrix:
        shard: [0, 1, 2, 3]
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
        sccache --stop-server >/dev/null 2>&1 || true
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ] \
             && sccache --start-server >/dev/null 2>&1 \
             && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache server (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent, unwritable, or unreachable; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    # Shared srv1/srv2 runners persist $RUNNER_WORKSPACE/gunbc between jobs; shallow fetch +
    # branch churn can leave refs/remotes/origin/* pointing at missing objects and make checkout
    # fail (observed ci_floor srv2-23, run 27514705589: bad object refs/remotes/origin/session/*).
    - name: Scrub dangling remote refs (shared runner worktree)
      run: |
        scrub_repo() {
          local repo="$1"
          [ -d "${repo}/.git" ] || return 0
          echo "::group::Scrub dangling remote refs: ${repo}"
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            if ! git -C "$repo" rev-parse --verify "${ref}^{commit}" >/dev/null 2>&1; then
              echo "::warning::deleting dangling ref ${ref}"
              git -C "$repo" update-ref -d "$ref" 2>/dev/null || true
            fi
          done < <(git -C "$repo" for-each-ref --format='%(refname)' refs/remotes/origin 2>/dev/null || true)
          # Self-heal: if the ref store is still unreadable, or any ref tip object remains missing
          # after the dangling-ref scrub (e.g. corrupt packed-refs that update-ref -d could not
          # clear), the next checkout fails 'fatal: bad object <ref>'. Remove the repo so
          # actions/checkout fresh-clones. Precise: fires ONLY when for-each-ref errors or a ref
          # tip is genuinely missing -- a healthy or empty checkout is never removed.
          corrupt=0
          if ! git -C "$repo" for-each-ref >/dev/null 2>&1; then
            corrupt=1
          elif git -C "$repo" for-each-ref --format='%(objectname)' 2>/dev/null \
               | git -C "$repo" cat-file --batch-check 2>/dev/null | grep -q ' missing$'; then
            corrupt=1
          fi
