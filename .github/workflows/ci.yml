      run: python3 scripts/check_ci_timeout_budgets.py
    - name: Timeout budget gate detects a planted raise
      run: python3 scripts/check_ci_timeout_budgets.py --perturb-check
  # Per-run CI wall-clock TIMING LEDGER (latency monitoring for the CI-latency profilers).
  # NON-GATING: after the floor/lens jobs finish, read THIS run's per-job wall-clock via the Actions
  # API (the shell-free .dag github.Actions extdep) and write the `affected-set-ci-receipt-timed`
  # artifact (wall_clock_by_job + actual_run_minutes). Transport-only (RR-K §2.4): computes NO
  # affected-set facts and gates NO job. Deliberately NOT in the `ci` aggregator needs-closure --
  # timing collection must never fail a merge. `if: always()` so timings are captured even when a
  # floor job failed (not when the whole run is cancelled). The affected-set SELECTION machinery
  # (the former `affected` job + detect/emit-selection bins) was retired on the Axis-A uniform
  # consolidation (operator "go uniform", 2026-06-13): CI runs every job, so selection gated nothing
  # and saved nothing (kill-criterion receipts measured saved_minutes=0). This is the surviving
  # latency half only.
  affected_timings:
    runs-on: [self-hosted, linux, arm64]
    # checkout + rust + the shell-free .dag github.Actions fetch (collect-affected-set-timings, which
    # embeds v2-compiler and writes the timed receipt directly).
    # Budget rule (documented uncontended wall x2): INTERIM 8 -- v2-compiler is sccache-warm from
    # the floor jobs that build it (ci_floor_emit), so the warm wall is ~1-2m; the cold-build
    # (sccache-miss) tail dominates at ~3-4m; 4m x2 = 8. Re-derive from the first green run; if the
    # v2-host build breaches it cold, restore a cached binary as the lens jobs do for claim_batch.
    timeout-minutes: 8
    needs: [ci_floor, ci_floor_parity, ci_floor_emit, v4_lens_gate, v4_lens_ci]
    if: always()
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
