        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
        # SCCACHE_SERVER_UDS, ctrl#1419). Do NOT hardcode SCCACHE_SERVER_UDS here: a job/step-level
        # env beats the runner default, so pinning the old shared socket forces EACCES and keeps
        # sccache inert. Inherit the runner's socket; only flip RUSTC_WRAPPER on. The server starts
        # LAZILY (sccache creates the socket on the first rustc call), so the socket does NOT exist yet
        # at this pre-cargo step -- so we gate in two stages. (1) the socket's
        # PARENT DIR must be writable (runner provisions it ghrunner:ghrunner 0755,
        # ctrl#1419); a missing/unwritable dir -> cold build. (2) actively
        # health-probe the server: `--start-server` is idempotent (no-op if up,
        # else starts + WARMS it) and `--show-stats` forces the SAME client->server
        # round-trip the compile will use. Why (2): the dir test only proves sccache
        # COULD start, not that the server is reachable -- a lazily-started server
        # from a prior job can be mid-idle-shutdown exactly as this job's first
        # `rustc -vV` connects, failing the build HARD with "failed to read response
        # header" (observed 2026-06-04, run 26985377093). Probing here catches a
        # sick/unreachable server and degrades to a cold build (::warning) instead
        # of a hard mid-build failure. The `&&` chain runs in an `if` condition, so
        # a probe failure under `set -e` selects the cold branch, never aborts.
        # Fails SAFE at every stage; dissolve-on-arrival (real fix: ci.dag cache projection).
        if [ -n "$SCCACHE_SERVER_UDS" ] && [ -w "$(dirname "$SCCACHE_SERVER_UDS")" ] \
             && sccache --start-server >/dev/null 2>&1 \
             && sccache --show-stats >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        else
          echo "::warning::sccache server (SCCACHE_SERVER_UDS=${SCCACHE_SERVER_UDS:-unset}) absent, unwritable, or unreachable; building cold"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
      # Shared-$HOME self-hosted runners: rustup-init's default modify-path appends
      # `. "$CARGO_HOME/env"` to ~/.bashrc and ~/.profile. With CARGO_HOME isolated to the
      # per-job $RUNNER_TEMP (step above), that path is wiped post-job, leaving a dangling source
      # line that errors on every interactive login and accumulates one per runner slot. Scope HOME
      # to throwaway $RUNNER_TEMP for just this step so those writes never touch the real shared
      # $HOME (the git-auth scrub step runs under the real HOME and is unaffected).
      env:
        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Cache Cargo (ci floor)
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache gunbc binary (v4 floor)
      id: v4-v2-bin
      uses: actions/cache@v5
      with:
        path: target/release/gunbc
        key: gunbc-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          gunbc-bin-${{ runner.os }}-${{ runner.arch }}-
    - name: Build v2 compiler (v4 floor)
      if: steps.v4-v2-bin.outputs.cache-hit != 'true'
      run: cargo build -p v2-compiler --release
    - name: M1 v4 full-tree rust emit probe (v2 emit)
      timeout-minutes: 35
      env:
        V4_M1_RUST_EMIT_OUT: ${{ runner.temp }}/v4-rust-emit
        V4_M1_DAG_EMIT_OUT: ${{ runner.temp }}/v4-bootstrap
        V4_M1_DAG_EMIT_LOG: ${{ runner.temp }}/v4-bootstrap.shared.log
        V4_M1_RUST_EMIT_PROBE_STRICT: "0"
      run: bash .github/ci-floor/v4-m1-rust-emit-probe.sh
  ci:
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [affected, ci_floor, ci_floor_emit, infra_isolation]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Validate prerequisites (fail-closed under skipped/failed deps)
      run: |
        set -euo pipefail
        if [[ "${{ needs.affected.result }}" != "success" ]]; then
          echo "::error::affected job did not succeed (result=${{ needs.affected.result }}); ci aggregator fails closed."
          exit 1
        fi
        if [[ "${{ needs.ci_floor.result }}" != "success" ]]; then
          echo "::error::ci_floor job did not succeed (result=${{ needs.ci_floor.result }}); ci aggregator fails closed."
          exit 1
        fi
        if [[ "${{ needs.ci_floor_emit.result }}" != "success" ]]; then
          echo "::error::ci_floor_emit job did not succeed (result=${{ needs.ci_floor_emit.result }}); ci aggregator fails closed."
          exit 1
        fi
        if [[ "${{ needs.infra_isolation.result }}" != "success" ]]; then
          echo "::error::infra_isolation guard did not succeed (result=${{ needs.infra_isolation.result }}); runner de-priv unverified -- ci aggregator fails closed."
          exit 1
        fi
        echo "ci aggregator: Wave 1 safety floor satisfied (affected receipt + stage0 freshness + DAG parity in ci_floor + M1 rust+dag emit in ci_floor_emit; infra_isolation de-priv guard green)"
    - name: ci receipt (section 11.7.1 floor)
      run: |
        echo "::notice::Required CI: fmt + affected receipt + ci_floor (stage0 freshness + DAG parity) + ci_floor_emit (M1 rust+dag emit)"
