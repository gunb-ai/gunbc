name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v2/stage0/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Build Compiler
        run: cargo build -p v2-compiler --release

      - name: CI Pipeline
        run: cargo run -p v2-compiler --release -- run --source-root dsl --function run_ci_pipeline

      - name: CI Timing
        if: always()
        run: cat /tmp/v2-ci-timing.txt 2>/dev/null || echo "no timing data"

  v3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo (v3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v3-${{ runner.os }}-

      - name: v3 Compiler Tests
        run: cargo test -p v3-compiler

      - name: v3 Compiler Clippy
        run: cargo clippy -p v3-compiler --all-targets -- -D warnings

      - name: L-8 Lens surface gate
        run: |
          # L-8 (INVARIANTS.md): lens Rust wrappers must not collapse
          # typed failure carriers (CostLookup, Origin, ...) into opaque
          # primitives. Scan every lens_*.rs wrapper for return signatures
          # that violate the carrier-preservation rule.
          matches=$(grep -nE "fn .*Lens.*-> (usize|bool|i64)" src/v3/compiler/src/lens_*.rs 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::L-8 violation: lens wrapper collapses typed carrier to a primitive"
            echo "$matches"
            exit 1
          fi

      - name: Banked-dissolutions ratchet
        run: scripts/check-banked-dissolutions.sh
