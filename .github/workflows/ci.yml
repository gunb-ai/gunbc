        HOME: ${{ runner.temp }}
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Fetch main for diff base
      if: github.event_name == 'pull_request'
      run: git fetch origin main:refs/remotes/origin/main
    - name: Detect affected components
      id: detect
      run: bash .github/ci-floor/with-sccache-retry.sh cargo run -p ci_affected_components --bin detect-ci-affected-components -- "${{ github.event_name }}" "$GITHUB_OUTPUT"
    - name: Emit Wave 3 shadow selection receipt (Class C, non-blocking)
      continue-on-error: true
      run: cargo run -p ci_affected_components --bin emit-ci-wave3-shadow-receipt -- "${{ github.event_name }}"
    # Wave-1 §11.7 kill-criterion instrumentation (work-item adhoc-0ae3efe5-52b). Measurement only:
    # emits a per-PR JSON receipt (affected-set partition + bootstrap_required prediction) that the
    # operator aggregates to decide whether to affected-set-gate ci_floor. Does NOT gate any job.
    # See docs/planning/affected-set-ci-kill-criterion-instrumentation-2026-06-02.md.
    # estimated-full-run-minutes is the PROVISIONAL ci_floor p50 (~13-15m, self-hosted arm64, runs
    # this session; CI Manager 2026-06-02) — revise once we have a 20+ PR sample. Per-run wall-clock /
    # actual_run_minutes await a follow-up aggregator job that reads GHA job timings via the API, so
    # saved_minutes is not yet populated from real run time (actual_run_minutes defaults to 0).
    - name: Emit affected-set CI kill-criterion receipt
      run: bash .github/ci-floor/with-sccache-retry.sh cargo run -p ci_affected_components --bin emit-affected-set-ci-receipt -- "${{ github.event_name }}" "$RUNNER_TEMP/affected-set-ci-receipt.json" --estimated-full-run-minutes 15
    - name: Upload affected-set CI receipt
      uses: actions/upload-artifact@v6
      with:
        name: affected-set-ci-receipt
        path: ${{ runner.temp }}/affected-set-ci-receipt.json
        if-no-files-found: warn
  # §11.7.1 Class A safety floor -- stage0 freshness + bootstrap dag parity. The M1 rust+dag emit
  # probe runs in the parallel `ci_floor_emit` job (split for concurrency; see gunb-ai/ctrl#1458).
  ci_floor:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
        # INTERIM sccache transport (operator 2026-06-01 override; "disregard the memo for now").
        # Right-way fix is the modeled cache_interface projection consumer (dsl/std/cache_interface.dag
        # sccache_local_facts; src/v4/workflow/ci.dag cache-projection note) -- NOT this hand-wire.
        # The runner provides an ISOLATED, ghrunner-owned sccache via systemd env (SCCACHE_DIR +
