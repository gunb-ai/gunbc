# The whole CI floor is one `.dag` binary: claim_batch discovers the
# single-representation `test fn`/`test data` corpus under src/v2/test and evaluates
# every claim in-interpreter — no shell gate, no hand roster, no `.dag` shell-out.
# Branch protection should require job id `ci`.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    steps:
      # Toolchain isolation: the shared-$HOME self-hosted runners race on a global
      # rustup/cargo dir, so pin CARGO_HOME/RUSTUP_HOME under RUNNER_TEMP per job.
      - name: Isolate toolchain dirs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 0 (not 1): full history so `origin/main...HEAD` merge-base resolves for the
          # Rust-gate affected-set below. claim_batch fail-closes (runs the gates) if
          # the base is unavailable, so safety holds regardless. Revert to 1 if clone slows.
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      # CI floor — one step, nine `.dag` evaluations:
      #   (1) claim_batch: the always-on src/v2 witness corpus (the compiler-seed
      #       `claim_batch` bin, --roster-from-discovery). Discovery is a build-time
      #       lens over parsed source (NOT runtime reflection), so it is a Rust host today;
      #       it dissolves when witness discovery moves to gunbc.
      #   (2) gunbc: the rust-monolith SELECTOR witnesses (tools.rust_stage0_gates) — keeps the
      #       selector's edge cases (suffix-not-substring, dag-only, fail-closed) gated.
      #   (3) gunbc: the rust-monolith GATE (tools.rust_gates_ci) — git diff -> selector ->
      #       cargo fmt + clippy, returning ProcessExit (fail-closed). The gate logic is `.dag`
      #       authority; the only Rust is the gunbc interpreter seed (DESIGN §7). A `.dag`-only
      #       diff fires neither cargo gate; an undeterminable diff fail-closes (runs them).
      #   (4) gunbc: emit-host gate WITNESSES (tools.emit_host_fixtures contract pins).
      #   (5) gunbc: emit-host GATE (tools.emit_host_gate) — compiles+runs MVP fixtures per
      #       target row; replaces deleted `tools/emit_host_runner` (DESIGN §7).
      #   (6) gunbc: layering-imports coverage witness (pure roster pins, src/v2).
      #   (7) gunbc: layering-imports GATE (tools.layering_imports_gate) — host scan +
      #       clean_tree + scanner-execution perturb receipts; replaces deleted
      #       layering_imports_scan + scripts/v4-layering-imports-gate.sh (DESIGN §7).
      #   (8) gunbc: filesystem entry-kind witness (test.claim.filesystem_entry_kind_witness) —
      #       by-execution proof that the cited posix/ntfs reductions map to the agnostic
      #       std.filesystem.types.EntryKind (socket/junction → Other, not nicknamed Symlink).
      #   (9) gunbc: std.measure Power/Watt consuming-fold witness (computes a wattage total).
      # The git fetch makes `origin/main...HEAD` resolvable.
      - name: CI floor (.dag witness corpus + gates via gunbc)
        run: |
          git fetch --no-tags origin main 2>/dev/null || true
          cargo run -p v1-compiler --release --bin claim_batch -- --source-root src/v2 --roster-from-discovery --notice-title "v2 claim corpus"
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/test/claim/rust_stage0_gates_witness.dag --function rust_stage0_gates_witnesses --claim-run
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/tools/rust_gates_ci.dag --function main
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/test/claim/emit_host_gate_witness.dag --function emit_host_gate_witnesses --claim-run
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/tools/emit_host_gate.dag --function main
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root src/v2 --entry src/v2/test/claim/layering_imports/coverage_domain_equivalence.dag --function coverage_domain_equivalence_argument_holds --claim-run
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/tools/layering_imports_gate.dag --function main
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/test/claim/filesystem_entry_kind_witness.dag --function filesystem_entry_kind_witnesses --claim-run
          cargo run -p v1-compiler --release --bin gunbc -- run --source-root dsl --entry dsl/test/claim/power_watt_witness.dag --function power_watt_witnesses --claim-run
