name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"
          components: rustfmt

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v2/stage0/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Build Compiler
        run: cargo build -p v2-compiler --release

      - name: CI Pipeline
        run: cargo run -p v2-compiler --release -- run --source-root dsl --function run_ci_pipeline

      - name: CI Timing
        if: always()
        run: cat /tmp/v2-ci-timing.txt 2>/dev/null || echo "no timing data"

  v3:
    runs-on: ubuntu-latest
    # Full suite is capped at 750s, plus clippy + lens gates + cold compile — 15m
    # can cancel the job before the final steps finish.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo (v3)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-v3-${{ runner.os }}-

      # Layer 1 (coarse CI): wall-clock gates on `cargo test -p v3-compiler`.
      #
      # Full-suite budget is 1050s. The last green GitHub run was 719s, but the
      # current mainline suite is ~951–953s on ubuntu-24.04 after #548. Keep the
      # cap above the live runner baseline while leaving ~100s headroom for normal
      # variance and the post-test clippy / lens / ratchet steps in this job.
      # Regressions show up when integration tests redo full `compile_to_dag` per
      # `#[test]` (see `lane2_stage_2e_parallelism_test`: shared `OnceLock` + clone).
      #
      # 120s gate: applies to the lane2 Stage 2d symbolic-cost tests only
      # — that is the ζ (#537) regression surface (many `#[test]` each
      # doing full compile). All integration tests live in a single
      # `integration` binary post-#546 consolidation; the narrow gate
      # filters to the lane2d module via `--test-name-filter` so the
      # narrow ratchet still measures just the symbolic-cost subsuite.
      # A warm full `cargo test -p v3-compiler` is ~400s locally
      # (testgen / rustc roundtrips), so a 120s cap on the *entire*
      # suite would fail every run until suite-wide setup is shared;
      # tighten the second gate when that baseline drops.
      - name: v3 tests with 120s budget (lane2 Stage 2d only)
        run: |
          start=$(date +%s)
          cargo test -p v3-compiler --test integration lane2_stage_2d_symbolic_cost_test::
          elapsed=$(( $(date +%s) - start ))
          echo "v3 lane2d wall time: ${elapsed}s"
          if [ "$elapsed" -gt 120 ]; then
            echo "::error::v3 lane2d tests took ${elapsed}s (budget: 120s) — share bootstrap setup via OnceLock or collapse fine-grained tests"
            exit 1
          fi

