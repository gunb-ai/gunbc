  # (~510s, the v2 emitter's own runtime) is independent of the stage0 self-compile, so serializing
  # them only added wall-clock. This job needs only the `gunbc` binary (restored from the shared
  # gunbc-bin cache, or cold-built on miss); it does NOT run stage0/parity. Required on every
  # PR -- branch protection references `ci_floor_emit` by name (unchanged).
  # Authority/plan: gunb-ai/ctrl#1458 (Phase 3).
  ci_floor_emit:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
