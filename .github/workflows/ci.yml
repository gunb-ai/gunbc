      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          cache: false
          rustflags: ""
      - run: bash scripts/ci-binary-shim.sh self-host-ratchet
