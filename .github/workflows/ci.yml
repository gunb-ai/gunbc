name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 240
    steps:
      - name: Isolate toolchain dirs
        run: |
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: gunbc ci (.dag witnesses + gates)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          cargo build -p v1-compiler --release --features text_lookup_work_counter --bins
          git fetch --no-tags origin main 2>/dev/null || true
          "$ROOT/target/release/claim_batch" --source-root src/v2 --source-root dsl --roster-from-discovery --entry dsl/test/claim/rust_stage0_gates_witness.dag --function rust_stage0_gates_witnesses --entry dsl/test/claim/emit_host_gate_witness.dag --function emit_host_gate_witnesses --entry src/v2/test/claim/layering_imports/coverage_domain_equivalence.dag --function coverage_domain_equivalence_argument_holds --entry dsl/test/claim/filesystem_entry_kind_witness.dag --function filesystem_entry_kind_witnesses --entry dsl/test/claim/power_watt_witness.dag --function power_watt_witnesses --entry dsl/test/claim/dsl_compile_clean_witness.dag --function dsl_compile_clean_witnesses --entry dsl/test/claim/ci_spec_witness.dag --function ci_spec_witnesses --entry dsl/test/claim/ci_yaml_serializer_witness.dag --function ci_yaml_serializer_keystone_holds --entry dsl/test/claim/pareto_dominance_witness.dag --function pareto_dominance_holds --entry dsl/test/claim/hardware_selection_witness.dag --function hardware_selection_holds --notice-title "v2 claim corpus"
          "$ROOT/target/release/gunbc" run --source-root src/v2 --source-root dsl --entry dsl/tools/ci_gates.dag --function main
