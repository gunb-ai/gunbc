name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  ci:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=6" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Build release bins (claim_executor + gunbc)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              RETRY_LOG=$(mktemp)
              if ! ( CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc ) 2>&1 | tee "$RETRY_LOG"; then
                if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$RETRY_LOG"; then
                  echo "::warning::cargo/sccache still failing; retry without RUSTC_WRAPPER"
                  env -u RUSTC_WRAPPER CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc || exit 1
                else
                  exit 1
                fi
              fi
              rm -f "$RETRY_LOG"
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc"
          sccache --show-stats 2>/dev/null || true
        timeout-minutes: 45
      - name: gunbc ci (.dag witnesses + gates)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          git fetch --no-tags origin main 2>/dev/null || true
          _ci_changed=$(git diff --name-only origin/main...HEAD 2>/dev/null || true)
          if [ -n "$_ci_changed" ]; then
          # Interim compile-clean scoping: merge-base diffs whose only changed paths are under docs/ skip the compose floor. Path-prefix matching is an interim heuristic — dissolve-on: affected-set-scoped compile-clean (Ruling 1 path grain) replaces it. Empty _ci_changed (git fetch/diff failure) short-circuits this block and falls through to the full floor (fail-closed, not widening). Merge-admission stamps Skipped (not Success) via CI_FLOOR_DISPOSITION=documentation_only_skipped so floor-not-run ≠ floor-green. Generated-artifact carriers (.gitignore, README.md/CLAUDE.md/DESIGN.md symlinks) are excluded from the allowlist — their only drift guard is floor-resident; whitelisting them would self-shortcut that gate (#6236 class). CI substrate (.github/workflows/ci.yml, dag/gunbc/ci_spec.dag, ci_spec witnesses) is likewise excluded.
          # 🟡 dissolve-on: ci_documentation_only_floor_shortcut_script — concat-built bash path-prefix predicate + heredoc over git diff --name-only (interim path heuristic until affected-set-scoped compile-clean); DISSOLVES WHEN bash-emit (#5828 / ROADMAP 6-shell-slice0) realizes floor scoping through orchestration emit and this shortcut retires
            DOCS_ONLY=1
            while IFS= read -r _ci_path; do
              [ -z "$_ci_path" ] && continue
              if [[ "$_ci_path" == docs/* ]]; then
                :
              else
                DOCS_ONLY=0
                break
              fi
            done <<_ci_diff_eof_
          $_ci_changed
          _ci_diff_eof_
            if [ "$DOCS_ONLY" = "1" ]; then
              echo "claim_executor: documentation-only diff — floor skipped (CI_FLOOR_DISPOSITION=documentation_only_skipped)"
              CI_FLOOR_DISPOSITION=documentation_only_skipped "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/tools/merge_admission_stamp.dag --function main
              exit $?
            fi
          fi
          set +e
          "$ROOT/target/release/claim_executor" --source-root dag --source-root src/v2 --plan-entry src/v2/workflow/ci_floor_plan.dag --plan-function gunbc_ci_floor_batches --notice-title "v2 claim corpus"
          FLOOR_EXIT=$?
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          CI_FLOOR_EXIT=$FLOOR_EXIT "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/tools/merge_admission_stamp.dag --function main
          STAMP_EXIT=$?
          if [ "$FLOOR_EXIT" -ne 0 ]; then exit "$FLOOR_EXIT"; fi
          exit "$STAMP_EXIT"
        timeout-minutes: 10
      - name: Merge-admission gate (receipt required; freshness block held until GatingEnforced)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          git fetch --no-tags origin main
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/tools/merge_admission_gate.dag --function main
        timeout-minutes: 5
  rust_tests:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 106
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=6" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Install cargo-nextest
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          if ! "$CARGO_HOME/bin/cargo-nextest" nextest --version >/dev/null 2>&1; then
            mkdir -p "$CARGO_HOME/bin"
            case "$(uname -m)" in aarch64|arm64) A=linux-arm ;; *) A=linux ;; esac
            curl -LsSf --retry 3 "https://get.nexte.st/0.9.138/$A" | tar zxf - -C "$CARGO_HOME/bin"
          fi
        timeout-minutes: 5
      - name: sccache warm (release bins + cache prime)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              RETRY_LOG=$(mktemp)
              if ! ( CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc ) 2>&1 | tee "$RETRY_LOG"; then
                if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$RETRY_LOG"; then
                  echo "::warning::cargo/sccache still failing; retry without RUSTC_WRAPPER"
                  env -u RUSTC_WRAPPER CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc || exit 1
                else
                  exit 1
                fi
              fi
              rm -f "$RETRY_LOG"
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc"
          sccache --show-stats 2>/dev/null || true
        timeout-minutes: 46
      - name: v1 rust gate (fmt + clippy + nextest)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          git fetch --no-tags origin main 2>/dev/null || true
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/tools/rust_gates_ci.dag --function main) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              RETRY_LOG=$(mktemp)
              if ! ( CARGO_BUILD_JOBS=1 "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/tools/rust_gates_ci.dag --function main ) 2>&1 | tee "$RETRY_LOG"; then
                if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$RETRY_LOG"; then
                  echo "::warning::cargo/sccache still failing; retry without RUSTC_WRAPPER"
                  env -u RUSTC_WRAPPER CARGO_BUILD_JOBS=1 "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/tools/rust_gates_ci.dag --function main || exit 1
                else
                  exit 1
                fi
              fi
              rm -f "$RETRY_LOG"
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
        timeout-minutes: 45
      - name: rust_tests cgroup peak (placement divisor)
        run: |
          BIN="$(git rev-parse --show-toplevel 2>/dev/null || pwd)/target/release/claim_executor"
          if [ -x "$BIN" ]; then "$BIN" --measure-cgroup-peak; else echo "[measurement] cgroup peak: unavailable (claim_executor not built)"; fi
        if: always()
        timeout-minutes: 5
  deploy_dashboard_srv1:
    runs-on: [self-hosted, linux, arm64, srv1]
    needs: [ci]
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Isolate toolchain dirs
        run: |
          rm -rf "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo"
          echo "HOME=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=6" >> "$GITHUB_ENV"
          if sccache --show-stats >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          fi
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
        with:
          components: rustfmt
          cache: false
          rustflags: ''
        env:
          HOME: ${{ runner.temp }}
      - name: Pin rustup default (isolated RUSTUP_HOME has no default toolchain)
        run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/cargo/registry/index/
            ${{ runner.temp }}/cargo/registry/cache/
            ${{ runner.temp }}/cargo/git/db/
            target/
          key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-${{ runner.arch }}-
      - name: Deploy dashboard to srv1 (live_deploy_apply_srv1_wet)
        run: |
          ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
          set -o pipefail
          BUILD_LOG=$(mktemp)
          if ! ("$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc) 2>&1 | tee "$BUILD_LOG"; then
            if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$BUILD_LOG"; then
              echo "::warning::cargo/sccache EAGAIN under fleet pressure; cold retry CARGO_BUILD_JOBS=1 (keep sccache)"
              RETRY_LOG=$(mktemp)
              if ! ( CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc ) 2>&1 | tee "$RETRY_LOG"; then
                if grep -qiE 'Resource temporarily unavailable|failed to spawn|sccache: encountered fatal error|(exit status: 254)|sccache: error: failed to execute compile' "$RETRY_LOG"; then
                  echo "::warning::cargo/sccache still failing; retry without RUSTC_WRAPPER"
                  env -u RUSTC_WRAPPER CARGO_BUILD_JOBS=1 "$CARGO_HOME/bin/cargo" build -p v1-compiler --release --features text_lookup_work_counter --bin claim_executor --bin gunbc || exit 1
                else
                  exit 1
                fi
              fi
              rm -f "$RETRY_LOG"
            else
              exit 1
            fi
          fi
          rm -f "$BUILD_LOG"
          "$ROOT/target/release/claim_executor" --verify-build-artifacts "$ROOT/target/release/claim_executor" "$ROOT/target/release/gunbc"
          sccache --show-stats 2>/dev/null || true
          "$ROOT/target/release/gunbc" run --source-root dag --source-root src/v2 --entry dag/gunbc/live_deploy/apply.dag --function live_deploy_apply_srv1_wet
