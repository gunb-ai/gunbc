    # Shared srv1/srv2 runners persist $RUNNER_WORKSPACE/gunbc between jobs; shallow fetch +
    # branch churn can leave refs/remotes/origin/* pointing at missing objects and make checkout
    # fail (observed ci_floor srv2-23, run 27514705589: bad object refs/remotes/origin/session/*).
