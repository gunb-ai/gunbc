name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.0"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v2/stage0/src/**') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Lint
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test -p v2-compiler-tests

      - name: Full DSL Compiles
        run: cargo test -p v2-compiler-tests full_dsl_compiles -- --ignored --nocapture

      - name: Diagnostic Ratchet
        run: cargo test -p v2-compiler-tests strict_compile_diagnostic_count -- --ignored --nocapture

      - name: L1 Type Knowledge Ratchet
        run: scripts/l1-ratchet.sh --check

      - name: Stage0 Freshness (informational)
        run: scripts/check-stage0-freshness.sh || echo "::warning::Stage0 is stale — Bootstrap D not yet complete"
        continue-on-error: true
