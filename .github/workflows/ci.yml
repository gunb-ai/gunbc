name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
# Wave 1 §11.7.1 safety floor — honesty ledger: docs/planning/ci-required-surface-cut-2026-06-01.md
# Required on every non-draft PR: fmt, bootstrap viability, M1 rust emit, ci.dag structural receipt, no-new-shell.
jobs:
  fmt:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # Shared host sccache server (ctrl-sccache.service on srv1/srv2).
        # These jobs build directly on the self-hosted host, so rustc and
        # every build path are real host paths the server can exec/read.
        # Gate on the live socket so a host where the server isn't up (or a
        # future non-self-hosted runner) cold-builds instead of failing; a
        # missing socket degrades observably (warning), never silently.
        # CARGO_INCREMENTAL=0 because sccache cannot cache incremental
        # compilation — without it most rustc calls are non-cacheable.
        if [ -S /var/lib/ctrl/sccache/server.sock ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_UDS=/var/lib/ctrl/sccache/server.sock" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "::notice::shared sccache enabled (UDS present)"
        else
          echo "::warning::shared sccache socket absent — cold build (RUSTC_WRAPPER unset)"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: cargo fmt --all --check
      run: cargo fmt --all --check
  # Affected-set host transport — Wave 3 shadow only (Class C). continue-on-error: not a §11.7.1 gate.
  affected:
    if: github.event.pull_request.draft != true
    continue-on-error: true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    outputs:
      v2: ${{ steps.detect.outputs.v2 }}
      v3: ${{ steps.detect.outputs.v3 }}
      v4: ${{ steps.detect.outputs.v4 }}
      testclaim_corpus: ${{ steps.detect.outputs.testclaim_corpus }}
      workflow_policy: ${{ steps.detect.outputs.workflow_policy }}
      release_distribution: ${{ steps.detect.outputs.release_distribution }}
      release_distribution_only: ${{ steps.detect.outputs.release_distribution_only }}
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # Shared host sccache server (ctrl-sccache.service on srv1/srv2).
        # These jobs build directly on the self-hosted host, so rustc and
        # every build path are real host paths the server can exec/read.
        # Gate on the live socket so a host where the server isn't up (or a
        # future non-self-hosted runner) cold-builds instead of failing; a
        # missing socket degrades observably (warning), never silently.
        # CARGO_INCREMENTAL=0 because sccache cannot cache incremental
        # compilation — without it most rustc calls are non-cacheable.
        if [ -S /var/lib/ctrl/sccache/server.sock ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_UDS=/var/lib/ctrl/sccache/server.sock" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "::notice::shared sccache enabled (UDS present)"
        else
          echo "::warning::shared sccache socket absent — cold build (RUSTC_WRAPPER unset)"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Fetch main for diff base
      if: github.event_name == 'pull_request'
      run: git fetch origin main:refs/remotes/origin/main
    - name: Detect affected components
      id: detect
      run: cargo run -p ci_affected_components --bin detect-ci-affected-components -- "${{ github.event_name }}" "$GITHUB_OUTPUT"
  # §11.7.1 Class A safety floor — single job, one v2 build, two compiles (M1 rust + bootstrap dag).
  ci_floor:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
        # Shared host sccache server (ctrl-sccache.service on srv1/srv2).
        # These jobs build directly on the self-hosted host, so rustc and
        # every build path are real host paths the server can exec/read.
        # Gate on the live socket so a host where the server isn't up (or a
        # future non-self-hosted runner) cold-builds instead of failing; a
        # missing socket degrades observably (warning), never silently.
        # CARGO_INCREMENTAL=0 because sccache cannot cache incremental
        # compilation — without it most rustc calls are non-cacheable.
        if [ -S /var/lib/ctrl/sccache/server.sock ]; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_UDS=/var/lib/ctrl/sccache/server.sock" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "::notice::shared sccache enabled (UDS present)"
        else
          echo "::warning::shared sccache socket absent — cold build (RUSTC_WRAPPER unset)"
        fi
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Cache Cargo (ci floor)
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('src/v3/compiler/src/**', 'src/v3/compiler/tests/**') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}-
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache gunbc binary (v4 floor)
      id: v4-v2-bin
      uses: actions/cache@v4
      with:
        path: target/release/gunbc
        key: gunbc-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
    - name: Build v2 compiler (v4 floor)
      if: steps.v4-v2-bin.outputs.cache-hit != 'true'
      run: cargo build -p v2-compiler --release
    - name: M1 v4 full-tree rust emit probe (v2 emit + cargo check)
      timeout-minutes: 20
      env:
        V4_M1_RUST_EMIT_OUT: ${{ runner.temp }}/v4-rust-emit
        V4_M1_CARGO_CHECK_JOBS: "4"
        V4_M1_RUST_EMIT_PROBE_STRICT: "1"
      run: bash scripts/v4-m1-rust-emit-probe.sh
    - name: v2 → v4 bootstrap compile (fail-closed full)
      timeout-minutes: 35
      env:
        V4_BOOTSTRAP_OUT: ${{ runner.temp }}/v4-bootstrap
        V4_BOOTSTRAP_LOG: ${{ runner.temp }}/v4-bootstrap.log
        V4_BOOTSTRAP_TIMEOUT_SECS: '480'
      run: bash scripts/v4-bootstrap-viability.sh
    - name: M1 v4 workflow CI model/YAML binding smoke
      run: |
        set -euo pipefail
        cargo test -p v3-compiler --test integration v4_workflow_ci_runner_dag_smoke_test::v4_workflow_ci_m1_rust_emit_probe_modeled_and_bound_to_ci_yml -- --exact --quiet
        cargo test -p v3-compiler --test integration v4_workflow_ci_runner_dag_smoke_test::v4_workflow_ci_bankruptcy_tier0_ -- --quiet
        cargo test -p v3-compiler --test integration v4_workflow_ci_runner_dag_smoke_test::v4_workflow_ci_wave1_ -- --quiet
    - name: no-new-shell ratchet (required CI path)
      run: |
        bash scripts/check-ci-no-new-shell.sh --self-test
        bash scripts/check-ci-no-new-shell.sh
  ci:
    if: ${{ always() && github.event.pull_request.draft != true }}
    needs: [ci_floor]
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 5
    steps:
    - name: Validate prerequisites (fail-closed under skipped/failed deps)
      run: |
        set -euo pipefail
        if [[ "${{ needs.ci_floor.result }}" != "success" ]]; then
          echo "::error::ci_floor job did not succeed (result=${{ needs.ci_floor.result }}); ci aggregator fails closed."
          exit 1
        fi
        echo "ci aggregator: Wave 1 safety floor satisfied (five Class-A gates in ci_floor; affected is shadow-only)"
    - name: ci receipt (§11.7.1 floor)
      run: |
        echo "::notice::Required CI: fmt + ci_floor (M1, bootstrap, ci.dag structural receipt, no-new-shell). See docs/planning/ci-required-surface-cut-2026-06-01.md"
