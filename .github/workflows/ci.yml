name: ci
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
# Wave 1 §11.7.1 safety floor — fmt + ci_floor (M1, bootstrap, ci.dag binding, no-new-shell)
# Required on every non-draft PR: fmt, bootstrap viability, M1 rust emit, ci.dag structural receipt, no-new-shell.
jobs:
  fmt:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: cargo fmt --all --check
      run: cargo fmt --all --check
  # Affected-set host transport — Wave 3 shadow only (Class C). continue-on-error: not a §11.7.1 gate.
  affected:
    if: github.event.pull_request.draft != true
    continue-on-error: true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 15
    outputs:
      v2: ${{ steps.detect.outputs.v2 }}
      v3: ${{ steps.detect.outputs.v3 }}
      v4: ${{ steps.detect.outputs.v4 }}
      testclaim_corpus: ${{ steps.detect.outputs.testclaim_corpus }}
      workflow_policy: ${{ steps.detect.outputs.workflow_policy }}
      release_distribution: ${{ steps.detect.outputs.release_distribution }}
      release_distribution_only: ${{ steps.detect.outputs.release_distribution_only }}
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    - name: Fetch main for diff base
      if: github.event_name == 'pull_request'
      run: git fetch origin main:refs/remotes/origin/main
    - name: Detect affected components
      id: detect
      run: cargo run -p ci_affected_components --bin detect-ci-affected-components -- "${{ github.event_name }}" "$GITHUB_OUTPUT"
  # §11.7.1 Class A safety floor — single job, one v2 build, two compiles (M1 rust + bootstrap dag).
  ci_floor:
    if: github.event.pull_request.draft != true
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    steps:
    - name: Isolate toolchain dirs (srv1/srv2 shared-$HOME concurrent-rustup race)
      run: |
        echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
    - name: Clear inherited GitHub auth header (shared runner HOME)
      run: git config --global --unset-all http.https://github.com/.extraheader || true
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1.16.0
      with:
        components: rustfmt
        cache: false
        rustflags: ''
    - name: Pin global rustup default (isolated RUSTUP_HOME has no default toolchain)
      run: rustup default "$(rustup show active-toolchain | awk '{print $1; exit}')"
    # INTERIM transport repair (operator 2026-06-01, "stop the bleeding"). Authority for the
    # right-way fix: src/v4/workflow/ci.dag cache-projection note + dsl/std/cache_interface.dag.
    # The old key mixed in hashFiles('src/v3/compiler/src/**', …), which changes on nearly every
    # commit — so the primary slot was NEVER reused: each run minted a brand-new ~200 MiB cache,
    # flooding the repo's 10 GB budget and LRU-evicting the warm caches (including the v2
    # `gunbc-bin` build) before the next run could restore them. Cargo's own fingerprinting
    # already invalidates stale crates on top of a restored target/, so the v3-src component
    # bought churn, not correctness. De-churned to Cargo.lock + toolchain → one cache per
    # dependency set, restored via the broad restore-key, eviction pressure cut ~100×.
    # Does NOT speed up the M1 emit-probe / bootstrap steps — those need content-addressed
    # sccache via the modeled cache_interface projection (see ci.dag note). dissolve-on-arrival.
    - name: Cache Cargo (ci floor)
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/cargo/registry/index/
          ${{ runner.temp }}/cargo/registry/cache/
          ${{ runner.temp }}/cargo/git/db/
          target/
        key: cargo-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-ci-${{ runner.os }}-${{ runner.arch }}-
    - name: Cache gunbc binary (v4 floor)
      id: v4-v2-bin
      uses: actions/cache@v4
      with:
        path: target/release/gunbc
        key: gunbc-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/v2/stage0/src/**', 'src/v2/stage0/Cargo.toml', 'Cargo.toml', '**/Cargo.lock', 'rust-toolchain.toml') }}
    - name: Build v2 compiler (v4 floor)
      if: steps.v4-v2-bin.outputs.cache-hit != 'true'
      run: cargo build -p v2-compiler --release
    - name: M1 v4 full-tree rust emit probe (v2 emit + cargo check)
      timeout-minutes: 20
      env:
        V4_M1_RUST_EMIT_OUT: ${{ runner.temp }}/v4-rust-emit
        # Static fallback (ctrl-build absent) + governor ceiling (CTRL_BUILD_DYNAMIC_JOBS_MAX).
        # Projected from v4.workflow.ci m1_probe_cargo_check_jobs / _ceiling. Actual parallelism is
        # memory-denominated via the host compute governor — see src/v4/workflow/ci.dag note.
        V4_M1_DAG_EMIT_OUT: ${{ runner.temp }}/v4-bootstrap
        V4_M1_DAG_EMIT_LOG: ${{ runner.temp }}/v4-bootstrap.shared.log
        V4_M1_CARGO_CHECK_JOBS: "4"
        V4_M1_CARGO_CHECK_JOBS_CEILING: "64"
        V4_M1_RUST_EMIT_PROBE_STRICT: "0"
      run: bash scripts/v4-m1-rust-emit-probe.sh
