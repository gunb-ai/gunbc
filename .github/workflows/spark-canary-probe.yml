# srv5 CANARY — STEP 1 of the live sequence, and READ-ONLY.
#
# It answers the one question that gates every later step and that no amount of modeling can
# settle: can the fleet controller authenticate to srv5 as a managed principal, and as WHICH one?
# #8083 reports "srv5 no verified managed principal"; that is a claim about our records, not an
# observation of the host. This observes the host.
#
# WHY A SELF-HOSTED RUNNER: the Sparks have no Actions runner, so nothing can bootstrap them from
# the inside. Authenticated remote application from a fleet controller on the same LAN is the only
# mechanism. srv1/srv2 are that controller.
#
# WHY THIS IS NOT AN APPLY: every command below is an observation. It installs nothing, writes no
# authorized_keys, and changes no state on srv5. `ssh -o BatchMode=yes` cannot prompt, so a missing
# credential fails rather than hanging or falling back to an interactive path.
name: spark-canary-probe

# TEMPORARY branch-scoped push trigger: workflow_dispatch requires the workflow to exist on the
# default branch, and this one does not yet. Scoped to this branch only, it is not a required
# check and gates no pull request, so it cannot red a merge.
# DISSOLVE-ON: deleted once the canary sequence has produced its receipt.
on:
  workflow_dispatch:
  push:
    branches:
      - session/spark-serve-0

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: Observe srv5 managed-principal reach (read-only)
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC/WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Observe srv5 reach and principal
        env:
          TOK: ${{ steps.auth.outputs.access_token }}
        run: |
          set -uo pipefail
          umask 077
          WORK="${RUNNER_TEMP}/canary"; mkdir -p "$WORK"

          # Token to a 0600 curl config -- never argv, per the exposure already recorded in this repo.
          cat > "$WORK/curlrc" <<EOF
          header = "Authorization: Bearer ${TOK}"
          EOF

          echo "=== 1. network reach to srv5:22 ==="
          timeout 5 bash -c 'cat < /dev/null > /dev/tcp/192.168.1.222/22' \
            && echo "srv5:22 OPEN" || echo "srv5:22 UNREACHABLE"

          echo "=== 2. fetch the fleet key (versions.access is the ONE permission measured as held) ==="
          CODE=$(curl -s --config "$WORK/curlrc" -o "$WORK/v.json" -w '%{http_code}' \
            "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/fleet-automation-ssh-key/versions/latest:access")
          echo "AccessVersion http=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "REFUSED: cannot fetch fleet key; canary blocked at credential materialization"
            head -c 300 "$WORK/v.json"; echo; exit 0
          fi

          python3 -c "import json,base64,sys;d=json.load(open('$WORK/v.json'));sys.stdout.write(base64.b64decode(d['payload']['data']).decode())" > "$WORK/id" 2>/dev/null || {
            echo "REFUSED: payload did not decode as a key"; exit 0; }
          chmod 600 "$WORK/id"
          echo "key bytes: $(wc -c < "$WORK/id")  (content never printed)"

          echo "=== 3. WHICH principal is admitted? read-only, srv5 AND srv6 ==="
          for HOSTPAIR in "srv5 192.168.1.222" "srv6 192.168.1.223"; do
          set -- $HOSTPAIR; HOST=$1; ADDR=$2
          echo "--- $HOST ($ADDR) ---"
          # A FAILED LOGIN IS DATA, NOT A FATAL. GitHub Actions runs `run:` under `bash -e`, so the
          # first ssh returning non-zero aborted the whole step before any principal line printed --
          # the probe's own harness converted its primary observation into a crash. Each attempt now
          # captures its exit code and continues; the step's success does not depend on any login
          # succeeding, because the question is WHICH principal is admitted, not whether one is.
          for U in briansrls root dgxuser gunbc-fleet ghrunner ubuntu nvidia; do
            if OUT=$(timeout 10 ssh -i "$WORK/id" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 -o UserKnownHostsFile="$WORK/kh" \
              "$U@$ADDR" 'echo PRINCIPAL=$(id -un) UID=$(id -u)' 2>&1 | tr '\n' ' '); then
              RC=0
            else
              RC=$?
            fi
            # `OUT=$(...) || true; RC=$?` captured the exit status of `true`, so EVERY row reported
            # rc=0 including the three that were plainly refused -- the harness fabricated the exact
            # field a reader would use to decide success. The if/else captures the real status.
            #
            # The remote command now prints an explicit PRINCIPAL= marker: the previous `id -un`
            # output was indistinguishable from an empty capture, so "no denial and no output" could
            # not be told apart from a successful login whose text was lost. A login is only
            # admitted below when that marker is present.
            if echo "$OUT" | grep -q "PRINCIPAL="; then
              VERDICT="ADMITTED"
            elif echo "$OUT" | grep -q "Permission denied"; then
              VERDICT="REFUSED-publickey"
            else
              VERDICT="UNRESOLVED-no-marker-no-denial"
            fi
            echo "  $U -> rc=$RC verdict=$VERDICT out=$OUT"
          done
          done
          echo "principal probe complete (no login required for this step to succeed)"

          echo "=== READING THIS RECEIPT ==="
          echo "A returned 'id -un' is a REAL remote-process observation of the admitted principal."
          echo "A failure is NOT proof the account is absent: it distinguishes neither missing"
          echo "authorized_keys, nor absent account, nor sshd policy. Those are different remedies."

      - name: Shred credential material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/canary" || true
