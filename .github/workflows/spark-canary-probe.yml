# srv5 CANARY — STEP 1 of the live sequence, and READ-ONLY.
#
# It answers the one question that gates every later step and that no amount of modeling can
# settle: can the fleet controller authenticate to srv5 as a managed principal, and as WHICH one?
# #8083 reports "srv5 no verified managed principal"; that is a claim about our records, not an
# observation of the host. This observes the host.
#
# WHY A SELF-HOSTED RUNNER: the Sparks have no Actions runner, so nothing can bootstrap them from
# the inside. Authenticated remote application from a fleet controller on the same LAN is the only
# mechanism. srv1/srv2 are that controller.
#
# WHY THIS IS NOT AN APPLY: every command below is an observation. It installs nothing, writes no
# authorized_keys, and changes no state on srv5. `ssh -o BatchMode=yes` cannot prompt, so a missing
# credential fails rather than hanging or falling back to an interactive path.
name: spark-canary-probe

# TEMPORARY branch-scoped push trigger: workflow_dispatch requires the workflow to exist on the
# default branch, and this one does not yet. Scoped to this branch only, it is not a required
# check and gates no pull request, so it cannot red a merge.
# DISSOLVE-ON: deleted once the canary sequence has produced its receipt.
on:
  workflow_dispatch:
  push:
    branches:
      - session/spark-serve-0

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: Observe srv5 managed-principal reach (read-only)
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC/WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/582015116396/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: fleet-cloud-convergence@gunbai-secrets.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Observe srv5 reach and principal
        env:
          TOK: ${{ steps.auth.outputs.access_token }}
        run: |
          set -uo pipefail
          umask 077
          WORK="${RUNNER_TEMP}/canary"; mkdir -p "$WORK"

          # Token to a 0600 curl config -- never argv, per the exposure already recorded in this repo.
          cat > "$WORK/curlrc" <<EOF
          header = "Authorization: Bearer ${TOK}"
          EOF

          echo "=== 1. network reach to srv5:22 ==="
          timeout 5 bash -c 'cat < /dev/null > /dev/tcp/192.168.1.222/22' \
            && echo "srv5:22 OPEN" || echo "srv5:22 UNREACHABLE"

          echo "=== 2. fetch the fleet key (versions.access is the ONE permission measured as held) ==="
          CODE=$(curl -s --config "$WORK/curlrc" -o "$WORK/v.json" -w '%{http_code}' \
            "https://secretmanager.googleapis.com/v1/projects/gunbai-secrets/secrets/fleet-automation-ssh-key/versions/latest:access")
          echo "AccessVersion http=$CODE"
          if [ "$CODE" != "200" ]; then
            echo "REFUSED: cannot fetch fleet key; canary blocked at credential materialization"
            head -c 300 "$WORK/v.json"; echo; exit 0
          fi

          python3 -c "import json,base64,sys;d=json.load(open('$WORK/v.json'));sys.stdout.write(base64.b64decode(d['payload']['data']).decode())" > "$WORK/id" 2>/dev/null || {
            echo "REFUSED: payload did not decode as a key"; exit 0; }
          chmod 600 "$WORK/id"
          echo "key bytes: $(wc -c < "$WORK/id")  (content never printed)"

          echo "=== 3. WHICH principal is admitted? read-only, srv5 AND srv6 ==="
          for HOSTPAIR in "srv5 192.168.1.222" "srv6 192.168.1.223"; do
          set -- $HOSTPAIR; HOST=$1; ADDR=$2
          echo "--- $HOST ($ADDR) ---"
          # A FAILED LOGIN IS DATA, NOT A FATAL. GitHub Actions runs `run:` under `bash -e`, so the
          # first ssh returning non-zero aborted the whole step before any principal line printed --
          # the probe's own harness converted its primary observation into a crash. Each attempt now
          # captures its exit code and continues; the step's success does not depend on any login
          # succeeding, because the question is WHICH principal is admitted, not whether one is.
          for U in briansrls root dgxuser gunbc-fleet ghrunner ubuntu nvidia; do
            if OUT=$(timeout 10 ssh -i "$WORK/id" -o BatchMode=yes -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 -o UserKnownHostsFile="$WORK/kh" \
              "$U@$ADDR" 'echo PRINCIPAL=$(id -un) UID=$(id -u)' 2>&1 | tr '\n' ' '); then
              RC=0
            else
              RC=$?
            fi
            # `OUT=$(...) || true; RC=$?` captured the exit status of `true`, so EVERY row reported
            # rc=0 including the three that were plainly refused -- the harness fabricated the exact
            # field a reader would use to decide success. The if/else captures the real status.
            #
            # The remote command now prints an explicit PRINCIPAL= marker: the previous `id -un`
            # output was indistinguishable from an empty capture, so "no denial and no output" could
            # not be told apart from a successful login whose text was lost. A login is only
            # admitted below when that marker is present.
            if echo "$OUT" | grep -q "PRINCIPAL="; then
              VERDICT="ADMITTED"
            elif echo "$OUT" | grep -q "Permission denied"; then
              VERDICT="REFUSED-publickey"
            else
              VERDICT="UNRESOLVED-no-marker-no-denial"
            fi
            echo "  $U -> rc=$RC verdict=$VERDICT out=$OUT"
          done
          done
          echo "principal probe complete (no login required for this step to succeed)"

          echo "=== 4. srv5 serving-relevant facts (READ-ONLY, as the admitted principal) ==="
          # STEP 2 of the canary needs a pinned serving process. What can be pinned is a fact about
          # the host, not a modeling choice: accelerator presence, driver/runtime versions, container
          # runtime, free space for weights, and whether anything already listens. Observed BEFORE any
          # install so the install is derived from measured state rather than assumed state.
          #
          # Each probe prints its own absence marker. A command that is missing prints ABSENT rather
          # than an empty line, because an empty capture is indistinguishable from a failed one --
          # the exact conflation that made the first principal probe report a false negative.
          if OUT=$(timeout 60 ssh -i "$WORK/id" -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=5 -o UserKnownHostsFile="$WORK/kh" \
            "briansrls@192.168.1.222" 'bash -s' <<'REMOTE' 2>&1); then RC=0; else RC=$?; fi
          echo "FACT uname=$(uname -srm 2>/dev/null || echo ABSENT)"
          echo "FACT os=$(. /etc/os-release 2>/dev/null && echo "$PRETTY_NAME" || echo ABSENT)"
          echo "FACT nvidia_smi=$(command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader 2>&1 | tr '\n' ';' || echo ABSENT)"
          echo "FACT docker=$(command -v docker >/dev/null 2>&1 && (docker version --format '{{.Server.Version}}' 2>&1 || echo PRESENT-BUT-NO-DAEMON) || echo ABSENT)"
          echo "FACT python=$(command -v python3 >/dev/null 2>&1 && python3 -V 2>&1 || echo ABSENT)"
          echo "FACT systemd_user=$(command -v systemctl >/dev/null 2>&1 && echo PRESENT || echo ABSENT)"
          echo "FACT sudo_nopasswd=$(sudo -n true 2>/dev/null && echo YES || echo NO)"
          echo "FACT disk_root=$(df -BG --output=avail / 2>/dev/null | tail -1 | tr -d ' ' || echo ABSENT)"
          echo "FACT mem_total=$(awk '/MemTotal/{print $2$3}' /proc/meminfo 2>/dev/null || echo ABSENT)"
          echo "FACT listeners=$( (ss -ltnp 2>/dev/null || netstat -ltn 2>/dev/null) | awk 'NR>1{print $4}' | tr '\n' ',' || echo ABSENT)"
          # `pgrep -af ... | head` left the || arm unreachable (head succeeds regardless), so a
          # no-match and a failed probe printed the SAME empty string -- in the two fields a serving
          # canary most relies on to claim the host was not already serving. pgrep's own exit code
          # separates them exactly: 1 is "ran, matched nothing", >1 is "did not run".
          if SERV=$(pgrep -af 'vllm|text-generation|ollama|llama|sglang' 2>/dev/null); then
            echo "FACT existing_serving=MATCHED:$(echo "$SERV" | head -3 | tr '\n' ';')"
          else
            SRC=$?
            if [ "$SRC" = 1 ]; then echo "FACT existing_serving=NONE-MATCHED"
            else echo "FACT existing_serving=PROBE-FAILED-rc$SRC"; fi
          fi
          if [ -d "$HOME/.cache/huggingface" ]; then
            echo "FACT hf_cache=PRESENT:$(du -sh "$HOME/.cache/huggingface" 2>/dev/null | cut -f1)"
          else
            echo "FACT hf_cache=ABSENT-no-such-dir"
          fi

          # :11000 -- an unidentified listener on a host about to run an inference server. Privilege
          # will not name the process, so ASK IT WHAT IT IS over HTTP from the host itself. Silence is
          # recorded as a typed unknown, never as absence: a port that is open but does not speak HTTP
          # is a different state from a port that is closed, and both differ from a probe that failed.
          P11=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:11000/ 2>/dev/null) || P11="NO-HTTP-REPLY"
          echo "FACT port11000_http=$P11"
          echo "FACT port11000_body=$(curl -s -m 5 http://127.0.0.1:11000/ 2>/dev/null | head -c 160 | tr -d '\r' | tr '\n' ' ' || echo NO-BODY)"
          echo "FACT port11000_models=$(curl -s -m 5 http://127.0.0.1:11000/v1/models 2>/dev/null | head -c 160 | tr -d '\r' | tr '\n' ' ' || echo NO-REPLY)"
          echo "FACT port11000_server_hdr=$(curl -s -m 5 -D - -o /dev/null http://127.0.0.1:11000/ 2>/dev/null | grep -i '^server:' | tr -d '\r' || echo NO-SERVER-HEADER)"

          # SERVING-TOOLCHAIN FEASIBILITY. GB10 is aarch64 Blackwell, where a serving runtime having
          # an installable build is a real question and not a formality -- assuming a wheel exists is
          # how an install step discovers its blocker halfway through a mutation. Observed read-only
          # first: what is already here, and what resolves for THIS platform.
          echo "FACT cuda_toolkit=$(command -v nvcc >/dev/null 2>&1 && nvcc --version 2>&1 | tail -1 || echo ABSENT)"
          echo "FACT ollama=$(command -v ollama >/dev/null 2>&1 && ollama --version 2>&1 | head -1 || echo ABSENT)"
          echo "FACT uv=$(command -v uv >/dev/null 2>&1 && uv --version 2>&1 || echo ABSENT)"
          echo "FACT pip=$(command -v pip3 >/dev/null 2>&1 && pip3 --version 2>&1 | cut -d' ' -f1-2 || echo ABSENT)"
          echo "FACT venv_module=$(python3 -c 'import venv' 2>/dev/null && echo PRESENT || echo ABSENT)"
          echo "FACT torch=$(python3 -c 'import torch;print(torch.__version__, torch.cuda.is_available())' 2>&1 | head -1)"
          # A resolvable candidate list is not an install; it only distinguishes "no build exists for
          # this platform" from "a build exists and the install is the next step".
          echo "FACT vllm_candidates=$(python3 -m pip index versions vllm 2>&1 | head -2 | tr '\n' ' ')"
          REMOTE
          echo "srv5 facts rc=$RC"
          echo "$OUT"

          echo "=== READING THIS RECEIPT ==="
          echo "A returned 'id -un' is a REAL remote-process observation of the admitted principal."
          echo "A failure is NOT proof the account is absent: it distinguishes neither missing"
          echo "authorized_keys, nor absent account, nor sshd policy. Those are different remedies."
          echo "The section-4 facts are OBSERVATIONS gating the step-2 install; an ABSENT marker is a"
          echo "measured absence, while a missing line is a probe that did not run -- not the same."

      - name: Shred credential material
        if: always()
        run: rm -rf "${RUNNER_TEMP}/canary" || true
