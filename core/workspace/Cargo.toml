[package]
name = "gunbc-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Unified WorkspaceOp and fractal workspace DAG composition"

[dependencies]
# Core
gunbc-ir = { path = "../ir" }
gunbc-exec = { path = "../exec" }

# Libraries
gunbc-primitives = { path = "../../lib/primitives" }
gunbc-lib-transport = { path = "../../lib/transport" }
gunbc-lib-gist-ops = { path = "../../lib/gist-ops" }

# Tools
gunbc-makegen = { path = "../../lib/tools/makegen" }
gunbc-deps = { path = "../../lib/tools/deps" }
gunbc-ci = { path = "../../lib/tools/ci" }
gunbc-gist = { path = "../../lib/tools/gist" }
gunbc-bootstrap = { path = "../../lib/tools/bootstrap" }
gunbc-buck2 = { path = "../../lib/tools/buck2" }
gunbc-clippy = { path = "../../lib/tools/clippy" }

# Test support
gunbc-test = { path = "../test" }

[dev-dependencies]
gunbc-test = { path = "../test" }
