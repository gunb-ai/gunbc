[package]
name = "daglang-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-ish compiler driver for daglang"

[dependencies]
daglang-contract = { path = "../daglang-contract" }
daglang-syntax = { path = "../daglang-syntax" }
daglang-resolve = { path = "../daglang-resolve" }
daglang-typecheck = { path = "../daglang-typecheck" }
daglang-lower = { path = "../daglang-lower" }
daglang-derive = { path = "../daglang-derive" }
daglang-emit = { path = "../daglang-emit" }
gunbc-ir = { path = "../../ir" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
gunbc-test = { path = "../../test" }
