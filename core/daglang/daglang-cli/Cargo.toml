[package]
name = "daglang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tools: dag viz, dag expand, dag manifest, dag modules"

[dependencies]
daglang-syntax = { path = "../daglang-syntax" }
daglang-resolve = { path = "../daglang-resolve" }
daglang-typecheck = { path = "../daglang-typecheck" }
daglang-lower = { path = "../daglang-lower" }
daglang-contract = { path = "../daglang-contract" }
daglang-derive = { path = "../daglang-derive" }
daglang-emit = { path = "../daglang-emit" }
daglang-driver = { path = "../daglang-driver" }
gunbc-dag = { path = "../../../gunbc-dag" }
gunbc-ir = { path = "../../ir" }
gunbc-exec = { path = "../../exec" }
gunbc-resolve = { path = "../../resolve" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
gunbc-test = { path = "../../test" }

[[bin]]
name = "daglang"
path = "src/main.rs"
