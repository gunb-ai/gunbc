[package]
name = "daglang-lower"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lowers typed .dag AST to gunbc GraphIR (Dag/Node/Port/Edge)"

[dependencies]
daglang-syntax = { path = "../daglang-syntax" }
daglang-typecheck = { path = "../daglang-typecheck" }
gunbc-ir = { path = "../../ir" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
daglang-resolve = { path = "../daglang-resolve" }
gunbc-dag = { path = "../../../gunbc-dag" }
gunbc-lib-aws-ops = { path = "../../../lib/aws-ops" }
gunbc-lib-azure-ops = { path = "../../../lib/azure-ops" }
gunbc-clippy = { path = "../../../lib/tools/clippy" }
gunbc-deps = { path = "../../../lib/tools/deps" }
gunbc-gist = { path = "../../../lib/tools/gist" }
gunbc-lib-gcp-ops = { path = "../../../lib/gcp-ops" }
