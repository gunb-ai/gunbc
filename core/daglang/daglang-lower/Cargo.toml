[package]
name = "daglang-lower"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lowers typed .dag AST to gunbc GraphIR (Dag/Node/Port/Edge)"

[dependencies]
daglang-contract = { path = "../daglang-contract" }
daglang-syntax = { path = "../daglang-syntax" }
daglang-typecheck = { path = "../daglang-typecheck" }
gunbc-ir = { path = "../../ir" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
daglang-resolve = { path = "../daglang-resolve" }
gunbc-app = { path = "../../../gunbc-app" }
gunbc-deps = { path = "../../../lib/tools/deps" }
