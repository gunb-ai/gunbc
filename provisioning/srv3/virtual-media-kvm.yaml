bmc_webui_virtual_media:
  spa_route: /#/operations/virtual-media
  transport: nbd-websocket-local-file
  nbd_websocket_path: /vm/0/0
  requires_local_file: true
  session_must_persist_during_mount: true
  dom:
    login_username_input_id: username
    login_password_input_id: password
    login_submit_selector: button[type="submit"]
    attach_section_heading: Load image from web browser
    attach_file_input_id: virtual_media_device
    attach_start_button_label: Start
