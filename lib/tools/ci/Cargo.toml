[package]
name = "gunbc-ci"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CI orchestration binary for gunbc"

[dependencies]
gunbc-ir = { path = "../../../core/ir" }
gunbc-exec = { path = "../../../core/exec" }
gunbc-primitives = { path = "../../primitives" }
gunbc-test = { path = "../../../core/test" }
gunbc-makegen = { path = "../makegen" }

[dev-dependencies]
gunbc-test = { path = "../../../core/test" }

[[bin]]
name = "gunbc-ci"
# Note: This is NOT generated. gunbc-ci is the bootstrap tool that runs codegen
# for other tools. It has a handwritten main.rs to avoid circular dependency.
path = "src/main.rs"
