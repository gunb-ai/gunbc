[package]
name = "gunbc-viz"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interactive DAG visualizer for gunbc"

[dependencies]
gunbc-ir = { path = "../../../core/ir" }
gunbc-exec = { path = "../../../core/exec" }
gunbc-lib-transport = { path = "../../transport" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Import all tool crates to discover their DAGs generically
gunbc-gist = { path = "../gist" }
gunbc-buck2 = { path = "../buck2" }
gunbc-makegen = { path = "../makegen" }
gunbc-deps = { path = "../deps" }
gunbc-ci = { path = "../ci" }
gunbc-bootstrap = { path = "../bootstrap" }

[dev-dependencies]
gunbc-test = { path = "../../../core/test" }

[[bin]]
name = "gunbc-viz"
path = "src/main.rs"
