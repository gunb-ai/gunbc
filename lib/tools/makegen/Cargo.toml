[package]
name = "gunbc-makegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Makefile generation from gunbc DAG entrypoints"

[dependencies]
gunbc-ir = { path = "../../../core/ir" }
gunbc-exec = { path = "../../../core/exec" }
gunbc-codegen = { path = "../../../core/codegen" }
gunbc-test = { path = "../../../core/test" }
serde_json = "1.0"

[dev-dependencies]
gunbc-test = { path = "../../../core/test" }

[[bin]]
name = "gunbc-makegen"
path = "src/main.rs"
