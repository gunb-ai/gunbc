[package]
name = "gunbc-gist"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gist generation tool built on gunbc"

[dependencies]
gunbc-ir = { path = "../../../core/ir" }
gunbc-exec = { path = "../../../core/exec" }
gunbc-primitives = { path = "../../primitives" }
gunbc-lib-git-ops = { path = "../../git-ops" }
gunbc-lib-gist-ops = { path = "../../gist-ops" }
gunbc-lib-markdown = { path = "../../markdown" }
gunbc-lib-transport = { path = "../../transport" }
gunbc-lib-cloud-ops = { path = "../../cloud-ops" }
gunbc-lib-gcp-ops = { path = "../../gcp-ops" }
gunbc-test = { path = "../../../core/test" }
gunbc-testgen-registry = { path = "../../../core/testgen-registry" }
gunbc-testgen-registry-macros = { path = "../../../core/testgen-registry-macros" }
gunbc-tool-registry = { path = "../../../core/tool-registry" }
gunbc-tool-registry-macros = { path = "../../../core/tool-registry-macros" }
gunbc-cli = { path = "../../../core/cli" }

[dependencies.serde_json]
workspace = true

[dev-dependencies]
gunbc-test = { path = "../../../core/test" }

[[bin]]
name = "gunbc-gist"
path = "../../../target/codegen/bin/gist/main.rs"

[[bin]]
name = "gunbc-gist-diff"
path = "../../../target/codegen/bin/gist-diff/main.rs"

[[bin]]
name = "gunbc-gist-recent"
path = "../../../target/codegen/bin/gist-recent/main.rs"

[[bin]]
name = "gunbc-gist-auth-doctor"
path = "../../../target/codegen/bin/gist-auth-doctor/main.rs"
