apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gunbc-sdlc-worker
  labels:
    managed-by: gunbc
    component: sdlc-worker
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: gunbc-sdlc-worker@gunbai-auto.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/gunbai-auto/gunbc/sdlc-worker:latest
          command: ["gunbc-sdlc"]
          args: ["worker"]
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          env:
            - name: SDLC_LEDGER_DIR
              value: /data/ledger
            - name: SDLC_REPO_OWNER
              value: gunb-ai
            - name: SDLC_REPO_NAME
              value: gunbc
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-token
                  key: latest
          volumeMounts:
            - name: ledger-volume
              mountPath: /data/ledger
      volumes:
        - name: ledger-volume
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: gunbai-auto-sdlc-ledger
