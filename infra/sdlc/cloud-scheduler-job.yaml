apiVersion: cloudscheduler.googleapis.com/v1
kind: Job
metadata:
  name: gunbc-sdlc-worker-trigger
  labels:
    managed-by: gunbc
    component: sdlc-scheduler
spec:
  description: "Triggers the SDLC worker to process open issues every 5 minutes"
  schedule: "*/5 * * * *"
  timeZone: "UTC"
  httpTarget:
    uri: https://gunbc-sdlc-worker-HASH-uc.a.run.app
    httpMethod: POST
    headers:
      Content-Type: application/json
    body: |
      {
        "command": "worker",
        "dry_run": false
      }
    oidcToken:
      serviceAccountEmail: gunbc-sdlc-scheduler@gunbai-auto.iam.gserviceaccount.com
      audience: https://gunbc-sdlc-worker-HASH-uc.a.run.app
  retryConfig:
    retryCount: 3
    minBackoffDuration: 30s
    maxBackoffDuration: 300s
    maxDoublings: 3
