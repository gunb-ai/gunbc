<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .layer  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-style: italic; fill: #6e7781; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <text x="20" y="30" class="title">One primitive.</text>
  <text x="20" y="48" class="sub">A single Sum type. One function that uses it. The starting point.</text>

  <text x="20"  y="78" class="col-label">BUSINESS LOGIC</text>
  <text x="320" y="78" class="col-label">RUST — GENERATED</text>
  <text x="820" y="78" class="col-label">FACTS</text>

  <!-- LEFT: primitive consumer -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="160" class="card"/>
  <text x="32" y="130" class="layer">// primitive consumer</text>
  <text x="32" y="150" class="code">fn unwrap_str(</text>
  <text x="32" y="168" class="code">    s: Sum&lt;Str, Str&gt;</text>
  <text x="32" y="186" class="code">) -&gt; Str =</text>
  <text x="32" y="204" class="code">  match s {</text>
  <text x="32" y="222" class="code">    Left  { value } =&gt; value</text>
  <text x="32" y="240" class="code">    Right { value } =&gt; value</text>
  <text x="32" y="258" class="code">  }</text>

  <!-- CENTER: emission -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="240" class="card"/>
  <text x="332" y="130" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="148" class="code">pub enum Sum&lt;A, B&gt; {</text>
  <text x="332" y="166" class="code">    Left  { value: A },</text>
  <text x="332" y="184" class="code">    Right { value: B },</text>
  <text x="332" y="202" class="code">}</text>
  <text x="332" y="230" class="code">impl&lt;A, B&gt; Sum&lt;A, B&gt; {</text>
  <text x="332" y="248" class="code">    pub fn left(value: A)  -&gt; Self { Self::Left  { value } }</text>
  <text x="332" y="266" class="code">    pub fn right(value: B) -&gt; Self { Self::Right { value } }</text>
  <text x="332" y="284" class="code">    pub fn is_left(&amp;self)  -&gt; bool { matches!(self, Self::Left  {..}) }</text>
  <text x="332" y="302" class="code">    pub fn is_right(&amp;self) -&gt; bool { matches!(self, Self::Right {..}) }</text>
  <text x="332" y="320" class="code">}</text>
  <text x="332" y="348" class="code">pub fn unwrap_str(s: Sum&lt;String,String&gt;) -&gt; String { ... }</text>

  <!-- RIGHT: facts (tiny) -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="58" class="card"/>
  <text x="832" y="130" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="148" class="code">  Left{value:A} | Right{value:B}</text>

  <text x="20" y="368" class="sub">3 lines of facts. 7 lines of logic. ~13 lines of Rust. The fact will not grow as we add layers.</text>
</svg>
