<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust   { fill: #ce422b; }
      .badge-python { fill: #3776ab; }
      .badge-go     { fill: #00add8; }
      .badge-dag    { fill: #57606a; }
      .code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .arrow { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="20" y="30" class="title">Add a language. Then another.</text>
  <text x="20" y="48" class="sub">Same type. Three languages. Three pieces of code.</text>

  <text x="20" y="78" class="label">YOU WRITE</text>
  <rect x="20" y="88" width="240" height="22" class="card-header"/>
  <rect x="20" y="110" width="240" height="120" class="card"/>
  <text x="32" y="104" class="badge badge-dag">.dag</text>
  <text x="32" y="132" class="code">type Pair&lt;A, B&gt; {</text>
  <text x="32" y="150" class="code">  first: A</text>
  <text x="32" y="168" class="code">  second: B</text>
  <text x="32" y="186" class="code">}</text>

  <!-- fan-out arrows from source to each target card -->
  <path d="M 270 170 C 290 170, 290 160, 308 160" class="arrow"/>
  <path d="M 270 170 C 290 170, 590 170, 608 170" class="arrow"/>
  <path d="M 270 170 C 290 170, 890 170, 908 170" class="arrow"/>

  <text x="320" y="78" class="label">COMPILER GENERATES</text>

  <!-- Rust -->
  <rect x="320" y="88" width="280" height="22" class="card-header"/>
  <rect x="320" y="110" width="280" height="120" class="card"/>
  <text x="332" y="104" class="badge badge-rust">RUST</text>
  <text x="332" y="132" class="code">pub struct Pair&lt;A, B&gt; {</text>
  <text x="332" y="150" class="code">    pub first: A,</text>
  <text x="332" y="168" class="code">    pub second: B,</text>
  <text x="332" y="186" class="code">}</text>

  <!-- Python -->
  <rect x="620" y="88" width="280" height="22" class="card-header"/>
  <rect x="620" y="110" width="280" height="120" class="card"/>
  <text x="632" y="104" class="badge badge-python">PYTHON</text>
  <text x="632" y="132" class="code">@dataclass</text>
  <text x="632" y="150" class="code">class Pair(Generic[A, B]):</text>
  <text x="632" y="168" class="code">    first: A</text>
  <text x="632" y="186" class="code">    second: B</text>

  <!-- Go -->
  <rect x="920" y="88" width="240" height="22" class="card-header"/>
  <rect x="920" y="110" width="240" height="120" class="card"/>
  <text x="932" y="104" class="badge badge-go">GO</text>
  <text x="932" y="132" class="code">type Pair[A, B any] struct {</text>
  <text x="932" y="150" class="code">    First  A</text>
  <text x="932" y="168" class="code">    Second B</text>
  <text x="932" y="186" class="code">}</text>

  <text x="20" y="258" class="sub">Adding a language adds <tspan font-style="italic">one column</tspan>. Your intent didn't change.</text>
</svg>
