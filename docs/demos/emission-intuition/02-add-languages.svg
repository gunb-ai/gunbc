<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .layer  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-style: italic; fill: #6e7781; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Two layers — primitive and helpers.</text>
  <text x="20" y="48" class="sub">A second layer on the right (an alias). Helper combinators on the left, still operating at the primitive layer.</text>

  <text x="20"  y="78" class="col-label">BUSINESS LOGIC · HELPERS · LIBRARIES</text>
  <text x="320" y="78" class="col-label">RUST — GENERATED</text>
  <text x="820" y="78" class="col-label">FACTS · STRUCTS · OBJECTS</text>

  <!-- LEFT -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="478" class="card"/>
  <text x="32" y="130" class="layer">// primitive consumer</text>
  <text x="32" y="150" class="code">fn unwrap_str(</text>
  <text x="32" y="168" class="code">    s: Sum&lt;Str, Str&gt;) -&gt; Str =</text>
  <text x="32" y="186" class="code">  match s {</text>
  <text x="32" y="204" class="code">    Left  { value } =&gt; value</text>
  <text x="32" y="222" class="code">    Right { value } =&gt; value</text>
  <text x="32" y="240" class="code">  }</text>
  <text x="32" y="278" class="layer">// generic helpers (still on Sum)</text>
  <text x="32" y="298" class="code">fn map&lt;A, B, C&gt;(</text>
  <text x="32" y="316" class="code">    s: Sum&lt;A, B&gt;,</text>
  <text x="32" y="334" class="code">    f: A -&gt; C</text>
  <text x="32" y="352" class="code">) -&gt; Sum&lt;C, B&gt; =</text>
  <text x="32" y="370" class="code">  match s {</text>
  <text x="32" y="388" class="code">    Left  { value } =&gt;</text>
  <text x="32" y="406" class="code">      Left { value: f(value) }</text>
  <text x="32" y="424" class="code">    Right { value } =&gt; Right { value }</text>
  <text x="32" y="442" class="code">  }</text>
  <text x="32" y="480" class="code">fn and_then&lt;A, B, C&gt;(</text>
  <text x="32" y="498" class="code">    s: Sum&lt;A, B&gt;,</text>
  <text x="32" y="516" class="code">    f: A -&gt; Sum&lt;C, B&gt;</text>
  <text x="32" y="534" class="code">) -&gt; Sum&lt;C, B&gt; =</text>
  <text x="32" y="552" class="code">  match s {</text>
  <text x="32" y="570" class="code">    Left  { value } =&gt; f(value)</text>
  <text x="32" y="582" class="code">    Right { value } =&gt; Right { value } }</text>

  <!-- CENTER -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="600" class="card"/>
  <text x="332" y="130" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="148" class="code">pub enum Sum&lt;A, B&gt; { Left { value: A }, Right { value: B } }</text>
  <text x="332" y="176" class="code">impl&lt;A, B&gt; Sum&lt;A, B&gt; {</text>
  <text x="332" y="194" class="code">    pub fn left(value: A)  -&gt; Self { Self::Left  { value } }</text>
  <text x="332" y="212" class="code">    pub fn right(value: B) -&gt; Self { Self::Right { value } }</text>
  <text x="332" y="230" class="code">    pub fn is_left(&amp;self)  -&gt; bool { matches!(self, Self::Left  {..}) }</text>
  <text x="332" y="248" class="code">    pub fn is_right(&amp;self) -&gt; bool { matches!(self, Self::Right {..}) }</text>
  <text x="332" y="266" class="code">}</text>
  <text x="332" y="294" class="code">pub type Result&lt;T, E&gt; = Sum&lt;E, T&gt;;</text>
  <text x="332" y="332" class="code">pub fn unwrap_str(s: Sum&lt;String, String&gt;) -&gt; String {</text>
  <text x="332" y="350" class="code">    match s {</text>
  <text x="332" y="368" class="code">        Sum::Left  { value } =&gt; value,</text>
  <text x="332" y="386" class="code">        Sum::Right { value } =&gt; value,</text>
  <text x="332" y="404" class="code">    }</text>
  <text x="332" y="422" class="code">}</text>
  <text x="332" y="450" class="code">pub fn map&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;, f: impl FnOnce(A) -&gt; C)</text>
  <text x="332" y="468" class="code">    -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="486" class="code">    match s {</text>
  <text x="332" y="504" class="code">        Sum::Left  { value } =&gt; Sum::Left  { value: f(value) },</text>
  <text x="332" y="522" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="540" class="code">    }</text>
  <text x="332" y="558" class="code">}</text>
  <text x="332" y="586" class="code">pub fn and_then&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;,</text>
  <text x="332" y="604" class="code">    f: impl FnOnce(A) -&gt; Sum&lt;C, B&gt;) -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="622" class="code">    match s {</text>
  <text x="332" y="640" class="code">        Sum::Left  { value } =&gt; f(value),</text>
  <text x="332" y="658" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="676" class="code">    }</text>
  <text x="332" y="694" class="code">}</text>

  <!-- RIGHT -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="158" class="card"/>
  <text x="832" y="130" class="layer">// PRIMITIVE</text>
  <text x="832" y="150" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="168" class="code">  Left{value:A} | Right{value:B}</text>
  <text x="832" y="208" class="layer">// HELPERS (alias)</text>
  <text x="832" y="228" class="code">type Result&lt;T, E&gt; =</text>
  <text x="832" y="246" class="code">  Sum&lt;E, T&gt;</text>

  <text x="20" y="740" class="sub">Two layers of facts. The helpers on the left know about the primitive — and they're enough to power everything that comes next.</text>
</svg>
