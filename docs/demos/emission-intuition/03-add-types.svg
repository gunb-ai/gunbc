<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .layer  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-style: italic; fill: #6e7781; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .abstract { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 3 3; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Three layers — add a library on top.</text>
  <text x="20" y="48" class="sub">Library types in the right column; library functions on the left use them. The primitive and helpers are abstracted — the left column never names Sum.</text>

  <text x="20"  y="78" class="col-label">BUSINESS LOGIC · HELPERS · LIBRARIES</text>
  <text x="320" y="78" class="col-label">RUST — GENERATED</text>
  <text x="820" y="78" class="col-label">FACTS · STRUCTS · OBJECTS</text>

  <!-- LEFT: library functions only — Sum is abstracted away -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="478" class="card"/>
  <text x="32" y="130" class="layer">// library — abstracts Sum/Result</text>
  <text x="32" y="150" class="code">fn http_get(</text>
  <text x="32" y="168" class="code">    url: Str</text>
  <text x="32" y="186" class="code">) -&gt; ApiResponse&lt;Bytes&gt;</text>
  <text x="32" y="222" class="code">fn parse_user(</text>
  <text x="32" y="240" class="code">    bytes: Bytes</text>
  <text x="32" y="258" class="code">) -&gt; ApiResponse&lt;User&gt;</text>
  <text x="32" y="296" class="layer">// composes the library</text>
  <text x="32" y="316" class="code">fn fetch_user(</text>
  <text x="32" y="334" class="code">    id: UserId</text>
  <text x="32" y="352" class="code">) -&gt; ApiResponse&lt;User&gt; =</text>
  <text x="32" y="370" class="code">  and_then(</text>
  <text x="32" y="388" class="code">    http_get(format("/u/{id}")),</text>
  <text x="32" y="406" class="code">    fn(bytes) =&gt; parse_user(bytes))</text>
  <text x="32" y="446" class="layer">// note: fetch_user does not</text>
  <text x="32" y="462" class="layer">// pattern-match Sum or Result.</text>
  <text x="32" y="478" class="layer">// Lower layers are abstracted.</text>

  <!-- CENTER: full emission for primitive + helpers + library -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="918" class="card"/>
  <text x="332" y="130" class="layer">// primitive — full impl</text>
  <text x="332" y="150" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="168" class="code">pub enum Sum&lt;A, B&gt; { Left { value: A }, Right { value: B } }</text>
  <text x="332" y="196" class="code">impl&lt;A, B&gt; Sum&lt;A, B&gt; {</text>
  <text x="332" y="214" class="code">    pub fn left(value: A)  -&gt; Self { Self::Left  { value } }</text>
  <text x="332" y="232" class="code">    pub fn right(value: B) -&gt; Self { Self::Right { value } }</text>
  <text x="332" y="250" class="code">    pub fn is_left(&amp;self)  -&gt; bool { matches!(self, Self::Left  {..}) }</text>
  <text x="332" y="268" class="code">    pub fn is_right(&amp;self) -&gt; bool { matches!(self, Self::Right {..}) }</text>
  <text x="332" y="286" class="code">}</text>
  <text x="332" y="314" class="layer">// helpers — derived aliases + combinators</text>
  <text x="332" y="334" class="code">pub type Result&lt;T, E&gt; = Sum&lt;E, T&gt;;</text>
  <text x="332" y="362" class="code">pub fn map&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;, f: impl FnOnce(A) -&gt; C)</text>
  <text x="332" y="380" class="code">    -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="398" class="code">    match s {</text>
  <text x="332" y="416" class="code">        Sum::Left  { value } =&gt; Sum::Left  { value: f(value) },</text>
  <text x="332" y="434" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="452" class="code">    }</text>
  <text x="332" y="470" class="code">}</text>
  <text x="332" y="498" class="code">pub fn and_then&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;,</text>
  <text x="332" y="516" class="code">    f: impl FnOnce(A) -&gt; Sum&lt;C, B&gt;) -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="534" class="code">    match s {</text>
  <text x="332" y="552" class="code">        Sum::Left  { value } =&gt; f(value),</text>
  <text x="332" y="570" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="588" class="code">    }</text>
  <text x="332" y="606" class="code">}</text>
  <text x="332" y="634" class="layer">// library — domain alias + structs</text>
  <text x="332" y="654" class="code">pub type ApiResponse&lt;T&gt; = Result&lt;T, HttpError&gt;;</text>
  <text x="332" y="682" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="700" class="code">pub struct HttpError { pub status: i32, pub body: String }</text>
  <text x="332" y="728" class="code">impl HttpError {</text>
  <text x="332" y="746" class="code">    pub fn new(status: i32, body: String) -&gt; Self { Self { status, body } }</text>
  <text x="332" y="764" class="code">}</text>
  <text x="332" y="792" class="code">pub fn http_get(url: &amp;str) -&gt; ApiResponse&lt;Bytes&gt; { unimplemented!() }</text>
  <text x="332" y="810" class="code">pub fn parse_user(bytes: Bytes) -&gt; ApiResponse&lt;User&gt; { unimplemented!() }</text>
  <text x="332" y="838" class="code">pub fn fetch_user(id: UserId) -&gt; ApiResponse&lt;User&gt; {</text>
  <text x="332" y="856" class="code">    and_then(</text>
  <text x="332" y="874" class="code">        http_get(&amp;format!("/u/{}", id)),</text>
  <text x="332" y="892" class="code">        |bytes| parse_user(bytes),</text>
  <text x="332" y="910" class="code">    )</text>
  <text x="332" y="928" class="code">}</text>

  <!-- RIGHT: 3 layers stacked -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="318" class="card"/>
  <text x="832" y="130" class="layer">// PRIMITIVE</text>
  <text x="832" y="150" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="168" class="code">  Left{value:A} | Right{value:B}</text>
  <text x="832" y="208" class="layer">// HELPERS</text>
  <text x="832" y="228" class="code">type Result&lt;T, E&gt; =</text>
  <text x="832" y="246" class="code">  Sum&lt;E, T&gt;</text>
  <text x="832" y="286" class="layer">// LIBRARY</text>
  <text x="832" y="306" class="code">type ApiResponse&lt;T&gt; =</text>
  <text x="832" y="324" class="code">  Result&lt;T, HttpError&gt;</text>
  <text x="832" y="352" class="code">type HttpError {</text>
  <text x="832" y="370" class="code">  status: Int</text>
  <text x="832" y="388" class="code">  body:   Str</text>
  <text x="832" y="406" class="code">}</text>

  <text x="20" y="1068" class="sub">Three stacked layers on the right. Library code on the left only mentions the top one. Everything underneath still gets emitted.</text>
</svg>
