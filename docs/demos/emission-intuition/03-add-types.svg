<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .layer  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-style: italic; fill: #6e7781; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .stable { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
      .stable-text { font-size: 10px; font-weight: 600; fill: #0969da; letter-spacing: 0.04em; }
    </style>
  </defs>

  <text x="20" y="30" class="title">A library built from those helpers.</text>
  <text x="20" y="48" class="sub">Same Sum on the right (with one alias). Library functions on the left use Sum at concrete types like Int and HttpError.</text>

  <text x="20"  y="78" class="col-label">BUSINESS LOGIC</text>
  <text x="320" y="78" class="col-label">RUST — GENERATED</text>
  <text x="820" y="78" class="col-label">FACTS</text>

  <!-- LEFT: primitive consumer + helpers + library -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="778" class="card"/>
  <text x="32" y="130" class="layer">// primitive consumer</text>
  <text x="32" y="150" class="code">fn unwrap_str(</text>
  <text x="32" y="168" class="code">    s: Sum&lt;Str, Str&gt;) -&gt; Str =</text>
  <text x="32" y="186" class="code">  match s {</text>
  <text x="32" y="204" class="code">    Left  { value } =&gt; value</text>
  <text x="32" y="222" class="code">    Right { value } =&gt; value }</text>
  <text x="32" y="260" class="layer">// helpers</text>
  <text x="32" y="280" class="code">fn map&lt;A,B,C&gt;(</text>
  <text x="32" y="298" class="code">    s: Sum&lt;A,B&gt;, f: A-&gt;C) -&gt; Sum&lt;C,B&gt; =</text>
  <text x="32" y="316" class="code">  match s {</text>
  <text x="32" y="334" class="code">    Left  { value } =&gt; Left { value: f(value) }</text>
  <text x="32" y="352" class="code">    Right { value } =&gt; Right { value } }</text>
  <text x="32" y="386" class="code">fn and_then&lt;A,B,C&gt;(</text>
  <text x="32" y="404" class="code">    s: Sum&lt;A,B&gt;, f: A-&gt;Sum&lt;C,B&gt;) -&gt; Sum&lt;C,B&gt; =</text>
  <text x="32" y="422" class="code">  match s {</text>
  <text x="32" y="440" class="code">    Left  { value } =&gt; f(value)</text>
  <text x="32" y="458" class="code">    Right { value } =&gt; Right { value } }</text>
  <text x="32" y="496" class="layer">// library — Sum with concrete primitives</text>
  <text x="32" y="516" class="code">fn parse_int(</text>
  <text x="32" y="534" class="code">    s: Str</text>
  <text x="32" y="552" class="code">) -&gt; Sum&lt;ParseError, Int&gt; =</text>
  <text x="32" y="570" class="code">  // ... try parse, return Left on err</text>
  <text x="32" y="588" class="code"></text>
  <text x="32" y="616" class="code">fn http_get(</text>
  <text x="32" y="634" class="code">    url: Str</text>
  <text x="32" y="652" class="code">) -&gt; Sum&lt;HttpError, Bytes&gt; =</text>
  <text x="32" y="670" class="code">  // ... fetch, return Left on err</text>
  <text x="32" y="708" class="code">fn validate_email(</text>
  <text x="32" y="726" class="code">    s: Str</text>
  <text x="32" y="744" class="code">) -&gt; Sum&lt;ValidationError, Email&gt; =</text>
  <text x="32" y="762" class="code">  // ... regex check etc.</text>

  <!-- CENTER: emission for Sum + helpers + library fns -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="788" class="card"/>
  <text x="332" y="130" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="148" class="code">pub enum Sum&lt;A, B&gt; { Left { value: A }, Right { value: B } }</text>
  <text x="332" y="176" class="code">impl&lt;A, B&gt; Sum&lt;A, B&gt; {</text>
  <text x="332" y="194" class="code">    pub fn left(value: A)  -&gt; Self { Self::Left  { value } }</text>
  <text x="332" y="212" class="code">    pub fn right(value: B) -&gt; Self { Self::Right { value } }</text>
  <text x="332" y="230" class="code">    pub fn is_left(&amp;self)  -&gt; bool { matches!(self, Self::Left  {..}) }</text>
  <text x="332" y="248" class="code">    pub fn is_right(&amp;self) -&gt; bool { matches!(self, Self::Right {..}) }</text>
  <text x="332" y="266" class="code">}</text>
  <text x="332" y="294" class="code">// alias from .dag</text>
  <text x="332" y="312" class="code">pub type Result&lt;T, E&gt; = Sum&lt;E, T&gt;;</text>
  <text x="332" y="350" class="code">pub fn unwrap_str(s: Sum&lt;String, String&gt;) -&gt; String {</text>
  <text x="332" y="368" class="code">    match s {</text>
  <text x="332" y="386" class="code">        Sum::Left  { value } =&gt; value,</text>
  <text x="332" y="404" class="code">        Sum::Right { value } =&gt; value,</text>
  <text x="332" y="422" class="code">    }</text>
  <text x="332" y="440" class="code">}</text>
  <text x="332" y="468" class="code">pub fn map&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;, f: impl FnOnce(A) -&gt; C)</text>
  <text x="332" y="486" class="code">    -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="504" class="code">    match s {</text>
  <text x="332" y="522" class="code">        Sum::Left  { value } =&gt; Sum::Left  { value: f(value) },</text>
  <text x="332" y="540" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="558" class="code">    }</text>
  <text x="332" y="576" class="code">}</text>
  <text x="332" y="604" class="code">pub fn and_then&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;,</text>
  <text x="332" y="622" class="code">    f: impl FnOnce(A) -&gt; Sum&lt;C, B&gt;) -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="640" class="code">    match s {</text>
  <text x="332" y="658" class="code">        Sum::Left  { value } =&gt; f(value),</text>
  <text x="332" y="676" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="694" class="code">    }</text>
  <text x="332" y="712" class="code">}</text>
  <text x="332" y="740" class="code">pub fn parse_int(s: &amp;str) -&gt; Sum&lt;ParseError, i64&gt; {</text>
  <text x="332" y="758" class="code">    s.parse::&lt;i64&gt;().map_or_else(</text>
  <text x="332" y="776" class="code">        |e| Sum::Left  { value: ParseError::from(e) },</text>
  <text x="332" y="794" class="code">        |n| Sum::Right { value: n })</text>
  <text x="332" y="812" class="code">}</text>
  <text x="332" y="840" class="code">pub fn http_get(url: &amp;str) -&gt; Sum&lt;HttpError, Bytes&gt; { ... }</text>
  <text x="332" y="868" class="code">pub fn validate_email(s: &amp;str) -&gt; Sum&lt;ValidationError, Email&gt; { ... }</text>

  <!-- RIGHT: facts (still tiny — Sum + one alias line) -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="98" class="card"/>
  <text x="832" y="130" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="148" class="code">  Left{value:A} | Right{value:B}</text>
  <text x="832" y="178" class="code">type Result&lt;T, E&gt; = Sum&lt;E, T&gt;</text>
  <rect x="820" y="220" width="220" height="18" rx="4" class="stable"/>
  <text x="832" y="234" class="stable-text">FACTS GREW BY ONE LINE</text>

  <text x="20" y="908" class="sub">Five lines of facts. The library on the left compounded — and the middle compounded faster.</text>
</svg>
