<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust   { fill: #ce422b; }
      .badge-python { fill: #3776ab; }
      .badge-go     { fill: #00add8; }
      .badge-ts     { fill: #3178c6; }
      .badge-dag    { fill: #57606a; }
      .col-header   { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
      .code  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; fill: #1f2328; }
      .code-sm { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; fill: #1f2328; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .punchline { font-size: 14px; font-weight: 600; fill: #1f2328; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Now scale.</text>
  <text x="20" y="48" class="sub">Eight types × four languages — 32 pieces of code. Your intent and the rules stayed small.</text>

  <text x="20" y="78" class="label">YOU WRITE — 8 TYPES</text>
  <text x="320" y="78" class="label">COMPILER GENERATES — ONE CELL PER (TYPE × LANGUAGE)</text>

  <!-- column headers (the targets — only 4 of them, regardless of how many types) -->
  <rect x="320"  y="88" width="232" height="22" class="card-header"/>
  <text x="332"  y="103" class="col-header badge-rust">RUST</text>
  <rect x="556"  y="88" width="232" height="22" class="card-header"/>
  <text x="568"  y="103" class="col-header badge-python">PYTHON</text>
  <rect x="792"  y="88" width="232" height="22" class="card-header"/>
  <text x="804"  y="103" class="col-header badge-go">GO</text>
  <rect x="1028" y="88" width="232" height="22" class="card-header"/>
  <text x="1040" y="103" class="col-header badge-ts">TYPESCRIPT</text>

  <!-- 8 type rows. Each row: source card + 4 generated cells. Row height 80, gap 4. -->

  <!-- Row 1: Pair (y=114) -->
  <rect x="20"   y="114" width="280" height="76" class="card"/>
  <text x="32"   y="130" class="badge badge-dag">PAIR</text>
  <text x="32"   y="150" class="code">type Pair&lt;A, B&gt; {</text>
  <text x="32"   y="166" class="code">  first: A; second: B }</text>
  <rect x="320"  y="114" width="232" height="76" class="card"/>
  <text x="332"  y="134" class="code-sm">pub struct Pair&lt;A, B&gt; {</text>
  <text x="332"  y="148" class="code-sm">  pub first: A,</text>
  <text x="332"  y="162" class="code-sm">  pub second: B,</text>
  <text x="332"  y="176" class="code-sm">}</text>
  <rect x="556"  y="114" width="232" height="76" class="card"/>
  <text x="568"  y="134" class="code-sm">@dataclass</text>
  <text x="568"  y="148" class="code-sm">class Pair(Generic[A,B]):</text>
  <text x="568"  y="162" class="code-sm">  first: A; second: B</text>
  <rect x="792"  y="114" width="232" height="76" class="card"/>
  <text x="804"  y="134" class="code-sm">type Pair[A,B any] struct{</text>
  <text x="804"  y="148" class="code-sm">  First A; Second B</text>
  <text x="804"  y="162" class="code-sm">}</text>
  <rect x="1028" y="114" width="232" height="76" class="card"/>
  <text x="1040" y="134" class="code-sm">interface Pair&lt;A, B&gt; {</text>
  <text x="1040" y="148" class="code-sm">  first: A; second: B;</text>
  <text x="1040" y="162" class="code-sm">}</text>

  <!-- Row 2: Sum (y=194) -->
  <rect x="20"   y="194" width="280" height="76" class="card"/>
  <text x="32"   y="210" class="badge badge-dag">SUM</text>
  <text x="32"   y="230" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="32"   y="246" class="code">  Left{v:A} | Right{v:B}</text>
  <rect x="320"  y="194" width="232" height="76" class="card"/>
  <text x="332"  y="214" class="code-sm">pub enum Sum&lt;A, B&gt; {</text>
  <text x="332"  y="228" class="code-sm">  Left{v:A}, Right{v:B}</text>
  <text x="332"  y="242" class="code-sm">}</text>
  <rect x="556"  y="194" width="232" height="76" class="card"/>
  <text x="568"  y="214" class="code-sm">Sum = Union[</text>
  <text x="568"  y="228" class="code-sm">  Left[A], Right[B]</text>
  <text x="568"  y="242" class="code-sm">]</text>
  <rect x="792"  y="194" width="232" height="76" class="card"/>
  <text x="804"  y="214" class="code-sm">type Sum[A,B any] interface{</text>
  <text x="804"  y="228" class="code-sm">  isSum()  // + Left, Right</text>
  <text x="804"  y="242" class="code-sm">}</text>
  <rect x="1028" y="194" width="232" height="76" class="card"/>
  <text x="1040" y="214" class="code-sm">type Sum&lt;A, B&gt; =</text>
  <text x="1040" y="228" class="code-sm">  | { kind:'L', v:A }</text>
  <text x="1040" y="242" class="code-sm">  | { kind:'R', v:B };</text>

  <!-- Row 3: Option (y=274) -->
  <rect x="20"   y="274" width="280" height="76" class="card"/>
  <text x="32"   y="290" class="badge badge-dag">OPTION</text>
  <text x="32"   y="310" class="code">type Option&lt;T&gt; =</text>
  <text x="32"   y="326" class="code">  Some{v:T} | None</text>
  <rect x="320"  y="274" width="232" height="76" class="card"/>
  <text x="332"  y="294" class="code-sm">pub enum Option&lt;T&gt; {</text>
  <text x="332"  y="308" class="code-sm">  Some{v:T}, None</text>
  <text x="332"  y="322" class="code-sm">}</text>
  <rect x="556"  y="274" width="232" height="76" class="card"/>
  <text x="568"  y="294" class="code-sm">Option = Union[</text>
  <text x="568"  y="308" class="code-sm">  Some[T], _None</text>
  <text x="568"  y="322" class="code-sm">]</text>
  <rect x="792"  y="274" width="232" height="76" class="card"/>
  <text x="804"  y="294" class="code-sm">type Option[T any] interface{</text>
  <text x="804"  y="308" class="code-sm">  isOpt() // + Some, None_</text>
  <text x="804"  y="322" class="code-sm">}</text>
  <rect x="1028" y="274" width="232" height="76" class="card"/>
  <text x="1040" y="294" class="code-sm">type Option&lt;T&gt; =</text>
  <text x="1040" y="308" class="code-sm">  | { kind:'Some', v:T }</text>
  <text x="1040" y="322" class="code-sm">  | { kind:'None' };</text>

  <!-- Row 4: Result (y=354) -->
  <rect x="20"   y="354" width="280" height="76" class="card"/>
  <text x="32"   y="370" class="badge badge-dag">RESULT</text>
  <text x="32"   y="390" class="code">type Result&lt;T, E&gt; =</text>
  <text x="32"   y="406" class="code">  Ok{v:T} | Err{e:E}</text>
  <rect x="320"  y="354" width="232" height="76" class="card"/>
  <text x="332"  y="374" class="code-sm">pub enum Result&lt;T, E&gt; {</text>
  <text x="332"  y="388" class="code-sm">  Ok{v:T}, Err{e:E}</text>
  <text x="332"  y="402" class="code-sm">}</text>
  <rect x="556"  y="354" width="232" height="76" class="card"/>
  <text x="568"  y="374" class="code-sm">Result = Union[</text>
  <text x="568"  y="388" class="code-sm">  Ok[T], Err[E]</text>
  <text x="568"  y="402" class="code-sm">]</text>
  <rect x="792"  y="354" width="232" height="76" class="card"/>
  <text x="804"  y="374" class="code-sm">type Result[T,E any] interface{</text>
  <text x="804"  y="388" class="code-sm">  isResult() // + Ok, Err</text>
  <text x="804"  y="402" class="code-sm">}</text>
  <rect x="1028" y="354" width="232" height="76" class="card"/>
  <text x="1040" y="374" class="code-sm">type Result&lt;T, E&gt; =</text>
  <text x="1040" y="388" class="code-sm">  | { kind:'Ok', v:T }</text>
  <text x="1040" y="402" class="code-sm">  | { kind:'Err', e:E };</text>

  <!-- Row 5: List (y=434) -->
  <rect x="20"   y="434" width="280" height="76" class="card"/>
  <text x="32"   y="450" class="badge badge-dag">LIST</text>
  <text x="32"   y="470" class="code">type List&lt;T&gt; =</text>
  <text x="32"   y="486" class="code">  Cons{h:T,t:List&lt;T&gt;} | Nil</text>
  <rect x="320"  y="434" width="232" height="76" class="card"/>
  <text x="332"  y="454" class="code-sm">pub enum List&lt;T&gt; {</text>
  <text x="332"  y="468" class="code-sm">  Cons{h:T,t:Box&lt;List&lt;T&gt;&gt;},</text>
  <text x="332"  y="482" class="code-sm">  Nil }</text>
  <rect x="556"  y="434" width="232" height="76" class="card"/>
  <text x="568"  y="454" class="code-sm">@dataclass</text>
  <text x="568"  y="468" class="code-sm">class Cons: h:T; t:'List[T]'</text>
  <text x="568"  y="482" class="code-sm">List = Union[Cons[T], Nil]</text>
  <rect x="792"  y="434" width="232" height="76" class="card"/>
  <text x="804"  y="454" class="code-sm">type List[T any] interface{</text>
  <text x="804"  y="468" class="code-sm">  isList() // recursive Cons,</text>
  <text x="804"  y="482" class="code-sm">}        // Nil_</text>
  <rect x="1028" y="434" width="232" height="76" class="card"/>
  <text x="1040" y="454" class="code-sm">type List&lt;T&gt; =</text>
  <text x="1040" y="468" class="code-sm">  | { kind:'Cons', h:T,</text>
  <text x="1040" y="482" class="code-sm">      t:List&lt;T&gt; } | {kind:'Nil'};</text>

  <!-- Row 6: Tree (y=514) -->
  <rect x="20"   y="514" width="280" height="76" class="card"/>
  <text x="32"   y="530" class="badge badge-dag">TREE</text>
  <text x="32"   y="550" class="code">type Tree&lt;T&gt; = Leaf{v:T}</text>
  <text x="32"   y="566" class="code">  | Node{l:Tree,r:Tree}</text>
  <rect x="320"  y="514" width="232" height="76" class="card"/>
  <text x="332"  y="534" class="code-sm">pub enum Tree&lt;T&gt; {</text>
  <text x="332"  y="548" class="code-sm">  Leaf{v:T},</text>
  <text x="332"  y="562" class="code-sm">  Node{l:Box&lt;..&gt;, r:Box&lt;..&gt;} }</text>
  <rect x="556"  y="514" width="232" height="76" class="card"/>
  <text x="568"  y="534" class="code-sm">@dataclass</text>
  <text x="568"  y="548" class="code-sm">class Leaf: v:T</text>
  <text x="568"  y="562" class="code-sm">Tree = Union[Leaf[T], Node[T]]</text>
  <rect x="792"  y="514" width="232" height="76" class="card"/>
  <text x="804"  y="534" class="code-sm">type Tree[T any] interface{</text>
  <text x="804"  y="548" class="code-sm">  isTree() // Leaf, Node</text>
  <text x="804"  y="562" class="code-sm">}</text>
  <rect x="1028" y="514" width="232" height="76" class="card"/>
  <text x="1040" y="534" class="code-sm">type Tree&lt;T&gt; =</text>
  <text x="1040" y="548" class="code-sm">  | { kind:'Leaf', v:T }</text>
  <text x="1040" y="562" class="code-sm">  | { kind:'Node', ... };</text>

  <!-- Row 7: Either (y=594) -->
  <rect x="20"   y="594" width="280" height="76" class="card"/>
  <text x="32"   y="610" class="badge badge-dag">EITHER</text>
  <text x="32"   y="630" class="code">type Either&lt;L, R&gt; =</text>
  <text x="32"   y="646" class="code">  Lhs{v:L} | Rhs{v:R}</text>
  <rect x="320"  y="594" width="232" height="76" class="card"/>
  <text x="332"  y="614" class="code-sm">pub enum Either&lt;L, R&gt; {</text>
  <text x="332"  y="628" class="code-sm">  Lhs{v:L}, Rhs{v:R}</text>
  <text x="332"  y="642" class="code-sm">}</text>
  <rect x="556"  y="594" width="232" height="76" class="card"/>
  <text x="568"  y="614" class="code-sm">Either = Union[</text>
  <text x="568"  y="628" class="code-sm">  Lhs[L], Rhs[R]</text>
  <text x="568"  y="642" class="code-sm">]</text>
  <rect x="792"  y="594" width="232" height="76" class="card"/>
  <text x="804"  y="614" class="code-sm">type Either[L,R any] interface{</text>
  <text x="804"  y="628" class="code-sm">  isEither() // Lhs, Rhs</text>
  <text x="804"  y="642" class="code-sm">}</text>
  <rect x="1028" y="594" width="232" height="76" class="card"/>
  <text x="1040" y="614" class="code-sm">type Either&lt;L, R&gt; =</text>
  <text x="1040" y="628" class="code-sm">  | { kind:'Lhs', v:L }</text>
  <text x="1040" y="642" class="code-sm">  | { kind:'Rhs', v:R };</text>

  <!-- Row 8: NonEmpty (y=674) -->
  <rect x="20"   y="674" width="280" height="76" class="card"/>
  <text x="32"   y="690" class="badge badge-dag">NONEMPTY</text>
  <text x="32"   y="710" class="code">type NonEmpty&lt;T&gt; {</text>
  <text x="32"   y="726" class="code">  head: T; tail: List&lt;T&gt; }</text>
  <rect x="320"  y="674" width="232" height="76" class="card"/>
  <text x="332"  y="694" class="code-sm">pub struct NonEmpty&lt;T&gt; {</text>
  <text x="332"  y="708" class="code-sm">  pub head: T,</text>
  <text x="332"  y="722" class="code-sm">  pub tail: List&lt;T&gt;,</text>
  <text x="332"  y="736" class="code-sm">}</text>
  <rect x="556"  y="674" width="232" height="76" class="card"/>
  <text x="568"  y="694" class="code-sm">@dataclass</text>
  <text x="568"  y="708" class="code-sm">class NonEmpty(Generic[T]):</text>
  <text x="568"  y="722" class="code-sm">  head: T; tail: List[T]</text>
  <rect x="792"  y="674" width="232" height="76" class="card"/>
  <text x="804"  y="694" class="code-sm">type NonEmpty[T any] struct{</text>
  <text x="804"  y="708" class="code-sm">  Head T; Tail List[T]</text>
  <text x="804"  y="722" class="code-sm">}</text>
  <rect x="1028" y="674" width="232" height="76" class="card"/>
  <text x="1040" y="694" class="code-sm">interface NonEmpty&lt;T&gt; {</text>
  <text x="1040" y="708" class="code-sm">  head: T;</text>
  <text x="1040" y="722" class="code-sm">  tail: List&lt;T&gt;;</text>
  <text x="1040" y="736" class="code-sm">}</text>

  <text x="20" y="780" class="punchline">A new type adds one row. A new language adds one column. The grid grows fast — your intent doesn't.</text>
</svg>
