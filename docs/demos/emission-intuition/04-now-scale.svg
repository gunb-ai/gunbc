<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .punchline { font-size: 14px; font-weight: 600; fill: #1f2328; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Now scale.</text>
  <text x="20" y="48" class="sub">Six types, six consumers. The wings still fit on a page. The middle is a real working module.</text>

  <text x="20"   y="78" class="col-label">BUSINESS LOGIC</text>
  <text x="320"  y="78" class="col-label">RUST — GENERATED</text>
  <text x="820"  y="78" class="col-label">FACTS</text>

  <!-- LEFT: business logic .dag (6 functions) -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="998" class="card"/>
  <text x="32" y="130" class="code">fn swap&lt;A, B&gt;(p: Pair&lt;A, B&gt;)</text>
  <text x="32" y="148" class="code">  -&gt; Pair&lt;B, A&gt; =</text>
  <text x="32" y="166" class="code">  Pair { first:  p.second,</text>
  <text x="32" y="184" class="code">         second: p.first }</text>
  <text x="32" y="218" class="code">fn unwrap_str(</text>
  <text x="32" y="236" class="code">    s: Sum&lt;Str, Str&gt;) -&gt; Str =</text>
  <text x="32" y="254" class="code">  match s {</text>
  <text x="32" y="272" class="code">    Left  { value } =&gt; value</text>
  <text x="32" y="290" class="code">    Right { value } =&gt; value</text>
  <text x="32" y="308" class="code">  }</text>
  <text x="32" y="342" class="code">fn or_else&lt;T&gt;(</text>
  <text x="32" y="360" class="code">    o: Option&lt;T&gt;, d: T) -&gt; T =</text>
  <text x="32" y="378" class="code">  match o {</text>
  <text x="32" y="396" class="code">    Some { value } =&gt; value</text>
  <text x="32" y="414" class="code">    None           =&gt; d</text>
  <text x="32" y="432" class="code">  }</text>
  <text x="32" y="466" class="code">fn unwrap_or&lt;T, E&gt;(</text>
  <text x="32" y="484" class="code">    r: Result&lt;T, E&gt;, d: T) -&gt; T =</text>
  <text x="32" y="502" class="code">  match r {</text>
  <text x="32" y="520" class="code">    Ok  { value } =&gt; value</text>
  <text x="32" y="538" class="code">    Err { _ }     =&gt; d</text>
  <text x="32" y="556" class="code">  }</text>
  <text x="32" y="590" class="code">fn length&lt;T&gt;(</text>
  <text x="32" y="608" class="code">    l: List&lt;T&gt;) -&gt; Int =</text>
  <text x="32" y="626" class="code">  match l {</text>
  <text x="32" y="644" class="code">    Cons { tail, _ } =&gt;</text>
  <text x="32" y="662" class="code">      1 + length(tail)</text>
  <text x="32" y="680" class="code">    Nil =&gt; 0</text>
  <text x="32" y="698" class="code">  }</text>
  <text x="32" y="732" class="code">fn depth&lt;T&gt;(</text>
  <text x="32" y="750" class="code">    t: Tree&lt;T&gt;) -&gt; Int =</text>
  <text x="32" y="768" class="code">  match t {</text>
  <text x="32" y="786" class="code">    Leaf { _ } =&gt; 1</text>
  <text x="32" y="804" class="code">    Node { left, right } =&gt;</text>
  <text x="32" y="822" class="code">      1 + max(</text>
  <text x="32" y="840" class="code">        depth(left),</text>
  <text x="32" y="858" class="code">        depth(right))</text>
  <text x="32" y="876" class="code">  }</text>

  <!-- CENTER: generated Rust -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="998" class="card"/>
  <text x="332" y="130" class="code">pub struct Pair&lt;A, B&gt; { pub first: A, pub second: B }</text>
  <text x="332" y="158" class="code">pub enum Sum&lt;A, B&gt; {</text>
  <text x="332" y="176" class="code">    Left  { value: A }, Right { value: B },</text>
  <text x="332" y="194" class="code">}</text>
  <text x="332" y="222" class="code">pub enum Option&lt;T&gt; { Some { value: T }, None }</text>
  <text x="332" y="250" class="code">pub enum Result&lt;T, E&gt; {</text>
  <text x="332" y="268" class="code">    Ok  { value: T }, Err { error: E },</text>
  <text x="332" y="286" class="code">}</text>
  <text x="332" y="314" class="code">pub enum List&lt;T&gt; {</text>
  <text x="332" y="332" class="code">    Cons { head: T, tail: Box&lt;List&lt;T&gt;&gt; },</text>
  <text x="332" y="350" class="code">    Nil,</text>
  <text x="332" y="368" class="code">}</text>
  <text x="332" y="396" class="code">pub enum Tree&lt;T&gt; {</text>
  <text x="332" y="414" class="code">    Leaf { value: T },</text>
  <text x="332" y="432" class="code">    Node { left:  Box&lt;Tree&lt;T&gt;&gt;,</text>
  <text x="332" y="450" class="code">           right: Box&lt;Tree&lt;T&gt;&gt; },</text>
  <text x="332" y="468" class="code">}</text>
  <text x="332" y="506" class="code">pub fn swap&lt;A, B&gt;(p: Pair&lt;A, B&gt;) -&gt; Pair&lt;B, A&gt; {</text>
  <text x="332" y="524" class="code">    Pair { first: p.second, second: p.first }</text>
  <text x="332" y="542" class="code">}</text>
  <text x="332" y="570" class="code">pub fn unwrap_str(s: Sum&lt;String, String&gt;) -&gt; String {</text>
  <text x="332" y="588" class="code">    match s {</text>
  <text x="332" y="606" class="code">        Sum::Left  { value } =&gt; value,</text>
  <text x="332" y="624" class="code">        Sum::Right { value } =&gt; value,</text>
  <text x="332" y="642" class="code">    }</text>
  <text x="332" y="660" class="code">}</text>
  <text x="332" y="688" class="code">pub fn or_else&lt;T&gt;(o: Option&lt;T&gt;, d: T) -&gt; T {</text>
  <text x="332" y="706" class="code">    match o { Option::Some{value}=&gt;value, Option::None=&gt;d }</text>
  <text x="332" y="724" class="code">}</text>
  <text x="332" y="752" class="code">pub fn unwrap_or&lt;T, E&gt;(r: Result&lt;T, E&gt;, d: T) -&gt; T {</text>
  <text x="332" y="770" class="code">    match r {</text>
  <text x="332" y="788" class="code">        Result::Ok  { value }    =&gt; value,</text>
  <text x="332" y="806" class="code">        Result::Err { error: _ } =&gt; d,</text>
  <text x="332" y="824" class="code">    }</text>
  <text x="332" y="842" class="code">}</text>
  <text x="332" y="870" class="code">pub fn length&lt;T&gt;(l: List&lt;T&gt;) -&gt; i64 {</text>
  <text x="332" y="888" class="code">    match l {</text>
  <text x="332" y="906" class="code">        List::Cons { tail, .. } =&gt; 1 + length(*tail),</text>
  <text x="332" y="924" class="code">        List::Nil =&gt; 0,</text>
  <text x="332" y="942" class="code">    }</text>
  <text x="332" y="960" class="code">}</text>
  <text x="332" y="988" class="code">pub fn depth&lt;T&gt;(t: Tree&lt;T&gt;) -&gt; i64 {</text>
  <text x="332" y="1006" class="code">    match t {</text>
  <text x="332" y="1024" class="code">        Tree::Leaf { .. } =&gt; 1,</text>
  <text x="332" y="1042" class="code">        Tree::Node { left, right } =&gt;</text>
  <text x="332" y="1060" class="code">            1 + std::cmp::max(depth(left), depth(right)),</text>
  <text x="332" y="1078" class="code">    }</text>
  <text x="332" y="1096" class="code">}</text>

  <!-- RIGHT: facts .dag (6 type defs) -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="528" class="card"/>
  <text x="832" y="130" class="code">type Pair&lt;A, B&gt; {</text>
  <text x="832" y="148" class="code">  first: A; second: B</text>
  <text x="832" y="166" class="code">}</text>
  <text x="832" y="200" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="218" class="code">    Left  { value: A }</text>
  <text x="832" y="236" class="code">  | Right { value: B }</text>
  <text x="832" y="270" class="code">type Option&lt;T&gt; =</text>
  <text x="832" y="288" class="code">    Some { value: T }</text>
  <text x="832" y="306" class="code">  | None</text>
  <text x="832" y="340" class="code">type Result&lt;T, E&gt; =</text>
  <text x="832" y="358" class="code">    Ok  { value: T }</text>
  <text x="832" y="376" class="code">  | Err { error: E }</text>
  <text x="832" y="410" class="code">type List&lt;T&gt; =</text>
  <text x="832" y="428" class="code">    Cons { head: T,</text>
  <text x="832" y="446" class="code">           tail: List&lt;T&gt; }</text>
  <text x="832" y="464" class="code">  | Nil</text>
  <text x="832" y="498" class="code">type Tree&lt;T&gt; =</text>
  <text x="832" y="516" class="code">    Leaf { value: T }</text>
  <text x="832" y="534" class="code">  | Node { left:  Tree&lt;T&gt;,</text>
  <text x="832" y="552" class="code">           right: Tree&lt;T&gt; }</text>

  <text x="20" y="1170" class="punchline">A few inches of source on each wing. A real Rust module in the middle. Swap "Rust" for any target — the wings don't change.</text>
</svg>
