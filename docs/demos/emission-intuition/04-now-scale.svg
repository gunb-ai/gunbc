<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .layer  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-style: italic; fill: #6e7781; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .stable { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
      .stable-text { font-size: 10px; font-weight: 600; fill: #0969da; letter-spacing: 0.04em; }
      .punchline { font-size: 14px; font-weight: 600; fill: #1f2328; }
    </style>
  </defs>

  <text x="20" y="30" class="title">An app uses the library.</text>
  <text x="20" y="48" class="sub">Same Sum on the right. App handler on the left composes library functions through the helpers. The middle is the real Rust module.</text>

  <text x="20"  y="78" class="col-label">BUSINESS LOGIC</text>
  <text x="320" y="78" class="col-label">RUST — GENERATED</text>
  <text x="820" y="78" class="col-label">FACTS</text>

  <!-- LEFT: 4 layers -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="1098" class="card"/>
  <text x="32" y="130" class="layer">// primitive consumer</text>
  <text x="32" y="150" class="code">fn unwrap_str(</text>
  <text x="32" y="168" class="code">    s: Sum&lt;Str, Str&gt;) -&gt; Str =</text>
  <text x="32" y="186" class="code">  match s {</text>
  <text x="32" y="204" class="code">    Left  { value } =&gt; value</text>
  <text x="32" y="222" class="code">    Right { value } =&gt; value }</text>
  <text x="32" y="260" class="layer">// helpers</text>
  <text x="32" y="280" class="code">fn map&lt;A,B,C&gt;(s: Sum&lt;A,B&gt;,</text>
  <text x="32" y="298" class="code">    f: A-&gt;C) -&gt; Sum&lt;C,B&gt; =</text>
  <text x="32" y="316" class="code">  match s {</text>
  <text x="32" y="334" class="code">    Left  { value } =&gt; Left { value: f(value) }</text>
  <text x="32" y="352" class="code">    Right { value } =&gt; Right { value } }</text>
  <text x="32" y="386" class="code">fn and_then&lt;A,B,C&gt;(s: Sum&lt;A,B&gt;,</text>
  <text x="32" y="404" class="code">    f: A-&gt;Sum&lt;C,B&gt;) -&gt; Sum&lt;C,B&gt; =</text>
  <text x="32" y="422" class="code">  match s {</text>
  <text x="32" y="440" class="code">    Left  { value } =&gt; f(value)</text>
  <text x="32" y="458" class="code">    Right { value } =&gt; Right { value } }</text>
  <text x="32" y="496" class="layer">// library</text>
  <text x="32" y="516" class="code">fn parse_int(s: Str)</text>
  <text x="32" y="534" class="code">  -&gt; Sum&lt;ParseError, Int&gt;</text>
  <text x="32" y="552" class="code"></text>
  <text x="32" y="572" class="code">fn http_get(url: Str)</text>
  <text x="32" y="590" class="code">  -&gt; Sum&lt;HttpError, Bytes&gt;</text>
  <text x="32" y="610" class="code"></text>
  <text x="32" y="630" class="code">fn validate_email(s: Str)</text>
  <text x="32" y="648" class="code">  -&gt; Sum&lt;ValidationError, Email&gt;</text>
  <text x="32" y="686" class="layer">// app — composes everything</text>
  <text x="32" y="706" class="code">fn handle_signup(</text>
  <text x="32" y="724" class="code">    req: SignupRequest</text>
  <text x="32" y="742" class="code">) -&gt; Sum&lt;AppError, Session&gt; =</text>
  <text x="32" y="760" class="code">  and_then(</text>
  <text x="32" y="778" class="code">    validate_email(req.email),</text>
  <text x="32" y="796" class="code">    fn(email) =&gt;</text>
  <text x="32" y="814" class="code">      and_then(</text>
  <text x="32" y="832" class="code">        http_get(profile_url(email)),</text>
  <text x="32" y="850" class="code">        fn(bytes) =&gt;</text>
  <text x="32" y="868" class="code">          map(</text>
  <text x="32" y="886" class="code">            parse_int(bytes_to_str(bytes)),</text>
  <text x="32" y="904" class="code">            fn(uid) =&gt; mint_session(uid))))</text>

  <!-- CENTER: emission for everything -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="1098" class="card"/>
  <text x="332" y="130" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="148" class="code">pub enum Sum&lt;A, B&gt; { Left { value: A }, Right { value: B } }</text>
  <text x="332" y="176" class="code">impl&lt;A, B&gt; Sum&lt;A, B&gt; {</text>
  <text x="332" y="194" class="code">    pub fn left(value: A)  -&gt; Self { Self::Left  { value } }</text>
  <text x="332" y="212" class="code">    pub fn right(value: B) -&gt; Self { Self::Right { value } }</text>
  <text x="332" y="230" class="code">    pub fn is_left(&amp;self)  -&gt; bool { matches!(self, Self::Left  {..}) }</text>
  <text x="332" y="248" class="code">    pub fn is_right(&amp;self) -&gt; bool { matches!(self, Self::Right {..}) }</text>
  <text x="332" y="266" class="code">}</text>
  <text x="332" y="294" class="code">pub type Result&lt;T, E&gt; = Sum&lt;E, T&gt;;</text>
  <text x="332" y="332" class="code">pub fn unwrap_str(s: Sum&lt;String, String&gt;) -&gt; String {</text>
  <text x="332" y="350" class="code">    match s {</text>
  <text x="332" y="368" class="code">        Sum::Left  { value } =&gt; value,</text>
  <text x="332" y="386" class="code">        Sum::Right { value } =&gt; value,</text>
  <text x="332" y="404" class="code">    }</text>
  <text x="332" y="422" class="code">}</text>
  <text x="332" y="450" class="code">pub fn map&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;, f: impl FnOnce(A) -&gt; C)</text>
  <text x="332" y="468" class="code">    -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="486" class="code">    match s {</text>
  <text x="332" y="504" class="code">        Sum::Left  { value } =&gt; Sum::Left  { value: f(value) },</text>
  <text x="332" y="522" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="540" class="code">    }</text>
  <text x="332" y="558" class="code">}</text>
  <text x="332" y="586" class="code">pub fn and_then&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;,</text>
  <text x="332" y="604" class="code">    f: impl FnOnce(A) -&gt; Sum&lt;C, B&gt;) -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="622" class="code">    match s {</text>
  <text x="332" y="640" class="code">        Sum::Left  { value } =&gt; f(value),</text>
  <text x="332" y="658" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="676" class="code">    }</text>
  <text x="332" y="694" class="code">}</text>
  <text x="332" y="722" class="code">pub fn parse_int(s: &amp;str) -&gt; Sum&lt;ParseError, i64&gt; {</text>
  <text x="332" y="740" class="code">    s.parse::&lt;i64&gt;().map_or_else(</text>
  <text x="332" y="758" class="code">        |e| Sum::Left  { value: ParseError::from(e) },</text>
  <text x="332" y="776" class="code">        |n| Sum::Right { value: n })</text>
  <text x="332" y="794" class="code">}</text>
  <text x="332" y="822" class="code">pub fn http_get(url: &amp;str) -&gt; Sum&lt;HttpError, Bytes&gt; {</text>
  <text x="332" y="840" class="code">    /* fetch implementation */</text>
  <text x="332" y="858" class="code">}</text>
  <text x="332" y="886" class="code">pub fn validate_email(s: &amp;str) -&gt; Sum&lt;ValidationError, Email&gt; {</text>
  <text x="332" y="904" class="code">    /* regex implementation */</text>
  <text x="332" y="922" class="code">}</text>
  <text x="332" y="950" class="code">pub fn handle_signup(req: SignupRequest)</text>
  <text x="332" y="968" class="code">    -&gt; Sum&lt;AppError, Session&gt; {</text>
  <text x="332" y="986" class="code">    and_then(</text>
  <text x="332" y="1004" class="code">        validate_email(&amp;req.email),</text>
  <text x="332" y="1022" class="code">        |email| and_then(</text>
  <text x="332" y="1040" class="code">            http_get(&amp;profile_url(&amp;email))</text>
  <text x="332" y="1058" class="code">                .map_left(AppError::Http),</text>
  <text x="332" y="1076" class="code">            |bytes| map(</text>
  <text x="332" y="1094" class="code">                parse_int(&amp;bytes_to_str(bytes))</text>
  <text x="332" y="1112" class="code">                    .map_left(AppError::Parse),</text>
  <text x="332" y="1130" class="code">                |uid| mint_session(uid))))</text>
  <text x="332" y="1148" class="code">}</text>

  <!-- RIGHT: facts — STILL essentially Sum -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="98" class="card"/>
  <text x="832" y="130" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="148" class="code">  Left{value:A} | Right{value:B}</text>
  <text x="832" y="178" class="code">type Result&lt;T, E&gt; = Sum&lt;E, T&gt;</text>
  <rect x="820" y="220" width="240" height="18" rx="4" class="stable"/>
  <text x="832" y="234" class="stable-text">SAME 5 LINES OF FACTS</text>

  <text x="20" y="1230" class="punchline">5 lines of facts. ~70 lines of business logic on the left. ~150 lines of generated Rust in the middle. The fact never changed. The middle is what runs.</text>
</svg>
