<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12px; fill: #57606a; }
      .col-label { font-size: 10px; font-weight: 700; fill: #57606a; letter-spacing: 0.10em; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; }
      .badge-rust { fill: #ce422b; }
      .badge-dag  { fill: #57606a; }
      .code   { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; fill: #1f2328; }
      .layer  { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; font-style: italic; fill: #6e7781; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .card-header { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .punchline { font-size: 14px; font-weight: 600; fill: #1f2328; }
    </style>
  </defs>

  <text x="20" y="30" class="title">Four layers — primitive · helpers · library · domain.</text>
  <text x="20" y="48" class="sub">A business handler on the left. It talks only to the domain and library. Sum, Result, the helpers — all abstracted away in the source, all materialized in the middle.</text>

  <text x="20"  y="78" class="col-label">BUSINESS LOGIC · HELPERS · LIBRARIES</text>
  <text x="320" y="78" class="col-label">RUST — GENERATED</text>
  <text x="820" y="78" class="col-label">FACTS · STRUCTS · OBJECTS</text>

  <!-- LEFT: business handler — touches only domain + library -->
  <rect x="20" y="88" width="280" height="22" class="card-header"/>
  <text x="32" y="103" class="badge badge-dag">.dag</text>
  <rect x="20" y="110" width="280" height="568" class="card"/>
  <text x="32" y="130" class="layer">// library — known signatures</text>
  <text x="32" y="150" class="code">fn validate(</text>
  <text x="32" y="168" class="code">    req: LoginRequest</text>
  <text x="32" y="186" class="code">) -&gt; ApiResponse&lt;Credentials&gt;</text>
  <text x="32" y="222" class="code">fn fetch_user(</text>
  <text x="32" y="240" class="code">    creds: Credentials</text>
  <text x="32" y="258" class="code">) -&gt; ApiResponse&lt;User&gt;</text>
  <text x="32" y="294" class="code">fn mint_session(</text>
  <text x="32" y="312" class="code">    user: User</text>
  <text x="32" y="330" class="code">) -&gt; ApiResponse&lt;UserSession&gt;</text>
  <text x="32" y="368" class="layer">// app — handler composes them</text>
  <text x="32" y="388" class="code">fn handle_login(</text>
  <text x="32" y="406" class="code">    req: LoginRequest</text>
  <text x="32" y="424" class="code">) -&gt; ApiResponse&lt;UserSession&gt; =</text>
  <text x="32" y="442" class="code">  and_then(</text>
  <text x="32" y="460" class="code">    validate(req),</text>
  <text x="32" y="478" class="code">    fn(creds) =&gt;</text>
  <text x="32" y="496" class="code">      and_then(</text>
  <text x="32" y="514" class="code">        fetch_user(creds),</text>
  <text x="32" y="532" class="code">        fn(user) =&gt; mint_session(user)))</text>
  <text x="32" y="572" class="layer">// the handler doesn't say "Sum"</text>
  <text x="32" y="588" class="layer">// or "Result" anywhere. Lower</text>
  <text x="32" y="604" class="layer">// layers are abstract here.</text>

  <!-- CENTER: full emission for all 4 layers -->
  <rect x="320" y="88" width="480" height="22" class="card-header"/>
  <text x="332" y="103" class="badge badge-rust">RUST</text>
  <rect x="320" y="110" width="480" height="1318" class="card"/>
  <text x="332" y="130" class="layer">// primitive</text>
  <text x="332" y="150" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="168" class="code">pub enum Sum&lt;A, B&gt; { Left { value: A }, Right { value: B } }</text>
  <text x="332" y="196" class="code">impl&lt;A, B&gt; Sum&lt;A, B&gt; {</text>
  <text x="332" y="214" class="code">    pub fn left(value: A)  -&gt; Self { Self::Left  { value } }</text>
  <text x="332" y="232" class="code">    pub fn right(value: B) -&gt; Self { Self::Right { value } }</text>
  <text x="332" y="250" class="code">    pub fn is_left(&amp;self)  -&gt; bool { matches!(self, Self::Left  {..}) }</text>
  <text x="332" y="268" class="code">    pub fn is_right(&amp;self) -&gt; bool { matches!(self, Self::Right {..}) }</text>
  <text x="332" y="286" class="code">}</text>
  <text x="332" y="314" class="layer">// helpers</text>
  <text x="332" y="334" class="code">pub type Result&lt;T, E&gt; = Sum&lt;T, E&gt;;</text>
  <text x="332" y="362" class="code">pub fn map&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;, f: impl FnOnce(A) -&gt; C)</text>
  <text x="332" y="380" class="code">    -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="398" class="code">    match s {</text>
  <text x="332" y="416" class="code">        Sum::Left  { value } =&gt; Sum::Left  { value: f(value) },</text>
  <text x="332" y="434" class="code">        Sum::Right { value } =&gt; Sum::Right { value },</text>
  <text x="332" y="452" class="code">    }</text>
  <text x="332" y="470" class="code">}</text>
  <text x="332" y="498" class="code">pub fn and_then&lt;A, B, C&gt;(s: Sum&lt;A, B&gt;,</text>
  <text x="332" y="516" class="code">    f: impl FnOnce(A) -&gt; Sum&lt;C, B&gt;) -&gt; Sum&lt;C, B&gt; {</text>
  <text x="332" y="534" class="code">    match s { Sum::Left{value}=&gt;f(value), Sum::Right{value}=&gt;Sum::Right{value} }</text>
  <text x="332" y="552" class="code">}</text>
  <text x="332" y="580" class="layer">// library</text>
  <text x="332" y="600" class="code">pub type ApiResponse&lt;T&gt; = Result&lt;T, HttpError&gt;;</text>
  <text x="332" y="628" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="646" class="code">pub struct HttpError { pub status: i32, pub body: String }</text>
  <text x="332" y="664" class="code">impl HttpError {</text>
  <text x="332" y="682" class="code">    pub fn new(status: i32, body: String) -&gt; Self { Self { status, body } }</text>
  <text x="332" y="700" class="code">}</text>
  <text x="332" y="728" class="layer">// domain</text>
  <text x="332" y="748" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="766" class="code">pub struct LoginRequest { pub email: String, pub password: String }</text>
  <text x="332" y="784" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="802" class="code">pub struct Credentials  { pub email: String, pub hash: Vec&lt;u8&gt; }</text>
  <text x="332" y="820" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="838" class="code">pub struct User { pub id: u64, pub email: String }</text>
  <text x="332" y="856" class="code">#[derive(Debug, Clone, PartialEq, Eq, Hash)]</text>
  <text x="332" y="874" class="code">pub struct UserSession { pub user_id: u64, pub expires_at: i64 }</text>
  <text x="332" y="902" class="code">impl LoginRequest {</text>
  <text x="332" y="920" class="code">    pub fn new(email: String, password: String) -&gt; Self {</text>
  <text x="332" y="938" class="code">        Self { email, password }</text>
  <text x="332" y="956" class="code">    }</text>
  <text x="332" y="974" class="code">}</text>
  <text x="332" y="1002" class="code">pub fn validate(req: LoginRequest)     -&gt; ApiResponse&lt;Credentials&gt; { unimplemented!() }</text>
  <text x="332" y="1020" class="code">pub fn fetch_user(creds: Credentials)  -&gt; ApiResponse&lt;User&gt;        { unimplemented!() }</text>
  <text x="332" y="1038" class="code">pub fn mint_session(user: User)        -&gt; ApiResponse&lt;UserSession&gt; { unimplemented!() }</text>
  <text x="332" y="1066" class="layer">// app handler — composes the library</text>
  <text x="332" y="1086" class="code">pub fn handle_login(</text>
  <text x="332" y="1104" class="code">    req: LoginRequest,</text>
  <text x="332" y="1122" class="code">) -&gt; ApiResponse&lt;UserSession&gt; {</text>
  <text x="332" y="1140" class="code">    and_then(</text>
  <text x="332" y="1158" class="code">        validate(req),</text>
  <text x="332" y="1176" class="code">        |creds| and_then(</text>
  <text x="332" y="1194" class="code">            fetch_user(creds),</text>
  <text x="332" y="1212" class="code">            |user| mint_session(user),</text>
  <text x="332" y="1230" class="code">        ),</text>
  <text x="332" y="1248" class="code">    )</text>
  <text x="332" y="1266" class="code">}</text>

  <!-- RIGHT: 4 layers stacked -->
  <rect x="820" y="88" width="280" height="22" class="card-header"/>
  <text x="832" y="103" class="badge badge-dag">.dag</text>
  <rect x="820" y="110" width="280" height="638" class="card"/>
  <text x="832" y="130" class="layer">// PRIMITIVE</text>
  <text x="832" y="150" class="code">type Sum&lt;A, B&gt; =</text>
  <text x="832" y="168" class="code">  Left{value:A} | Right{value:B}</text>
  <text x="832" y="208" class="layer">// HELPERS</text>
  <text x="832" y="228" class="code">type Result&lt;T, E&gt; =</text>
  <text x="832" y="246" class="code">  Sum&lt;T, E&gt;</text>
  <text x="832" y="286" class="layer">// LIBRARY</text>
  <text x="832" y="306" class="code">type ApiResponse&lt;T&gt; =</text>
  <text x="832" y="324" class="code">  Result&lt;T, HttpError&gt;</text>
  <text x="832" y="352" class="code">type HttpError {</text>
  <text x="832" y="370" class="code">  status: Int; body: Str</text>
  <text x="832" y="388" class="code">}</text>
  <text x="832" y="428" class="layer">// DOMAIN</text>
  <text x="832" y="448" class="code">type LoginRequest {</text>
  <text x="832" y="466" class="code">  email: Str</text>
  <text x="832" y="484" class="code">  password: Str</text>
  <text x="832" y="502" class="code">}</text>
  <text x="832" y="530" class="code">type Credentials {</text>
  <text x="832" y="548" class="code">  email: Str; hash: Bytes</text>
  <text x="832" y="566" class="code">}</text>
  <text x="832" y="594" class="code">type User {</text>
  <text x="832" y="612" class="code">  id: Int; email: Str</text>
  <text x="832" y="630" class="code">}</text>
  <text x="832" y="658" class="code">type UserSession {</text>
  <text x="832" y="676" class="code">  user_id: Int</text>
  <text x="832" y="694" class="code">  expires_at: Int</text>
  <text x="832" y="712" class="code">}</text>

  <text x="20" y="1470" class="punchline">Four stacked layers on the right. The handler on the left only writes against the top two. The middle is the whole stack — types, helpers, library scaffolding, app body — ready to compile (drop in the library bodies and it runs).</text>
</svg>
