<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gunbc</title>
  <meta name="description" content="gunbc — a structural compiler for composable systems">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #090e09;
      color: #9aaa9a;
      font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, 'Courier New', monospace;
      min-height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      padding: 2.5rem 3.5rem;
      max-width: 520px;
      pointer-events: none;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: #c4d4c4;
      margin-bottom: 0.8rem;
    }

    .tagline {
      font-size: 0.85rem;
      line-height: 1.9;
      opacity: 0.5;
      margin-bottom: 2rem;
    }

    nav { display: flex; gap: 1.4rem; }

    nav a {
      pointer-events: auto;
      font-size: 0.8rem;
      color: #5a8a5a;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s, color 0.3s;
      padding-bottom: 2px;
    }

    nav a:hover {
      color: #7aaa7a;
      border-color: #5a8a5a;
    }

    @media (max-width: 700px) {
      main { padding: 2rem 1.5rem; max-width: none; }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <canvas id="tc"></canvas>
  <main>
    <h1>gunbc</h1>
    <p class="tagline">a structural compiler<br>for composable systems</p>
    <nav>
      <a href="https://github.com/gunb-ai/gunbc">source</a>
    </nav>
  </main>
  <script>
    const canvas = document.getElementById('tc');
    const ctx = canvas.getContext('2d');
    let W, H;
    const branches = [];
    const leaves = [];
    let branchImg = null;
    const mouse = { x: -9999, y: -9999 };
    let hovering = false;

    // Seeded PRNG (mulberry32)
    let _seed = 0;
    function seed(s) { _seed = s | 0; }
    function rand() {
      _seed = _seed + 0x6D2B79F5 | 0;
      let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    const LEAF_CHARS = ['\u00B7', '\u2022', '\u2218', '\u00B0', '\u22C5', '*', '\u00D7'];
    const LEAF_GREENS = [
      '#1a4020', '#225528', '#2a6030', '#1e4a24',
      '#2d5a30', '#345a34', '#1a3520', '#264a2e',
      '#1b3a1f', '#2e5432'
    ];
    const TRUNK_DARK = '#2a1f15';
    const TRUNK_LIGHT = '#3a2a1d';

    function generate() {
      branches.length = 0;
      leaves.length = 0;
      seed(7);

      const sc = Math.min(W, H) / 850;
      const bx = W * 0.62;
      const by = H * 0.84;
      const tLen = 130 * sc;

      grow(bx, by, tLen, -Math.PI / 2 + 0.12, 0, 9, sc);

      for (const l of leaves) { l.ox = l.x; l.oy = l.y; }
    }

    function grow(x, y, len, angle, depth, maxDepth, sc) {
      if (len < 2.5 * sc) return;

      const ex = x + len * Math.cos(angle);
      const ey = y + len * Math.sin(angle);
      const cpOff = (rand() - 0.5) * len * 0.35;
      const nx = Math.cos(angle + Math.PI / 2);
      const ny = Math.sin(angle + Math.PI / 2);

      branches.push({
        x1: x, y1: y,
        cx: (x + ex) / 2 + cpOff * nx,
        cy: (y + ey) / 2 + cpOff * ny,
        x2: ex, y2: ey,
        w: Math.max(0.8, (maxDepth - depth + 1) * 1.15 * sc),
        color: depth < 3 ? TRUNK_DARK : TRUNK_LIGHT
      });

      if (depth >= 5) {
        const count = 5 + Math.floor(rand() * 14);
        const spread = (10 - depth) * 5.5 * sc;
        for (let i = 0; i < count; i++) {
          leaves.push({
            x: ex + (rand() - 0.5) * spread * 2.2,
            y: ey + (rand() - 0.5) * spread * 1.6,
            ox: 0, oy: 0,
            ch: LEAF_CHARS[Math.floor(rand() * LEAF_CHARS.length)],
            col: LEAF_GREENS[Math.floor(rand() * LEAF_GREENS.length)],
            sz: (6 + rand() * 5) * sc,
            ph: rand() * Math.PI * 2,
            sp: 0.25 + rand() * 0.8,
            fl: 0
          });
        }
      }

      if (depth >= maxDepth) return;

      const n = depth < 2 ? 2 : (rand() > 0.35 ? 2 : 3);
      for (let i = 0; i < n; i++) {
        const sp = 0.28 + rand() * 0.38;
        const na = angle + (i - (n - 1) / 2) * sp + (rand() - 0.5) * 0.15;
        const nl = len * (0.6 + rand() * 0.17);
        grow(ex, ey, nl, na, depth + 1, maxDepth, sc);
      }
    }

    function bakeBranches() {
      const off = document.createElement('canvas');
      const dpr = window.devicePixelRatio || 1;
      off.width = W * dpr;
      off.height = H * dpr;
      const oc = off.getContext('2d');
      oc.scale(dpr, dpr);
      oc.lineCap = 'round';

      for (const b of branches) {
        oc.beginPath();
        oc.moveTo(b.x1, b.y1);
        oc.quadraticCurveTo(b.cx, b.cy, b.x2, b.y2);
        oc.strokeStyle = b.color;
        oc.lineWidth = b.w;
        oc.stroke();
      }

      branchImg = off;
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      generate();
      bakeBranches();
    }

    function frame(t) {
      ctx.clearRect(0, 0, W, H);

      // Baked branches
      const dpr = window.devicePixelRatio || 1;
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(branchImg, 0, 0);
      ctx.restore();

      // Leaves
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < leaves.length; i++) {
        const l = leaves[i];
        const dx = mouse.x - l.ox;
        const dy = mouse.y - l.oy;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const target = hovering ? Math.max(0, 1 - dist / 280) : 0;
        l.fl += (target - l.fl) * 0.035;

        // Ambient micro-sway + hover flutter
        const ambient = 1.2;
        const amp = ambient + l.fl * 7;
        l.x = l.ox + Math.sin(t * 0.0009 * l.sp + l.ph) * amp;
        l.y = l.oy + Math.cos(t * 0.0011 * l.sp + l.ph * 1.3) * amp * 0.55;

        ctx.font = l.sz + 'px monospace';
        ctx.fillStyle = l.col;
        ctx.globalAlpha = 0.45 + l.fl * 0.4;
        ctx.fillText(l.ch, l.x, l.y);
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }

    document.addEventListener('mousemove', function(e) {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      hovering = true;
    });
    document.addEventListener('mouseleave', function() { hovering = false; });
    window.addEventListener('resize', resize);

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
