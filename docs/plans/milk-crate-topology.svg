<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc"><title id="title">Integrated cassette stack, wiring and middle-node service</title><desc id="desc">Concept schematic, not manufacturing geometry. Four cassette corner columns carry gravity loads. Independent front DC and rear network drops leave other nodes connected while temporary floor-supported trestles support the upper group during removal.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs><rect width="1440" height="930" fill="#f4f7fb"/><style>text{font-family:Arial,sans-serif;fill:#172b43}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52647a}.h{font-size:19px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#52647a}.post{fill:#39a4aa;stroke:#187078;stroke-width:2}.tray{fill:#cde9eb;stroke:#187078;stroke-width:2}.node{fill:#c9d2db;stroke:#65768a;stroke-width:1.5}.dc{fill:none;stroke:#dc8a23;stroke-width:4}.net{fill:none;stroke:#687bd0;stroke-width:3}.support{fill:#d3dbe5;stroke:#62748b;stroke-width:2}</style><text x="44" y="48" class="title">One cassette, one structural layer</text><text x="44" y="77" class="sub">Milk-crate architecture • independent cable drops • temporary supports for a middle-node pop</text><text x="44" y="105" class="small">CONCEPT REVIEW — not scaled CAD, structural qualification, or a print-ready assembly</text><rect x="28" y="127" width="681" height="633" rx="16" fill="white"/><rect x="730" y="127" width="682" height="633" rx="16" fill="white"/><text x="50" y="160" class="h">Normal operation · front-side perspective</text><text x="750" y="160" class="h">Service · support the upper group first</text><rect x="100" y="425" width="20" height="108" class="post"/><rect x="345" y="425" width="20" height="108" class="post"/><rect x="96" y="533" width="273" height="14" class="tray"/><rect x="133" y="494" width="190" height="10" class="node"/><rect x="195" y="461" width="65" height="32" class="node"/><text x="138" y="525" class="label">Node 1</text><rect x="100" y="303" width="20" height="108" class="post"/><rect x="345" y="303" width="20" height="108" class="post"/><rect x="96" y="411" width="273" height="14" class="tray"/><rect x="133" y="372" width="190" height="10" class="node"/><rect x="195" y="339" width="65" height="32" class="node"/><text x="138" y="403" class="label">Node 2</text><rect x="100" y="181" width="20" height="108" class="post"/><rect x="345" y="181" width="20" height="108" class="post"/><rect x="96" y="289" width="273" height="14" class="tray"/><rect x="133" y="250" width="190" height="10" class="node"/><rect x="195" y="217" width="65" height="32" class="node"/><text x="138" y="281" class="label">Node 3</text><rect x="95" y="565" width="275" height="90" rx="5" fill="#e6e9ef" stroke="#65768a" stroke-width="2"/><text x="119" y="594" class="label">Power cassette at base</text><text x="119" y="617" class="small">Enclosed PSU + protected branches</text><text x="119" y="638" class="small">Mass / supply selection unresolved</text><path d="M60 675 H415" stroke="#7e8c9b" stroke-width="3"/><rect x="835" y="425" width="20" height="108" class="post"/><rect x="1080" y="425" width="20" height="108" class="post"/><rect x="831" y="533" width="273" height="14" class="tray"/><rect x="868" y="494" width="190" height="10" class="node"/><rect x="930" y="461" width="65" height="32" class="node"/><text x="873" y="525" class="label">Node 1</text><rect x="835" y="181" width="20" height="108" class="post"/><rect x="1080" y="181" width="20" height="108" class="post"/><rect x="831" y="289" width="273" height="14" class="tray"/><rect x="868" y="250" width="190" height="10" class="node"/><rect x="930" y="217" width="65" height="32" class="node"/><text x="873" y="281" class="label">Node 3</text><rect x="830" y="565" width="275" height="90" rx="5" fill="#e6e9ef" stroke="#65768a" stroke-width="2"/><text x="854" y="594" class="label">Power cassette at base</text><text x="854" y="617" class="small">Enclosed PSU + protected branches</text><text x="854" y="638" class="small">Mass / supply selection unresolved</text><path d="M795 675 H1150" stroke="#7e8c9b" stroke-width="3"/><path class="dc" d="M280 580 H410 V530 H371"/><circle cx="371" cy="530" r="5" fill="#dc8a23"/><path class="net" d="M505 224 V504 H369"/><path class="dc" d="M280 580 H425 V408 H371"/><circle cx="371" cy="408" r="5" fill="#dc8a23"/><path class="net" d="M520 224 V382 H369"/><path class="dc" d="M280 580 H440 V286 H371"/><circle cx="371" cy="286" r="5" fill="#dc8a23"/><path class="net" d="M535 224 V260 H369"/><rect x="481" y="191" width="124" height="34" rx="5" fill="#e7e9fa" stroke="#687bd0"/><text x="493" y="213" class="label">Network switch</text><text x="443" y="558" class="small">Front: DC</text><text x="529" y="505" class="small">Rear: network</text><text x="431" y="578" class="small">One branch per node</text><path d="M63 620 H94" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/><text x="47" y="603" class="small">Mains</text><text x="58" y="710" class="label">Columns belong to the cassette; no permanent outer frame.</text><text x="58" y="734" class="small">Front power headers • rear fans / I/O • side routes around fan bank</text><rect x="808" y="303" width="15" height="368" class="support"/><rect x="788" y="662" width="55" height="12" class="support"/><rect x="806" y="303" width="55" height="12" class="support"/><rect x="1131" y="303" width="15" height="368" class="support"/><rect x="1111" y="662" width="55" height="12" class="support"/><rect x="1096" y="303" width="55" height="12" class="support"/><path d="M931 445 H1170" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="1190" y="415" width="159" height="14" class="tray"/><rect x="1192" y="340" width="13" height="76" class="post"/><rect x="1332" y="340" width="13" height="76" class="post"/><rect x="1217" y="389" width="105" height="9" class="node"/><text x="1202" y="455" class="label">Target node out</text><text x="1190" y="478" class="small">Shutdown + isolate first</text><path class="dc" d="M1087 575 H1167 V285 H1104"/><path class="net" d="M1182 224 V264 H1104"/><text x="1178" y="195" class="small">Upper leads stay connected</text><text x="1178" y="217" class="small">with measured lift slack</text><text x="779" y="355" class="small" transform="rotate(-90 779 355)">Removable support</text><text x="760" y="710" class="label">The upper group's load goes to the floor through service supports.</text><text x="760" y="734" class="small">Lift / retention / extraction sweep and powered service still need qualification.</text><rect x="28" y="783" width="1384" height="123" rx="16" fill="#e5edf5"/><text x="50" y="814" class="h">Model before release</text><text x="50" y="842" class="label">Mass: board + CPU, 8 DIMMs, cooler, SSD, fans, every print, fasteners, harness, columns, PSU and distribution.</text><text x="50" y="866" class="label">Forces: every interface, actual mass locations, corner reactions, tipping, sliding, cable pull and service-support state.</text><text x="50" y="890" class="label">Heat: local fan / mount / joint temperatures and loaded creep. PETG HDT is not a continuous operating rating.</text></svg>