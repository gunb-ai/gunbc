[package]
name = "rust_gate_runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# SCAFFOLD CI executor — the Rust-conditional gate realizer. Reads the `.dag` selector
# (v2.workflow.rust_stage0_gates) as the authority for "did this diff touch the Rust
# monolith", and runs `cargo fmt --all --check` + `cargo clippy --all-targets -- -D warnings`
# fail-closed when it did. The in-process witness gate (ci-claim-gate) is the always-on
# floor and is NOT run here. Dissolution trigger: delete when the Rust seed reaches zero
# (DESIGN §7) — no Rust, no Rust gates. Mirrors ci_claim_gate's embed of v1-compiler so the
# selector is evaluated in-interpreter rather than re-implemented in Rust.

[[bin]]
name = "rust-gate-runner"
path = "src/main.rs"

[dependencies]
v1-compiler = { path = "../../src/v1/stage0" }
