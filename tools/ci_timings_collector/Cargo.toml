[package]
name = "ci_timings_collector"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Option B host: embeds the v2 interpreter to drive the .dag github.Actions transport
# shell-free, then reuses ci_affected_components' single-authority windows->timings
# projection. Kept a SEPARATE crate from ci_affected_components on purpose: the fast,
# critical-path `affected` detector bin lives in that crate and must NOT pull in the
# heavy v1-compiler dependency.

[[bin]]
name = "collect-affected-set-timings"
path = "src/main.rs"

[dependencies]
v1-compiler = { path = "../../src/v1/stage0" }
ci_affected_components = { path = "../ci_affected_components" }
serde_json = { workspace = true }
