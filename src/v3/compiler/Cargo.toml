[package]
name = "v3-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
# PB-1-e / Zero-Floor: `regen_bootstrap` is the only bin that enables
# `bootstrap-regen-fresh`; listing bins explicitly keeps that boundary
# without Cargo silently promoting a new `src/bin/*.rs` driver.
autobins = false

[features]
# Fresh tokenize/parse/lower bootstrap for `regen_bootstrap` only — not part of
# the default `v3-compiler` library build graph (production uses snapshots).
bootstrap-regen-fresh = []

# Cross-crate **tests** that need a declaration graph without bootstrap rows
# (e.g. E-6 empty-`dag` witnesses). Off by default so production dependency graphs
# cannot construct this substrate-invalid state without opting in.
empty-substrate-for-tests = []

# M0: the smallest v3 pipeline that exercises the full substrate.
# parse -> lower to L1 behaviors -> infer types through Ports ->
# emit diagnostics via the enforced mark_unresolved API -> one lens.
#
# No code emission (that is M1). No self-hosting (M3). No generics,
# no Optional, no service calls (M2). Five L1 behaviors hardcoded
# in Rust; std/-backed dispatch lands in M1.
#
# `libc` is Unix-only: process-group + kill for `ExecuteCommand` (PB-Runtime).
[dependencies]

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[dev-dependencies]
# Interpreter-backed receipts for substrate behavior (repeat_string, etc.).
v2-compiler = { path = "../../v2/stage0" }
v2-compiler-tests = { path = "../../v2/tests" }
# R3 C1 — Tier-3 mirror dissolution perf budget (Phase 1 baseline capture); see
# `docs/briefs/r3-pb-tier3-perf-budget-worker.md` deliverable 0a/0b.
criterion = "0.5"

[[bench]]
name = "tier3_mirror_perf"
harness = false

[[bin]]
name = "regen_bootstrap"
path = "src/bin/regen_bootstrap.rs"
required-features = ["bootstrap-regen-fresh"]

[[bin]]
name = "regen_lens"
path = "src/bin/regen_lens.rs"

[[bin]]
name = "regen_parse"
path = "src/bin/regen_parse.rs"

[[bin]]
name = "regen_parse_tables"
path = "src/bin/regen_parse_tables.rs"

[[bin]]
name = "regen_tokenize"
path = "src/bin/regen_tokenize.rs"

[[bin]]
name = "regen_v3"
path = "src/bin/regen_v3.rs"

[[bin]]
name = "emit_method_template_projection"
path = "src/bin/emit_method_template_projection.rs"

[[bin]]
name = "self_host_fixed_point"
path = "src/bin/self_host_fixed_point.rs"

# R1C-E — `ExecuteCommand` logical child for T-Emit `.dag` `TestClaim` wrappers.
# Subcommands wrap `v3_compiler::r1c_e_gates::check_*` so the host `#[test]`
# harness and the `.dag`-driven gate share one implementation.
[[bin]]
name = "r1c_e_emit_gates"
path = "src/bin/r1c_e_emit_gates.rs"
