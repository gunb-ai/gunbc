[package]
name = "v3-grounding-coercion-fold"
version.workspace = true
edition.workspace = true
license.workspace = true

# T-Ground-Coercion-Fold — structural fold scaffold (program intent × substrate
# → target inhabitance OR fail-closed diagnostic). Sibling to grounding_pilot /
# grounding_engine / grounding_lifetime; does not touch `src/v3/compiler/` SG-0.

[dependencies]
v3-compiler = { path = "../compiler" }
v3-grounding-lifetime = { path = "../grounding_lifetime" }

[dev-dependencies]
# `#[test]` witnesses call `Dag::new_empty_for_testing` (feature-gated on `v3-compiler`).
# `declaration-id-raw-test-witness` enables opaque `DeclarationId` handles for witnesses that bail
# out before dereferencing declarations (see `declaration_id_raw_for_testing`).
v3-compiler = { path = "../compiler", features = ["empty-substrate-for-tests", "declaration-id-raw-test-witness"] }
