[package]
name = "execute-command-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux bootstrap for ExecuteCommand unshare: fd3 sentinel + FD_CLOEXEC before execvp"

[[bin]]
name = "gunbc_execute_command_bootstrap"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", default-features = false }
