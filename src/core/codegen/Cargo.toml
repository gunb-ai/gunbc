[package]
name = "gunbc-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared code generation utilities for gunbc"

[dependencies]
gunbc-infra = { path = "../infra" }
gunbc-ir = { path = "../ir" }
gunbc-test = { path = "../test" }
gunbc-exec = { path = "../exec" }
gunbc-resolve = { path = "../resolve" }
gunbc-cli = { path = "../cli" }
gunbc-primitives = { path = "../primitives" }
gunbc-lib-transport = { path = "../transport" }
gunbc-lib-blob = { path = "../blob" }
daglang-derive = { path = "../daglang/daglang-derive" }
daglang-driver = { path = "../daglang/daglang-driver" }
daglang-emit = { path = "../daglang/daglang-emit" }
daglang-lower = { path = "../daglang/daglang-lower" }
daglang-resolve = { path = "../daglang/daglang-resolve" }
daglang-syntax = { path = "../daglang/daglang-syntax" }
daglang-typecheck = { path = "../daglang/daglang-typecheck" }
serde = { workspace = true }
serde_json = { workspace = true }
cargo_metadata = "0.18"
toml_edit = "0.22"

[dev-dependencies]
gunbc-test = { path = "../test" }
serde_json = { workspace = true }

[[bin]]
name = "gunbc-codegen"
path = "src/bin/codegen_cli.rs"

[[bin]]
name = "gunbc-testgen"
path = "src/bin/testgen_cli.rs"

[[bin]]
name = "gunbc-bootstrap"
path = "../../../target/codegen/bin/bootstrap/main.rs"

[[bin]]
name = "gunbc-codegen-dag"
path = "../../../target/codegen/bin/codegen/main.rs"

[[bin]]
name = "gunbc-infra"
path = "../../../target/codegen/bin/infra/main.rs"

[[bin]]
name = "gunbc-build-all"
path = "../../../target/codegen/bin/build-all/main.rs"

[[bin]]
name = "gunbc-workflow"
path = "../../../target/codegen/bin/workflow/main.rs"

[[bin]]
name = "gunbc-readme"
path = "../../../target/codegen/bin/readme/main.rs"

[[bin]]
name = "gunbc-gist"
path = "../../../target/codegen/bin/gist/main.rs"
