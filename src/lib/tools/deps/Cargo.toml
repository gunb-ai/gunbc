[package]
name = "gunbc-deps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tool dependency management with upsert pattern"

[dependencies]
gunbc-ir = { path = "../../../core/ir" }
gunbc-exec = { path = "../../../core/exec" }
gunbc-delegate-macros = { path = "../../../core/delegate-macros" }
gunbc-primitives = { path = "../../primitives" }
gunbc-lib-transport = { path = "../../transport" }
gunbc-test = { path = "../../../core/test" }
gunbc-testgen-registry = { path = "../../../core/testgen-registry" }
gunbc-testgen-registry-macros = { path = "../../../core/testgen-registry-macros" }
gunbc-cli = { path = "../../../core/cli" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
gunbc-test = { path = "../../../core/test" }
