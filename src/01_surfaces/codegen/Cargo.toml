[package]
name = "gunbc-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared code generation utilities for gunbc"

[dependencies]
gunbc-infra = { path = "../../00_foundation/infra" }
gunbc-ir = { path = "../../00_foundation/ir" }
gunbc-test = { path = "../../10_test/test" }
gunbc-exec = { path = "../../09_execute/exec" }
gunbc-resolve = { path = "../../08_materialize/resolve" }
gunbc-cli = { path = "../cli" }
gunbc-lib-transport = { path = "../../08_materialize/transport" }
gunbc-lib-blob = { path = "../../08_materialize/blob" }
daglang-derive = { path = "../../06_artifacts/daglang-derive" }
daglang-driver = { path = "../../02_pipeline/daglang-driver" }
daglang-emit = { path = "../../07_emit/daglang-emit" }
daglang-lower = { path = "../../05_graph/daglang-lower" }
daglang-resolve = { path = "../../03_source/daglang-resolve" }
daglang-syntax = { path = "../../03_source/daglang-syntax" }
daglang-typecheck = { path = "../../04_semantics/daglang-typecheck" }
serde = { workspace = true }
