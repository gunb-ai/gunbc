[package]
name = "v2-compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
stacker = "0.1"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "v2-compiler"
path = "src/main.rs"

[[bin]]
name = "regen_stage0"
path = "src/bin/regen_stage0.rs"
