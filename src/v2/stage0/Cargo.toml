[package]
name = "v2-compiler"
version = "0.1.0"
edition = "2021"

[features]
default = []
text_lookup_work_counter = []

[dependencies]
stacker = "0.1"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "gunbc"
path = "src/main.rs"

[[bin]]
name = "regen_stage0"
path = "src/bin/regen_stage0.rs"
# cache-bust-v2-binary-20260526

# Batch claim runner: resolve one --entry closure once, run many witnesses.
# Hand-written CI tool (like regen_stage0); reuses the v2-compiler lib, does NOT
# go through the generated main.rs / emit stage. Amortizes the per-row full-tree
# resolve in the v4 node-frontier CI gate's green pass.
[[bin]]
name = "claim_batch"
path = "src/bin/claim_batch.rs"
