[package]
name = "daglang-lower"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lowers typed .dag AST to gunbc GraphIR (Dag/Node/Port/Edge)"

[dependencies]
daglang-contract = { path = "../../0_foundation/daglang-contract" }
daglang-syntax = { path = "../../1_source/daglang-syntax" }
daglang-typecheck = { path = "../../2_semantics/daglang-typecheck" }
gunbc-ir = { path = "../../0_foundation/ir" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
daglang-resolve = { path = "../../1_source/daglang-resolve" }
gunbc-exec = { path = "../../7_execute/exec" }
gunbc-resolve = { path = "../../6_materialize/resolve" }
