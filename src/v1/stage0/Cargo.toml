[package]
name = "v1-compiler"
version = "0.1.0"
edition = "2021"

[features]
default = []
text_lookup_work_counter = []
# Test-only interpreter instrumentation (default-off until armed). Compiled into shared release artifact; inert at runtime until armed.
interp_test_witness = []
test_hooks = []

[dependencies]
# Persistent value carriers (ctrl#1533 phase 2). `im` and `im-rc` are the same
# crate source; build.rs switches on CARGO_PKG_NAME to set cfg(threadsafe),
# which flips one alias in that crate's util.rs -- Ref<A> = std::rc::Rc for
# im-rc, std::sync::Arc for im. Public API, macro set, and algorithms are
# identical; the only feature im-rc adds is `pool`, which we do not request.
# It provides BOTH carriers v2.std.value_carrier declares: HashMap is a hash
# array mapped trie (map_carrier: ^hash_array_mapped_trie) and Vector is a
# relaxed radix balanced tree (list_carrier: ^relaxed_radix_balanced_tree,
# O(log n) concatenation). rpds was the considered alternative; rejected
# because its Vector has no concatenation, so it cannot realize the declared
# list carrier.
#
# im-rc -> im so the typed payloads these carriers build CAN become Send. The
# floor runs serially because each worker rebuilds its own whole-tree typed
# index; cross-entry reuse is real (measured 92.5% typed_module_cache hit rate
# over 80 sequential discovery entries), but sharing it needs Send payloads,
# and an outer Arc cannot make a value Send when its interior is im_rc-backed.
# NOT Send yet: the Value substrate is still std::rc::Rc. That is the
# follow-on step, gated on this swap's measured cost -- im refcounts
# atomically, so this taxes every collection op including the interpreter
# hot path.
im = { version = "15.1", features = ["serde"] }
unicode-ident = "1"
unicode-properties = { version = "0.1", features = ["emoji"] }
stacker = "0.1"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
toml = { workspace = true }
ureq = { version = "2", features = ["json"] }
# Thread CPU-time clock (CLOCK_THREAD_CPUTIME_ID) for the fast-lane eval budget: the
# budget bounds COMPUTE, not wall, so a witness inflated by cold-I/O reads or governor
# time-slicing is not misclassified as an eval-wedge (a true non-terminating eval still
# burns CPU and is caught). Already present transitively; declared direct for this use.
libc = "0.2"

[[bin]]
name = "gunbc"
path = "src/main.rs"

[[bin]]
name = "cssl_assemble"
path = "src/bin/cssl_assemble.rs"

# Batch claim runner: resolve one --entry closure once, run many witnesses.
# Hand-written CI tool (like regen_stage0); reuses the v1-compiler lib, does NOT
# go through the generated main.rs / emit stage. Amortizes the per-row full-tree
# resolve in the v2 node-frontier CI gate's green pass.
[[bin]]
name = "claim_batch"
path = "src/bin/claim_batch.rs"

# Batch claim executor: host transport for the v2.workflow.executor .dag. Reads
# the executor-decided batches (List<List<ClaimRef>>) from a plan function and
# runs the v2 claim suite batch-by-batch, claims-in-parallel. The .dag is the
# batching authority; this bin consumes it (does not re-derive grouping/order).
[[bin]]
name = "claim_executor"
path = "src/bin/claim_executor.rs"

# CHARAT-0 / STR-RC-0 measurement scaffold (not floor-enrolled).
# Local transport for `extdeps.languages.json.parse` `parse_json` interpreter scaling.
# Modes: `scaling` (sub-40KB grid), `large` (100/200/507KB decisive regime), plus
# `survival` and `memo_receipt` for mechanism receipts.
# DISSOLUTION: delete when CHARAT-0 string-indexing acceptance enrolls a floor witness
# (or STR-RC-0 scaffold retires), or when large-regime measurement refutes and reverts.
# Carrier: `JSON_PARSE_SCALING_PROBE_SCAFFOLD_MARKER` in json_parse_scaling_probe.rs.
[[bin]]
name = "json_parse_scaling_probe"
path = "src/bin/json_parse_scaling_probe.rs"

# Isolated char_at scaling receipt: position x string-length, uncontaminated by the
# JSON parser's independent list-accumulation cost (eager-koi-458 scope correction,
# 2026-08-17). SCAFFOLD -- disposition authority is
# `char_at_scaling_probe_disposition` in dag/gunbc/char_at_scaling_probe_support.dag.
# DISSOLUTION: its OWN trigger (`char_at_scaling_probe_dissolution`), NOT alongside
# json_parse_scaling_probe.rs -- the two probes measure different primitives and can
# have independently different lifetimes (DESIGN section 5, same-unit rule).
[[bin]]
name = "char_at_scaling_probe"
path = "src/bin/char_at_scaling_probe.rs"

# Resolved-type owned-data discovery for Consolidation #4553 glob discovery.
# Hand-written CI tool (like claim_batch); exposes neutral decl facts only.
[[bin]]
name = "discover_owned_data"
path = "src/bin/discover_owned_data.rs"

# Whole-tree `.dag` source read discovery for Stage C Lane 3a SourceRootIngest.
[[bin]]
name = "discover_source_root_ingest"
path = "src/bin/discover_source_root_ingest.rs"


# CI2-0 Commit B sweep driver — local recipe only (NOT floor-enrolled, not WitnessBin-addressed):
# per-entry canonical realization sweep over the frontier-probe overlay transport.
[[bin]]
name = "realization_sweep_survey"
path = "src/bin/realization_sweep_survey.rs"

# Parse-only regression scanner for src/v1/*.dag (cheap half of full_dag_compiles,
# which is #[ignore]; this lifts the v1 parse gate onto the CI floor non-ignored).
# SCAFFOLD — dissolves when src/v1 is fully migrated to .dag substrate authority
# and the floor covers it via the standard dag_compile_clean_gate.
[[bin]]
name = "v1_src_dag_parse"
path = "src/bin/v1_src_dag_parse.rs"

# Whole-tree wiring-liveness scan (gunbc#5364 widening): runs
# wiring_liveness_corpus_dead_wires over a context built across the WHOLE
# source-root corpus in one pass, so a dead wire ANYWHERE (not just inside a
# per-entry import closure) fails the floor. Coverage widens from per-entry
# resolve-closure to whole-tree-in-one-pass.
[[bin]]
name = "wiring_liveness_whole_tree"
path = "src/bin/wiring_liveness_whole_tree.rs"

# SCAFFOLD — emit-only whole-corpus audit for complexity/linearity lens family (SYNTACTIC half).
# ROADMAP §3 `3-gates-whole` ("complexity budget gates the whole codebase"); audit-first bridge
# until `decl_facts(roots)` host builtin (#5966) grounds fn-body reflection. Parse-only walk over
# witness_layer_roots; NOT floor-enrolled — prints findings TSV, exit 0 unless --fail-on-findings.
# DISSOLUTION: swap stub for decl_facts(roots), move triage roster on-carrier, fold into pure .dag
# reader (gunbc#5364), then enroll floor gate.
[[bin]]
name = "complexity_linearity_audit"
path = "src/bin/complexity_linearity_audit.rs"

[[bin]]
name = "measure_whole_tree_resolve"
path = "src/bin/measure_whole_tree_resolve.rs"

[[bin]]
name = "measure_selected_closure_overlap"
path = "src/bin/measure_selected_closure_overlap.rs"

[[bin]]
name = "measure_dependency_view_build"
path = "src/bin/measure_dependency_view_build.rs"

[[bin]]
name = "capture_func_env_semantic_oracle"
path = "src/bin/capture_func_env_semantic_oracle.rs"

# Floor witness for extdep REST transport collection (cli_run::collect_rest_transport_operations).
# Parses the eight-file authority closure live, resolves tracked ops, and checks
