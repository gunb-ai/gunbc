[package]
name = "v1-compiler"
version = "0.1.0"
edition = "2021"

[features]
default = []
text_lookup_work_counter = []

[target.'cfg(target_os = "linux")'.dependencies]
# jemalloc returns dirty pages via madvise(MADV_DONTNEED) per freed region,
# avoiding the brk fragmentation that prevents malloc_trim from recovering pages
# between discovery chunks (see run_discovery_rows_chunked in cli_run.rs).
tikv-jemallocator = "0.5"

[dependencies]
# Persistent value carriers (ctrl#1533 phase 2). im-rc is the Rc-backed
# (thread-confined, matching the Value Rc-discipline) crate providing BOTH
# carriers v2.std.value_carrier declares: HashMap is a hash array mapped trie
# (map_carrier: ^hash_array_mapped_trie) and Vector is a relaxed radix
# balanced tree (list_carrier: ^relaxed_radix_balanced_tree, O(log n)
# concatenation). rpds was the considered alternative; rejected because its
# Vector has no concatenation, so it cannot realize the declared list carrier.
im-rc = "15.1"
unicode-ident = "1"
unicode-properties = { version = "0.1", features = ["emoji"] }
stacker = "0.1"
clap = { version = "4", features = ["derive"] }
lazy_static = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = { workspace = true }
ureq = { version = "2", features = ["json"] }

[[bin]]
name = "gunbc"
path = "src/main.rs"

[[bin]]
name = "regen_stage0"
path = "src/bin/regen_stage0.rs"
# cache-bust-v2-binary-20260526

# Batch claim runner: resolve one --entry closure once, run many witnesses.
# Hand-written CI tool (like regen_stage0); reuses the v1-compiler lib, does NOT
# go through the generated main.rs / emit stage. Amortizes the per-row full-tree
# resolve in the v2 node-frontier CI gate's green pass.
[[bin]]
name = "claim_batch"
path = "src/bin/claim_batch.rs"

# Batch claim executor: host transport for the v2.workflow.executor .dag. Reads
# the executor-decided batches (List<List<ClaimRef>>) from a plan function and
# runs the v2 claim suite batch-by-batch, claims-in-parallel. The .dag is the
# batching authority; this bin consumes it (does not re-derive grouping/order).
[[bin]]
name = "claim_executor"
path = "src/bin/claim_executor.rs"

# Resolved-type owned-data discovery for Consolidation #4553 glob discovery.
# Hand-written CI tool (like claim_batch); exposes neutral decl facts only.
[[bin]]
name = "discover_owned_data"
path = "src/bin/discover_owned_data.rs"

# Hand-written CI parse fallback for `gunbc.ci_yaml_validate` when PyYAML/actionlint
# are absent on the runner (see `dsl/gunbc/ci_yaml_validate.dag`). SCAFFOLD — dissolves
# when (a) self-hosted CI image pins actionlint/PyYAML so the shell chain never needs this
# bin, or (b) YAML parse becomes a declared extdeps host effect with no v1 seed binary
# (DESIGN §7: seed transport shrinks as host facts move into `.dag` authority).
[[bin]]
name = "yaml_check"
path = "src/bin/yaml_check.rs"

# Whole-tree `.dag` source read discovery for Stage C Lane 3a SourceRootIngest.
[[bin]]
name = "discover_source_root_ingest"
path = "src/bin/discover_source_root_ingest.rs"

# Whole-tree v2 parse regression scanner (host transport; one harness, N files).
[[bin]]
name = "v2_whole_tree_parse_scan"
path = "src/bin/v2_whole_tree_parse_scan.rs"

# Parse-only regression scanner for src/v1/*.dag (cheap half of full_dsl_compiles,
# which is #[ignore]; this lifts the v1 parse gate onto the CI floor non-ignored).
# SCAFFOLD — dissolves when src/v1 is fully migrated to .dag substrate authority
# and the floor covers it via the standard dsl_compile_clean_gate.
[[bin]]
name = "v1_src_dag_parse"
path = "src/bin/v1_src_dag_parse.rs"

# Whole-tree wiring-liveness scan (gunbc#5364 widening): runs
# wiring_liveness_corpus_dead_wires over a context built across the WHOLE
# source-root corpus in one pass, so a dead wire ANYWHERE (not just inside a
# per-entry import closure) fails the floor. Coverage widens from per-entry
# resolve-closure to whole-tree-in-one-pass.
[[bin]]
name = "wiring_liveness_whole_tree"
path = "src/bin/wiring_liveness_whole_tree.rs"
