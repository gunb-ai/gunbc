[package]
name = "gunbc-resolve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared DAG resolution operations for service transports"

[dependencies]
daglang-derive = { path = "../../06_artifacts/daglang-derive" }
daglang-driver = { path = "../../02_pipeline/daglang-driver", optional = true }
daglang-lower = { path = "../../05_graph/daglang-lower" }
gunbc-exec = { path = "../../09_execute/exec" }
gunbc-infra = { path = "../../00_foundation/infra" }
gunbc-ir = { path = "../../00_foundation/ir" }
gunbc-lib-blob = { path = "../blob" }
gunbc-lib-transport = { path = "../transport" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
## Enable compilation convenience functions (`compile_and_resolve`, dagbin cache).
## Without this feature, only the pure resolution API (`resolve_compiled_dsl`) is available.
compile = ["dep:daglang-driver"]

[dev-dependencies]
daglang-resolve = { path = "../../03_source/daglang-resolve" }
daglang-syntax = { path = "../../03_source/daglang-syntax" }
daglang-typecheck = { path = "../../04_semantics/daglang-typecheck" }
gunbc-test = { path = "../../10_test/test" }
