<div id="header">
  <h1>{TITLE}</h1>
  <span id="stats"></span>
  <div id="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#0e7490;border-color:#22d3ee;"></div> env/resource</div>
    <div class="legend-item"><div class="legend-dot" style="background:#9a3412;border-color:#f97316;"></div> execute</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1e40af;border-color:#60a5fa;"></div> subdag</div>
    <div class="legend-item"><div class="legend-dot" style="background:#374151;border-color:#6b7280;"></div> logic</div>
    <div class="legend-item"><div class="legend-dot" style="background:transparent;border-color:#475569;border-style:dashed;"></div> resource flow</div>
  </div>
</div>
<div id="breadcrumb"></div>
<div id="cy"></div>
<div id="tooltip"><div class="tt-title"></div><div class="tt-body"></div></div>
<div id="controls">
  <button id="btn-fit" title="Fit to screen">&#8644;</button>
  <button id="btn-zin" title="Zoom in">+</button>
  <button id="btn-zout" title="Zoom out">&minus;</button>
</div>
<script>
// ---------------------------------------------------------------------------
// Data
// ---------------------------------------------------------------------------
const TOPOLOGY = {TOPOLOGY_JSON};

// ---------------------------------------------------------------------------
// Color classification (mirrors dag_mermaid::snapshot_node_class)
// ---------------------------------------------------------------------------
const COLORS = {
  env:     { bg: '#0e7490', border: '#22d3ee', text: '#cffafe' },
  execute: { bg: '#9a3412', border: '#f97316', text: '#ffedd5' },
  subdag:  { bg: '#1e40af', border: '#60a5fa', text: '#dbeafe' },
  default: { bg: '#374151', border: '#6b7280', text: '#e5e7eb' },
};

function classifyNode(name, isSubdag) {
  if (isSubdag) return 'subdag';
  const n = name.toLowerCase();
  if (n.endsWith('_env') || n.startsWith('platform_env') || n === 'fs_env' ||
      n === 'clock_env' || n === 'cloud_env' || n === 'net_env' ||
      n.startsWith('cloud_env') || n === 'resource_gate' ||
      n.endsWith('_env_status')) return 'env';
  if (n.startsWith('execute_') || n === 'execute_transport' ||
      n.startsWith('generate_script')) return 'execute';
  return 'default';
}

// ---------------------------------------------------------------------------
// Build Cytoscape elements from DagTopology
// ---------------------------------------------------------------------------
function buildElements(topo, parentId, prefix) {
  const nodes = [];
  const edges = [];

  for (const node of topo.nodes) {
    const fullId = prefix ? prefix + '/' + node.id : node.id;
    const isSubdag = !!node.children;
    const cls = classifyNode(node.id, isSubdag);
    const childCount = isSubdag ? countNodes(node.children) : 0;
    const label = isSubdag ? node.id + ' (' + childCount + ')' : node.id;

    const nodeData = {
      id: fullId,
      label: label,
      shortLabel: node.id,
      nodeClass: cls,
      isSubdag: isSubdag,
      expanded: false,
      childCount: childCount,
      inputCount: node.inputs ? node.inputs.length : 0,
      outputCount: node.outputs ? node.outputs.length : 0,
      _topoNode: node,
    };
    if (parentId) nodeData.parent = parentId;

    nodes.push({ data: nodeData, classes: cls });
  }

  // Aggregate edges between same node pairs
  const edgeMap = {};
  for (const edge of topo.edges) {
    const fromId = prefix ? prefix + '/' + edge.from_node : edge.from_node;
    const toId = prefix ? prefix + '/' + edge.to_node : edge.to_node;
    const isResource = edge.from_port.startsWith('res:') || edge.to_port.startsWith('res:');
    const key = fromId + '>' + toId + (isResource ? ':res' : ':data');

    if (!edgeMap[key]) {
      edgeMap[key] = { from: fromId, to: toId, isResource: isResource, count: 0, ports: [] };
    }
    edgeMap[key].count++;
    edgeMap[key].ports.push(edge.from_port + ' -> ' + edge.to_port);
  }

  for (const key of Object.keys(edgeMap)) {
    const e = edgeMap[key];
    const label = e.isResource
      ? (e.count > 1 ? e.count + ' resources' : 'res:' + e.ports[0].split(' -> ')[0].replace('res:', ''))
      : (e.count > 1 ? e.count + ' ports' : '');

    edges.push({
      data: {
        id: 'e_' + key,
        source: e.from,
        target: e.to,
        label: label,
        isResource: e.isResource,
        portDetail: e.ports.join('\n'),
      },
      classes: e.isResource ? 'resource-edge' : 'data-edge',
    });
  }

  return { nodes, edges };
}

function countNodes(topo) {
  let c = topo.nodes.length;
  for (const n of topo.nodes) {
    if (n.children) c += countNodes(n.children);
  }
  return c;
}

// ---------------------------------------------------------------------------
// Cytoscape setup
// ---------------------------------------------------------------------------
const rootElements = buildElements(TOPOLOGY, null, null);

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: [...rootElements.nodes, ...rootElements.edges],
  wheelSensitivity: 0.3,
  style: [
    {
      selector: 'node.default',
      style: {
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': '11px',
        'font-family': 'monospace',
        'color': COLORS.default.text,
        'background-color': COLORS.default.bg,
        'border-width': 2,
        'border-color': COLORS.default.border,
        'shape': 'roundrectangle',
        'width': 'label',
        'height': 'label',
        'padding': '10px',
        'text-wrap': 'wrap',
        'text-max-width': '160px',
      }
    },
    {
      selector: 'node.env',
      style: {
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': '11px',
        'font-family': 'monospace',
        'color': COLORS.env.text,
        'background-color': COLORS.env.bg,
        'border-width': 2,
        'border-color': COLORS.env.border,
        'shape': 'roundrectangle',
        'width': 'label',
        'height': 'label',
        'padding': '10px',
        'text-wrap': 'wrap',
        'text-max-width': '160px',
      }
    },
    {
      selector: 'node.execute',
      style: {
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': '11px',
        'font-family': 'monospace',
        'color': COLORS.execute.text,
        'background-color': COLORS.execute.bg,
        'border-width': 2,
        'border-color': COLORS.execute.border,
        'shape': 'barrel',
        'width': 'label',
        'height': 'label',
        'padding': '10px',
        'text-wrap': 'wrap',
        'text-max-width': '160px',
      }
    },
    {
      selector: 'node.subdag',
      style: {
        'label': 'data(label)',
        'text-valign': 'center',
        'text-halign': 'center',
        'font-size': '12px',
        'font-weight': 'bold',
        'font-family': 'monospace',
        'color': COLORS.subdag.text,
        'background-color': COLORS.subdag.bg,
        'border-width': 2,
        'border-color': COLORS.subdag.border,
        'shape': 'roundrectangle',
        'width': 'label',
        'height': 'label',
        'padding': '14px',
        'text-wrap': 'wrap',
        'text-max-width': '180px',
      }
    },
    {
      selector: 'node.subdag-expanded',
      style: {
        'label': 'data(shortLabel)',
        'text-valign': 'top',
        'text-halign': 'center',
        'font-size': '13px',
        'font-weight': 'bold',
        'font-family': 'monospace',
        'color': '#93c5fd',
        'background-color': '#0f172a',
        'background-opacity': 0.6,
        'border-width': 2,
        'border-color': '#60a5fa',
        'border-style': 'dashed',
        'shape': 'roundrectangle',
        'padding': '20px',
        'text-margin-y': -8,
      }
    },
    {
      selector: 'edge.data-edge',
      style: {
        'width': 1.5,
        'line-color': '#475569',
        'target-arrow-color': '#475569',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'arrow-scale': 0.8,
        'label': 'data(label)',
        'font-size': '9px',
        'font-family': 'monospace',
        'color': '#64748b',
        'text-background-color': '#0f172a',
        'text-background-opacity': 0.8,
        'text-background-padding': '2px',
      }
    },
    {
      selector: 'edge.resource-edge',
      style: {
        'width': 1.5,
        'line-color': '#22d3ee',
        'line-style': 'dashed',
        'target-arrow-color': '#22d3ee',
        'target-arrow-shape': 'triangle',
        'curve-style': 'bezier',
        'arrow-scale': 0.8,
        'label': 'data(label)',
        'font-size': '9px',
        'font-family': 'monospace',
        'color': '#22d3ee',
        'text-background-color': '#0f172a',
        'text-background-opacity': 0.8,
        'text-background-padding': '2px',
      }
    },
  ],
  layout: { name: 'preset' },
});

// ---------------------------------------------------------------------------
// Layout helper
// ---------------------------------------------------------------------------
function runLayout(animate) {
  cy.layout({
    name: 'dagre',
    rankDir: 'LR',
    nodeSep: 30,
    rankSep: 60,
    edgeSep: 15,
    animate: animate,
    animationDuration: 300,
    fit: true,
    padding: 40,
  }).run();
}

runLayout(false);

// ---------------------------------------------------------------------------
// Expand / Collapse
// ---------------------------------------------------------------------------
const expandedSet = new Set();

function expandNode(nodeId) {
  const node = cy.getElementById(nodeId);
  const topoNode = node.data('_topoNode');
  if (!topoNode || !topoNode.children) return;

  expandedSet.add(nodeId);
  node.data('expanded', true);
  node.removeClass('subdag');
  node.addClass('subdag-expanded');

  const childElems = buildElements(topoNode.children, nodeId, nodeId);
  cy.add(childElems.nodes);
  cy.add(childElems.edges);

  runLayout(true);
  updateBreadcrumb();
}

function collapseNode(nodeId) {
  const node = cy.getElementById(nodeId);
  if (!node || !expandedSet.has(nodeId)) return;

  const descendants = node.descendants();
  descendants.forEach(function(d) {
    if (expandedSet.has(d.id())) {
      expandedSet.delete(d.id());
    }
  });

  cy.remove(descendants);

  expandedSet.delete(nodeId);
  node.data('expanded', false);
  node.data('label', node.data('shortLabel') + ' (' + node.data('childCount') + ')');
  node.removeClass('subdag-expanded');
  node.addClass('subdag');

  runLayout(true);
  updateBreadcrumb();
}

function toggleNode(nodeId) {
  if (expandedSet.has(nodeId)) {
    collapseNode(nodeId);
  } else {
    expandNode(nodeId);
  }
}

// ---------------------------------------------------------------------------
// Click handler
// ---------------------------------------------------------------------------
cy.on('tap', 'node', function(evt) {
  const node = evt.target;
  if (node.data('isSubdag')) {
    toggleNode(node.id());
  }
});

cy.on('doubleTap', 'node', function(evt) {
  const node = evt.target;
  const parentId = node.data('parent');
  if (parentId && expandedSet.has(parentId)) {
    collapseNode(parentId);
  }
});

// ---------------------------------------------------------------------------
// Tooltip on hover
// ---------------------------------------------------------------------------
const tooltip = document.getElementById('tooltip');
const ttTitle = tooltip.querySelector('.tt-title');
const ttBody = tooltip.querySelector('.tt-body');

cy.on('mouseover', 'node', function(evt) {
  const d = evt.target.data();
  ttTitle.textContent = d.shortLabel || d.label;
  let body = '';
  if (d.isSubdag) {
    body += (d.expanded ? 'Click to collapse' : 'Click to expand') + '\n';
    body += d.childCount + ' child nodes';
  } else {
    body += 'in: ' + d.inputCount + '  out: ' + d.outputCount;
  }
  ttBody.textContent = body;
  ttBody.style.whiteSpace = 'pre';
  tooltip.style.display = 'block';
});

cy.on('mouseover', 'edge', function(evt) {
  const d = evt.target.data();
  ttTitle.textContent = (d.isResource ? 'Resource' : 'Data') + ' flow';
  ttBody.textContent = d.portDetail || '';
  ttBody.style.whiteSpace = 'pre';
  tooltip.style.display = 'block';
});

cy.on('mouseout', function() {
  tooltip.style.display = 'none';
});

cy.on('mousemove', function(evt) {
  if (tooltip.style.display === 'block') {
    const x = evt.originalEvent.clientX;
    const y = evt.originalEvent.clientY;
    tooltip.style.left = (x + 14) + 'px';
    tooltip.style.top = (y + 14) + 'px';
  }
});

// ---------------------------------------------------------------------------
// Breadcrumb
// ---------------------------------------------------------------------------
const breadcrumbEl = document.getElementById('breadcrumb');

function updateBreadcrumb() {
  if (expandedSet.size === 0) {
    breadcrumbEl.style.display = 'none';
    return;
  }
  breadcrumbEl.style.display = 'block';

  const items = Array.from(expandedSet).sort();
  let html = 'Expanded: ';
  items.forEach(function(id) {
    const parts = id.split('/');
    const name = parts[parts.length - 1];
    html += '<span onclick="collapseNode(\'' + id + '\')" title="Click to collapse">' + name + '</span> ';
  });
  breadcrumbEl.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
document.getElementById('btn-fit').addEventListener('click', function() {
  cy.fit(null, 40);
});
document.getElementById('btn-zin').addEventListener('click', function() {
  cy.zoom({ level: cy.zoom() * 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
});
document.getElementById('btn-zout').addEventListener('click', function() {
  cy.zoom({ level: cy.zoom() / 1.3, renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 } });
});

// ---------------------------------------------------------------------------
// Stats
// ---------------------------------------------------------------------------
(function() {
  const total = countNodes(TOPOLOGY);
  const workflows = TOPOLOGY.nodes.length;
  document.getElementById('stats').textContent =
    workflows + ' workflows, ' + total + ' total nodes';
})();
</script>
