[package]
name = "gunbc-dag"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gunbc repo-specific DAG configuration, CI, and generators"

[dependencies]
# Core
gunbc-infra = { path = "../core/infra" }
gunbc-ir = { path = "../core/ir" }
gunbc-exec = { path = "../core/exec" }
gunbc-codegen = { path = "../core/codegen" }
gunbc-test = { path = "../core/test" }

# Libraries
gunbc-primitives = { path = "../lib/primitives" }
gunbc-lib-transport = { path = "../lib/transport" }
gunbc-lib-blob = { path = "../lib/blob" }
gunbc-lib-gist-ops = { path = "../lib/gist-ops" }

# General tools (reusable)
gunbc-deps = { path = "../lib/tools/deps" }
gunbc-gist = { path = "../lib/tools/gist" }
gunbc-clippy = { path = "../lib/tools/clippy" }
gunbc-lib-llm-ops = { path = "../lib/llm-ops" }
gunbc-testgen-registry = { path = "../core/testgen-registry" }
gunbc-testgen-registry-macros = { path = "../core/testgen-registry-macros" }
gunbc-lib-review = { path = "../lib/review" }

serde_json = { workspace = true }

[dev-dependencies]
gunbc-test = { path = "../core/test" }
glob = { workspace = true }


[[bin]]
name = "gunbc-ci"
path = "src/bin/ci.rs"

[[bin]]
name = "gunbc-makegen"
path = "src/bin/makegen.rs"

[[bin]]
name = "gunbc-bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "gunbc-testgen"
path = "src/bin/testgen.rs"

[[bin]]
name = "gunbc-build"
path = "src/bin/build.rs"

[[bin]]
name = "gunbc-codegen-dag"
path = "src/bin/codegen.rs"
