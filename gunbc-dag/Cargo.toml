[package]
name = "gunbc-dag"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "gunbc repo-specific DAG configuration, CI, and generators"

[dependencies]
# Core
gunbc-infra = { path = "../core/infra" }
gunbc-ir = { path = "../core/ir" }
gunbc-exec = { path = "../core/exec" }
gunbc-codegen = { path = "../core/codegen" }
gunbc-test = { path = "../core/test" }

# DSL compilation
daglang-driver = { path = "../core/daglang/daglang-driver" }
daglang-emit = { path = "../core/daglang/daglang-emit" }
daglang-lower = { path = "../core/daglang/daglang-lower" }
daglang-syntax = { path = "../core/daglang/daglang-syntax" }

# Libraries
gunbc-primitives = { path = "../lib/primitives" }
gunbc-lib-transport = { path = "../lib/transport" }
gunbc-lib-blob = { path = "../lib/blob" }
gunbc-lib-cloud-ops = { path = "../lib/cloud-ops" }
gunbc-lib-gcp-ops = { path = "../lib/gcp-ops" }

# General tools (reusable)
gunbc-deps = { path = "../lib/tools/deps" }
gunbc-clippy = { path = "../lib/tools/clippy" }
gunbc-lib-llm-ops = { path = "../lib/llm-ops" }
gunbc-testgen-registry = { path = "../core/testgen-registry" }
gunbc-testgen-registry-macros = { path = "../core/testgen-registry-macros" }
gunbc-tool-registry = { path = "../core/tool-registry" }
gunbc-tool-registry-macros = { path = "../core/tool-registry-macros" }
gunbc-delegate-macros = { path = "../core/delegate-macros" }
gunbc-lib-review = { path = "../lib/review" }
gunbc-design-ops = { path = "../lib/design-ops" }
gunbc-cli = { path = "../core/cli" }

serde_json = { workspace = true }
serde = { workspace = true }
cargo_metadata = "0.18"
toml_edit = "0.22"
serde_yml = "0.0.12"
ron = "0.12.0"

[dev-dependencies]
gunbc-test = { path = "../core/test" }
glob = { workspace = true }


[[bin]]
name = "gunbc-ci"
path = "src/bin/ci.rs"

[[bin]]
name = "gunbc-makegen"
path = "../target/codegen/bin/makegen/main.rs"

[[bin]]
name = "gunbc-bootstrap"
path = "../target/codegen/bin/bootstrap/main.rs"

[[bin]]
name = "gunbc-testgen"
path = "../target/codegen/bin/testgen/main.rs"

[[bin]]
name = "gunbc-pragma"
path = "../target/codegen/bin/pragma/main.rs"

[[bin]]
name = "gunbc-codegen-dag"
path = "../target/codegen/bin/codegen/main.rs"

[[bin]]
name = "gunbc-codegen"
path = "src/bin/codegen_cli.rs"

[[bin]]
name = "gunbc-deps-config"
path = "src/bin/deps_config.rs"


[[bin]]
name = "gunbc-infra"
path = "src/bin/infra.rs"

[[bin]]
name = "gunbc-review"
path = "../target/codegen/bin/review/main.rs"

[[bin]]
name = "gunbc-pipeline"
path = "src/bin/pipeline.rs"

[[bin]]
name = "gunbc-workflow"
path = "src/bin/workflow.rs"

[[bin]]
name = "gunbc-gist"
path = "../target/codegen/bin/gist/main.rs"

[[bin]]
name = "gunbc-gist-diff"
path = "../target/codegen/bin/gist-diff/main.rs"

[[bin]]
name = "gunbc-gist-recent"
path = "../target/codegen/bin/gist-recent/main.rs"

[[bin]]
name = "gunbc-deps"
path = "../target/codegen/bin/deps/main.rs"
