# Clippy configuration for gunbc
#
# BuilderError is intentionally large (144 bytes) to contain diagnostic info.
# Increase the threshold to allow it in Result types.
large-error-threshold = 256

# This enforces two patterns:
#
# 1. TRANSPORT PATTERN: Direct I/O operations disallowed outside approved crates
#    - lib/transport (the transport executor - I/O boundary)
#    - lib/primitives (deprecated ops, allowed for backwards compatibility)
#    - core/codegen (bootstrapper, can't use transport)
#
# 2. TOOL ACQUISITION PATTERN: Command::new disallowed except:
#    - lib/transport/src/executor.rs (the I/O boundary)
#    - core/ir/src/transport/cli.rs (tool acquisition implementation)
#    - core/codegen/src/main.rs (bootstrapper)
#
# For CLI tools, use node.requires(&cli::TOOL) to declare dependencies.
# The framework handles tool acquisition automatically.
#
# Exceptions use #[allow(clippy::disallowed_methods)] with a comment explaining why.

disallowed-methods = [
    # Filesystem operations - use PrepareFileReadOp/PrepareFileWriteOp instead
    { path = "std::fs::read", reason = "Use PrepareFileReadOp + TransportOps::Execute for transport compliance" },
    { path = "std::fs::read_to_string", reason = "Use PrepareFileReadOp + TransportOps::Execute for transport compliance" },
    { path = "std::fs::write", reason = "Use PrepareFileWriteOp + TransportOps::Execute for transport compliance" },
    { path = "std::fs::read_dir", reason = "Use PrepareDirectoryListOp + TransportOps::Execute for transport compliance" },
    { path = "std::fs::remove_file", reason = "Direct filesystem ops should be in transport layer" },
    { path = "std::fs::remove_dir_all", reason = "Direct filesystem ops should be in transport layer" },
    { path = "std::fs::create_dir_all", reason = "Direct filesystem ops should be in transport layer" },
    
    # Process execution - use node.requires(&cli::TOOL) for tool dependencies
    # Direct Command::new should only be in transport executor and cli.rs
    { path = "std::process::Command::new", reason = "Use node.requires(&cli::TOOL) for tool dependencies. Command::new only in transport executor." },
]
