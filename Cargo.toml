[workspace]
resolver = "2"
members = [
    "src/v1/00_foundation/infra",
    "src/v1/00_foundation/ir",
    "src/v1/00_foundation/daglang-contract",
    "src/v1/00_foundation/delegate-macros",
    "src/v1/02_pipeline/daglang-driver",
    "src/v1/03_source/daglang-syntax",
    "src/v1/03_source/daglang-resolve",
    "src/v1/04_semantics/daglang-typecheck",
    "src/v1/05_graph/daglang-eval",
    "src/v1/05_graph/daglang-lower",
    "src/v1/06_artifacts/daglang-derive",
    "src/v1/07_emit/daglang-emit",
    "src/v1/08_materialize/resolve",
    "src/v1/08_materialize/blob",
    "src/v1/08_materialize/transport",
    "src/v1/09_execute/exec",
    "src/v1/01_surfaces/daglang-cli",
    "src/v1/01_surfaces/cli",
    "src/v1/01_surfaces/codegen",
    "src/v1/01_surfaces/workflow",
    "src/v1/10_test/test",
    "src/v1/10_test/generated-tests",
    "src/v1/10_test/testgen-registry",
    "src/v1/10_test/testgen-registry-macros",
    "src/v2/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"
stacker = "0.1"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

[profile.release]
debug = 0
