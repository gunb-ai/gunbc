[workspace]
resolver = "2"
members = [
    # Core crates (handwritten foundation)
    "src/core/infra",
    "src/core/ir",
    "src/core/exec",
    "src/core/workflow",
    "src/core/cli",
    "src/core/resolve",
    "src/core/codegen",
    "src/core/test",
    "src/core/testgen-registry",
    "src/core/testgen-registry-macros",
    "src/core/generated-tests",
    "src/core/delegate-macros",
    # DSL compiler (daglang)
    "src/core/daglang/daglang-syntax",
    "src/core/daglang/daglang-contract",
    "src/core/daglang/daglang-resolve",
    "src/core/daglang/daglang-typecheck",
    "src/core/daglang/daglang-lower",
    "src/core/daglang/daglang-derive",
    "src/core/daglang/daglang-emit",
    "src/core/daglang/daglang-driver",
    "src/core/daglang/daglang-cli",

    # Library crates (moved from src/lib/ into core/)
    "src/core/primitives",
    "src/core/blob",
    "src/core/transport",

]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

[profile.release]
debug = 0
