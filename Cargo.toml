[workspace]
resolver = "2"
members = [
    # v1 foundation -- kept as dev-dependencies for v2 test evaluation chain
    "src/v1/00_foundation/infra",
    "src/v1/00_foundation/ir",
    "src/v1/00_foundation/daglang-contract",
    "src/v1/00_foundation/delegate-macros",
    # v1 source -- parser used by v2 test harness to load .dag files
    "src/v1/03_source/daglang-syntax",
    "src/v1/03_source/daglang-resolve",
    # v1 semantics -- transitive dep of daglang-lower
    "src/v1/04_semantics/daglang-typecheck",
    # v1 graph -- evaluator used by v2 test harness to execute .dag functions
    "src/v1/05_graph/daglang-eval",
    "src/v1/05_graph/daglang-lower",
    # v1 emit -- used by bootstrap tests to assemble stage0
    "src/v1/06_artifacts/daglang-derive",
    "src/v1/07_emit/daglang-emit",
    # v2 self-hosted compiler tests
    "src/v2/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"
stacker = "0.1"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

[profile.release]
debug = 0
