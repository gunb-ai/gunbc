[workspace]
resolver = "2"
exclude = [".stage1"]
members = [
    # v2 stage0 — self-hosted (generated by the v2 compiler itself)
    "src/v2/stage0",
    # v2 self-hosted compiler tests
    "src/v2/tests",
    # v3 compiler — M0: hand-written substrate skeleton
    "src/v3/compiler",
    # v1 compiler — ARCHIVED. No longer in the build or generation path.
    # Retained in src/v1/ for historical reference. Can be deleted.
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"
stacker = "0.1"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

# Stage0 generated code uses debug_assert!(Rc::strong_count(...) == 1) to
# verify ownership for in-place mutation. These fire on shared Rc (expected
# in interpreter paths); the fallback clone is correct. This suppresses ALL
# debug_assert! in v2-compiler, not just ownership checks — acceptable
# because stage0 is generated code with no hand-written debug assertions.
# If hand-written debug_assert! is ever added to stage0, revisit this.
[profile.dev.package.v2-compiler]
debug-assertions = false
opt-level = 2

[profile.release]
debug = 0
