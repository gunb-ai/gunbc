[workspace]
resolver = "2"
members = [
    # Core crates (handwritten foundation)
    "core/ir",
    "core/exec",
    "core/codegen",
    "core/test",
    "core/testgen",
    
    # Library crates (DAG op libraries)
    "lib/primitives",
    # "lib/fs",  # DEPRECATED: Consolidated into lib/primitives
    "lib/gist-ops",
    "lib/markdown",
    "lib/transport",
    
    # Tool compositions (higher-level DAG pipelines)
    "lib/tools/gist",
    "lib/tools/buck2",
    "lib/tools/viz",
    "lib/tools/makegen",
    "lib/tools/deps",
    "lib/tools/ci",
    "lib/tools/bootstrap",
    # NOTE: lib/tools/clippy and lib/tools/cargo removed - use cli::CLIPPY/CARGO
    # with node.requires() instead for the capability-based tool pattern
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
