[workspace]
resolver = "2"
exclude = [".stage1"]
members = [
    # v2 stage0 — self-hosted (generated by the v2 compiler itself)
    "src/v2/stage0",
    # v2 self-hosted compiler tests
    "src/v2/tests",
    # v3 compiler — M0: hand-written substrate skeleton
    "src/v3/compiler",
    # T-Ground-Pilot probe — bounded inhabitance-search routing pilot
    # for the Rust target. Sibling crate so the probe lifecycle is
    # isolated and the v3-compiler SG-0 ratchet is untouched.
    "src/v3/grounding_pilot",
    # T-Ground-Engine Phase 1 — type-structure validation for Rust target
    # primitive declarations loaded through v3-compiler's public accessor.
    "src/v3/grounding_engine",
    # T-Ground-Lifetime-Analyzer — R2 structural ownership / lifetime / growability fold.
    "src/v3/grounding_lifetime",
    # T-Ground-Coercion-Fold — structural emission fold scaffold (stub until LanguageSpec + boundary gates).
    "src/v3/grounding_coercion_fold",
    # T-Ground-CrossTarget-Meta — L6 cross-product walker (TypeConnective × Behavior × Shape A target).
    "src/v3/grounding_cross_target_meta",
    # T-Ground-Tests — L4 routing-stability Stratum A (name-keyed parity) vs LanguageSpec rows.
    "src/v3/grounding_tests",
    # Linux ExecuteCommand unshare bootstrap — fd3 sentinel + FD_CLOEXEC before execvp
    "src/v3/execute_command_bootstrap",
    # v1 compiler — ARCHIVED. No longer in the build or generation path.
    # Retained in src/v1/ for historical reference. Can be deleted.
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"
stacker = "0.1"
# R3 Substrate Rust-primitive-full-coverage (Director Path A RATIFIED at
# gunbc#1739 #issuecomment-4392731264): `IntervalInt::ExactInterval`
# widens from `i128` to `BigInt` to admit `u128::MAX` (and any future
# wider primitive) without per-width host-repr variant explosion.
# Single, stable, widely-vendored crate; minor workspace-surface add.
num-bigint = { version = "0.4", default-features = false }

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

# Stage0 generated code uses debug_assert!(Rc::strong_count(...) == 1) to
# verify ownership for in-place mutation. These fire on shared Rc (expected
# in interpreter paths); the fallback clone is correct. This suppresses ALL
# debug_assert! in v2-compiler, not just ownership checks — acceptable
# because stage0 is generated code with no hand-written debug assertions.
# If hand-written debug_assert! is ever added to stage0, revisit this.
[profile.dev.package.v2-compiler]
debug-assertions = false
opt-level = 2

[profile.release]
debug = 0
