[workspace]
resolver = "2"
members = [
    # v1 compiler — retained for assemble_stage0 binary (seed regeneration).
    # Tests no longer depend on v1; they call stage0 directly.
    "src/v1/00_foundation/infra",
    "src/v1/00_foundation/ir",
    "src/v1/00_foundation/daglang-contract",
    "src/v1/00_foundation/delegate-macros",
    "src/v1/03_source/daglang-syntax",
    "src/v1/03_source/daglang-resolve",
    "src/v1/04_semantics/daglang-typecheck",
    "src/v1/05_graph/daglang-eval",
    "src/v1/05_graph/daglang-lower",
    "src/v1/06_artifacts/daglang-derive",
    "src/v1/07_emit/daglang-emit",
    # v2 stage0 — bootstrap seed (generated from .dag by v1 emitter)
    "src/v2/stage0",
    # v2 self-hosted compiler tests
    "src/v2/tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"
stacker = "0.1"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

# Stage0 generated code uses debug_assert!(Rc::strong_count(...) == 1) to
# verify ownership for in-place mutation. These fire on shared Rc (expected
# in interpreter paths); the fallback clone is correct. This suppresses ALL
# debug_assert! in v2-compiler, not just ownership checks — acceptable
# because stage0 is generated code with no hand-written debug assertions.
# If hand-written debug_assert! is ever added to stage0, revisit this.
[profile.dev.package.v2-compiler]
debug-assertions = false

[profile.release]
debug = 0
