[workspace]
resolver = "2"
members = [
    # Core crates (handwritten foundation)
    "core/ir",
    "core/exec",
    "core/codegen",
    "core/test",
    "core/testgen",
    
    # Library crates (DAG op libraries)
    "lib/primitives",
    "lib/blob",
    "lib/git-ops",
    "lib/gist-ops",
    "lib/llm-ops",
    "lib/review",
    "lib/markdown",
    "lib/transport",
    
    # General tool definitions (reusable by any project)
    "lib/tools/gist",
    "lib/tools/buck2",
    "lib/tools/deps",
    "lib/tools/clippy",
    
    # Repo-specific configuration (gunbc's own DAGs)
    "gunbc-dag",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
