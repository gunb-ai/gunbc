[workspace]
resolver = "2"
members = [
    "src/infra",
    "src/ir",
    "src/exec",
    "src/workflow",
    "src/cli",
    "src/resolve",
    "src/codegen",
    "src/test",
    "src/testgen-registry",
    "src/testgen-registry-macros",
    "src/generated-tests",
    "src/delegate-macros",
    # DSL compiler
    "src/daglang/daglang-syntax",
    "src/daglang/daglang-contract",
    "src/daglang/daglang-resolve",
    "src/daglang/daglang-typecheck",
    "src/daglang/daglang-lower",
    "src/daglang/daglang-derive",
    "src/daglang/daglang-emit",
    "src/daglang/daglang-driver",
    "src/daglang/daglang-cli",
    # Runtime
    "src/primitives",
    "src/blob",
    "src/transport",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

[profile.release]
debug = 0
