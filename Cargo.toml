[workspace]
resolver = "2"
members = [
    "src/0_foundation/infra",
    "src/0_foundation/ir",
    "src/0_foundation/daglang-contract",
    "src/0_foundation/delegate-macros",
    "src/2_pipeline/daglang-driver",
    "src/3_source/daglang-syntax",
    "src/3_source/daglang-resolve",
    "src/4_semantics/daglang-typecheck",
    "src/5_graph/daglang-lower",
    "src/6_artifacts/daglang-derive",
    "src/7_emit/daglang-emit",
    "src/8_materialize/resolve",
    "src/8_materialize/primitives",
    "src/8_materialize/blob",
    "src/8_materialize/transport",
    "src/9_execute/exec",
    "src/1_surfaces/daglang-cli",
    "src/1_surfaces/cli",
    "src/1_surfaces/codegen",
    "src/1_surfaces/workflow",
    "src/10_test/test",
    "src/10_test/generated-tests",
    "src/10_test/testgen-registry",
    "src/10_test/testgen-registry-macros",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

[profile.release]
debug = 0
