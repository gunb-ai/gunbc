[workspace]
resolver = "2"
members = [
    # Core crates (handwritten foundation)
    "core/infra",
    "core/ir",
    "core/exec",
    "core/cli",
    "core/codegen",
    "core/test",
    "core/testgen-registry",
    "core/testgen-registry-macros",
    "core/tool-registry",
    "core/tool-registry-macros",
    
    # Library crates (DAG op libraries)
    "lib/primitives",
    "lib/blob",
    "lib/git-ops",
    "lib/gist-ops",
    "lib/cloud-ops",
    "lib/aws-ops",
    "lib/azure-ops",
    "lib/llm-ops",
    "lib/review",
    "lib/markdown",
    "lib/transport",
    "lib/gcp-ops",
    
    # General tool definitions (reusable by any project)
    "lib/tools/gist",
    "lib/tools/deps",
    "lib/tools/clippy",
    
    # Repo-specific configuration (gunbc's own DAGs)
    "gunbc-dag",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "1.4"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

[profile.release]
debug = 0