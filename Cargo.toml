[workspace]
resolver = "2"
exclude = [".stage1"]
members = [
    "src/v1/stage0",
    # BEGIN generated stage0 crate members -- regen_stage0 writes this region (authority: v1.compiler.workspace_members)
    "src/v1/stage0_core",
    "src/v1/stage0_emit_core",
    # END generated stage0 crate members
    "src/v1/tests",
]

[workspace.metadata]
description = "A causal engine for programs — validates declared intent and emits to any target language."
repository = "https://github.com/gunb-ai/gunbc"
homepage = "https://github.com/gunb-ai/gunbc"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
proptest = "=1.4.0"
sha2 = "0.10"
hex = "0.4"
glob = "0.3"
ureq = "2"
stacker = "0.1"
num-bigint = { version = "0.4", default-features = false }

# Strip debug info from both profiles — this repo produces dev tools,
# not debuggable production binaries. Cuts artifact size ~60% and
# avoids the linker OOM / SIGBUS failures we saw on CI runners.
[profile.dev]
debug = 0

# Stage0 generated code uses debug_assert!(Rc::strong_count(...) == 1) to
# verify ownership for in-place mutation. These fire on shared Rc (expected
# in interpreter paths); the fallback clone is correct. This suppresses ALL
# debug_assert! in v1-compiler, not just ownership checks — acceptable
# because stage0 is generated code with no hand-written debug assertions.
[profile.dev.package.v1-compiler]
debug-assertions = false
opt-level = 2

# v1-compiler under `cargo test` pays a ~30-120s/test amplification cost at opt-level=2
# because its interpreter runs unoptimised fixture evaluation. opt-level=3 recovers wall
# time without changing behaviour (no debug_assert! in generated stage0 code — see note
# on dev.package.v1-compiler above). The one-time optimised build is sccache-cached
# cross-run; run-2+ is near-instant.
[profile.test.package.v1-compiler]
opt-level = 3

[profile.release]
debug = 0
