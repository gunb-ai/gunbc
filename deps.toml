# gunbc tool dependencies
# Install with: gunbc-deps install

[[dependency]]
name = "cargo"
verify = "cargo --version"

[dependency.install.linux]
method = "script"
script = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"

[dependency.install.macos]
method = "brew"
packages = ["rustup"]

[[dependency]]
name = "gh"
verify = "gh --version"

[dependency.install.linux]
method = "apt"
packages = ["gh"]

[dependency.install.macos]
method = "brew"
packages = ["gh"]

[[dependency]]
name = "git"
verify = "git --version"

[dependency.install.linux]
method = "apt"
packages = ["git"]

[dependency.install.macos]
method = "brew"
packages = ["git"]
